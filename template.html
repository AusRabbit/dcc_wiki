<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__TITLE__ — session recaps, floors and a cross-linked cast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
  .nav-toggle{display:none}
  @media(max-width:820px){
    .nav-toggle{display:block;margin:0 20px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer}
    .nav:not(.expanded){display:none}
    .nav.expanded{max-height:40vh;overflow-y:auto}
  }

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .tag.t-floor{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-crawler,.tag.t-npc,.tag.t-rival{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-mob{background:var(--rust-soft); color:var(--rust); border-color:transparent}

  .st-good,.st-bad,.st-warn{font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; padding:1px 6px; border-radius:3px; margin-left:6px; white-space:nowrap}
  .st-good{background:var(--teal-soft); color:var(--teal)}
  .st-bad{background:var(--rust-soft); color:var(--rust)}
  .st-warn{background:var(--amber-soft); color:var(--amber)}

  .axis-grp{margin:0 0 16px}
  .axis-grp .ph{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:5px}
  .axis-grp ul{list-style:none; margin:0; padding:0}
  .axis-grp li{margin-bottom:4px; font-size:15px}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
  main{width:100%}
  .source{color:var(--muted);font-size:14px}
  .reference-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:9px}
  .reference-controls label{font-size:13px;color:var(--muted)}
  .reference-controls label:first-child{grid-column:1/-1}
  .reference-controls input,.reference-controls select,.reference-controls button{display:block;width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink)}
  .reference-controls button{align-self:end;cursor:pointer}
  .reference-controls :focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .reference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .reference-card{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:16px;overflow-wrap:anywhere}
  .reference-card h2{font-size:20px;margin:0 0 8px;border:0;padding:0}
  .reference-card p:last-child{margin-bottom:0}
  .reference-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:20px 0}
  .reference-facts div{background:var(--surface);padding:12px}
  .reference-facts dt{font-size:12px;color:var(--muted)}
  .reference-facts dd{margin:3px 0 0;overflow-wrap:anywhere}
  .rank-upgrades h3{color:var(--teal);font-size:18px;margin-bottom:8px}
  .reference-table{width:100%;border-collapse:collapse;margin-bottom:20px;text-align:left}
  .reference-table th,.reference-table td{padding:8px 12px;border-bottom:1px solid var(--line)}
  .raw-reference{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}
  details{margin:16px 0}summary{cursor:pointer;color:var(--teal)}
  [hidden]{display:none!important}
  @media(max-width:520px){.reference-grid,.reference-facts,.reference-controls{grid-template-columns:minmax(0,1fr)}}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="ship">__TITLE__</div>
      <div class="sub">__SUBTITLE__</div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Filter the index&hellip;" aria-label="Filter index"></div>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="nav" aria-expanded="false">Browse wiki</button>
    <nav class="nav" id="nav" aria-label="Wiki pages"></nav>
  </aside>
  <main id="main"></main>
</div>
<button class="themebtn" id="themebtn" type="button">Theme</button>

<script>
const PAGES  = /*__PAGES__*/;
const TITLES = /*__TITLES__*/;
const BUILT  = "__BUILT__";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");
const navToggle = document.getElementById('nav-toggle');
function expandNav(expanded){
  nav.classList.toggle('expanded', expanded);
  navToggle.setAttribute('aria-expanded', String(expanded));
}
navToggle.addEventListener('click', () => expandNav(!nav.classList.contains('expanded')));
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + escapeHTML(p.title) + '</h1>';
  if(p.dek) h += '<div class="dek">' + escapeHTML(p.dek) + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.axis && p.type !== "floor") h += '<span class="tag">' + p.axisLabel + ' ' + p.axis + '</span>';
    if(p.statusLabel) h += '<span class="tag"><span class="st-' + p.statusTone + '">' + p.statusLabel + '</span></span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length && (!p.reference || p.referenceEntry)){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + escapeHTML(TITLES[b]) + '</a></li>').join('')
       + '</ul></div>';
  }

  if(p.reference) h += '<div class="foot">Rulebook reference from the supplied skills and spells JSON · Royal Court Edition. Printed and PDF page numbers are shown separately. Built ' + BUILT + '.</div>';
  else h += '<div class="foot">Generated from session recordings, transcribed with '
     + '<code>faster-whisper large-v3</code>. Names carry every surface form the transcripts '
     + 'produced; anything marked <em>needs review</em> or <em>low confidence</em> is waiting on '
     + 'confirmation before it becomes canon. Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(p.referenceEntry && !f && p.id !== current) return;
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + escapeHTML(p.title) + '</span>'
        + (p.axis && p.type !== "floor" ? '<span class="n">' + p.axis + '</span>'
           : (p.type !== "doc" && !p.reference && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : ''))
        + '</a>').join('')
    + '</div>').join('');
}

function filterReference(){
  const controls = main.querySelector('.reference-controls');
  if(!controls) return;
  const filters = Object.fromEntries(Array.from(controls.querySelectorAll('[data-filter]'), el => [el.dataset.filter, el.value.trim().toLowerCase()]));
  let count = 0;
  main.querySelectorAll('.reference-card').forEach(card => {
    const matches = Object.entries(filters).every(([key, value]) => !value ||
      (key === 'search' ? value.split(/\s+/).every(word => card.dataset.search.includes(word)) :
       key === 'traits' ? card.dataset.traits.toLowerCase().split('|').includes(value) : card.dataset[key].toLowerCase() === value));
    card.hidden = !matches;
    if(matches) count++;
  });
  main.querySelector('[data-reference-count]').textContent = count + ' matching entries';
  main.querySelector('[data-reference-empty]').hidden = count !== 0;
}
main.addEventListener('input', filterReference);
main.addEventListener('change', filterReference);
main.addEventListener('click', event => {
  if(event.target.closest('[data-reset-reference]')){
    main.querySelectorAll('[data-filter]').forEach(el => { el.value = ''; });
    filterReference();
  }
});

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  expandNav(false);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "__TITLE__";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); expandNav(true); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
</body>
</html>
