y 10 seconds outside of combat). if not, you heal 1 health bar slot every other round (or every 20 seconds outside of combat). {'5': 'after 5 minutes, any minor injury debuff you suffer from ends. after 10 minutes, any major injury debuff you suffer from ends.', '10': 'after 20 minutes, any long-term minor injury debuff you suffer from ends. after 1 hour, any long-term major injury debuff you suffer from ends.', '15': 'the time required to end injury debuffs is halved.'}"}, {"id": "skill-religion", "reference": true, "referenceEntry": true, "title": "Religion", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You have a knack for understanding gods, their followers, and what makes them tick. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you know the basic information about a god and the practices of their followers.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can identify the followers on sight, even if they’re trying to hide their affiliation.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You know how to sow discord among the followers of that religion.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You know strengths and weakness of the gods.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 197 · PDF pages 199\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">RELIGION\nIntelligence\nYou have a knack for understanding gods, their follow‑\ners, and what makes them tick. Make an Unopposed\nSkill Check.\nOn Success, you know the basic information about a\ngod and the practices of their followers.\nUPGRADES\nRank 5: You can identify the followers on sight, even if\nthey’re trying to hide their affiliation.\nRank 10: You know how to sow discord among the\nfollowers of that religion.\nRank 15: You know strengths and weakness of the\ngods.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "religion utility skills religion religion utility_skill intelligence intelligence false false false [] [] you have a knack for understanding gods, their followers, and what makes them tick. make an unopposed skill check.\n\non success, you know the basic information about a god and the practices of their followers. {'5': 'you can identify the followers on sight, even if they’re trying to hide their affiliation.', '10': 'you know how to sow discord among the followers of that religion.', '15': 'you know strengths and weakness of the gods.'}"}, {"id": "skill-repair", "reference": true, "referenceEntry": true, "title": "Repair", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>For basic repairs to items with no moving parts, magical or not.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>After spending 2 hours, you can repair most simple items that are broken or damaged but not destroyed. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you repair the item.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can make repairs to things with moving parts.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can make repairs in 1 hour.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can rebuild a destroyed item.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 197 · PDF pages 199\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">REPAIR\nIntelligence\nLimitations: For basic repairs to items with no moving\nparts, magical or not.\nAfter spending 2 hours, you can repair most simple\nitems that are broken or damaged but not destroyed.\nMake an Unopposed Skill Check.\nOn Success, you repair the item.\nUPGRADES\nRank 5: You can make repairs to things with moving\nparts.\nRank 10: You can make repairs in 1 hour.\nRank 15: You can rebuild a destroyed item.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "repair utility skills repair repair utility_skill intelligence intelligence false false false [] [] for basic repairs to items with no moving parts, magical or not. after spending 2 hours, you can repair most simple items that are broken or damaged but not destroyed. make an unopposed skill check.\n\non success, you repair the item. {'5': 'you can make repairs to things with moving parts.', '10': 'you can make repairs in 1 hour.', '15': 'you can rebuild a destroyed item.'}"}, {"id": "skill-riding", "reference": true, "referenceEntry": true, "title": "Riding", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>The rider in control of the mount rolls Attack Skill Checks with Disadvantage.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>While mounted on a living beast, you can ride to the local watering hole without needing to make a Check. But during an action scene or when exploring Giant Gopher Hole Flats, your mount might panic, and you might get tossed for 1d6 bludgeoning for every 10ft Move your mount has, plus its size value. Don’t land in a cactus patch! Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, your mount doesn’t stumble, and you stay upright.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your mount has +5ft Move. You no longer suffer Disadvantage when attacking while Riding.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Your mount has an additional +10ft Move. When other crawlers in your party roll this Skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your mount has an additional +15ft Move. When performing crazy stunts (like jumping through flames), roll with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 197 · PDF pages 199\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">RIDING\nDexterity\nLimitations: The rider in control of the mount rolls\nAttack Skill Checks with Disadvantage.\nWhile mounted on a living beast, you can ride to the\nlocal watering hole without needing to make a Check.\nBut during an action scene or when exploring Giant\nGopher Hole Flats, your mount might panic, and you\nmight get tossed for 1d6 bludgeoning for every 10ft\nMove your mount has, plus its size value. Don’t land in\na cactus patch! Make an Unopposed Skill Check.\nOn Success, your mount doesn’t stumble, and you\nstay upright.\nUPGRADES\nRank 5: Your mount has +5ft Move. You no longer\nsuffer Disadvantage when attacking while Riding.\nRank 10: Your mount has an additional +10ft Move.\nWhen other crawlers in your party roll this Skill un‑\ntrained, they roll as normal (not with Disadvantage).\nRank 15: Your mount has an additional +15ft Move.\nWhen performing crazy stunts (like jumping through\nflames), roll with Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "riding utility skills riding riding utility_skill dexterity dexterity false false false [] [] the rider in control of the mount rolls attack skill checks with disadvantage. while mounted on a living beast, you can ride to the local watering hole without needing to make a check. but during an action scene or when exploring giant gopher hole flats, your mount might panic, and you might get tossed for 1d6 bludgeoning for every 10ft move your mount has, plus its size value. don’t land in a cactus patch! make an unopposed skill check.\n\non success, your mount doesn’t stumble, and you stay upright. {'5': 'your mount has +5ft move. you no longer suffer disadvantage when attacking while riding.', '10': 'your mount has an additional +10ft move. when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).', '15': 'your mount has an additional +15ft move. when performing crazy stunts (like jumping through flames), roll with advantage.'}"}, {"id": "skill-ropework", "reference": true, "referenceEntry": true, "title": "Ropework", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You know a half hitch from a clove hitch, and the qualities of hemp vs. nylon (we had to look it up). Sadly, this knowledge is mostly used to tie people up so you can tor—interrogate them, but you’re going to buck that trend, right? Just climbing and cattle-rustling for you!\u003c/p>\u003cp>Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you rope the thing with a good knot.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can now use this Skill as an Attack, at a Range of 10ft vs. the target’s Evade. On Success, the target gains the Held Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can whip your line in that special way to untie a knot you made and recover your rope.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your Attack now has a Range of your Strength (min 15). Just make sure your rope is long enough.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 197 · PDF pages 199\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ROPEWORK\nDexterity\nYou know a half hitch from a clove hitch, and the quali‑\nties of hemp vs. nylon (we had to look it up). Sadly, this\nknowledge is mostly used to tie people up so you can\ntor—interrogate them, but you’re going to buck that\ntrend, right? Just climbing and cattle-rustling for you!\nMake an Unopposed Skill Check.\nOn Success, you rope the thing with a good knot.\nUPGRADES\nRank 5: You can now use this Skill as an Attack, at a\nRange of 10ft vs. the target’s Evade. On Success, the\ntarget gains the Held Debuff.\nRank 10: You can whip your line in that special way to\nuntie a knot you made and recover your rope.\nRank 15: Your Attack now has a Range of your\nStrength (min 15). Just make sure your rope is long\nenough.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "ropework utility skills ropework ropework utility_skill dexterity dexterity false false false [] [] you know a half hitch from a clove hitch, and the qualities of hemp vs. nylon (we had to look it up). sadly, this knowledge is mostly used to tie people up so you can tor—interrogate them, but you’re going to buck that trend, right? just climbing and cattle-rustling for you!\n\nmake an unopposed skill check.\n\non success, you rope the thing with a good knot. {'5': 'you can now use this skill as an attack, at a range of 10ft vs. the target’s evade. on success, the target gains the held debuff.', '10': 'you can whip your line in that special way to untie a knot you made and recover your rope.', '15': 'your attack now has a range of your strength (min 15). just make sure your rope is long enough.'}"}, {"id": "skill-running", "reference": true, "referenceEntry": true, "title": "Running", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>For short bursts of running. For extended runs, use Endurance instead (p. 190).\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You don’t need to use this Skill if you’re running down a hallway to attack some Mobs. But if you’re racing, chasing, or need to get away from a ticking time bomb, this is the Skill you want. See Racing &amp; Chasing, p. 73. Make an Unopposed Skill Check every minute, not every round. Add 1 to your result for every 10ft of Move you have.\u003c/p>\u003cp>On Success, you succeed in the run.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You have a permanent +5ft Move Buff. Make a Check every 2 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You have an additional permanent +10ft Move Buff. Make a Check every 4 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You have an additional permanent +15ft Move Buff. Make a Check every 6 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 197–198 · PDF pages 199–200\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">RUNNING\nDexterity\nLimitations: For short bursts of running. For extended\nruns, use Endurance instead (p. 190).\nYou don’t need to use this Skill if you’re running down a\nhallway to attack some Mobs. But if you’re racing, chas‑\ning, or need to get away from a ticking time bomb, this\nis the Skill you want. See Racing &amp; Chasing, p. 73.\nMake an Unopposed Skill Check every minute, not every\nround. Add 1 to your result for every 10ft of Move you have.\nOn Success, you succeed in the run.\nUPGRADES\nRank 5: You have a permanent +5ft Move Buff. Make\na Check every 2 minutes.\nRank 10: You have an additional permanent +10ft\nMove Buff. Make a Check every 4 minutes.\nRank 15: You have an additional permanent +15ft\nMove Buff. Make a Check every 6 minutes.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "running utility skills running running utility_skill dexterity dexterity false false false [] [] for short bursts of running. for extended runs, use endurance instead (p. 190). you don’t need to use this skill if you’re running down a hallway to attack some mobs. but if you’re racing, chasing, or need to get away from a ticking time bomb, this is the skill you want. see racing & chasing, p. 73. make an unopposed skill check every minute, not every round. add 1 to your result for every 10ft of move you have.\n\non success, you succeed in the run. {'5': 'you have a permanent +5ft move buff. make a check every 2 minutes.', '10': 'you have an additional permanent +10ft move buff. make a check every 4 minutes.', '15': 'you have an additional permanent +15ft move buff. make a check every 6 minutes.'}"}, {"id": "skill-salvage", "reference": true, "referenceEntry": true, "title": "Salvage", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Salvage cannot be used with explosive devices.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Salvage is the art of collecting useful items from things you have deconstructed or failed to properly craft. See Crafting, p. 221.\u003c/p>\u003cp>Salvaging usually takes 1 hour to accomplish. At the end of that time, make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you recover half of the important raw materials.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your Salvage Checks take 30 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>On Success, you recover all of the important raw materials.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>On a crafting Standard Fail or Near Miss, roll your crafting Check again with Advantage, with an additional 15-minute time expenditure.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 198 · PDF pages 200\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SALVAGE\nIntelligence\nLimitations: Salvage cannot be used with explosive\ndevices.\nSalvage is the art of collecting useful items from things\nyou have deconstructed or failed to properly craft. See\nCrafting, p. 221.\nSalvaging usually takes 1 hour to accomplish. At the\nend of that time, make an Unopposed Skill Check.\nOn Success, you recover half of the important raw materials.\nUPGRADES\nRank 5: Your Salvage Checks take 30 minutes.\nRank 10: On Success, you recover all of the important\nraw materials.\nRank 15: On a crafting Standard Fail or Near Miss,\nroll your crafting Check again with Advantage, with an\nadditional 15-minute time expenditure.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "salvage utility skills salvage salvage utility_skill intelligence intelligence false false false [] [] salvage cannot be used with explosive devices. salvage is the art of collecting useful items from things you have deconstructed or failed to properly craft. see crafting, p. 221.\n\nsalvaging usually takes 1 hour to accomplish. at the end of that time, make an unopposed skill check.\n\non success, you recover half of the important raw materials. {'5': 'your salvage checks take 30 minutes.', '10': 'on success, you recover all of the important raw materials.', '15': 'on a crafting standard fail or near miss, roll your crafting check again with advantage, with an additional 15-minute time expenditure.'}"}, {"id": "skill-scutelliphily", "reference": true, "referenceEntry": true, "title": "Scutelliphily", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>This Limited Skill can only be learned via a Race, Class, or item.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You know your way around patches and love collecting them. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you are able to identify a patch and its bonus level, if any.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can sew and iron patches onto clothing using this Skill.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may use this as a crafting Skill, but crafting tables provide no bonuses. Enchanted patches are limited to one per Gear slot and do not take up Accessory slots. See Crafting, p. 221.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your crafting Checks take half the time. Increase the bonus value of your enchantments with this Skill by 1, at no additional Difficulty or time to craft. Example: If you craft a +2 Strength patch, it becomes a +3 Strength patch.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 198 · PDF pages 200\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SCUTELLIPHILY\nIntelligence\nLimitations: This Limited Skill can only be learned via\na Race, Class, or item.\nYou know your way around patches and love collecting\nthem. Make an Unopposed Skill Check.\nOn Success, you are able to identify a patch and its\nbonus level, if any.\nUPGRADES\nRank 5: You can sew and iron patches onto clothing\nusing this Skill.\nRank 10: You may use this as a crafting Skill, but\ncrafting tables provide no bonuses. Enchanted patches\nare limited to one per Gear slot and do not take up\nAccessory slots. See Crafting, p. 221.\nRank 15: Your crafting Checks take half the time. In‑\ncrease the bonus value of your enchantments with this\nSkill by 1, at no additional Difficulty or time to craft.\nExample: If you craft a +2 Strength patch, it becomes\na +3 Strength patch.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "scutelliphily utility skills scutelliphily scutelliphily utility_skill intelligence intelligence false false false [] [] this limited skill can only be learned via a race, class, or item. you know your way around patches and love collecting them. make an unopposed skill check.\n\non success, you are able to identify a patch and its bonus level, if any. {'5': 'you can sew and iron patches onto clothing using this skill.', '10': 'you may use this as a crafting skill, but crafting tables provide no bonuses. enchanted patches are limited to one per gear slot and do not take up accessory slots. see crafting, p. 221.', '15': 'your crafting checks take half the time. increase the bonus value of your enchantments with this skill by 1, at no additional difficulty or time to craft. example: if you craft a +2 strength patch, it becomes a +3 strength patch.'}"}, {"id": "skill-shield-block", "reference": true, "referenceEntry": true, "title": "Shield Block", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength, Interrupt\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires you to be wielding a shield. Cannot be used against Area of Effect damage. A successful Shield Block still counts as “a hit crawler” or “a crawler who failed to Evade.”\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You’re one of those types. You like a big slab of wood or metal between you and the beasties. When you are attacked by a physical Attack, spend one Action to make a separate Shield Block Skill Check vs. the Mob’s “to hit” for each of the Attacks targeting you. If 3 physical Attacks are directed at you, roll this Skill Check 3 times. Where an Evade Check is called for, ask your GM if you can use this Skill.\u003c/p>\u003cp>On Success, take half the damage before applying your DR. Your Shield takes a -1 DR penalty on a Major Fail; -2 on a Critical Fail. It breaks at 0 DR. However, a broken shield and lost DR can be Repaired.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may also use this Skill against Spells and magical damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>On a Critical Hit, you may make a Shield Bash Attack as a free melee-range Interrupt Attack (instead of Advantage on your next Attack) if you wish, dealing 3d6 base damage + Str Bludgeoning.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 Shield Bash damage. Further reduce the damage you would take by your Str Mod. Example: After halving 30 damage down to 15, your Str Mod of 5 reduces it to 10 damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 198 · PDF pages 200\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SHIELD BLOCK\nStrength, Interrupt\nLimitations: Requires you to be wielding a shield.\nCannot be used against Area of Effect damage. A suc‑\ncessful Shield Block still counts as “a hit crawler” or “a\ncrawler who failed to Evade.”\nYou’re one of those types. You like a big slab of wood\nor metal between you and the beasties. When you\nare attacked by a physical Attack, spend one Action\nto make a separate Shield Block Skill Check vs. the\nMob’s “to hit” for each of the Attacks targeting you.\nIf 3 physical Attacks are directed at you, roll this Skill\nCheck 3 times. Where an Evade Check is called for, ask\nyour GM if you can use this Skill.\nOn Success, take half the damage before applying\nyour DR. Your Shield takes a -1 DR penalty on a Major\nFail; -2 on a Critical Fail. It breaks at 0 DR. However, a\nbroken shield and lost DR can be Repaired.\nUPGRADES\nRank 5: You may also use this Skill against Spells and\nmagical damage.\nRank 10: On a Critical Hit, you may make a Shield\nBash Attack as a free melee-range Interrupt Attack\n(instead of Advantage on your next Attack) if you wish,\ndealing 3d6 base damage + Str Bludgeoning.\nRank 15: +1d6 Shield Bash damage. Further reduce\nthe damage you would take by your Str Mod. Example:\nAfter halving 30 damage down to 15, your Str Mod of\n5 reduces it to 10 damage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "shield block utility skills shield-block shield block utility_skill strength, interrupt strength false true false [] [] requires you to be wielding a shield. cannot be used against area of effect damage. a successful shield block still counts as “a hit crawler” or “a crawler who failed to evade.” you’re one of those types. you like a big slab of wood or metal between you and the beasties. when you are attacked by a physical attack, spend one action to make a separate shield block skill check vs. the mob’s “to hit” for each of the attacks targeting you. if 3 physical attacks are directed at you, roll this skill check 3 times. where an evade check is called for, ask your gm if you can use this skill.\n\non success, take half the damage before applying your dr. your shield takes a -1 dr penalty on a major fail; -2 on a critical fail. it breaks at 0 dr. however, a broken shield and lost dr can be repaired. {'5': 'you may also use this skill against spells and magical damage.', '10': 'on a critical hit, you may make a shield bash attack as a free melee-range interrupt attack (instead of advantage on your next attack) if you wish, dealing 3d6 base damage + str bludgeoning.', '15': '+1d6 shield bash damage. further reduce the damage you would take by your str mod. example: after halving 30 damage down to 15, your str mod of 5 reduces it to 10 damage.'}"}, {"id": "skill-shotgun", "reference": true, "referenceEntry": true, "title": "Shotgun", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d10 Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield. Each Attack requires proper ammunition. Spend one Action to reload after a Major Fail or worse.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d10 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d10 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d10 base damage, +5ft Splash\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 182 · PDF pages 184\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SHOTGUN\nRanged Attack, Dex\nRange: 30 feet\nLimitations: Requires two hands to wield. Each Attack\nrequires proper ammunition. Spend one Action to\nreload after a Major Fail or worse.\nBase Damage: 1d10 Piercing\nUPGRADES\nRank 5: +1d10 base damage\nRank 10: +1d10 base damage\nRank 15: +1d10 base damage, +5ft Splash\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "shotgun ranged weapon skills shotgun shotgun attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['piercing'] 30 feet requires two hands to wield. each attack requires proper ammunition. spend one action to reload after a major fail or worse. 1d10 piercing {'5': '+1d10 base damage', '10': '+1d10 base damage', '15': '+1d10 base damage, +5ft splash'}"}, {"id": "skill-shuriken", "reference": true, "referenceEntry": true, "title": "Shuriken", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and the range is 40 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and you may make an extra free attack with Disadvantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and you may make an extra free attack with Disadvantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 182 · PDF pages 184\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SHURIKEN\nRanged Attack, Dex\nRange: 30 feet\nAI Favor: 1\nBase Damage: 1d4 + Str Piercing\nUPGRADES\nRank 5: +1d4 base damage, and the range is 40 feet.\nRank 10: +1d4 base damage, and you may make an\nextra free attack with Disadvantage.\nRank 15: +1d4 base damage, and you may make an\nextra free attack with Disadvantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "shuriken ranged weapon skills shuriken shuriken attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['piercing'] 30 feet 1 1d4 + str piercing {'5': '+1d4 base damage, and the range is 40 feet.', '10': '+1d4 base damage, and you may make an extra free attack with disadvantage.', '15': '+1d4 base damage, and you may make an extra free attack with disadvantage.'}"}, {"id": "skill-skullcracker", "reference": true, "referenceEntry": true, "title": "Skullcracker", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Noggin Nocker Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>If the target is the same size as you, gain +1d4 base damage.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Noggin Nocker\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-noggin-nocker\">Noggin Nocker\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage if target is the same size as you.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>If the target is the same size as you, add 1 Rank damage die, and the target gains the Stunned Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>If the target is the same size as you, add 1 Rank damage die, and the target gains the Blood Trail Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 180 · PDF pages 182\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SKULLCRACKER\nNoggin Nocker Damage Effect, Passive\nIf the target is the same size as you, gain +1d4 base\ndamage.\nUPGRADES\nRank 5: +1d4 base damage if target is the same size\nas you.\nRank 10: If the target is the same size as you, add\n1 Rank damage die, and the target gains the\nStunned Debuff.\nRank 15: If the target is the same size as you, add 1\nRank damage die, and the target gains the Blood Trail\nDebuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "skullcracker hand-to-hand damage effect skills skullcracker skullcracker attack_skill hand-to-hand damage effect skills noggin nocker damage effect, passive true false false noggin nocker [] [] if the target is the same size as you, gain +1d4 base damage. {'5': '+1d4 base damage if target is the same size as you.', '10': 'if the target is the same size as you, add 1 rank damage die, and the target gains the stunned debuff.', '15': 'if the target is the same size as you, add 1 rank damage die, and the target gains the blood trail debuff.'}"}, {"id": "skill-sleight-of-hand", "reference": true, "referenceEntry": true, "title": "Sleight of Hand", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Items you manipulate must be smaller than the size of your hand. You cannot access others’ Inventories or Hotlists.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You’ve learned to manipulate small objects without being spotted. Great for shoplifting. Make an Int-Opposed Skill Check. If someone’s Perception is a higher Rank than your Sleight of Hand, you have Disadvantage.\u003c/p>\u003cp>On Success, you maneuver the item without being noticed.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may attempt to pick the pockets of NPCs and Mobs.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may attempt to plant items on someone with pockets or the equivalent.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You may manipulate items up to half your own size (rounded down).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 198–199 · PDF pages 200–201\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SLEIGHT OF HAND\nDexterity\nLimitations: Items you manipulate must be smaller\nthan the size of your hand. You cannot access others’\nInventories or Hotlists.\nYou’ve learned to manipulate small objects without being\nspotted. Great for shoplifting. Make an Int-Opposed Skill\nCheck. If someone’s Perception is a higher Rank than\nyour Sleight of Hand, you have Disadvantage.\nOn Success, you maneuver the item without being noticed.\nUPGRADES\nRank 5: You may attempt to pick the pockets of NPCs\nand Mobs.\nRank 10: You may attempt to plant items on someone\nwith pockets or the equivalent.\nRank 15: You may manipulate items up to half your\nown size (rounded down).\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "sleight of hand utility skills sleight-of-hand sleight of hand utility_skill dexterity dexterity false false false [] [] items you manipulate must be smaller than the size of your hand. you cannot access others’ inventories or hotlists. you’ve learned to manipulate small objects without being spotted. great for shoplifting. make an int-opposed skill check. if someone’s perception is a higher rank than your sleight of hand, you have disadvantage.\n\non success, you maneuver the item without being noticed. {'5': 'you may attempt to pick the pockets of npcs and mobs.', '10': 'you may attempt to plant items on someone with pockets or the equivalent.', '15': 'you may manipulate items up to half your own size (rounded down).'}"}, {"id": "skill-slice-attack", "reference": true, "referenceEntry": true, "title": "Slice Attack", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Animal Crawler & Pet Strike Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Slashing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Slashing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+2d4 base damage\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 177 · PDF pages 179\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SLICE ATTACK\nMelee Attack, Dex\nAI Favor: 1\nBase Damage: 1d4 + Str Slashing\nUPGRADES\nRank 5: +1d4 base damage\nRank 10: +1d4 base damage\nRank 15: +2d4 base damage\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "slice attack animal crawler & pet strike skills slice-attack slice attack attack_skill animal crawler & pet strike skills melee attack, dex dexterity false false false melee [] ['slashing'] 1 1d4 + str slashing {'5': '+1d4 base damage', '10': '+1d4 base damage', '15': '+2d4 base damage'}"}, {"id": "skill-slingshot", "reference": true, "referenceEntry": true, "title": "Slingshot", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d2 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d2 base damage, and its range increases by your Strength score in feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d2 base damage, and add 1 Rank damage die.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d2 base damage, and add 1 Rank damage die. Reach weapons allow you to make melee attacks against foes up to 10 feet away but not through occu-pied spaces. You may attack diagonally through the junction of two spaces as long as at least one of those spaces is unoccupied.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 182 · PDF pages 184\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SLINGSHOT\nRanged Attack, Dex\nRange: 30 feet\nAI Favor: 2\nLimitations: Requires two hands to wield.\nBase Damage: 1d2 + Str Bludgeoning\nUPGRADES\nRank 5: +1d2 base damage, and its range increases\nby your Strength score in feet.\nRank 10: +1d2 base damage, and add 1 Rank damage die.\nRank 15: +1d2 base damage, and add 1 Rank damage die.\nReach weapons allow you to make melee attacks\nagainst foes up to 10 feet away but not through occu-\npied spaces. You may attack diagonally through the\njunction of two spaces as long as at least one of those\nspaces is unoccupied.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "slingshot ranged weapon skills slingshot slingshot attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['bludgeoning'] 30 feet 2 requires two hands to wield. 1d2 + str bludgeoning {'5': '+1d2 base damage, and its range increases by your strength score in feet.', '10': '+1d2 base damage, and add 1 rank damage die.', '15': '+1d2 base damage, and add 1 rank damage die. reach weapons allow you to make melee attacks against foes up to 10 feet away but not through occu-pied spaces. you may attack diagonally through the junction of two spaces as long as at least one of those spaces is unoccupied.'}"}, {"id": "skill-smithing", "reference": true, "referenceEntry": true, "title": "Smithing", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You may craft mundane items such as horseshoes, railroad spikes, nails, or the fun stuff: armor and weapons, but without DR or any bonuses. See Crafting, p. 221.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may craft items up to a +5 bonus.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may craft items up to a +10 bonus.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your crafting with this Skill takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 199 · PDF pages 201\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SMITHING\nStrength\nYou may craft mundane items such as horseshoes,\nrailroad spikes, nails, or the fun stuff: armor and\nweapons, but without DR or any bonuses. See Crafting,\np. 221.\nUPGRADES\nRank 5: You may craft items up to a +5 bonus.\nRank 10: You may craft items up to a +10 bonus.\nRank 15: Your crafting with this Skill takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "smithing utility skills smithing smithing utility_skill strength strength false false false [] [] you may craft mundane items such as horseshoes, railroad spikes, nails, or the fun stuff: armor and weapons, but without dr or any bonuses. see crafting, p. 221. {'5': 'you may craft items up to a +5 bonus.', '10': 'you may craft items up to a +10 bonus.', '15': 'your crafting with this skill takes half the time.'}"}, {"id": "skill-smush", "reference": true, "referenceEntry": true, "title": "Smush", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Foot Soldier Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>Once per round.\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>You can only apply this Damage Effect to targets with 20% Health Bar or less.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You deal ×2 the total damage.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Foot Soldier\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-foot-soldier\">Foot Soldier\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Smush activates at 30% Health Bar or less and deals ×3 the total damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>This skill has no cooldown.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Smush activates at 40% Health Bar or less and deals ×4 the total damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 181 · PDF pages 183\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SMUSH\nFoot Soldier Damage Effect, Passive\nLimitations: You can only apply this Damage Effect to\ntargets with 20% Health Bar or less.\nCooldown: Once per round.\nYou deal ×2 the total damage.\nUPGRADES\nRank 5: Smush activates at 30% Health Bar or less\nand deals ×3 the total damage.\nRank 10: This skill has no cooldown.\nRank 15: Smush activates at 40% Health Bar or less\nand deals ×4 the total damage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "smush hand-to-hand damage effect skills smush smush attack_skill hand-to-hand damage effect skills foot soldier damage effect, passive true false false foot soldier [] [] once per round. you can only apply this damage effect to targets with 20% health bar or less. you deal ×2 the total damage. {'5': 'smush activates at 30% health bar or less and deals ×3 the total damage.', '10': 'this skill has no cooldown.', '15': 'smush activates at 40% health bar or less and deals ×4 the total damage.'}"}, {"id": "skill-stealth", "reference": true, "referenceEntry": true, "title": "Stealth", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>You must be out of sight of all foes to begin this Check.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill if you want to move undetected or surprise a Mob. Make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success before combat starts, you are unnoticed and gain 1 non-Attack Action. Don’t forget to take your 10ft Step!\u003c/p>\u003cp>On Success in a non-combat situation, you remain unnoticed and can perform a Move Action with a 10ft Step as part of this Check.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your surprise Action can be an Attack with Advantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When other crawlers in your party roll this Skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>On a successful Surprise Check, you may also take a full Move and Step. If you Attack with your Surprise Action, deal ×2 the base damage dice.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 199 · PDF pages 201\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">STEALTH\nDexterity\nLimitations: You must be out of sight of all foes to\nbegin this Check.\nUse this Skill if you want to move undetected or sur‑\nprise a Mob. Make an Int-Opposed Skill Check.\nOn Success before combat starts, you are unnoticed\nand gain 1 non-Attack Action. Don’t forget to take\nyour 10ft Step!\nOn Success in a non-combat situation, you remain\nunnoticed and can perform a Move Action with a 10ft\nStep as part of this Check.\nUPGRADES\nRank 5: Your surprise Action can be an Attack with\nAdvantage.\nRank 10: When other crawlers in your party roll this Skill\nuntrained, they roll as normal (not with Disadvantage).\nRank 15: On a successful Surprise Check, you may\nalso take a full Move and Step. If you Attack with your\nSurprise Action, deal ×2 the base damage dice.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "stealth utility skills stealth stealth utility_skill dexterity dexterity false false false [] [] you must be out of sight of all foes to begin this check. use this skill if you want to move undetected or surprise a mob. make an int-opposed skill check.\n\non success before combat starts, you are unnoticed and gain 1 non-attack action. don’t forget to take your 10ft step!\n\non success in a non-combat situation, you remain unnoticed and can perform a move action with a 10ft step as part of this check. {'5': 'your surprise action can be an attack with advantage.', '10': 'when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).', '15': 'on a successful surprise check, you may also take a full move and step. if you attack with your surprise action, deal ×2 the base damage dice.'}"}, {"id": "skill-streetwise", "reference": true, "referenceEntry": true, "title": "Streetwise", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill in populated areas to learn or spread rumors, avoid attracting too much attention, gain access to less-than-legal items, and the like. Make an Unopposed Skill Check. On Success, you navigate a town without attracting attention, deal with a criminal network, identify an informal power structure, or gain the information you’re seeking.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You also hear an additional rumor, as determined by the GM. Or spread one!\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You also quickly find a hiding place determined by the GM.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You also uncover information that might give you some leverage on an important person in town determined by the GM.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 199 · PDF pages 201\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">STREETWISE\nCharisma\nUse this Skill in populated areas to learn or spread ru‑\nmors, avoid attracting too much attention, gain access\nto less-than-legal items, and the like. Make an Unop‑\nposed Skill Check.\nOn Success, you navigate a town without attracting\nattention, deal with a criminal network, identify an informal\npower structure, or gain the information you’re seeking.\nUPGRADES\nRank 5: You also hear an additional rumor, as deter‑\nmined by the GM. Or spread one!\nRank 10: You also quickly find a hiding place deter‑\nmined by the GM.\nRank 15: You also uncover information that might give\nyou some leverage on an important person in town\ndetermined by the GM.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "streetwise utility skills streetwise streetwise utility_skill charisma charisma false false false [] [] use this skill in populated areas to learn or spread rumors, avoid attracting too much attention, gain access to less-than-legal items, and the like. make an unopposed skill check. on success, you navigate a town without attracting attention, deal with a criminal network, identify an informal power structure, or gain the information you’re seeking. {'5': 'you also hear an additional rumor, as determined by the gm. or spread one!', '10': 'you also quickly find a hiding place determined by the gm.', '15': 'you also uncover information that might give you some leverage on an important person in town determined by the gm.'}"}, {"id": "skill-survival", "reference": true, "referenceEntry": true, "title": "Survival", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Constitution\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Constitution\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You know how to survive in dangerous, often remote places for long periods of time with only the meager food and water you can rustle up. When traveling through such areas, make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you survive the perils of the conditions unscathed. On a standard Fail, you suffer the effects of hunger and/or thirst (see p. 76).\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You do not suffer additional damage from a Critical Fail.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When other crawlers in your party roll this Skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You do not suffer additional damage from a Major Fail.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 199 · PDF pages 201\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SURVIVAL\nConstitution\nYou know how to survive in dangerous, often remote\nplaces for long periods of time with only the meager\nfood and water you can rustle up. When traveling\nthrough such areas, make an Unopposed Skill Check.\nOn Success, you survive the perils of the conditions\nunscathed. On a standard Fail, you suffer the effects of\nhunger and/or thirst (see p. 76).\nUPGRADES\nRank 5: You do not suffer additional damage from a\nCritical Fail.\nRank 10: When other crawlers in your party roll\nthis Skill untrained, they roll as normal (not with\nDisadvantage).\nRank 15: You do not suffer additional damage from a\nMajor Fail.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "survival utility skills survival survival utility_skill constitution constitution false false false [] [] you know how to survive in dangerous, often remote places for long periods of time with only the meager food and water you can rustle up. when traveling through such areas, make an unopposed skill check.\n\non success, you survive the perils of the conditions unscathed. on a standard fail, you suffer the effects of hunger and/or thirst (see p. 76). {'5': 'you do not suffer additional damage from a critical fail.', '10': 'when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).', '15': 'you do not suffer additional damage from a major fail.'}"}, {"id": "skill-swimming", "reference": true, "referenceEntry": true, "title": "Swimming", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>After 1 minute of Swimming (Success or Fail) or immediately on a Major Fail or worse, gain the Fatigued Debuff.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill when there are consequences for not swimming strongly or well rather than when you’re taking a casual swim. For instance, if you’re racing for your life, swimming against a strong current, or trying to get to shore to avoid a waterfall. In these cases, make an Unopposed Skill Check every 30 seconds.\u003c/p>\u003cp>On Success, you swim well despite the danger. For swimming during combat, see Special Forms of Move-ment, p. 70.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>After 2 minutes of Swimming (Success or Fail), gain the Fatigued Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can swim at your full Move rate as an Action, but you still can’t take a 10ft Step.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Make this Check every 5 minutes, and only gain the Fatigue Debuff on a Critical Fail.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 199–200 · PDF pages 201–202\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SWIMMING\nStrength\nLimitations: After 1 minute of Swimming (Success or\nFail) or immediately on a Major Fail or worse, gain the\nFatigued Debuff.\nUse this Skill when there are consequences for not\nswimming strongly or well rather than when you’re\ntaking a casual swim. For instance, if you’re racing for\nyour life, swimming against a strong current, or trying\nto get to shore to avoid a waterfall. In these cases,\nmake an Unopposed Skill Check every 30 seconds.\nOn Success, you swim well despite the danger. For\nswimming during combat, see Special Forms of Move-\nment, p. 70.\nUPGRADES\nRank 5: After 2 minutes of Swimming (Success or\nFail), gain the Fatigued Debuff.\nRank 10: You can swim at your full Move rate as an\nAction, but you still can’t take a 10ft Step.\nRank 15: Make this Check every 5 minutes, and only\ngain the Fatigue Debuff on a Critical Fail.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "swimming utility skills swimming swimming utility_skill strength strength false false false [] [] after 1 minute of swimming (success or fail) or immediately on a major fail or worse, gain the fatigued debuff. use this skill when there are consequences for not swimming strongly or well rather than when you’re taking a casual swim. for instance, if you’re racing for your life, swimming against a strong current, or trying to get to shore to avoid a waterfall. in these cases, make an unopposed skill check every 30 seconds.\n\non success, you swim well despite the danger. for swimming during combat, see special forms of move-ment, p. 70. {'5': 'after 2 minutes of swimming (success or fail), gain the fatigued debuff.', '10': 'you can swim at your full move rate as an action, but you still can’t take a 10ft step.', '15': 'make this check every 5 minutes, and only gain the fatigue debuff on a critical fail.'}"}, {"id": "skill-tactics", "reference": true, "referenceEntry": true, "title": "Tactics", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>A crawler may attempt this Skill Check only once per combat.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Your tactical mind and directions can spur your allies to victory. Choose one of the following combat disciplines: Attack, Damage, or Evade, and then make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you and each member of your party gain a +1 bonus to Checks for the chosen discipline. Increase the bonus by +1 for each higher degree of Success.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>If you observe the foes and battlefield for at least 5 minutes prior to combat, roll this Skill Check with Advantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>After using this Skill during a combat, you roll 2d10 when you Call a Play (still choose one die).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The bonus applies to all three combat disciplines instead of just one.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 200 · PDF pages 202\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TACTICS\nIntelligence\nLimitations: A crawler may attempt this Skill Check\nonly once per combat.\nYour tactical mind and directions can spur your allies\nto victory. Choose one of the following combat disci‑\nplines: Attack, Damage, or Evade, and then make an\nUnopposed Skill Check.\nOn Success, you and each member of your party\ngain a +1 bonus to Checks for the chosen discipline.\nIncrease the bonus by +1 for each higher degree of\nSuccess.\nUPGRADES\nRank 5: If you observe the foes and battlefield for at\nleast 5 minutes prior to combat, roll this Skill Check\nwith Advantage.\nRank 10: After using this Skill during a combat, you\nroll 2d10 when you Call a Play (still choose one die).\nRank 15: The bonus applies to all three combat disci‑\nplines instead of just one.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "tactics utility skills tactics tactics utility_skill intelligence intelligence false false false [] [] a crawler may attempt this skill check only once per combat. your tactical mind and directions can spur your allies to victory. choose one of the following combat disciplines: attack, damage, or evade, and then make an unopposed skill check.\n\non success, you and each member of your party gain a +1 bonus to checks for the chosen discipline. increase the bonus by +1 for each higher degree of success. {'5': 'if you observe the foes and battlefield for at least 5 minutes prior to combat, roll this skill check with advantage.', '10': 'after using this skill during a combat, you roll 2d10 when you call a play (still choose one die).', '15': 'the bonus applies to all three combat disciplines instead of just one.'}"}, {"id": "skill-tattoo-artistry", "reference": true, "referenceEntry": true, "title": "Tattoo Artistry", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Used to stick and poke ink under someone’s skin to create a mundane tattoo. See Crafting, p. 221 for magical tattoos.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may craft tattoos with up to a +5 bonus.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may craft tattoos with up to a +10 bonus.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your crafting with this Skill takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 200 · PDF pages 202\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TATTOO ARTISTRY\nDexterity\nUsed to stick and poke ink under someone’s skin to\ncreate a mundane tattoo. See Crafting, p. 221 for mag‑\nical tattoos.\nUPGRADES\nRank 5: You may craft tattoos with up to a +5 bonus.\nRank 10: You may craft tattoos with up to a +10 bonus.\nRank 15: Your crafting with this Skill takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "tattoo artistry utility skills tattoo-artistry tattoo artistry utility_skill dexterity dexterity false false false [] [] used to stick and poke ink under someone’s skin to create a mundane tattoo. see crafting, p. 221 for magical tattoos. {'5': 'you may craft tattoos with up to a +5 bonus.', '10': 'you may craft tattoos with up to a +10 bonus.', '15': 'your crafting with this skill takes half the time.'}"}, {"id": "skill-taunt", "reference": true, "referenceEntry": true, "title": "Taunt", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma, Interrupt\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>With a shout, some choice words, and maybe an obscene hand gesture, you attempt to draw the ire of enemies within 30 feet of you. After seeing where the Mob Attacks are headed, make an Int-Opposed Skill Check. On Success, Taunt one Attack of your choosing away from any target of your choosing and onto you. Higher degrees of Success allow you to Taunt additional Attacks onto you.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may make a free Evade Check against each Taunted Attack (roll separately vs. each Attack as usual). Then you may still spend an Action to Evade other Attacks and reroll any Fails from your free Evades.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can affect Mobs within 60 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your free Evade Checks against Taunted Attacks are made with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 200 · PDF pages 202\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TAUNT\nCharisma, Interrupt\nWith a shout, some choice words, and maybe an\nobscene hand gesture, you attempt to draw the ire of\nenemies within 30 feet of you. After seeing where the\nMob Attacks are headed, make an Int-Opposed Skill\nCheck.\nOn Success, Taunt one Attack of your choosing away\nfrom any target of your choosing and onto you. Higher\ndegrees of Success allow you to Taunt additional\nAttacks onto you.\nUPGRADES\nRank 5: You may make a free Evade Check against\neach Taunted Attack (roll separately vs. each Attack\nas usual). Then you may still spend an Action to Evade\nother Attacks and reroll any Fails from your free\nEvades.\nRank 10: You can affect Mobs within 60 feet.\nRank 15: Your free Evade Checks against Taunted\nAttacks are made with Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "taunt utility skills taunt taunt utility_skill charisma, interrupt charisma false true false [] [] with a shout, some choice words, and maybe an obscene hand gesture, you attempt to draw the ire of enemies within 30 feet of you. after seeing where the mob attacks are headed, make an int-opposed skill check. on success, taunt one attack of your choosing away from any target of your choosing and onto you. higher degrees of success allow you to taunt additional attacks onto you. {'5': 'you may make a free evade check against each taunted attack (roll separately vs. each attack as usual). then you may still spend an action to evade other attacks and reroll any fails from your free evades.', '10': 'you can affect mobs within 60 feet.', '15': 'your free evade checks against taunted attacks are made with advantage.'}"}, {"id": "skill-throwing", "reference": true, "referenceEntry": true, "title": "Throwing", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>This Skill is used for passing the pigskin with your pops or throwing dynamite (potentially also at your pops).\u003c/p>\u003cp>You can Throw an object that weighs up to your Str in pounds at a distance of up to your Str ×10 feet. If you want to Throw a heavier or bulkier item (up to the GM’s discretion), you do so with Disadvantage.\u003c/p>\u003cp>To hit a target area, make an Unopposed Skill Check.\u003c/p>\u003cp>To hit a foe with an object, make an Attack Skill Check vs. the target’s Evade.\u003c/p>\u003cp>On Success, you hit the target. On Fail, roll 1d8 for direction (see Figure 3). The amount the Skill Check missed by is the distance away in feet it lands.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You have Advantage when Throwing to a target who wants to catch what you are selling.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Choose the direction on a miss, rather than roll.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your Throw range is your Str ×20 feet.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 200–201 · PDF pages 202–203\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">THROWING\nStrength\nThis Skill is used for passing the pigskin with your pops\nor throwing dynamite (potentially also at your pops).\nYou can Throw an object that weighs up to your Str in\npounds at a distance of up to your Str ×10 feet. If you\nwant to Throw a heavier or bulk
