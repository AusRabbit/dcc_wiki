ier item (up to the GM’s\ndiscretion), you do so with Disadvantage.\nTo hit a target area, make an Unopposed Skill Check.\nTo hit a foe with an object, make an Attack Skill Check\nvs. the target’s Evade.\nOn Success, you hit the target.\nOn Fail, roll 1d8 for direction (see Figure 3). The\namount the Skill Check missed by is the distance away\nin feet it lands.\nUPGRADES\nRank 5: You have Advantage when Throwing to a\ntarget who wants to catch what you are selling.\nRank 10: Choose the direction on a miss, rather than roll.\nRank 15: Your Throw range is your Str ×20 feet.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "throwing utility skills throwing throwing utility_skill strength strength false false false [] [] this skill is used for passing the pigskin with your pops or throwing dynamite (potentially also at your pops).\n\nyou can throw an object that weighs up to your str in pounds at a distance of up to your str ×10 feet. if you want to throw a heavier or bulkier item (up to the gm’s discretion), you do so with disadvantage.\n\nto hit a target area, make an unopposed skill check.\n\nto hit a foe with an object, make an attack skill check vs. the target’s evade.\n\non success, you hit the target. on fail, roll 1d8 for direction (see figure 3). the amount the skill check missed by is the distance away in feet it lands. {'5': 'you have advantage when throwing to a target who wants to catch what you are selling.', '10': 'choose the direction on a miss, rather than roll.', '15': 'your throw range is your str ×20 feet.'}"}, {"id": "skill-toss", "reference": true, "referenceEntry": true, "title": "Toss", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Wrasslin’ Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You deal +1d8 base damage + Str Bludgeoning, end the Held Debuff, and throw the target 5 feet for every five Ranks (minimum 5 feet) you have in this Skill. You can only Toss foes of a smaller size than you.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Wrasslin’\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-wrasslin\">Wrasslin’\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can Toss foes up to your own size or smaller.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can Toss foes one size larger than you or smaller.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and you can throw foes two sizes larger than you or smaller. Ranged Skills allow you to strike targets from a distance, hopefully before they can get into range to attack you— you filthy camper. All ranged weapons use your Dex to hit, and some add your Str to the damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 181 · PDF pages 183\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TOSS\nWrasslin’ Damage Effect, Passive\nYou deal +1d8 base damage + Str Bludgeoning, end\nthe Held Debuff, and throw the target 5 feet for every\nfive Ranks (minimum 5 feet) you have in this Skill. You\ncan only Toss foes of a smaller size than you.\nUPGRADES\nRank 5: You can Toss foes up to your own size or smaller.\nRank 10: You can Toss foes one size larger than you or\nsmaller.\nRank 15: +1d8 base damage, and you can throw foes\ntwo sizes larger than you or smaller.\nRanged Skills allow you to strike targets from a distance,\nhopefully before they can get into range to attack you—\nyou filthy camper. All ranged weapons use your Dex to\nhit, and some add your Str to the damage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "toss hand-to-hand damage effect skills toss toss attack_skill hand-to-hand damage effect skills wrasslin’ damage effect, passive true false false wrasslin’ [] [] you deal +1d8 base damage + str bludgeoning, end the held debuff, and throw the target 5 feet for every five ranks (minimum 5 feet) you have in this skill. you can only toss foes of a smaller size than you. {'5': 'you can toss foes up to your own size or smaller.', '10': 'you can toss foes one size larger than you or smaller.', '15': '+1d8 base damage, and you can throw foes two sizes larger than you or smaller. ranged skills allow you to strike targets from a distance, hopefully before they can get into range to attack you— you filthy camper. all ranged weapons use your dex to hit, and some add your str to the damage.'}"}, {"id": "skill-tracking", "reference": true, "referenceEntry": true, "title": "Tracking", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill to find and follow tracks. When searching for or attempting to follow tracks, make an Unopposed Skill Check. Factors such as how long ago the tracks were made, the ground conditions, and whether other tracks or marks obscure them may influence the Difficulty. Once you find tracks, you must make another Tracking Check every 15 minutes to continue following them.\u003c/p>\u003cp>On Success, you either find the tracks or continue following them.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can follow found tracks for 30 minutes before making a new Check, and gain 1 piece of information about the target(s).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can follow found tracks for 1 hour before making a new Check, and gain 2 pieces of information about the target(s).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can follow found tracks for 2 hours before making a new Check, and gain 4 pieces of information about the target(s).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 201 · PDF pages 203\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TRACKING\nIntelligence\nUse this Skill to find and follow tracks. When searching\nfor or attempting to follow tracks, make an Unopposed\nSkill Check. Factors such as how long ago the tracks\nwere made, the ground conditions, and whether other\ntracks or marks obscure them may influence the Dif‑\nficulty. Once you find tracks, you must make another\nTracking Check every 15 minutes to continue following\nthem.\nOn Success, you either find the tracks or continue\nfollowing them.\nUPGRADES\nRank 5: You can follow found tracks for 30 minutes\nbefore making a new Check, and gain 1 piece of infor‑\nmation about the target(s).\nRank 10: You can follow found tracks for 1 hour before\nmaking a new Check, and gain 2 pieces of information\nabout the target(s).\nRank 15: You can follow found tracks for 2 hours\nbefore making a new Check, and gain 4 pieces of infor‑\nmation about the target(s).\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "tracking utility skills tracking tracking utility_skill intelligence intelligence false false false [] [] use this skill to find and follow tracks. when searching for or attempting to follow tracks, make an unopposed skill check. factors such as how long ago the tracks were made, the ground conditions, and whether other tracks or marks obscure them may influence the difficulty. once you find tracks, you must make another tracking check every 15 minutes to continue following them.\n\non success, you either find the tracks or continue following them. {'5': 'you can follow found tracks for 30 minutes before making a new check, and gain 1 piece of information about the target(s).', '10': 'you can follow found tracks for 1 hour before making a new check, and gain 2 pieces of information about the target(s).', '15': 'you can follow found tracks for 2 hours before making a new check, and gain 4 pieces of information about the target(s).'}"}, {"id": "skill-trap-engineer", "reference": true, "referenceEntry": true, "title": "Trap Engineer", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Used to craft traps via a Sapper’s Table with a Trap Module (3,000 gold). See Crafting, p. 221.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Roll with Advantage when making non-explosive traps.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Your traps can be set to trigger only against a specific Mob, Boss, NPC, or crawler.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Add a +5 Splash to your trap at no additional Difficulty, and your crafting takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 201 · PDF pages 203\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TRAP ENGINEER\nIntelligence\nUsed to craft traps via a Sapper’s Table with a Trap\nModule (3,000 gold). See Crafting, p. 221.\nUPGRADES\nRank 5: Roll with Advantage when making non-explo‑\nsive traps.\nRank 10: Your traps can be set to trigger only against\na specific Mob, Boss, NPC, or crawler.\nRank 15: Add a +5 Splash to your trap at no addition‑\nal Difficulty, and your crafting takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "trap engineer utility skills trap-engineer trap engineer utility_skill intelligence intelligence false false false [] [] used to craft traps via a sapper’s table with a trap module (3,000 gold). see crafting, p. 221. {'5': 'roll with advantage when making non-explosive traps.', '10': 'your traps can be set to trigger only against a specific mob, boss, npc, or crawler.', '15': 'add a +5 splash to your trap at no additional difficulty, and your crafting takes half the time.'}"}, {"id": "skill-unarmed-combat", "reference": true, "referenceEntry": true, "title": "Unarmed Combat", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Combat Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Cannot choose a Damage Effect.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Every crawler starts out with this Skill. This is a mixture of all strikes, so call it what you will when you Attack.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+2d4 base damage\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 179 · PDF pages 181\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">UNARMED COMBAT\nMelee Attack, Str\nAI Favor: 1\nLimitations: Cannot choose a Damage Effect.\nEvery crawler starts out with this Skill. This is a mixture\nof all strikes, so call it what you will when you Attack.\nBase Damage: 1d4 + Str Bludgeoning\nUPGRADES\nRank 5: +1d4 base damage\nRank 10: +1d4 base damage\nRank 15: +2d4 base damage\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "unarmed combat hand-to-hand combat skills unarmed-combat unarmed combat attack_skill hand-to-hand combat skills melee attack, str strength false false false melee [] ['bludgeoning'] 1 cannot choose a damage effect. 1d4 + str bludgeoning every crawler starts out with this skill. this is a mixture of all strikes, so call it what you will when you attack. {'5': '+1d4 base damage', '10': '+1d4 base damage', '15': '+2d4 base damage'}"}, {"id": "skill-warhammer", "reference": true, "referenceEntry": true, "title": "Warhammer", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Bashing Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d10 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d10 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d10 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d10 base damage, and the target (of your size or smaller) is pushed 15 feet.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178 · PDF pages 180\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WARHAMMER\nMelee Attack, Str\nLimitations: Requires two hands to wield.\nBase Damage: 1d10 + Str Bludgeoning\nUPGRADES\nRank 5: +1d10 base damage\nRank 10: +1d10 base damage\nRank 15: +1d10 base damage, and the target (of your\nsize or smaller) is pushed 15 feet.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "warhammer bashing weapon skills warhammer warhammer attack_skill bashing weapon skills melee attack, str strength false false false melee [] ['bludgeoning'] requires two hands to wield. 1d10 + str bludgeoning {'5': '+1d10 base damage', '10': '+1d10 base damage', '15': '+1d10 base damage, and the target (of your size or smaller) is pushed 15 feet.'}"}, {"id": "skill-wrasslin", "reference": true, "referenceEntry": true, "title": "Wrasslin’", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Combat Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1 (only if no Damage Effect is used)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Choose the Choke Out, Dirty Fighting, or Toss Damage Effect (if you wish) before rolling to hit.\u003c/p>\u003cp>On Success, the target gains the Held Debuff. Held foes continue to be Held until they spend an Action to attempt escape (Mobs may use their Move Action). To prevent such an escape, you must use an Action as an Interrupt and succeed in a Wrasslin’ Str-Opposed Skill Check.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may maintain the Held Debuff at no Action cost if you wish, but your Skill Check to prevent escape is made with Disadvantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage Hand-to-hand Damage Effects are a special kind of Passive Skill that can be added to certain hand-to-hand Skills to enhance or modify the attack. If the attack succeeds, the chosen Damage Effect applies as well. If the attack Fails, the Damage Effect does nothing but still goes on cooldown (if there is one). When you make an Attack that adds a Damage Effect, place a mark for later Skill Advancement (p. 169) in either the Attack Skill or the Damage Effect, not both.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 179–180 · PDF pages 181–182\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WRASSLIN’\nMelee Attack, Str\nAI Favor: 1 (only if no Damage Effect is used)\nLimitations: Requires two hands to wield.\nChoose the Choke Out, Dirty Fighting, or Toss Damage\nEffect (if you wish) before rolling to hit.\nOn Success, the target gains the Held Debuff. Held\nfoes continue to be Held until they spend an Action to\nattempt escape (Mobs may use their Move Action). To\nprevent such an escape, you must use an Action as an\nInterrupt and succeed in a Wrasslin’ Str-Opposed Skill\nCheck.\nBase Damage: 1d4 + Str Bludgeoning\nUPGRADES\nRank 5: You may maintain the Held Debuff at no\nAction cost if you wish, but your Skill Check to prevent\nescape is made with Disadvantage.\nRank 10: +1d4 base damage\nRank 15: +1d4 base damage\nHand-to-hand Damage Effects are a special kind of\nPassive Skill that can be added to certain hand-to-hand\nSkills to enhance or modify the attack. If the attack\nsucceeds, the chosen Damage Effect applies as well.\nIf the attack Fails, the Damage Effect does nothing\nbut still goes on cooldown (if there is one).\nWhen you make an Attack that adds a Damage Effect,\nplace a mark for later Skill Advancement (p. 169) in\neither the Attack Skill or the Damage Effect, not both.\u003c/pre>\u003c/details>", "backlinks": ["skill-choke-out", "skill-dirty-fighting", "skills", "skill-toss"], "search": "wrasslin’ hand-to-hand combat skills wrasslin wrasslin’ attack_skill hand-to-hand combat skills melee attack, str strength false false false melee [] ['bludgeoning'] 1 (only if no damage effect is used) requires two hands to wield. 1d4 + str bludgeoning choose the choke out, dirty fighting, or toss damage effect (if you wish) before rolling to hit.\n\non success, the target gains the held debuff. held foes continue to be held until they spend an action to attempt escape (mobs may use their move action). to prevent such an escape, you must use an action as an interrupt and succeed in a wrasslin’ str-opposed skill check. {'5': 'you may maintain the held debuff at no action cost if you wish, but your skill check to prevent escape is made with disadvantage.', '10': '+1d4 base damage', '15': '+1d4 base damage hand-to-hand damage effects are a special kind of passive skill that can be added to certain hand-to-hand skills to enhance or modify the attack. if the attack succeeds, the chosen damage effect applies as well. if the attack fails, the damage effect does nothing but still goes on cooldown (if there is one). when you make an attack that adds a damage effect, place a mark for later skill advancement (p. 169) in either the attack skill or the damage effect, not both.'}"}, {"id": "skill-zone-of-control", "reference": true, "referenceEntry": true, "title": "Zone of Control", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>You must be wielding a Reach weapon.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Once per round, when an enemy enters a space adjacent to you for the first time, you may perform an Interrupt Attack against them at a cost of one Action. Make the Attack with Disadvantage.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your Attack is no longer made with Disadvantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The target is pushed 5 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Make your Attack Skill Check with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 201 · PDF pages 203\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ZONE OF CONTROL\nPassive\nLimitations: You must be wielding a Reach weapon.\nOnce per round, when an enemy enters a space\nadjacent to you for the first time, you may perform an\nInterrupt Attack against them at a cost of one Action.\nMake the Attack with Disadvantage.\nUPGRADES\nRank 5: Your Attack is no longer made with\nDisadvantage.\nRank 10: The target is pushed 5 feet.\nRank 15: Make your Attack Skill Check with Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "zone of control utility skills zone-of-control zone of control utility_skill passive true false false [] [] you must be wielding a reach weapon. once per round, when an enemy enters a space adjacent to you for the first time, you may perform an interrupt attack against them at a cost of one action. make the attack with disadvantage. {'5': 'your attack is no longer made with disadvantage.', '10': 'the target is pushed 5 feet.', '15': 'make your attack skill check with advantage.'}"}, {"id": "spells", "reference": true, "referenceEntry": false, "title": "Spells", "group": "Spells", "type": "reference", "typeLabel": "Catalogue", "dek": "54 entries · Royal Court Edition", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells-rules\">Read the spells rules →\u003c/a>\u003c/p>\u003cp>Browse by category, listed stat, or trait. Search includes effects, upgrades, damage types, and favored classes. Open an entry for full rules and sources.\u003c/p>\u003cp class=\"source\">Fields absent from the source are omitted; consult the general rules for defaults. The supplied extraction is preserved, including any extraction errors.\u003c/p>\u003cdiv class=\"reference-controls\">\u003clabel>Search spells\u003cinput type=\"search\" data-filter=\"search\" placeholder=\"Name, effect, class, damage…\">\u003c/label>\u003clabel>Category\u003cselect data-filter=\"category\">\u003coption value=\"\">All\u003c/option>\u003coption value=\"Attack\">Attack\u003c/option>\u003coption value=\"Heal\">Heal\u003c/option>\u003coption value=\"Other\">Other\u003c/option>\u003coption value=\"Passive\">Passive\u003c/option>\u003c/select>\u003c/label>\u003clabel>Listed stat\u003cselect data-filter=\"stat\">\u003coption value=\"\">All\u003c/option>\u003coption value=\"Charisma\">Charisma\u003c/option>\u003coption value=\"Constitution\">Constitution\u003c/option>\u003coption value=\"Intelligence\">Intelligence\u003c/option>\u003c/select>\u003c/label>\u003clabel>Trait\u003cselect data-filter=\"traits\">\u003coption value=\"\">All\u003c/option>\u003coption value=\"Area of Effect\">Area of Effect\u003c/option>\u003coption value=\"Interrupt\">Interrupt\u003c/option>\u003coption value=\"Passive\">Passive\u003c/option>\u003c/select>\u003c/label>\u003cbutton type=\"button\" data-reset-reference>Clear filters\u003c/button>\u003c/div>\u003cp data-reference-count role=\"status\">54 entries\u003c/p>\u003cdiv class=\"reference-grid\">\u003carticle class=\"reference-card\" data-search=\"air-buddy air buddy spell “there’s no dungeon rule that a dog can’t fly.” passive, favored: mage true false false passive [&#x27;mage&#x27;] [] 12 self you launch yourself with enough force to fly, hurtling forward from your current position up to 10 × your int mod away. you land safely if you land on solid ground; otherwise, you fall (see p. 76). you can cast this twice in a row to “double jump” just like in platforming video games. {&#x27;5&#x27;: &#x27;you may choose one additional willing target up to your size at touch range, who you bring with you.&#x27;, &#x27;10&#x27;: &#x27;you can fly up to 20 × your int mod away with this spell.&#x27;, &#x27;15&#x27;: &#x27;you may choose up to five additional willing targets up to your size at touch range to bring with you.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-air-buddy\">Air Buddy\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 12 · Range: Self\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"astral-paw-astral-hand-astral-claw astral paw (astral hand, astral claw) spell “you have summoned an astral paw. yes, just the paw. budget constraints.” passive true false false passive [] [] 12 30 feet until the end of combat or 5 minutes. you conjure a spectral hand, paw, or claw, looking much like your own. you can use this astral appendage to manipulate objects up to 30ft away by spending an action. you can use the astral paw to make skill checks but suffer disadvantage due to a lack of fine control. {&#x27;5&#x27;: &#x27;your pugilism and slice attacks with the paw add 1 astral paw rank damage die.&#x27;, &#x27;10&#x27;: &#x27;you can conjure a paw up to four size categories larger than your own, and the range increases to 50 feet.&#x27;, &#x27;15&#x27;: &#x27;the caster no longer suffers disadvantage when performing suitable skill checks using the paw, and the duration is 15 minutes.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-astral-paw-astral-hand-astral-claw\">Astral Paw (Astral Hand, Astral Claw)\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 12 · Range: 30 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"bad-faith bad faith spell “the system has classified your prayers as a hostile act.” attack, necrotic, charisma, favored: cleric charisma false false false attack [&#x27;cleric&#x27;] [&#x27;necrotic&#x27;] 10 40 feet 1d8 + cha necrotic an unholy presence invades your victim’s mind, body, and soul. {&#x27;5&#x27;: &#x27;+1d8 base damage, +5ft splash&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage, and end all buffs on the victims for the duration of the combat.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, +5ft splash&#x27;}\" data-category=\"Attack\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-bad-faith\">Bad Faith\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Stat: Charisma · Mana: 10 · Range: 40 feet · Damage: 1d8 + Cha Necrotic\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"bang-bro bang bro spell “when you want more zing in your zinger.” passive true false false passive [] [] 5 5 feet 5 minutes + 1 minute per rank 15 minutes place a hot and crackling temporary enchantment on a weapon you are holding.\n\nyour weapon deals +2 mixed fire and electric damage. {&#x27;5&#x27;: &#x27;+1d6 fire and electric damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 fire and electric damage, and on an amazing success, the target of the weapon attack gains the burned debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d6 fire and electric damage, and on an amazing success, the target of the weapon attack also gains the shocked debuff.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-bang-bro\">Bang Bro\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 5 · Range: 5 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"clockwork-triplicate clockwork triplicate spell “if one is good, then three is a party.” passive true false false passive [] [] 26 5 feet 1 minute per rank only castable on pets and minions. when you cast this spell upon your pet or minion, it splits into three, each with its full complement of abilities. you must spend an action making an unopposed animal handling skill check to issue a new command to each one separately. {&#x27;5&#x27;: &#x27;duration is 2 minutes per rank.&#x27;, &#x27;10&#x27;: &#x27;duration is 3 minutes per rank.&#x27;, &#x27;15&#x27;: &#x27;when you command your pet or minion, the clockwork versions follow suit.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-clockwork-triplicate\">Clockwork Triplicate\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 26 · Range: 5 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"confusing-fog confusing fog spell “visibility reduced. decision-making questionable.” passive true false false passive [] [] 6 40 feet until the end of two full rounds of combat or 20 seconds 15 minutes you create a billowing cloud of fog that you, your party members, and friendly npcs can see through, but it obscures the area from mobs, making it more difficult for them to attack you. mobs attack with disadvantage (see mob advantage and disadvantage, p. 60) against targets in the fog.\n\nthis fog fills a 25 × 25ft area. smart mobs may attempt to move the combat out of the fog if able. {&#x27;5&#x27;: &#x27;the fog fills a 50 × 50ft area, and its duration is 1 minute.&#x27;, &#x27;10&#x27;: &#x27;the fog fills a 100 × 100ft area and lasts for 5 minutes.&#x27;, &#x27;15&#x27;: &#x27;the fog fills a 500 × 500ft area and lasts for 15 minutes.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-confusing-fog\">Confusing Fog\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 6 · Range: 40 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"dirt-clod dirt clod spell “you have weaponized dirt.” attack, bludgeoning false false false attack [] [&#x27;bludgeoning&#x27;] 1 100 feet 2 1d2 + int bludgeoning you hurl a magical clod of dirt, leaving dirt and pebbles strewn about near the target. {&#x27;5&#x27;: &#x27;+2d2 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d2 base damage, and the target gains the woozy debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d2 base damage, and 1 rank damage die.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-dirt-clod\">Dirt Clod\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 1 · Range: 100 feet · Damage: 1d2 + Int Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"drain-life drain life spell “organic tether deployed. try not to think about where it’s been.” attack, necrotic false false false attack [] [&#x27;necrotic&#x27;] 14 30 feet for a brief instant, you create a disgusting blood vein that reaches out and wraps itself around your target. 1d6 + int necrotic {&#x27;5&#x27;: &#x27;+1d6 base damage, and if the target loses at least 3 health bar slots, you heal 1 health bar slot.&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and if you heal this way, heal +1 health bar slot.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and if you heal this way, heal +1 health bar slot.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-drain-life\">Drain Life\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 14 · Range: 30 feet · Damage: 1d6 + Int Necrotic\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"earworm earworm spell “hitting every note except the right ones.” attack, sonic, charisma, favored: bard charisma false false false attack [&#x27;bard&#x27;] [&#x27;sonic&#x27;] 6 30ft once per round. 1d6 + cha sonic sing a terrible song targeting the ear holes of a victim. yes, sing a few bars so the gm understands the pain you’re inflicting. {&#x27;5&#x27;: &#x27;+1d6 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and the target gains the queasy debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage and +10ft splash.&#x27;}\" data-category=\"Attack\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-earworm\">Earworm\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Stat: Charisma · Mana: 6 · Range: 30ft · Damage: 1d6 + Cha Sonic\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"fear fear spell “run away, little piggies!” attack, mind control false false false attack [] [&#x27;mind control&#x27;] 3 25 feet warning: scary-ass mobs are immune to fear effects (gm’s discretion). target a non-boss mob of half your level or less. on a standard success, it stands its ground, but it loses its dex mod for the duration of the combat. on a higher success, it uses two of its actions during the next round to run away. {&#x27;5&#x27;: &#x27;+5ft blast radius.&#x27;, &#x27;10&#x27;: &#x27;+5ft blast radius, and on a critical hit, the affected creatures gain the paralyzed debuff.&#x27;, &#x27;15&#x27;: &#x27;+5ft blast radius.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-fear\">Fear\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 3 · Range: 25 feet\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"fire-fingers fire fingers spell “fire fingers activated. try not to make it weird.” attack, fire false false false attack [] [&#x27;fire&#x27;] 3 melee 1 1d4 + int fire brilliant flame leaps from your fingers. {&#x27;5&#x27;: &#x27;+1d4 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and the target gains the burned debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and your hands begin to intermittently burn. your pugilism, unarmed combat, and slice attack strikes add 1 fire fingers rank damage die (fire).&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-fire-fingers\">Fire Fingers\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 3 · Range: Melee · Damage: 1d4 + Int Fire\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"fireball fireball spell “it almost reluctantly meanders toward you. then your world explodes.” attack, fire, area of effect false false true attack [] [&#x27;fire&#x27;] 45 80 feet once per scene 1d12 + int fire, 10ft blast radius a creeping beach ball-sized sphere of fire emanates from you. since it moves so slowly, your attack is made with disadvantage. when the impact zone has been determined, each creature in a 10ft blast radius takes full damage.\n\non fail, roll 1d8 for direction (see figure 3, p. 200). the amount the skill check missed by is the distance away in feet it impacts. {&#x27;5&#x27;: &#x27;+1d12 base damage. those who lose 1 or more health bar slots via this attack gain the burned debuff.&#x27;, &#x27;10&#x27;: &#x27;+1d12 base damage and becomes an 80ft line attack (and keeps the blast).&#x27;, &#x27;15&#x27;: &#x27;+1d12 base damage and +40ft splash (on the blast).&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"Area of Effect\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-fireball\">Fireball\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 45 · Range: 80 feet · Damage: 1d12 + Int Fire, 10ft Blast radius\u003c/p>\u003cp class=\"source\">Area of Effect\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"frost-scar frost scar spell “frigid status achieved; relationships may suffer.” attack, ice false false false attack [] [&#x27;ice&#x27;] 2 melee 1 1d4 + int ice with a slice of your frigid hand, you leave a scar of rime on your target. {&#x27;5&#x27;: &#x27;+1d4 base damage, and the target cannot heal themselves in the next combat round.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and the target gains the stiff legs debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and the target gains the taint debuff.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-frost-scar\">Frost Scar\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 2 · Range: Melee · Damage: 1d4 + Int Ice\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"grand-illusion grand illusion spell “why, yes, that is my pet t-rex.” intelligence intelligence false false false other [] [] 7 40 feet 2 minutes 15 minutes you create an illusion that might trick your foes. make a single int-opposed spell check vs. foes who can see it. your same roll is used against foes who see it even after the casting round.\n\nmundane illusions seeking only to impress might be rolled with advantage, while complex illusions seeking a specific response or images that suddenly pop up during combat might be rolled with disadvantage (gm’s discretion).\n\non success, they believe your illusion. {&#x27;5&#x27;: &#x27;those who believe gain the woozy debuff or similar based on the desired response.&#x27;, &#x27;10&#x27;: &#x27;those who believe also gain the queasy debuff or similar based on the desired response.&#x27;, &#x27;15&#x27;: &#x27;those who believe also gain the shocked debuff or similar based on the desired response.&#x27;}\" data-category=\"Other\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-grand-illusion\">Grand Illusion\u003c/a>\u003c/h2>\u003cp class=\"source\">Other\u003c/p>\u003cp>Stat: Intelligence · Mana: 7 · Range: 40 feet\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"heal heal spell “congratulations on not dying… yet.” heal, interrupt, passive true true false heal [] [] 2 self only rank 1 maximum heal 2 health bar slots. {} none\" data-category=\"Heal\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-heal\">Heal\u003c/a>\u003c/h2>\u003cp class=\"source\">Heal\u003c/p>\u003cp>Mana: 2 · Range: Self only\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"heal-critter heal critter spell “your pet has been restored to maximum cuddle capacity.” heal, interrupt, passive true true false heal [] [] 8 30 feet may only be cast on pets and minions (sorry, donut). the target glows as they heal back to 100% health bar. {&#x27;5&#x27;: &#x27;the target mends a minor injury debuff.&#x27;, &#x27;10&#x27;: &#x27;the target mends a major injury debuff.&#x27;, &#x27;15&#x27;: &#x27;the target regrows all lost appendages.&#x27;}\" data-category=\"Heal\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-heal-critter\">Heal Critter\u003c/a>\u003c/h2>\u003cp class=\"source\">Heal\u003c/p>\u003cp>Mana: 8 · Range: 30 feet\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"heal-others heal others spell “tell me you’re a cleric without…” heal, interrupt, passive true true false heal [] [] 6 30 feet you can’t cast this spell on yourself, pets, or minions. a wave of positive vibes engulfs the target. they heal 1d4 health bar slots. {&#x27;5&#x27;: &#x27;the target heals 1d6 health bar slots.&#x27;, &#x27;10&#x27;: &#x27;the target heals 2d6 health bar slots.&#x27;, &#x27;15&#x27;: &#x27;instead of a single target, all party members within a 20ft burst radius are healed.&#x27;}\" data-category=\"Heal\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-heal-others\">Heal Others\u003c/a>\u003c/h2>\u003cp class=\"source\">Heal\u003c/p>\u003cp>Mana: 6 · Range: 30 feet\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"heal-self heal self spell “way easier than manually shoving your guts back in!” heal, interrupt, passive true true false heal [] [] 1 self only you can only case this spell on yourself. you center yourself, using magic to make yourself whole. you heal 1d4 health bar slots. {&#x27;5&#x27;: &#x27;you heal 1d6 health bar slots and mend a minor injury, poison, or disease debuff.&#x27;, &#x27;10&#x27;: &#x27;you heal 2d6 health bar slots and mend a major injury or other debuff.&#x27;, &#x27;15&#x27;: &#x27;you heal to full and gain the benefits of a short rest.&#x27;}\" data-category=\"Heal\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-heal-self\">Heal Self\u003c/a>\u003c/h2>\u003cp class=\"source\">Heal\u003c/p>\u003cp>Mana: 1 · Range: Self only\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"hole hole spell “it’s a hole. this will absolutely be misused.” passive true false false passive [] [] 12 10 feet until the end of the combat or 5 minutes. can’t be used on saferoom doors or living things. you create a temporary cylindrical hole in a surface or material within range, to a depth of 1 inch per spell rank and a diameter of 2ft. anything that can fit in the hole can pass through it if the hole is deep enough to penetrate to the other side of the surface. {&#x27;5&#x27;: &#x27;you can reduce the diameter of the hole to a smaller size when cast.&#x27;, &#x27;10&#x27;: &#x27;you can widen the hole’s diameter by 1 inch for every inch of depth you sacrifice when cast.&#x27;, &#x27;15&#x27;: &#x27;the caster may end the spell with a thought (like an interrupt, but it doesn’t cost an action). anything in the hole at that time is destroyed.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-hole\">Hole\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 12 · Range: 10 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"holy-aura holy aura spell “look who’s all high and mighty.” attack, holy, area of effect, charisma, favored: cleric &amp; paladin charisma false false true attack [&#x27;cleric&#x27;, &#x27;paladin&#x27;] [&#x27;holy&#x27;] 7 5ft burst radius once per round 1d4 + cha holy, 5ft burst radius you channel your deity and emanate their essence to hurt only the enemies around you. {&#x27;5&#x27;: &#x27;+1d4 base damage, and affected undead mobs take double damage.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage and +5ft burst radius.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage and +5ft burst radius.&#x27;}\" data-category=\"Attack\" data-stat=\"Charisma\" data-traits=\"Area of Effect\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-holy-aura\">Holy Aura\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Stat: Charisma · Mana: 7 · Range: 5ft Burst radius · Damage: 1d4 + Cha Holy, 5ft Burst radius\u003c/p>\u003cp class=\"source\">Area of Effect\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"hot-stuff-aura hot stuff aura spell “bask in the warm glow of my machismo!” passive, area of effect, favored: bard true false true passive [&#x27;bard&#x27;] [] 8 5ft burst radius 2 rounds 5 minutes you create a shield of pure sex appeal around you against all damage types with a number of health bar slots equal to your cha mod, and a 2 in each slot. it also protects all allies within the radius. when depleted, it disappears. these slots cannot be healed. {&#x27;5&#x27;: &#x27;increase the health to 4 in each slot.&#x27;, &#x27;10&#x27;: &#x27;+5ft burst radius, with a 6 in each slot.&#x27;, &#x27;15&#x27;: &#x27;+10ft burst radius, with a 8 in each slot.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive|Area of Effect\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-hot-stuff-aura\">Hot Stuff Aura\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 8 · Range: 5ft Burst radius\u003c/p>\u003cp class=\"source\">Passive · Area of Effect\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"ice-blast ice blast spell “hope they brought a jacket.” attack, ice false false false attack [] [&#x27;ice&#x27;] 9 40 feet 1d8 + int ice with the howl of blizzard winds, you let loose a compact pocket of freezing cold and ice. {&#x27;5&#x27;: &#x27;+1d8 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage, and the target is pushed 10 feet away from you.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and you can change the range to a 15ft cone attack.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-ice-blast\">Ice Blast\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 9 · Range: 40 feet · Damage: 1d8 + Int Ice\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"icicles icicles spell “did you know that icicles are the #1 cause of home head impalements?” attack, ice false false false attack [] [&#x27;ice&#x27;] 19 60 feet 1d12 + int ice seizing upon the ice that runs through your veins, icicle projectiles shoot forth from your palms towards distant foes. {&#x27;5&#x27;: &#x27;+1d12 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d12 base damage, and the target gains the stiff legs debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d12 base damage, and the damage is armor-piercing.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-icicles\">Icicles\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 19 · Range: 60 feet · Damage: 1d12 + Int Ice\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"intimate-touches intimate touches spell “show me on the doll where they healed you.” heal, passive, favored: cleric &amp; paladin true false false heal [&#x27;cleric&#x27;, &#x27;paladin&#x27;] [] 8 5 feet unlike most healing, this spell is not an interrupt. you lay hands on the target (which could be you), who heals health bar slots equal to your cha mod. {&#x27;5&#x27;: &#x27;the target also heals a minor injury debuff.&#x27;, &#x27;10&#x27;: &#x27;the target also heals a major injury debuff.&#x27;, &#x27;15&#x27;: &#x27;the target also heals all poison &amp; disease debuffs.&#x27;}\" data-category=\"Heal\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-intimate-touches\">Intimate Touches\u003c/a>\u003c/h2>\u003cp class=\"source\">Heal\u003c/p>\u003cp>Mana: 8 · Range: 5 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"lightning-bolt lightning bolt spell “bolt released, viewership spike detected.” attack, electric false false false attack [] [&#x27;electric&#x27;] 15 100 feet 1d10 + int electric with a thunderous clap, you let loose a bolt of lightning. {&#x27;5&#x27;: &#x27;+1d10 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d10 base damage and becomes a 100ft line attack.&#x27;, &#x27;15&#x27;: &#x27;+1d10 base damage. the lightning bolt forks, and you may choose to apply your attack against any number of additional targets within 15 feet of the previous target (within the range limit). each successful attack (including against the primary target), deals half damage.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-lightning-bolt\">Lightning Bolt\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 15 · Range: 100 feet · Damage: 1d10 + Int Electric\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"magic-missile magic missile spell “standard spell detected. viewers appreciate the nostalgia.” attack, force false false false attack [] [&#x27;force&#x27;] 5 within your line of sight 1 1d4 + int force from glowing eyes, fingers, or whatever, a streak of pure force shoots out. {&#x27;5&#x27;: &#x27;+1d4 base damage, a for you without needing to command them. higher levels of success can turn additional mobs into allies (gm’s discretion). {&#x27;5&#x27;: &#x27;the casting time is 4 minutes. duration is 5 minutes.&#x27;, &#x27;10&#x27;: &#x27;add your charisma stat to the burst radius. duration is 10 minutes.&#x27;, &#x27;15&#x27;: &#x27;add your charisma stat to the burst radius. duration is 15 minutes.&#x27;}\" data-category=\"Other\" data-stat=\"Intelligence\" data-traits=\"Area of Effect\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-minion-army\">Minion Army\u003c/a>\u003c/h2>\u003cp class=\"source\">Other\u003c/p>\u003cp>Stat: Intelligence · Mana: 50 · Range: 50ft Burst radius\u003c/p>\u003cp class=\"source\">Area of Effect\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"natures-breath nature’s breath spell “this recycled dungeon air is bad for my complexion.” heal, interrupt, passive, favored: druid true true false heal [&#x27;druid&#x27;] [] 6 5 feet you blow cool, fresh air over the target’s wounds (could be yourself), healing them. roll a nature’s breath rank damage die. that is how many health bar slots the target heals. may also target pets and minions. {&#x27;5&#x27;: &#x27;add 1 to your die roll.&#x27;, &#x27;10&#x27;: &#x27;add 1 to your die roll, and remove a minor injury debuff.&#x27;, &#x27;15&#x27;: &#x27;add 1 to your die roll, and remove a major injury debuff.&#x27;}\" data-category=\"Heal\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-natures-breath\">Nature’s Breath\u003c/a>\u003c/h2>\u003cp class=\"source\">Heal\u003c/p>\u003cp>Mana: 6 · Range: 5 feet\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"oakhide oakhide spell “my bark is worse than my bite.” passive, favored: druid true false false passive [&#x27;druid&#x27;] [] 5 self 2 minutes 10 minutes your skin turns into solid wood, giving you great protection. you have +2 damage resistance for the duration of this spell. {&#x27;5&#x27;: &#x27;+2 dr. duration is 3 minutes.&#x27;, &#x27;10&#x27;: &#x27;+2 dr. you may target party members and npcs up to 10 feet away with this spell.&#x27;, &#x27;15&#x27;: &#x27;+2 dr. duration is 4 minutes.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-oakhide\">Oakhide\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 5 · Range: Self\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"paladins-smite paladin’s smite spell “repent or die!” attack, holy, charisma, favored: paladin charisma false false false attack [&#x27;paladin&#x27;] [&#x27;holy&#x27;] 11 30 feet 1d8 + cha holy you channel a torrent of divine wrath toward a soon-to-be repentant foe. {&#x27;5&#x27;: &#x27;+1d8 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage, and the target gains the take down debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and the damage is armor-piercing (ignores dr).&#x27;}\" data-category=\"Attack\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-paladins-smite\">Paladin’s Smite\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Stat: Charisma · Mana: 11 · Range: 30 feet · Damage: 1d8 + Cha Holy\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"panty-dropper panty dropper spell “you know what’s on the menu? me-n-u.” charisma, mind control, favored: bard charisma false false false other [&#x27;bard&#x27;] [&#x27;mind control&#x27;] 10 10 feet 2 minutes or until you finish 5 minutes make an int-opposed spell check against a non-boss target, even in combat. fighting’s just another form of penetration, after all. on success, the target wants to jump your bones and won’t let anyone stop them (they cease attacking or doing other things). {&#x27;5&#x27;: &#x27;the duration is 5 minutes.&#x27;, &#x27;10&#x27;: &#x27;the duration is 10 minutes.&#x27;, &#x27;15&#x27;: &#x27;the duration is 15 minutes.&#x27;}\" data-category=\"Other\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-panty-dropper\">Panty Dropper\u003c/a>\u003c/h2>\u003cp class=\"source\">Other\u003c/p>\u003cp>Stat: Charisma · Mana: 10 · Range: 10 feet\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"ping ping spell “here piggy, piggy.” passive, area of effect true false true passive [] [] 5 1 mile burst radius 5 minutes sends out an audible ping that gives the distance and location of all non-crawlers and non-red-tagged mobs in a circle around you. it will mark targets beyond the range of your map. you receive information about the mobs that is “somewhat complete.”\n\ntargets hit with ping will hear an audible ping noise, but they will not know where the ping originated. environmental factors and obstacles may increase or decrease range. {&#x27;5&#x27;: &#x27;if you know the fear spell (see p. 204), you may cast it at no action cost to affect all eligible mobs within the ping range. you only pay the mana.&#x27;, &#x27;10&#x27;: &#x27;environmental factors and obstacles no longer decrease the range, and you receive “mostly complete” information.&#x27;, &#x27;15&#x27;: &#x27;you pay no mana to add the fear spell, and you receive “entirely complete” information.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive|Area of Effect\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-ping\">Ping\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 5 · Range: 1 mile Burst radius\u003c/p>\u003cp class=\"source\">Passive · Area of Effect\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"protective-shell protective shell spell “hope activated. try not to waste it.” interrupt, passive, area of effect true true true passive [] [] none 10ft burst radius 5 seconds (only long enough to push foes away and protect against a single physical attack) 30 hours spell must be imbued onto something you are wearing. the shell cannot be moved by any means. you create a 10 + int-foot burst radius magic shell around yourself and nearby party members.\n\nthis shell pushes away all mobs in its area, which is the shell’s radius + 5ft. mobs cannot enter the shell (unless non-corporeal) or physically attack those inside. the shell does not protect against magic effects. crawlers inside may attack as usual. {&#x27;5&#x27;: &#x27;duration is 10 seconds. in addition to knocking enemies away, it protects the occupants from all non-spell attacks originating from outside the shell until the end of the current combat round.&#x27;, &#x27;10&#x27;: &#x27;duration is 20 seconds or two rounds.&#x27;, &#x27;15&#x27;: &#x27;duration is 30 seconds or three rounds.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive|Interrupt|Area of Effect\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-protective-shell\">Protective Shell\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: None · Range: 10ft Burst radius\u003c/p>\u003cp class=\"source\">Passive · Interrupt · Area of Effect\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"puddle-jumper puddle jumper spell “teleportation doesn’t suck.” passive true false false passive [] [] 20 line-of-sight to the destination surface 5 hours there is a 10-second delay before the effect takes place. you and up to 3 party members of your choice teleport to another location. everyone feels a tingling sensation while waiting for the effect to resolve. {&#x27;5&#x27;: &#x27;the delay is 2 seconds, and the destination doesn’t have to be a surface.&#x27;, &#x27;10&#x27;: &#x27;the delay is 1 second, and the destination can be anywhere within 1,000 yards in any direction, even if the exact destination cannot be seen.&#x27;, &#x27;15&#x27;: &#x27;there is no delay, and the destination can be anywhere within 1 mile in any direction, even if the exact destination cannot be seen.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-puddle-jumper\">Puddle Jumper\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 20 · Range: Line-of-sight to the destination surface\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"rise-dead-minion rise, dead minion! spell “the bigger they are, the deeper they’re buried.” attack, favored: necromancer false false false attack [&#x27;necromancer&#x27;] [] 10 30 feet 1 round at your command, a medium (4) size skeleton emerges from the ground to attack your foe in melee combat, dealing 1d8 + int necrotic damage. after the attack, the skeleton collapses, creating difficult terrain in the space it occupied. {&#x27;5&#x27;: &#x27;the skeleton attacks twice before collapsing.&#x27;, &#x27;10&#x27;: &#x27;the skeleton increases to size large (5), and its attack range is 10 feet. +1d8 base damage.&#x27;, &#x27;15&#x27;: &#x27;the skeleton increases to size colossal (7), and its attack range is 15 feet. add one rise, dead minion! rank damage die to the damage.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-rise-dead-minion\">Rise, Dead Minion!\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 10 · Range: 30 feet\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"rootfoot rootfoot spell “the ground is never empty. it is only sleeping.” attack, favored: druid false false false attack [&#x27;druid&#x27;] [] 5 30 feet 2 rounds roots reach up from the ground to ensnare a victim of up to size 4 (medium).\n\non success, the victim gains the held debuff. the rank of this spell is used in the opposed difficulty to escape, instead of the default str. {&#x27;5&#x27;: &#x27;can target victims up to size large (5). duration is 3 rounds.&#x27;, &#x27;10&#x27;: &#x27;can target victims up to size huge (6). duration is 4 rounds.&#x27;, &#x27;15&#x27;: &#x27;can target victims up to size colossal (7). the victim also gains the poisoned debuff.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-rootfoot\">Rootfoot\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 5 · Range: 30 feet\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"second-chance second chance spell “everyone deserves one. except for phil. never phil.” passive true false false passive [] [] 10 10 feet 1 minute you raise a mob with a level lower than your own from the dead. the mob temporarily becomes your undead minion with half of its original health bar slots.\n\nyou spend one action to command it, then it acts independently with 1 move action and 1 other action (usually an attack) until given new instructions. {&#x27;5&#x27;: &#x27;the mob can be up to 5 levels higher than you, and the duration is 5 minutes.&#x27;, &#x27;10&#x27;: &#x27;the mob can be up to 10 levels higher than the caster, with a duration of 15 minutes.&#x27;, &#x27;15&#x27;: &#x27;the mob can be up to 15 levels higher than the caster, with a duration of 45 minutes.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-second-chance\">Second Chance\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 10 · Range: 10 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"shield shield spell “enjoy the illusion of safety.” interrupt, passive true true false passive [] [] 8 self 5 minutes you are surrounded by a translucent force field that moves with you and reduces non-magic damage you take. the shield has 2 health bar slots, each with your con mod. when you take damage, reduce these health bar slots first. the spell ends early if the shield loses all its health bar slots. you can’t heal a shield. {&#x27;5&#x27;: &#x27;the shield has 5 health bar slots.&#x27;, &#x27;10&#x27;: &#x27;the shield has 10 health bar slots.&#x27;, &#x27;15&#x27;: &#x27;the shield has 15 health bar slots.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-shield\">Shield\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 8 · Range: Self\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"shock-treatment shock treatment spell “electrical therapy initiated; consent not required.” attack, electric false false false attack [] [&#x27;electric&#x27;] 2 30 feet 2 1d2 + int electric like a deranged emperor, bolts of electricity shoot out from your fingers. {&#x27;5&#x27;: &#x27;+1d2 base damage, and you may choose to afflict the target with the stunned debuff instead of dealing damage.&#x27;, &#x27;10&#x27;: &#x27;+1d2 base damage, and add 1 rank damage die (electric) at the end of the round.&#x27;, &#x27;15&#x27;: &#x27;+1d2 base damage, and if you make this attack at melee range, you deal ×5 the total damage.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-shock-treatment\">Shock Treatment\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 2 · Range: 30 feet · Damage: 1d2 + Int Electric\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"solsplash solsplash spell “the sun is merely a star close enough to hate us.” attack, fire, constitution, favored: druid constitution false false false attack [&#x27;druid&#x27;] [&#x27;fire&#x27;] 13 30 feet 1d8 + con fire beams of concentrated “sunlight” fall upon the victim and those around them. sunscreen’s not gonna help. {&#x27;5&#x27;: &#x27;+1d8 base damage, +5ft splash.&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage and +10ft splash. each affected entity who loses at least 3 health bar slots this way gains the burned debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage and +15ft splash.&#x27;}\" data-category=\"Attack\" data-stat=\"Constitution\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-solsplash\">Solsplash\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Stat: Constitution · Mana: 13 · Range: 30 feet · Damage: 1d8 + Con Fire\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"soul-collector soul collector spell “this soul appears… reusable.” attack, necrotic false false false attack [] [&#x27;necrotic&#x27;] 4 50 feet 1 1d4 + int necrotic with a twist of your hand, you siphon the spirit from your target. {&#x27;5&#x27;: &#x27;+1d4 base damage, and if this spell deals the killing blow to a foe of at least half your level, it deals +1 bonus damage until you complete a long rest. this damage bonus is cumulative up to the spell’s rank.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and the bonus continues for one week.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and the bonus continues for as long as you remain on your current floor.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-soul-collector\">Soul Collector\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 4 · Range: 50 feet · Damage: 1d4 + Int Necrotic\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"thunderlash thunderlash spell “loud noises and bad decisions go hand-in-hand.” attack, sonic false false false attack [] [&#x27;sonic&#x27;] 12 50 feet 1d10 + int sonic you unleash a whip-like emanation of pure sound which thunders through the air. {&#x27;5&#x27;: &#x27;+1d10 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d10 base damage, and this attack deals armor-piercing damage (ignores dr).&#x27;, &#x27;15&#x27;: &#x27;+1d10 base damage, and you can change the range to a 15ft cone attack.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-thunderlash\">Thunderlash\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 12 · Range: 50 feet · Damage: 1d10 + Int Sonic\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"torch torch spell “congratulations. you can now see what’s trying to kill you.” passive true false false passive [] [] 1 self until you enter a saferoom or descend to a new floor. you create a magical orb of light that follows slightly above and behind you. it provides bright light for a 20ft radius and dim light for a 20ft radius past that. {&#x27;5&#x27;: &#x27;you can move the orb up to 20 feet away from you.&#x27;, &#x27;10&#x27;: &#x27;you can move the orb up to 60 feet away from you and can double the radius of the brightness with a thought.&#x27;, &#x27;15&#x27;: &#x27;you can move the orb up to 100 feet away from you and attach it to a surface as an action.&#x27;}\" data-category=\"Passive\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-torch\">Torch\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Mana: 1 · Range: Self\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"tripper tripper spell “let’s see if they know we’re coming.” passive, area of effect true false true passive [] [] none 30ft burst radius 5 hours does not detonate traps with very specific triggers. must be imbued onto something you are wearing. with a snap of your fingers, every movement, heat, and weight-triggered trap in the area “goes off.” blades swing, bombs blow, and creatures are released. {&#x27;5&#x27;: &#x27;+intelligence burst radius.&#x27;, &#x27;10&#x27;: &#x27;+intelligence burst radius.  move ×5 for the duration.&#x27;}\" data-category=\"Passive\" data-stat=\"Intelligence\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-twinkle-toes\">Twinkle Toes\u003c/a>\u003c/h2>\u003cp class=\"source\">Passive\u003c/p>\u003cp>Stat: Intelligence · Mana: 2 · Range: 5 feet\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"unnecessary-force unnecessary force spell “excessive force authorized. paperwork waived.” attack, force false false false attack [] [&#x27;force&#x27;] 13 40 feet 1d12 + int force a shockwave akin to that of an a-bomb crashes over your target. {&#x27;5&#x27;: &#x27;+1d12 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d12 base damage, and the target is pushed 10 feet.&#x27;, &#x27;15&#x27;: &#x27;+1d12 base damage, and the target is pushed 15 feet.&#x27;}\" data-category=\"Attack\" data-stat=\"\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-unnecessary-force\">Unnecessary Force\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Mana: 13 · Range: 40 feet · Damage: 1d12 + Int Force\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"vine-porn vine porn spell “it’s like tentacle porn, but with vines… sorry, mom.” attack, piercing, constitution, favored: druid constitution false false false attack [&#x27;druid&#x27;] [&#x27;piercing&#x27;] 3 20 feet 1 1d4 + con piercing magical vines with pulsating veins shoot up from the ground or sprout from the target’s own body to rip and tear and smack them around a bit. {&#x27;5&#x27;: &#x27;+1d4 base damage.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and this attack deals armor-piercing damage (ignores dr).&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage. on a critical hit, the target takes ×4 damage.&#x27;}\" data-category=\"Attack\" data-stat=\"Constitution\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-vine-porn\">Vine Porn\u003c/a>\u003c/h2>\u003cp cla "source\">Passive\u003c/p>\u003cp>Stat: Intelligence · Mana: 2 · Range: Self\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"web web spell “blast your goo onto foes!” attack, intelligence intelligence false false false attack [] [] 6 20ft cone 2 rounds a cone of sticky webbing shoots from your fingers.\n\nmake a single spell attack skill check vs. each friend and foe’s evade (if any). on success, that entity gains the held debuff. the rank of this spell is used in the opposed difficulty to escape, instead of str. {&#x27;5&#x27;: &#x27;+5ft cone. duration is 5 rounds.&#x27;, &#x27;10&#x27;: &#x27;+5ft cone. duration is 10 rounds.&#x27;, &#x27;15&#x27;: &#x27;+5ft cone. duration is 15 rounds.&#x27;}\" data-category=\"Attack\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#spell-web\">Web\u003c/a>\u003c/h2>\u003cp class=\"source\">Attack\u003c/p>\u003cp>Stat: Intelligence · Mana: 6 · Range: 20ft Cone\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"wilburs-slow-build-fireblast wilbur’s slow-build fireblast spell “hold. hold! hold!” attack, fire false false false attack [] [&#x27;fire&#x27;] 60 50 feet 1d8 + int fire, and the target gains the burned debuff. this spell can be cast and held as a swirling ring of fire around your ring finger until you unleash it. only one ring may be held at a time. the next time you perform an attack action, it must be this spell (at no additional mana cost).\n\nif anyone touches the ring with the intent to diffuse it (you may oppose that action), the attack hits them for half damage. the appendage they touched you with smolders, useless for a number of rounds equal to the damage inflicted. {&#x27;5&#x27;: &#x27;+1d8 base damage. for each full day you hold the spell, +1d8 fire damage.&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage and +5ft splash.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage and +5ft splash.&# l-panty-dropper", "spell-ping", "spell-protective-shell", "spell-puddle-jumper", "spell-rise-dead-minion", "spell-rootfoot", "spell-second-chance", "spell-shield", "spell-shock-treatment", "spell-solsplash", "spell-soul-collector", "spells-rules", "spell-thunderlash", "spell-torch", "spell-tripper", "spell-turn-undead", "spell-twinkle-toes", "spell-unnecessary-force", "spell-vine-porn", "spell-wall-of-fire", "spell-water-breathing", "spell-web", "spell-wilburs-slow-build-fireblast", "spell-wisp-armor"], "search": "spells 54 entries · royal court edition "}, {"id": "spells-rules", "reference": true, "referenceEntry": false, "title": "Spells — Rules", "group": "Spells", "type": "rule", "typeLabel": "Game Guide", "dek": "General rules from the Royal Court Edition.", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← Browse spells\u003c/a>\u003c/p>\u003ch2>Spells\u003c/h2>\u003cp>Spells are the strange, dangerous, and occasionally irresponsible way crawlers bend reality. Some Spells heal wounds or reshape the battlefield, and others exist primarily to make something stop moving— permanently. Spells cannot be attempted untrained except via a scroll. Every Spell listed in this section follows the same core rules for things like casting, targeting, and spend-ing Mana. Spell listings include a variety of terms or fields associated with them, including: Name: The name of the Spell appears as a headline to the entry. Type: Whether the Spell is an Attack or Passive is noted under the flavor text. The type of damage delivered from Attack Spells is also listed here for quick reference. Spells default to your Int Mod for to-hit and damage rolls. If a different Stat is listed here, that Stat is used to hit and damage, but Spells all still use Intelligence for Mana. If the spell is Favored by any particular Classes, other Classes pay 1 additional Mana to cast it. Mana Cost: The Mana cost to cast the Spell. Range: The range of the Spell. Melee means 5ft (adjacent). Duration: Some Spells are not instantaneous. When the duration is reached, the Spell effect wears off at the end of that round. AI Favor: Low-damage Spells grant AI Favor to you if you use such a wimpy attack for a majority of your attacks during a combat that lasts for at least three rounds. Limitations: If there are conditions, requirements, or exclusions, they go here. Cooldown: If the Spell has a cooldown, it is listed here. You can’t cast the Spell during its cooldown. Description: Any notes or descriptions of the general effect seen when you cast the Spell are listed here. If the Spell requires a Spell Check, that is also provided here. Base Damage: This is the damage the Spell deals with 1–4 Ranks in the Spell. You add your Int to the base damage, unless it says otherwise. The damage type is listed here as well. Upgrades: These are bonuses you gain when you reach the listed Rank in the Spell. The first entry of each benefit adds a damage die of the same type to the base damage of the Spell. Additional damage dice and effects are also listed here.\u003c/p>\u003cp class=\"source\">Printed pages 202 · PDF pages 204\u003c/p>\u003ch2>Spells in Your Hotlist\u003c/h2>\u003cp>Don’t forget that Spells need to be in your Hotlist to cast them in combat or other stressful situations. Write down the specific combat text for your Spell in the “Attacks” section on the front of your character sheet. When you write a Spell on your Hotlist, you need only list additional notes like the Mana cost and Range of the Spell. Attack Spells require you to make an Attack Skill Check vs. the target’s Evade. Spells that don’t require a Check to be made when cast (non-Attack Spells) are tagged as Passive and simply happen, but those are not marked for Skill Advancement (p. 169) when used. Instead, their Ranks must be raised via magical means or trained at  include a variety of terms or fields associated with them, including: name: the name of the spell appears as a headline to the entry. type: whether the spell is an attack or passive is noted under the flavor text. the type of damage delivered from attack spells is also listed here for quick reference. spells default to your int mod for to-hit and damage rolls. if a different stat is listed here, that stat is used to hit and damage, but spells all still use intelligence for mana. if the spell is favored by any particular classes, other classes pay 1 additional mana to cast it. mana cost: the mana cost to cast the spell. range: the range of the spell. melee means 5ft (adjacent). duration: some spells are not instantaneous. when the duration is reached, the spell effect wears off at the end of that round. ai favor: low-damage spells grant ai favor to you if you use such a wimpy attack for a majority of your attacks during a combat that lasts for at least three rounds. limitations: if there are conditions, requirements, or exclusions, they go here. cooldown: if the spell has a cooldown, it is listed here. you can’t cast the spell during its cooldown. description: any notes or descriptions of the general effect seen when you cast the spell are listed here. if the spell requires a spell check, that is also provided here. base damage: this is the damage the spell deals with 1–4 ranks in the spell. you add your int to the base damage, unless it says otherwise. the damage type is listed here as well. upgrades: these are bonuses you gain when you reach the listed rank in the spell. the first entry of each benefit adds a damage die of the same type to the base damage of the spell. additional damage dice and effects are also listed here. don’t forget that spells need to be in your hotlist to cast them in combat or other stressful situations. write down the specific combat text for your spell in the “attacks” section on the front of your character sheet. when you write a spell
