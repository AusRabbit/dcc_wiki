on your hotlist, you need only list additional notes like the mana cost and range of the spell. attack spells require you to make an attack skill check vs. the target’s evade. spells that don’t require a check to be made when cast (non-attack spells) are tagged as passive and simply happen, but those are not marked for skill advancement (p. 169) when used. instead, their ranks must be raised via magical means or trained at a guild. in the ways that count, spells are just a special type of skill. create them in the same way as you’re create a skill (p. 174–175)."}, {"id": "spell-air-buddy", "reference": true, "referenceEntry": true, "title": "Air Buddy", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“There’s no dungeon rule that a dog can’t fly.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive, Favored: Mage\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>12\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Mage\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You launch yourself with enough force to fly, hurtling forward from your current position up to 10 × your Int Mod away. You land safely if you land on solid ground; otherwise, you fall (see p. 76). You can cast this twice in a row to “double jump” just like in platforming video games.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may choose one additional willing target up to your size at touch range, who you bring with you.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can fly up to 20 × your Int Mod away with this spell.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You may choose up to five additional willing targets up to your size at touch range to bring with you.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 202 · PDF pages 204\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">AIR BUDDY\n“There’s no dungeon rule that a dog can’t fly.”\nPassive, Favored: Mage\nMana Cost: 12\nRange: Self\nYou launch yourself with enough force to fly, hurtling for‑\nward from your current position up to 10 × your Int Mod\naway. You land safely if you land on solid ground; other‑\nwise, you fall (see p. 76). You can cast this twice in a row\nto “double jump” just like in platforming video games.\nUPGRADES\nRank 5: You may choose one additional willing target\nup to your size at touch range, who you bring with you.\nRank 10: You can fly up to 20 × your Int Mod away\nwith this spell.\nRank 15: You may choose up to five additional willing\ntargets up to your size at touch range to bring with you.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "air buddy passive air-buddy air buddy spell “there’s no dungeon rule that a dog can’t fly.” passive, favored: mage true false false passive ['mage'] [] 12 self you launch yourself with enough force to fly, hurtling forward from your current position up to 10 × your int mod away. you land safely if you land on solid ground; otherwise, you fall (see p. 76). you can cast this twice in a row to “double jump” just like in platforming video games. {'5': 'you may choose one additional willing target up to your size at touch range, who you bring with you.', '10': 'you can fly up to 20 × your int mod away with this spell.', '15': 'you may choose up to five additional willing targets up to your size at touch range to bring with you.'}"}, {"id": "spell-astral-paw-astral-hand-astral-claw", "reference": true, "referenceEntry": true, "title": "Astral Paw (Astral Hand, Astral Claw)", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“You have summoned an Astral Paw. Yes, just the paw. Budget constraints.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>12\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>Until the end of combat or 5 minutes.\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You conjure a spectral hand, paw, or claw, looking much like your own. You can use this astral appendage to manipulate objects up to 30ft away by spending an Action. You can use the Astral Paw to make Skill Checks but suffer Disadvantage due to a lack of fine control.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your Pugilism and Slice Attacks with the Paw add 1 Astral Paw Rank damage die.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can conjure a paw up to four size categories larger than your own, and the range increases to 50 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The caster no longer suffers Disadvantage when performing suitable Skill Checks using the paw, and the duration is 15 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 203 · PDF pages 205\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ASTRAL PAW (ASTRAL HAND, ASTRAL CLAW)\n“You have summoned an Astral Paw. Yes, just the\npaw. Budget constraints.”\nPassive\nMana Cost: 12\nRange: 30 feet\nDuration: Until the end of combat or 5 minutes.\nYou conjure a spectral hand, paw, or claw, looking\nmuch like your own. You can use this astral appendage\nto manipulate objects up to 30ft away by spending an\nAction. You can use the Astral Paw to make Skill Checks\nbut suffer Disadvantage due to a lack of fine control.\nUPGRADES\nRank 5: Your Pugilism and Slice Attacks with the Paw\nadd 1 Astral Paw Rank damage die.\nRank 10: You can conjure a paw up to four size\ncategories larger than your own, and the range\nincreases to 50 feet.\nRank 15: The caster no longer suffers Disadvantage\nwhen performing suitable Skill Checks using the paw,\nand the duration is 15 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "astral paw (astral hand, astral claw) passive astral-paw-astral-hand-astral-claw astral paw (astral hand, astral claw) spell “you have summoned an astral paw. yes, just the paw. budget constraints.” passive true false false passive [] [] 12 30 feet until the end of combat or 5 minutes. you conjure a spectral hand, paw, or claw, looking much like your own. you can use this astral appendage to manipulate objects up to 30ft away by spending an action. you can use the astral paw to make skill checks but suffer disadvantage due to a lack of fine control. {'5': 'your pugilism and slice attacks with the paw add 1 astral paw rank damage die.', '10': 'you can conjure a paw up to four size categories larger than your own, and the range increases to 50 feet.', '15': 'the caster no longer suffers disadvantage when performing suitable skill checks using the paw, and the duration is 15 minutes.'}"}, {"id": "spell-bad-faith", "reference": true, "referenceEntry": true, "title": "Bad Faith", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“The system has classified your prayers as a hostile act.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Necrotic, Charisma, Favored: Cleric\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Cha Necrotic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Necrotic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Cleric\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>An unholy presence invades your victim’s mind, body, and soul.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage, +5ft Splash\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage, and end all Buffs on the victims for the duration of the combat.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, +5ft Splash\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 203 · PDF pages 205\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BAD FAITH\n“The system has classified your prayers\nas a hostile act.”\nAttack, Necrotic, Charisma, Favored:\nCleric\nMana Cost: 10\nRange: 40 feet\nAn unholy pres‑\nence invades your\nvictim’s mind, body,\nand soul.\nBase Damage:\n1d8 + Cha\nNecrotic\nUPGRADES\nRank 5: +1d8\nbase damage, +5ft\nSplash\nRank 10: +1d8 base damage,\nand end all Buffs on the victims for\nthe duration of the combat.\nRank 15: +1d8 base damage, +5ft\nSplash\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "bad faith attack bad-faith bad faith spell “the system has classified your prayers as a hostile act.” attack, necrotic, charisma, favored: cleric charisma false false false attack ['cleric'] ['necrotic'] 10 40 feet 1d8 + cha necrotic an unholy presence invades your victim’s mind, body, and soul. {'5': '+1d8 base damage, +5ft splash', '10': '+1d8 base damage, and end all buffs on the victims for the duration of the combat.', '15': '+1d8 base damage, +5ft splash'}"}, {"id": "spell-bang-bro", "reference": true, "referenceEntry": true, "title": "Bang Bro", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“When you want more zing in your zinger.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>5\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>5 minutes + 1 minute per Rank\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>15 minutes\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Place a hot and crackling temporary enchantment on a weapon you are holding.\u003c/p>\u003cp>Your weapon deals +2 mixed Fire and Electric damage.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 Fire and Electric damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 Fire and Electric damage, and on an Amazing Success, the target of the weapon attack gains the Burned Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 Fire and Electric damage, and on an Amazing Success, the target of the weapon attack also gains the Shocked Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 203 · PDF pages 205\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BANG BRO\n“When you want more zing in your zinger.”\nPassive\nMana Cost: 5\nRange: 5 feet\nDuration: 5 minutes + 1 minute per Rank\nCooldown: 15 minutes\nPlace a hot and crackling temporary enchantment on a\nweapon you are holding.\nYour weapon deals +2 mixed Fire and Electric damage.\nUPGRADES\nRank 5: +1d6 Fire and Electric damage\nRank 10: +1d6 Fire and Electric damage, and on an\nAmazing Success, the target of the weapon attack\ngains the Burned Debuff.\nRank 15: +1d6 Fire and Electric damage, and on an\nAmazing Success, the target of the weapon attack also\ngains the Shocked Debuff.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "bang bro passive bang-bro bang bro spell “when you want more zing in your zinger.” passive true false false passive [] [] 5 5 feet 5 minutes + 1 minute per rank 15 minutes place a hot and crackling temporary enchantment on a weapon you are holding.\n\nyour weapon deals +2 mixed fire and electric damage. {'5': '+1d6 fire and electric damage', '10': '+1d6 fire and electric damage, and on an amazing success, the target of the weapon attack gains the burned debuff.', '15': '+1d6 fire and electric damage, and on an amazing success, the target of the weapon attack also gains the shocked debuff.'}"}, {"id": "spell-clockwork-triplicate", "reference": true, "referenceEntry": true, "title": "Clockwork Triplicate", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“If one is good, then three is a party.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>26\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>1 minute per Rank\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Only castable on pets and minions.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>When you cast this spell upon your pet or minion, it splits into three, each with its full complement of abilities. You must spend an Action making an Unopposed Animal Handling Skill Check to issue a new command to each one separately.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Duration is 2 minutes per Rank.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Duration is 3 minutes per Rank.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>When you command your pet or minion, the clockwork versions follow suit.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 203 · PDF pages 205\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CLOCKWORK TRIPLICATE\n“If one is good, then three is a party.”\nPassive\nMana Cost: 26\nRange: 5 feet\nDuration: 1 minute per\nRank\nLimitations: Only castable on\npets and minions.\nWhen you cast this spell\nupon your pet or minion, it\nsplits into three, each with\nits full complement of\nabilities. You must\nspend an Action\nmaking an Unopposed\nAnimal Handling\nSkill Check to issue a new\ncommand to each one separately.\nUPGRADES\nRank 5: Duration is 2 minutes per\nRank.\nRank 10: Duration is 3 minutes per Rank.\nRank 15: When you command your pet or minion, the\nclockwork versions follow suit.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "clockwork triplicate passive clockwork-triplicate clockwork triplicate spell “if one is good, then three is a party.” passive true false false passive [] [] 26 5 feet 1 minute per rank only castable on pets and minions. when you cast this spell upon your pet or minion, it splits into three, each with its full complement of abilities. you must spend an action making an unopposed animal handling skill check to issue a new command to each one separately. {'5': 'duration is 2 minutes per rank.', '10': 'duration is 3 minutes per rank.', '15': 'when you command your pet or minion, the clockwork versions follow suit.'}"}, {"id": "spell-confusing-fog", "reference": true, "referenceEntry": true, "title": "Confusing Fog", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Visibility reduced. Decision-making questionable.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>6\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>Until the end of two full rounds of combat or 20 seconds\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>15 minutes\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You create a billowing cloud of fog that you, your party members, and friendly NPCs can see through, but it obscures the area from Mobs, making it more difficult for them to attack you. Mobs attack with Disadvantage (see Mob Advantage and Disadvantage, p. 60) against targets in the fog.\u003c/p>\u003cp>This fog fills a 25 × 25ft area. Smart Mobs may attempt to move the combat out of the fog if able.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The fog fills a 50 × 50ft area, and its duration is 1 minute.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The fog fills a 100 × 100ft area and lasts for 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The fog fills a 500 × 500ft area and lasts for 15 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 204 · PDF pages 206\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CONFUSING FOG\n“Visibility reduced. Decision-making questionable.”\nPassive\nMana Cost: 6\nRange: 40 feet\nDuration: Until the end of two full rounds of combat\nor 20 seconds\nCooldown: 15 minutes\nYou create a billowing cloud of fog that you, your party\nmembers, and friendly NPCs can see through, but it\nobscures the area from Mobs, making it more difficult\nfor them to attack you. Mobs attack with Disadvantage\n(see Mob Advantage and Disadvantage, p. 60) against\ntargets in the fog.\nThis fog fills a 25 × 25ft area. Smart Mobs may attempt\nto move the combat out of the fog if able.\nUPGRADES\nRank 5: The fog fills a 50 × 50ft area, and its duration\nis 1 minute.\nRank 10: The fog fills a 100 × 100ft area and lasts for\n5 minutes.\nRank 15: The fog fills a 500 × 500ft area and lasts for\n15 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "confusing fog passive confusing-fog confusing fog spell “visibility reduced. decision-making questionable.” passive true false false passive [] [] 6 40 feet until the end of two full rounds of combat or 20 seconds 15 minutes you create a billowing cloud of fog that you, your party members, and friendly npcs can see through, but it obscures the area from mobs, making it more difficult for them to attack you. mobs attack with disadvantage (see mob advantage and disadvantage, p. 60) against targets in the fog.\n\nthis fog fills a 25 × 25ft area. smart mobs may attempt to move the combat out of the fog if able. {'5': 'the fog fills a 50 × 50ft area, and its duration is 1 minute.', '10': 'the fog fills a 100 × 100ft area and lasts for 5 minutes.', '15': 'the fog fills a 500 × 500ft area and lasts for 15 minutes.'}"}, {"id": "spell-dirt-clod", "reference": true, "referenceEntry": true, "title": "Dirt Clod", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“You have weaponized dirt.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Bludgeoning\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>100 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d2 + Int Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You hurl a magical clod of dirt, leaving dirt and pebbles strewn about near the target.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+2d2 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d2 base damage, and the target gains the Woozy Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d2 base damage, and 1 Rank damage die.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 204 · PDF pages 206\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DIRT CLOD\n“You have weaponized dirt.”\nAttack, Bludgeoning\nMana Cost: 1\nRange: 100 feet\nAI Favor: 2\nYou hurl a magical clod of dirt, leaving dirt and pebbles\nstrewn about near the target.\nBase Damage: 1d2 + Int Bludgeoning\nUPGRADES\nRank 5: +2d2 base damage\nRank 10: +1d2 base damage, and the target gains the\nWoozy Debuff.\nRank 15: +1d2 base damage, and 1 Rank damage die.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "dirt clod attack dirt-clod dirt clod spell “you have weaponized dirt.” attack, bludgeoning false false false attack [] ['bludgeoning'] 1 100 feet 2 1d2 + int bludgeoning you hurl a magical clod of dirt, leaving dirt and pebbles strewn about near the target. {'5': '+2d2 base damage', '10': '+1d2 base damage, and the target gains the woozy debuff.', '15': '+1d2 base damage, and 1 rank damage die.'}"}, {"id": "spell-drain-life", "reference": true, "referenceEntry": true, "title": "Drain Life", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Organic tether deployed. Try not to think about where it’s been.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Necrotic\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>14\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Int Necrotic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Necrotic\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>For a brief instant, you create a disgusting blood vein that reaches out and wraps itself around your target.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage, and if the target loses at least 3 Health Bar slots, you heal 1 Health Bar slot.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and if you heal this way, heal +1 Health Bar slot.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and if you heal this way, heal +1 Health Bar slot.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 204 · PDF pages 206\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DRAIN LIFE\n“Organic tether deployed. Try not to think about\nwhere it’s been.”\nAttack, Necrotic\nMana Cost: 14\nRange: 30 feet\nLimitations: For a brief instant, you create a disgust‑\ning blood vein that reaches out and wraps itself around\nyour target.\nBase Damage: 1d6 + Int Necrotic\nUPGRADES\nRank 5: +1d6 base damage, and if the target loses at\nleast 3 Health Bar slots, you heal 1 Health Bar slot.\nRank 10: +1d6 base damage, and if you heal this way,\nheal +1 Health Bar slot.\nRank 15: +1d6 base damage, and if you heal this way,\nheal +1 Health Bar slot.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "drain life attack drain-life drain life spell “organic tether deployed. try not to think about where it’s been.” attack, necrotic false false false attack [] ['necrotic'] 14 30 feet for a brief instant, you create a disgusting blood vein that reaches out and wraps itself around your target. 1d6 + int necrotic {'5': '+1d6 base damage, and if the target loses at least 3 health bar slots, you heal 1 health bar slot.', '10': '+1d6 base damage, and if you heal this way, heal +1 health bar slot.', '15': '+1d6 base damage, and if you heal this way, heal +1 health bar slot.'}"}, {"id": "spell-earworm", "reference": true, "referenceEntry": true, "title": "Earworm", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Hitting every note except the right ones.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Sonic, Charisma, Favored: Bard\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>6\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30ft\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>Once per round.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Cha Sonic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Sonic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Bard\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Sing a terrible song targeting the ear holes of a victim. Yes, sing a few bars so the GM understands the pain you’re inflicting.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and the target gains the Queasy Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage and +10ft Splash.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 204 · PDF pages 206\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">EARWORM\n“Hitting every note except the right ones.”\nAttack, Sonic, Charisma, Favored: Bard\nMana Cost: 6\nRange: 30ft\nCooldown: Once per round.\nSing a terrible song targeting the ear holes of a victim.\nYes, sing a few bars so the GM understands the pain\nyou’re inflicting.\nBase Damage: 1d6 + Cha Sonic\nUPGRADES\nRank 5: +1d6 base damage.\nRank 10: +1d6 base damage, and the target gains the\nQueasy Debuff.\nRank 15: +1d6 base damage and +10ft Splash.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "earworm attack earworm earworm spell “hitting every note except the right ones.” attack, sonic, charisma, favored: bard charisma false false false attack ['bard'] ['sonic'] 6 30ft once per round. 1d6 + cha sonic sing a terrible song targeting the ear holes of a victim. yes, sing a few bars so the gm understands the pain you’re inflicting. {'5': '+1d6 base damage.', '10': '+1d6 base damage, and the target gains the queasy debuff.', '15': '+1d6 base damage and +10ft splash.'}"}, {"id": "spell-fear", "reference": true, "referenceEntry": true, "title": "Fear", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Run away, little piggies!”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Mind Control\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>3\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>25 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Mind Control\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Warning: Scary-ass Mobs are immune to Fear effects (GM’s discretion).\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Target a non-Boss Mob of half your level or less. On a Standard Success, it stands its ground, but it loses its Dex Mod for the duration of the combat. On a higher success, it uses two of its Actions during the next round to run away.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+5ft Blast radius.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+5ft Blast radius, and on a Critical Hit, the affected creatures gain the Paralyzed Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+5ft Blast radius.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 204–205 · PDF pages 206–207\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FEAR\n“Run away, little piggies!”\nAttack, Mind Control\nMana Cost: 3\nRange: 25 feet\nLimitations: Warning: Scary-ass Mobs are immune to\nFear effects (GM’s discretion).\nTarget a non-Boss Mob of half your level or less. On a\nStandard Success, it stands its ground, but it loses its\nDex Mod for the duration of the combat. On a higher\nsuccess, it uses two of its Actions during the next\nround to run away.\nUPGRADES\nRank 5: +5ft Blast radius.\nRank 10: +5ft Blast radius, and on a Critical Hit, the\naffected creatures gain the Paralyzed Debuff.\nRank 15: +5ft Blast radius.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "fear attack fear fear spell “run away, little piggies!” attack, mind control false false false attack [] ['mind control'] 3 25 feet warning: scary-ass mobs are immune to fear effects (gm’s discretion). target a non-boss mob of half your level or less. on a standard success, it stands its ground, but it loses its dex mod for the duration of the combat. on a higher success, it uses two of its actions during the next round to run away. {'5': '+5ft blast radius.', '10': '+5ft blast radius, and on a critical hit, the affected creatures gain the paralyzed debuff.', '15': '+5ft blast radius.'}"}, {"id": "spell-fire-fingers", "reference": true, "referenceEntry": true, "title": "Fire Fingers", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Fire Fingers activated. Try not to make it weird.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Fire\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>3\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Int Fire\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Fire\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Brilliant flame leaps from your fingers.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and the target gains the Burned Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and your hands begin to intermittently burn. Your Pugilism, Unarmed Combat, and Slice Attack strikes add 1 Fire Fingers Rank damage die (Fire).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 205 · PDF pages 207\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FIRE FINGERS\n“Fire Fingers activated. Try not to make it weird.”\nAttack, Fire\nMana Cost: 3\nRange: Melee\nAI Favor: 1\nBrilliant flame leaps from your fingers.\nBase Damage: 1d4 + Int Fire\nUPGRADES\nRank 5: +1d4 base damage.\nRank 10: +1d4 base damage, and the target gains the\nBurned Debuff.\nRank 15: +1d4 base damage, and your hands begin to\nintermittently burn. Your Pugilism, Unarmed Combat,\nand Slice Attack strikes add 1 Fire Fingers Rank dam‑\nage die (Fire).\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "fire fingers attack fire-fingers fire fingers spell “fire fingers activated. try not to make it weird.” attack, fire false false false attack [] ['fire'] 3 melee 1 1d4 + int fire brilliant flame leaps from your fingers. {'5': '+1d4 base damage.', '10': '+1d4 base damage, and the target gains the burned debuff.', '15': '+1d4 base damage, and your hands begin to intermittently burn. your pugilism, unarmed combat, and slice attack strikes add 1 fire fingers rank damage die (fire).'}"}, {"id": "spell-fireball", "reference": true, "referenceEntry": true, "title": "Fireball", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“It almost reluctantly meanders toward you. Then your world explodes.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Fire, Area of Effect\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>45\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>80 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>Once per scene\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d12 + Int Fire, 10ft Blast radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Fire\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>A creeping beach ball-sized sphere of fire emanates from you. Since it moves so slowly, your attack is made with Disadvantage. When the impact zone has been determined, each creature in a 10ft Blast radius takes full damage.\u003c/p>\u003cp>On Fail, roll 1d8 for direction (see Figure 3, p. 200). The amount the Skill Check missed by is the distance away in feet it impacts.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d12 base damage. Those who lose 1 or more Health Bar slots via this attack gain the Burned Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d12 base damage and becomes an 80ft Line attack (and keeps the Blast).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d12 base damage and +40ft Splash (on the Blast).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 205 · PDF pages 207\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FIREBALL\n“It almost reluctantly meanders toward you. Then\nyour world explodes.”\nAttack, Fire, Area of Effect\nMana Cost: 45\nRange: 80 feet\nCooldown: Once per scene\nA creeping beach ball-sized sphere of fire emanates\nfrom you. Since it moves so slowly, your attack is\nmade with Disadvantage. When the impact zone has\nbeen determined, each creature in a 10ft Blast radius\ntakes full damage.\nOn Fail, roll 1d8 for direction (see Figure 3, p. 200). The\namount the Skill Check missed by is the distance away\nin feet it impacts.\nBase Damage: 1d12 + Int Fire, 10ft Blast radius\nUPGRADES\nRank 5: +1d12 base damage. Those who lose 1 or more\nHealth Bar slots via this attack gain the Burned Debuff.\nRank 10: +1d12 base damage and becomes an 80ft\nLine attack (and keeps the Blast).\nRank 15: +1d12 base damage and +40ft Splash (on\nthe Blast).\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "fireball attack fireball fireball spell “it almost reluctantly meanders toward you. then your world explodes.” attack, fire, area of effect false false true attack [] ['fire'] 45 80 feet once per scene 1d12 + int fire, 10ft blast radius a creeping beach ball-sized sphere of fire emanates from you. since it moves so slowly, your attack is made with disadvantage. when the impact zone has been determined, each creature in a 10ft blast radius takes full damage.\n\non fail, roll 1d8 for direction (see figure 3, p. 200). the amount the skill check missed by is the distance away in feet it impacts. {'5': '+1d12 base damage. those who lose 1 or more health bar slots via this attack gain the burned debuff.', '10': '+1d12 base damage and becomes an 80ft line attack (and keeps the blast).', '15': '+1d12 base damage and +40ft splash (on the blast).'}"}, {"id": "spell-frost-scar", "reference": true, "referenceEntry": true, "title": "Frost Scar", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Frigid status achieved; relationships may suffer.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Ice\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Int Ice\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Ice\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>With a slice of your frigid hand, you leave a scar of rime on your target.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and the target cannot heal themselves in the next combat round.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and the target gains the Stiff Legs Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and the target gains The Taint Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 205 · PDF pages 207\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FROST SCAR\n“Frigid status achieved; relationships may suffer.”\nAttack, Ice\nMana Cost: 2\nRange: Melee\nAI Favor: 1\nWith a slice of your frigid hand, you leave a scar of\nrime on your target.\nBase Damage: 1d4 + Int Ice\nUPGRADES\nRank 5: +1d4 base damage, and the target cannot\nheal themselves in the next combat round.\nRank 10: +1d4 base damage, and the target gains the\nStiff Legs Debuff.\nRank 15: +1d4 base damage, and the target gains The\nTaint Debuff.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "frost scar attack frost-scar frost scar spell “frigid status achieved; relationships may suffer.” attack, ice false false false attack [] ['ice'] 2 melee 1 1d4 + int ice with a slice of your frigid hand, you leave a scar of rime on your target. {'5': '+1d4 base damage, and the target cannot heal themselves in the next combat round.', '10': '+1d4 base damage, and the target gains the stiff legs debuff.', '15': '+1d4 base damage, and the target gains the taint debuff.'}"}, {"id": "spell-grand-illusion", "reference": true, "referenceEntry": true, "title": "Grand Illusion", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Other", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Why, yes, that is my pet T-Rex.”\u003c/em>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>other\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>7\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>15 minutes\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You create an illusion that might trick your foes. Make a single Int-Opposed Spell Check vs. foes who can see it. Your same roll is used against foes who see it even after the casting round.\u003c/p>\u003cp>Mundane illusions seeking only to impress might be rolled with Advantage, while complex illusions seeking a specific response or images that suddenly pop up during combat might be rolled with Disadvantage (GM’s discretion).\u003c/p>\u003cp>On Success, they believe your illusion.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Those who believe gain the Woozy Debuff or similar based on the desired response.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Those who believe also gain the Queasy Debuff or similar based on the desired response.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Those who believe also gain the Shocked Debuff or similar based on the desired response.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 205–206 · PDF pages 207–208\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">GRAND ILLUSION\n“Why, yes, that is my pet T-Rex.”\nIntelligence\nMana Cost: 7\nRange: 40 feet\nDuration: 2 minutes\nCooldown: 15 minutes\nYou create an illusion that might trick your foes.\nMake a single Int-Opposed Spell Check vs. foes who\ncan see it. Your same roll is used against foes who see\nit even after the casting round.\nMundane illusions seeking only to impress might be\nrolled with Advantage, while complex illusions seek‑\ning a specific response or images that suddenly pop\nup during combat might be rolled with Disadvantage\n(GM’s discretion).\nOn Success, they believe your illusion.\nUPGRADES\nRank 5: Those who believe gain the Woozy Debuff or\nsimilar based on the desired response.\nRank 10: Those who believe also gain the Queasy\nDebuff or similar based on the desired response.\nRank 15: Those who believe also gain the Shocked\nDebuff or similar based on the desired response.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "grand illusion other grand-illusion grand illusion spell “why, yes, that is my pet t-rex.” intelligence intelligence false false false other [] [] 7 40 feet 2 minutes 15 minutes you create an illusion that might trick your foes. make a single int-opposed spell check vs. foes who can see it. your same roll is used against foes who see it even after the casting round.\n\nmundane illusions seeking only to impress might be rolled with advantage, while complex illusions seeking a specific response or images that suddenly pop up during combat might be rolled with disadvantage (gm’s discretion).\n\non success, they believe your illusion. {'5': 'those who believe gain the woozy debuff or similar based on the desired response.', '10': 'those who believe also gain the queasy debuff or similar based on the desired response.', '15': 'those who believe also gain the shocked debuff or similar based on the desired response.'}"}, {"id": "spell-heal", "reference": true, "referenceEntry": true, "title": "Heal", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Heal", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Congratulations on not dying… yet.”\u003c/em>\u003c/p>\u003cp class=\"source\">Heal, Interrupt, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>heal\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self only\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Rank 1 maximum\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Heal 2 Health Bar slots.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003c/div>\u003cp>None\u003c/p>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 206 · PDF pages 208\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HEAL\n“Congratulations on not dying… yet.”\nHeal, Interrupt, Passive\nMana Cost: 2\nRange: Self only\nLimitations: Rank 1 maximum\nHeal 2 Health Bar slots.\nUPGRADES\nNone\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "heal heal heal heal spell “congratulations on not dying… yet.” heal, interrupt, passive true true false heal [] [] 2 self only rank 1 maximum heal 2 health bar slots. {} none"}, {"id": "spell-heal-critter", "reference": true, "referenceEntry": true, "title": "Heal Critter", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Heal", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Your pet has been restored to maximum cuddle capacity.”\u003c/em>\u003c/p>\u003cp class=\"source\">Heal, Interrupt, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>heal\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>8\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>May only be cast on pets and minions (sorry, Donut).\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>The target glows as they heal back to 100% Health Bar.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The target mends a Minor Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The target mends a Major Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The target regrows all lost appendages.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 206 · PDF pages 208\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HEAL CRITTER\n“Your pet has been restored to\nmaximum cuddle capacity.”\nHeal, Interrupt, Passive\nMana Cost: 8\nRange: 30 feet\nLimitations: May only be cast on\npets and minions (sorry, Donut).\nThe target glows as they heal\nback to 100% Health Bar.\nUPGRADES\nRank 5: The target mends a\nMinor Injury Debuff.\nRank 10: The target mends\na Major Injury Debuff.\nRank 15: The target\nregrows all lost appendages.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "heal critter heal heal-critter heal critter spell “your pet has been restored to maximum cuddle capacity.” heal, interrupt, passive true true false heal [] [] 8 30 feet may only be cast on pets and minions (sorry, donut). the target glows as they heal back to 100% health bar. {'5': 'the target mends a minor injury debuff.', '10': 'the target mends a major injury debuff.', '15': 'the target regrows all lost appendages.'}"}, {"id": "spell-heal-others", "reference": true, "referenceEntry": true, "title": "Heal Others", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Heal", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Tell me you’re a Cleric without…”\u003c/em>\u003c/p>\u003cp class=\"source\">Heal, Interrupt, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>heal\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>6\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>You can’t cast this Spell on yourself, pets, or minions.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>A wave of positive vibes engulfs the target. They heal 1d4 Health Bar slots.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The target heals 1d6 Health Bar slots.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The target heals 2d6 Health Bar slots.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Instead of a single target, all party members within a 20ft Burst radius are healed.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 206 · PDF pages 208\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HEAL OTHERS\n“Tell me you’re a Cleric without…”\nHeal, Interrupt, Passive\nMana Cost: 6\nRange: 30 feet\nLimitations: You can’t cast this Spell on yourself,\npets, or minions.\nA wave of positive vibes engulfs the target. They heal\n1d4 Health Bar slots.\nUPGRADES\nRank 5: The target heals 1d6 Health Bar slots.\nRank 10: The target heals 2d6 Health Bar slots.\nRank 15: Instead of a single target, all party members\nwithin a 20ft Burst radius are healed.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "heal others heal heal-others heal others spell “tell me you’re a cleric without…” heal, interrupt, passive true true false heal [] [] 6 30 feet you can’t cast this spell on yourself, pets, or minions. a wave of positive vibes engulfs the target. they heal 1d4 health bar slots. {'5': 'the target heals 1d6 health bar slots.', '10': 'the target heals 2d6 health bar slots.', '15': 'instead of a single target, all party members within a 20ft burst radius are healed.'}"}, {"id": "spell-heal-self", "reference": true, "referenceEntry": true, "title": "Heal Self", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Heal", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Way easier than manually shoving your guts back in!”\u003c/em>\u003c/p>\u003cp class=\"source\">Heal, Interrupt, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>heal\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self only\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>You can only case this Spell on yourself.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You center yourself, using magic to make yourself whole. You heal 1d4 Health Bar slots.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You heal 1d6 Health Bar slots and mend a Minor Injury, Poison, or Disease Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You heal 2d6 Health Bar slots and mend a Major Injury or other Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You heal to full and gain the benefits of a short rest.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 206 · PDF pages 208\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HEAL SELF\n“Way easier than manually shoving your guts back in!”\nHeal, Interrupt, Passive\nMana Cost: 1\nRange: Self only\nLimitations: You can only case this Spell on yourself.\nYou center yourself, using magic to make yourself\nwhole. You heal 1d4 Health Bar slots.\nUPGRADES\nRank 5: You heal 1d6 Health Bar slots and mend a\nMinor Injury, Poison, or Disease Debuff.\nRank 10: You heal 2d6 Health Bar slots and\nmend a Major Injury or other Debuff.\nRank 15: You heal to full and gain the\nbenefits of a short rest.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "heal self heal heal-self heal self spell “way easier than manually shoving your guts back in!” heal, interrupt, passive true true false heal [] [] 1 self only you can only case this spell on yourself. you center yourself, using magic to make yourself whole. you heal 1d4 health bar slots. {'5': 'you heal 1d6 health bar slots and mend a minor injury, poison, or disease debuff.', '10': 'you heal 2d6 health bar slots and mend a major injury or other debuff.', '15': 'you heal to full and gain the benefits of a short rest.'}"}, {"id": "spell-hole", "reference": true, "referenceEntry": true, "title": "Hole", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“It’s a hole. This will absolutely be misused.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>12\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>Until the end of the combat or 5 minutes.\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Can’t be used on saferoom doors or living things.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You create a temporary cylindrical hole in a surface or material within range, to a depth of 1 inch per Spell Rank and a diameter of 2ft. Anything that can fit in the hole can pass through it if the hole is deep enough to penetrate to the other side of the surface.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can reduce the diameter of the hole to a smaller size when cast.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can widen the hole’s diameter by 1 inch for every inch of depth you sacrifice when cast.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The caster may end the spell with a thought (like an Interrupt, but it doesn’t cost an Action). Anything in the hole at that time is destroyed.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 206–207 · PDF pages 208–209\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HOLE\n“It’s a hole. This will\nabsolutely be misused.”\nPassive\nMana Cost: 12\nRange: 10 feet\nDuration: Until the end of the\ncombat or 5 minutes.\nLimitations: Can’t be used\non saferoom doors or\nliving things.\nYou create a temporary cylindrical hole in a surface\nor material within range, to a depth of 1 inch per Spell\nRank and a diameter of 2ft. Anything that can fit in the\nhole can pass through it if the hole is deep enough to\npenetrate to the other side of the surface.\nUPGRADES\nRank 5: You can reduce the diameter of the hole to a\nsmaller size when cast.\nRank 10: You can widen the hole’s diameter by 1 inch\nfor every inch of depth you sacrifice when cast.\nRank 15: The caster may end the spell with a thought\n(like an Interrupt, but it doesn’t cost an Action). Any‑\nthing in the hole at that time is destroyed.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "hole passive hole hole spell “it’s a hole. this will absolutely be misused.” passive true false false passive [] [] 12 10 feet until the end of the combat or 5 minutes. can’t be used on saferoom doors or living things. you create a temporary cylindrical hole in a surface or material within range, to a depth of 1 inch per spell rank and a diameter of 2ft. anything that can fit in the hole can pass through it if the hole is deep enough to penetrate to the other side of the surface. {'5': 'you can reduce the diameter of the hole to a smaller size when cast.', '10': 'you can widen the hole’s diameter by 1 inch for every inch of depth you sacrifice when cast.', '15': 'the caster may end the spell with a thought (like an interrupt, but it doesn’t cost an action). anything in the hole at that time is destroyed.'}"}, {"id": "spell-holy-aura", "reference": true, "referenceEntry": true, "title": "Holy Aura", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Look who’s all high and mighty.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Holy, Area of Effect, Charisma, Favored: Cleric &amp; Paladin\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>7\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5ft Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>Once per round\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Cha Holy, 5ft Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Holy\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Cleric, Paladin\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You channel your deity and emanate their essence to hurt only the enemies around you.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and affected undead Mobs take double damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage and +5ft Burst radius.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage and +5ft Burst radius.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 207 · PDF pages 209\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HOLY AURA\n“Look who’s all high and mighty.”\nAttack, Holy, Area of Effect, Charisma, Favored: Cleric &amp;\nPaladin\nMana Cost: 7\nRange: 5ft Burst radius\nCooldown: Once per round\nYou channel your deity and emanate their essence to\nhurt only the enemies around you.\nBase Damage: 1d4 + Cha Holy, 5ft Burst radius\nUPGRADES\nRank 5: +1d4 base damage, and affected undead\nMobs take double damage.\nRank 10: +1d4 base damage and +5ft Burst radius.\nRank 15: +1d4 base damage and +5ft Burst radius.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "holy aura attack holy-aura holy aura spell “look who’s all high and mighty.” attack, holy, area of effect, charisma, favored: cleric & paladin charisma false false true attack ['cleric', 'paladin'] ['holy'] 7 5ft burst radius once per round 1d4 + cha holy, 5ft burst radius you channel your deity and emanate their essence to hurt only the enemies around you. {'5': '+1d4 base damage, and affected undead mobs take double damage.', '10': '+1d4 base damage and +5ft burst radius.', '15': '+1d4 base damage and +5ft burst radius.'}"}, {"id": "spell-hot-stuff-aura", "reference": true, "referenceEntry": true, "title": "Hot Stuff Aura", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Bask in the warm glow of my machismo!”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive, Area of Effect, Favored: Bard\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>8\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5ft Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 rounds\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Bard\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You create a shield of pure sex appeal around you against all damage types with a number of Health Bar slots equal to your Cha Mod, and a 2 in each slot. It also protects all allies within the radius. When depleted, it disappears. These slots cannot be healed.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Increase the Health to 4 in each slot.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+5ft Burst radius, with a 6 in each slot.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+10ft Burst radius, with a 8 in each slot.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 207 · PDF pages 209\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HOT STUFF AURA\n“Bask in the warm glow of my machismo!”\nPassive, Area of Effect, Favored: Bard\nMana Cost: 8\nRange: 5ft Burst radius\nDuration: 2 rounds\nCooldown: 5 minutes\nYou create a shield of pure sex appeal around you\nagainst all damage types with a number of Health Bar\nslots equal to your Cha Mod, and a 2 in each slot. It\nalso protects all allies within the radius. When deplet‑\ned, it disappears. These slots cannot be healed.\nUPGRADES\nRank 5: Increase the Health to 4 in each slot.\nRank 10: +5ft Burst radius, with a 6 in each slot.\nRank 15: +10ft Burst radius, with a 8 in each slot.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "hot stuff aura passive hot-stuff-aura hot stuff aura spell “bask in the warm glow of my machismo!” passive, area of effect, favored: bard true false true passive ['bard'] [] 8 5ft burst radius 2 rounds 5 minutes you create a shield of pure sex appeal around you against all damage types with a number of health bar slots equal to your cha mod, and a 2 in each slot. it also protects all allies within the radius. when depleted, it disappears. these slots cannot be healed. {'5': 'increase the health to 4 in each slot.', '10': '+5ft burst radius, with a 6 in each slot.', '15': '+10ft burst radius, with a 8 in each slot.'}"}, {"id": "spell-ice-blast", "reference": true, "referenceEntry": true, "title": "Ice Blast", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Hope they brought a jacket.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Ice\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>9\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Int Ice\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Ice\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>With the howl of blizzard winds, you let loose a compact pocket of freezing cold and ice.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage, and the target is pushed 10 feet away from you.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and you can change the range to a 15ft Cone Attack.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 207 · PDF pages 209\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ICE BLAST\n“Hope they brought a jacket.”\nAttack, Ice\nMana Cost: 9\nRange: 40 feet\nWith the howl of blizzard winds, you let loose a com‑\npact pocket of freezing cold and ice.\nBase Damage: 1d8 + Int Ice\nUPGRADES\nRank 5: +1d8 base damage.\nRank 10: +1d8 base damage, and the target is pushed\n10 feet away from you.\nRank 15: +1d8 base damage, and you can change the\nrange to a 15ft Cone Attack.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "ice blast attack ice-blast ice blast spell “hope they brought a jacket.” attack, ice false false false attack [] ['ice'] 9 40 feet 1d8 + int ice with the howl of blizzard winds, you let loose a compact pocket of freezing cold and ice. {'5': '+1d8 base damage.', '10': '+1d8 base damage, and the target is pushed 10 feet away from you.', '15': '+1d8 base damage, and you can change the range to a 15ft cone attack.'}"}, {"id": "spell-icicles", "reference": true, "referenceEntry": true, "title": "Icicles", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Did you know that icicles are the #1 cause of home head impalements?”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Ice\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>19\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>60 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d12 + Int Ice\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Ice\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Seizing upon the ice that runs through your veins, icicle projectiles shoot forth from your palms towards distant foes.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d12 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d12 base damage, and the target gains the Stiff Legs Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d12 base damage, and the damage is Armor-Piercing.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 207 · PDF pages 209\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ICICLES\n“Did you know that icicles are the #1 cause of home\nhead impalements?”\nAttack, Ice\nMana Cost: 19\nRange: 60 feet\nSeizing upon the ice that runs through your veins,\nicicle projectiles shoot forth from your palms towards\ndistant foes.\nBase Damage: 1d12 + Int Ice\nUPGRADES\nRank 5: +1d12 base damage.\nRank 10: +1d12 base damage, and the target gains\nthe Stiff Legs Debuff.\nRank 15: +1d12 base damage, and the damage is\nArmor-Piercing.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "icicles attack icicles icicles spell “did you know that icicles are the #1 cause of home head impalements?” attack, ice false false false attack [] ['ice'] 19 60 feet 1d12 + int ice seizing upon the ice that runs through your veins, icicle projectiles shoot forth from your palms towards distant foes. {'5': '+1d12 base damage.', '10': '+1d12 base damage, and the target gains the stiff legs debuff.', '15': '+1d12 base damage, and the damage is armor-piercing.'}"}, {"id": "spell-intimate-touches", "reference": true, "referenceEntry": true, "title": "Intimate Touches", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Heal", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Show me on the doll where they healed you.”\u003c/em>\u003c/p>\u003cp class=\"source\">Heal, Passive, Favored: Cleric &amp; Paladin\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>heal\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>8\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Cleric, Paladin\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Unlike most healing, this spell is not an Interrupt.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You lay hands on the target (which could be you), who heals Health Bar slots equal to your Cha Mod.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The target also heals a Minor Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The target also heals a Major Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The target also heals all Poison &amp; Disease Debuffs.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 208 · PDF pages 210\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">INTIMATE TOUCHES\n“Show me on the doll where they healed you.”\nHeal, Passive, Favored: Cleric &amp; Paladin\nMana Cost: 8\nRange: 5 feet\nLimitations: Unlike most healing, this spell is not an\nInterrupt.\nYou lay hands on the target (which could be you), who\nheals Health Bar slots equal to your Cha Mod.\nUPGRADES\nRank 5: The target also heals a Minor Injury Debuff.\nRank 10: The target also heals a Major Injury Debuff.\nRank 15: The target also heals all Poison &amp; Disease\nDebuffs.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "intimate touches heal intimate-touches intimate touches spell “show me on the doll where they healed you.” heal, passive, favored: cleric & paladin true false false heal ['cleric', 'paladin'] [] 8 5 feet unlike most healing, this spell is not an interrupt. you lay hands on the target (which could be you), who heals health bar slots equal to your cha mod. {'5': 'the target also heals a minor injury debuff.', '10': 'the target also heals a major injury debuff.', '15': 'the target also heals all poison & disease debuffs.'}"}, {"id": "spell-lightning-bolt", "reference": true, "referenceEntry": true, "title": "Lightning Bolt", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\"
