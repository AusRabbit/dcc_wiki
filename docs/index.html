k\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>13\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d12 + Int Force\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Force\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>A shockwave akin to that of an A-bomb crashes over your target.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d12 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d12 base damage, and the target is pushed 10 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d12 base damage, and the target is pushed 15 feet.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 213 · PDF pages 215\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">UNNECESSARY FORCE\n“Excessive force authorized. Paperwork waived.”\nAttack, Force\nMana Cost: 13\nRange: 40 feet\nA shockwave akin to that of an A-bomb crashes over\nyour target.\nBase Damage: 1d12 + Int Force\nUPGRADES\nRank 5: +1d12 base damage.\nRank 10: +1d12 base damage, and the target is\npushed 10 feet.\nRank 15: +1d12 base damage, and the target is\npushed 15 feet.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "unnecessary force attack unnecessary-force unnecessary force spell “excessive force authorized. paperwork waived.” attack, force false false false attack [] ['force'] 13 40 feet 1d12 + int force a shockwave akin to that of an a-bomb crashes over your target. {'5': '+1d12 base damage.', '10': '+1d12 base damage, and the target is pushed 10 feet.', '15': '+1d12 base damage, and the target is pushed 15 feet.'}"}, {"id": "spell-vine-porn", "reference": true, "referenceEntry": true, "title": "Vine Porn", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“It’s like tentacle porn, but with vines… sorry, Mom.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Piercing, Constitution, Favored: Druid\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Constitution\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>3\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>20 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Con Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Druid\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Magical vines with pulsating veins shoot up from the ground or sprout from the target’s own body to rip and tear and smack them around a bit.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and this Attack deals Armor-Piercing damage (ignores DR).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage. On a Critical Hit, the target takes ×4 damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 213 · PDF pages 215\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">VINE PORN\n“It’s like tentacle porn, but with vines… sorry, Mom.”\nAttack, Piercing, Constitution, Favored: Druid\nMana Cost: 3\nRange: 20 feet\nAI Favor: 1\nMagical vines with pulsating veins shoot up from the\nground or sprout from the target’s own body to rip and\ntear and smack them around a bit.\nBase Damage: 1d4 + Con Piercing\nUPGRADES\nRank 5: +1d4 base damage.\nRank 10: +1d4 base damage, and this Attack deals\nArmor-Piercing damage (ignores DR).\nRank 15: +1d4 base damage. On a Critical Hit, the\ntarget takes ×4 damage.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "vine porn attack vine-porn vine porn spell “it’s like tentacle porn, but with vines… sorry, mom.” attack, piercing, constitution, favored: druid constitution false false false attack ['druid'] ['piercing'] 3 20 feet 1 1d4 + con piercing magical vines with pulsating veins shoot up from the ground or sprout from the target’s own body to rip and tear and smack them around a bit. {'5': '+1d4 base damage.', '10': '+1d4 base damage, and this attack deals armor-piercing damage (ignores dr).', '15': '+1d4 base damage. on a critical hit, the target takes ×4 damage.'}"}, {"id": "spell-wall-of-fire", "reference": true, "referenceEntry": true, "title": "Wall of Fire", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“You’re gonna fall in… to a burnin’ ring of fire.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive, Fire\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>15\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 rounds\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d2 Fire for every 1ft of wall the victim passes through, and they gain the Burned Debuff.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Fire\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Creates a 30ft-long × 7ft-high × 2ft-thick wall of fire.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d2 base damage. The wall can be turned into a ring of fire. Duration is 5 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d2 base damage. Creates a 50ft-long × 10ft-high × 3ft-thick wall. Duration is 10 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d2 base damage. Creates a 100ft-long × 20ft-high × 5ft-thick wall. Duration is 15 rounds.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 214 · PDF pages 216\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WALL OF FIRE\n“You’re gonna fall in… to a burnin’ ring of fire.”\nPassive, Fire\nMana Cost: 15\nRange: 30 feet\nDuration: 2 rounds\nCreates a 30ft-long × 7ft-high × 2ft-thick wall of fire.\nBase Damage: 1d2 Fire for every 1ft of wall the victim\npasses through, and they gain the Burned Debuff.\nUPGRADES\nRank 5: +1d2 base damage. The wall can be turned\ninto a ring of fire. Duration is 5 rounds.\nRank 10: +1d2 base damage. Creates a 50ft-long ×\n10ft-high × 3ft-thick wall. Duration is 10 rounds.\nRank 15: +1d2 base damage. Creates a 100ft-long ×\n20ft-high × 5ft-thick wall. Duration is 15 rounds.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "wall of fire passive wall-of-fire wall of fire spell “you’re gonna fall in… to a burnin’ ring of fire.” passive, fire true false false passive [] ['fire'] 15 30 feet 2 rounds 1d2 fire for every 1ft of wall the victim passes through, and they gain the burned debuff. creates a 30ft-long × 7ft-high × 2ft-thick wall of fire. {'5': '+1d2 base damage. the wall can be turned into a ring of fire. duration is 5 rounds.', '10': '+1d2 base damage. creates a 50ft-long × 10ft-high × 3ft-thick wall. duration is 10 rounds.', '15': '+1d2 base damage. creates a 100ft-long × 20ft-high × 5ft-thick wall. duration is 15 rounds.'}"}, {"id": "spell-water-breathing", "reference": true, "referenceEntry": true, "title": "Water Breathing", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“It’s okay to inhale.”\u003c/em>\u003c/p>\u003cp class=\"source\">Intelligence, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>A number of seconds equal to the caster’s Intelligence ×3.\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>The target can breathe underwater without issue.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may now cast this upon others at a range of 5 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The targets roll Swimming Skill Checks with Advantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can target any or all individuals within a 15ft Burst radius.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 214 · PDF pages 216\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WATER BREATHING\n“It’s okay to inhale.”\nIntelligence, Passive\nMana Cost: 2\nRange: Self\nDuration: A number of seconds equal to the caster’s\nIntelligence ×3.\nThe target can breathe underwater without issue.\nUPGRADES\nRank 5: You may now cast this upon others at a range\nof 5 feet.\nRank 10: The targets roll Swimming Skill Checks with\nAdvantage.\nRank 15: You can target any or all individuals within a\n15ft Burst radius.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "water breathing passive water-breathing water breathing spell “it’s okay to inhale.” intelligence, passive intelligence true false false passive [] [] 2 self a number of seconds equal to the caster’s intelligence ×3. the target can breathe underwater without issue. {'5': 'you may now cast this upon others at a range of 5 feet.', '10': 'the targets roll swimming skill checks with advantage.', '15': 'you can target any or all individuals within a 15ft burst radius.'}"}, {"id": "spell-web", "reference": true, "referenceEntry": true, "title": "Web", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Blast your goo onto foes!”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>6\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>20ft Cone\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 rounds\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>A cone of sticky webbing shoots from your fingers.\u003c/p>\u003cp>Make a single Spell Attack Skill Check vs. each friend and foe’s Evade (if any). On Success, that entity gains the Held Debuff. The Rank of this spell is used in the Opposed Difficulty to escape, instead of Str.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+5ft Cone. Duration is 5 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+5ft Cone. Duration is 10 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+5ft Cone. Duration is 15 rounds.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 214 · PDF pages 216\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WEB\n“Blast your goo onto foes!”\nAttack, Intelligence\nMana Cost: 6\nRange: 20ft Cone\nDuration: 2 rounds\nA cone of sticky webbing shoots from your fingers.\nMake a single Spell Attack Skill Check vs. each friend\nand foe’s Evade (if any).\nOn Success, that entity gains the Held Debuff. The\nRank of this spell is used in the Opposed Difficulty to\nescape, instead of Str.\nUPGRADES\nRank 5: +5ft Cone. Duration is 5 rounds.\nRank 10: +5ft Cone. Duration is 10 rounds.\nRank 15: +5ft Cone. Duration is 15 rounds.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "web attack web web spell “blast your goo onto foes!” attack, intelligence intelligence false false false attack [] [] 6 20ft cone 2 rounds a cone of sticky webbing shoots from your fingers.\n\nmake a single spell attack skill check vs. each friend and foe’s evade (if any). on success, that entity gains the held debuff. the rank of this spell is used in the opposed difficulty to escape, instead of str. {'5': '+5ft cone. duration is 5 rounds.', '10': '+5ft cone. duration is 10 rounds.', '15': '+5ft cone. duration is 15 rounds.'}"}, {"id": "spell-wilburs-slow-build-fireblast", "reference": true, "referenceEntry": true, "title": "Wilbur’s Slow-Build Fireblast", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Hold. Hold! HOLD!”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Fire\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>60\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>50 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Int Fire, and the target gains the Burned Debuff.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Fire\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>This Spell can be cast and held as a swirling ring of fire around your ring finger until you unleash it. Only one ring may be held at a time. The next time you perform an Attack Action, it must be this Spell (at no additional Mana cost).\u003c/p>\u003cp>If anyone touches the ring with the intent to diffuse it (you may oppose that Action), the Attack hits them for half damage. The appendage they touched you with smolders, useless for a number of rounds equal to the damage inflicted.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage. For each full day you hold the spell, +1d8 Fire damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage and +5ft Splash.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage and +5ft Splash.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 214 · PDF pages 216\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WILBUR’S SLOW-BUILD FIREBLAST\n“Hold. Hold! HOLD!”\nAttack, Fire\nMana Cost: 60\nRange: 50 feet\nBase Damage: 1d8 + Int Fire, and the target gains the\nBurned Debuff.\nThis Spell can be cast and held as a swirling ring of fire\naround your ring finger until you unleash it. Only one ring\nmay be held at a time. The next time you perform an Attack\nAction, it must be this Spell (at no additional Mana cost).\nIf anyone touches the ring with the intent to diffuse it (you\nmay oppose that Action), the Attack hits them for half dam‑\nage. The appendage they touched you with smolders, use‑\nless for a number of rounds equal to the damage inflicted.\nUPGRADES\nRank 5: +1d8 base damage. For each full day you hold\nthe spell, +1d8 Fire damage.\nRank 10: +1d8 base damage and +5ft Splash.\nRank 15: +1d8 base damage and +5ft Splash.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "wilbur’s slow-build fireblast attack wilburs-slow-build-fireblast wilbur’s slow-build fireblast spell “hold. hold! hold!” attack, fire false false false attack [] ['fire'] 60 50 feet 1d8 + int fire, and the target gains the burned debuff. this spell can be cast and held as a swirling ring of fire around your ring finger until you unleash it. only one ring may be held at a time. the next time you perform an attack action, it must be this spell (at no additional mana cost).\n\nif anyone touches the ring with the intent to diffuse it (you may oppose that action), the attack hits them for half damage. the appendage they touched you with smolders, useless for a number of rounds equal to the damage inflicted. {'5': '+1d8 base damage. for each full day you hold the spell, +1d8 fire damage.', '10': '+1d8 base damage and +5ft splash.', '15': '+1d8 base damage and +5ft splash.'}"}, {"id": "spell-wisp-armor", "reference": true, "referenceEntry": true, "title": "Wisp Armor", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Empty minds are surprisingly easy to protect.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>5\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You conjure a protective barrier that reduces all magic damage (typically Spells) down to its Rank 1 base damage (1 die + Stat Mod) without any Upgrades or other bonuses. This Spell also makes you immune to Mind Control.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The duration is 10 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The duration is 15 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The duration is 20 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 214 · PDF pages 216\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">WISP ARMOR\n“Empty minds are surprisingly easy to protect.”\nPassive\nMana Cost: 5\nRange: Self\nDuration: 5 minutes\nCooldown: 5 minutes\nYou conjure a protective barrier that reduces all magic\ndamage (typically Spells) down to its Rank 1 base dam‑\nage (1 die + Stat Mod) without any Upgrades or other bo‑\nnuses. This Spell also makes you immune to Mind Control.\nUPGRADES\nRank 5: The duration is 10 minutes.\nRank 10: The duration is 15 minutes.\nRank 15: The duration is 20 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "wisp armor passive wisp-armor wisp armor spell “empty minds are surprisingly easy to protect.” passive true false false passive [] [] 5 self 5 minutes 5 minutes you conjure a protective barrier that reduces all magic damage (typically spells) down to its rank 1 base damage (1 die + stat mod) without any upgrades or other bonuses. this spell also makes you immune to mind control. {'5': 'the duration is 10 minutes.', '10': 'the duration is 15 minutes.', '15': 'the duration is 20 minutes.'}"}];

const BUILT  = "2026-09-29";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");
const navToggle = document.getElementById('nav-toggle');
function expandNav(expanded){
  nav.classList.toggle('expanded', expanded);
  navToggle.setAttribute('aria-expanded', String(expanded));
}
navToggle.addEventListener('click', () => expandNav(!nav.classList.contains('expanded')));
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + escapeHTML(p.title) + '</h1>';
  if(p.dek) h += '<div class="dek">' + escapeHTML(p.dek) + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.axis && p.type !== "floor") h += '<span class="tag">' + p.axisLabel + ' ' + p.axis + '</span>';
    if(p.statusLabel) h += '<span class="tag"><span class="st-' + p.statusTone + '">' + p.statusLabel + '</span></span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length && (!p.reference || p.referenceEntry)){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + escapeHTML(TITLES[b]) + '</a></li>').join('')
       + '</ul></div>';
  }

  if(p.reference) h += '<div class="foot">Rulebook reference from the supplied skills and spells JSON · Royal Court Edition. Printed and PDF page numbers are shown separately. Built ' + BUILT + '.</div>';
  else h += '<div class="foot">Generated from session recordings, transcribed with '
     + '<code>faster-whisper large-v3</code>. Names carry every surface form the transcripts '
     + 'produced; anything marked <em>needs review</em> or <em>low confidence</em> is waiting on '
     + 'confirmation before it becomes canon. Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(p.referenceEntry && !f && p.id !== current) return;
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + escapeHTML(p.title) + '</span>'
        + (p.axis && p.type !== "floor" ? '<span class="n">' + p.axis + '</span>'
           : (p.type !== "doc" && !p.reference && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : ''))
        + '</a>').join('')
    + '</div>').join('');
}

function filterReference(){
  const controls = main.querySelector('.reference-controls');
  if(!controls) return;
  const filters = Object.fromEntries(Array.from(controls.querySelectorAll('[data-filter]'), el => [el.dataset.filter, el.value.trim().toLowerCase()]));
  let count = 0;
  main.querySelectorAll('.reference-card').forEach(card => {
    const matches = Object.entries(filters).every(([key, value]) => !value ||
      (key === 'search' ? value.split(/\s+/).every(word => card.dataset.search.includes(word)) :
       key === 'traits' ? card.dataset.traits.toLowerCase().split('|').includes(value) : card.dataset[key].toLowerCase() === value));
    card.hidden = !matches;
    if(matches) count++;
  });
  main.querySelector('[data-reference-count]').textContent = count + ' matching entries';
  main.querySelector('[data-reference-empty]').hidden = count !== 0;
}
main.addEventListener('input', filterReference);
main.addEventListener('change', filterReference);
main.addEventListener('click', event => {
  if(event.target.closest('[data-reset-reference]')){
    main.querySelectorAll('[data-filter]').forEach(el => { el.value = ''; });
    filterReference();
  }
});

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  expandNav(false);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "Dungeon Crawler Carl";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); expandNav(true); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
