 href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Bolt released, viewership spike detected.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Electric\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>15\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>100 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d10 + Int Electric\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Electric\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>With a thunderous clap, you let loose a bolt of lightning.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d10 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d10 base damage and becomes a 100ft Line Attack.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d10 base damage. The lightning bolt forks, and you may choose to apply your Attack against any number of additional targets within 15 feet of the previous target (within the range limit). Each successful Attack (including against the primary target), deals half damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 208 · PDF pages 210\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LIGHTNING BOLT\n“Bolt released, viewership spike detected.”\nAttack, Electric\nMana Cost: 15\nRange: 100 feet\nWith a thunderous clap, you let loose a bolt of lightning.\nBase Damage: 1d10 + Int Electric\nUPGRADES\nRank 5: +1d10 base damage.\nRank 10: +1d10 base damage and becomes a 100ft\nLine Attack.\nRank 15: +1d10 base damage. The lightning bolt\nforks, and you may choose to apply your Attack\nagainst any number of additional targets within 15\nfeet of the previous target (within the range limit).\nEach successful Attack (including against the primary\ntarget), deals half damage.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "lightning bolt attack lightning-bolt lightning bolt spell “bolt released, viewership spike detected.” attack, electric false false false attack [] ['electric'] 15 100 feet 1d10 + int electric with a thunderous clap, you let loose a bolt of lightning. {'5': '+1d10 base damage.', '10': '+1d10 base damage and becomes a 100ft line attack.', '15': '+1d10 base damage. the lightning bolt forks, and you may choose to apply your attack against any number of additional targets within 15 feet of the previous target (within the range limit). each successful attack (including against the primary target), deals half damage.'}"}, {"id": "spell-magic-missile", "reference": true, "referenceEntry": true, "title": "Magic Missile", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Standard Spell detected. Viewers appreciate the nostalgia.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Force\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>5\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Within your line of sight\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Int Force\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Force\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>From glowing eyes, fingers, or whatever, a streak of pure force shoots out.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and you can cast the Spell at a higher or lower Mana cost. 3 Mana: −4 damage 4 Mana: −2 damage 6 Mana: Add 1 Rank damage die\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and the missiles deal Force and Fire damage. The target gains the Burned Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>This attack deals base damage ×3.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 208 · PDF pages 210\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">MAGIC MISSILE\n“Standard Spell detected. Viewers appreciate the\nnostalgia.”\nAttack, Force\nMana Cost: 5\nRange: Within your line of sight\nAI Favor: 1\nFrom glowing eyes, fingers, or whatever, a streak of\npure force shoots out.\nBase Damage: 1d4 + Int Force\nUPGRADES\nRank 5: +1d4 base damage, and you can cast the\nSpell at a higher or lower Mana cost.\n3 Mana: −4 damage\n4 Mana: −2 damage\n6 Mana: Add 1 Rank damage die\nRank 10: +1d4 base damage, and the missiles deal\nForce and Fire damage. The target gains the Burned\nDebuff.\nRank 15: This attack deals base damage ×3.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "magic missile attack magic-missile magic missile spell “standard spell detected. viewers appreciate the nostalgia.” attack, force false false false attack [] ['force'] 5 within your line of sight 1 1d4 + int force from glowing eyes, fingers, or whatever, a streak of pure force shoots out. {'5': '+1d4 base damage, and you can cast the spell at a higher or lower mana cost. 3 mana: −4 damage 4 mana: −2 damage 6 mana: add 1 rank damage die', '10': '+1d4 base damage, and the missiles deal force and fire damage. the target gains the burned debuff.', '15': 'this attack deals base damage ×3.'}"}, {"id": "spell-mind-tickle", "reference": true, "referenceEntry": true, "title": "Mind Tickle", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Don’t think of an elephant.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Psychic, Charisma, Favored: Cleric\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d2 + Cha Psychic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Psychic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Cleric\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You infect your target with a small headache.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d2 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d2 base damage, and the target gains the Sore as Shit Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d2 base damage, and the target gains the Muted Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 208 · PDF pages 210\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">MIND TICKLE\n“Don’t think of an elephant.”\nAttack, Psychic, Charisma, Favored: Cleric\nMana Cost: 2\nRange: 40 feet\nAI Favor: 2\nYou infect your target with a small headache.\nBase Damage: 1d2 + Cha Psychic\nUPGRADES\nRank 5: +1d2 base damage.\nRank 10: +1d2 base damage, and the target gains the\nSore as Shit Debuff.\nRank 15: +1d2 base damage, and the target gains the\nMuted Debuff.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "mind tickle attack mind-tickle mind tickle spell “don’t think of an elephant.” attack, psychic, charisma, favored: cleric charisma false false false attack ['cleric'] ['psychic'] 2 40 feet 2 1d2 + cha psychic you infect your target with a small headache. {'5': '+1d2 base damage.', '10': '+1d2 base damage, and the target gains the sore as shit debuff.', '15': '+1d2 base damage, and the target gains the muted debuff.'}"}, {"id": "spell-minion-army", "reference": true, "referenceEntry": true, "title": "Minion Army", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Other", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“No army can triumph when subjected to internecine conflict.”\u003c/em>\u003c/p>\u003cp class=\"source\">Intelligence, Area of Effect, Mind Control\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>other\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>50\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>50ft Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 hours\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Mind Control\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>5-minute casting time, and the caster cannot move while casting. Only works against Mobs with an Intelligence of 2+.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>When you cast this spell, choose a target within range. On a Standard Success, 1 in 50 Mobs in the affected area (min 1) become an ally and fight for you without needing to command them. Higher levels of success can turn additional Mobs into allies (GM’s discretion).\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The casting time is 4 minutes. Duration is 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Add your Charisma Stat to the Burst radius. Duration is 10 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Add your Charisma Stat to the Burst radius. Duration is 15 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 209 · PDF pages 211\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">MINION ARMY\n“No army can triumph when subjected to\ninternecine conflict.”\nIntelligence, Area of Effect, Mind Control\nMana Cost: 50\nRange: 50ft Burst radius\nDuration: 2 minutes\nCooldown: 5 hours\nLimitations: 5-minute casting time, and the caster\ncannot move while casting. Only works against Mobs\nwith an Intelligence of 2+.\nWhen you cast this spell, choose a target within range.\nOn a Standard Success, 1 in 50 Mobs in the affected\narea (min 1) become an ally and fight for you without\nneeding to command them. Higher levels of success\ncan turn additional Mobs into allies (GM’s discretion).\nUPGRADES\nRank 5: The casting time is 4 minutes. Duration is 5\nminutes.\nRank 10: Add your Charisma Stat to the Burst radius.\nDuration is 10 minutes.\nRank 15: Add your Charisma Stat to the Burst radius.\nDuration is 15 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "minion army other minion-army minion army spell “no army can triumph when subjected to internecine conflict.” intelligence, area of effect, mind control intelligence false false true other [] ['mind control'] 50 50ft burst radius 2 minutes 5 hours 5-minute casting time, and the caster cannot move while casting. only works against mobs with an intelligence of 2+. when you cast this spell, choose a target within range. on a standard success, 1 in 50 mobs in the affected area (min 1) become an ally and fight for you without needing to command them. higher levels of success can turn additional mobs into allies (gm’s discretion). {'5': 'the casting time is 4 minutes. duration is 5 minutes.', '10': 'add your charisma stat to the burst radius. duration is 10 minutes.', '15': 'add your charisma stat to the burst radius. duration is 15 minutes.'}"}, {"id": "spell-natures-breath", "reference": true, "referenceEntry": true, "title": "Nature’s Breath", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Heal", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“This recycled dungeon air is bad for my complexion.”\u003c/em>\u003c/p>\u003cp class=\"source\">Heal, Interrupt, Passive, Favored: Druid\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>heal\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>6\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Druid\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You blow cool, fresh air over the target’s wounds (could be yourself), healing them. Roll a Nature’s Breath Rank damage die. That is how many Health Bar slots the target heals. May also target pets and minions.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Add 1 to your die roll.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Add 1 to your die roll, and remove a Minor Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Add 1 to your die roll, and remove a Major Injury Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 209 · PDF pages 211\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">NATURE’S BREATH\n“This recycled dungeon air is bad for my\ncomplexion.”\nHeal, Interrupt, Passive, Favored: Druid\nMana Cost: 6\nRange: 5 feet\nYou blow cool, fresh air over the target’s wounds (could\nbe yourself), healing them. Roll a Nature’s Breath Rank\ndamage die. That is how many Health Bar slots the\ntarget heals. May also target pets and minions.\nUPGRADES\nRank 5: Add 1 to your die roll.\nRank 10: Add 1 to your die roll, and remove a Minor\nInjury Debuff.\nRank 15: Add 1 to your die roll, and remove a Major\nInjury Debuff.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "nature’s breath heal natures-breath nature’s breath spell “this recycled dungeon air is bad for my complexion.” heal, interrupt, passive, favored: druid true true false heal ['druid'] [] 6 5 feet you blow cool, fresh air over the target’s wounds (could be yourself), healing them. roll a nature’s breath rank damage die. that is how many health bar slots the target heals. may also target pets and minions. {'5': 'add 1 to your die roll.', '10': 'add 1 to your die roll, and remove a minor injury debuff.', '15': 'add 1 to your die roll, and remove a major injury debuff.'}"}, {"id": "spell-oakhide", "reference": true, "referenceEntry": true, "title": "Oakhide", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“My bark is worse than my bite.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive, Favored: Druid\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>5\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>10 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Druid\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Your skin turns into solid wood, giving you great protection. You have +2 Damage Resistance for the duration of this spell.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+2 DR. Duration is 3 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+2 DR. You may target party members and NPCs up to 10 feet away with this spell.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+2 DR. Duration is 4 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 209 · PDF pages 211\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">OAKHIDE\n“My bark is worse than my bite.”\nPassive, Favored: Druid\nMana Cost: 5\nRange: Self\nDuration: 2 minutes\nCooldown: 10 minutes\nYour skin turns into solid wood, giving you great\nprotection. You have +2 Damage Resistance for the\nduration of this spell.\nUPGRADES\nRank 5: +2 DR. Duration is 3 minutes.\nRank 10: +2 DR. You may target party members and\nNPCs up to 10 feet away with this spell.\nRank 15: +2 DR. Duration is 4 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "oakhide passive oakhide oakhide spell “my bark is worse than my bite.” passive, favored: druid true false false passive ['druid'] [] 5 self 2 minutes 10 minutes your skin turns into solid wood, giving you great protection. you have +2 damage resistance for the duration of this spell. {'5': '+2 dr. duration is 3 minutes.', '10': '+2 dr. you may target party members and npcs up to 10 feet away with this spell.', '15': '+2 dr. duration is 4 minutes.'}"}, {"id": "spell-paladins-smite", "reference": true, "referenceEntry": true, "title": "Paladin’s Smite", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Repent or die!”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Holy, Charisma, Favored: Paladin\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>11\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Cha Holy\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Holy\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Paladin\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You channel a torrent of divine wrath toward a soon-to-be repentant foe.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage, and the target gains the Take Down Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and the damage is Armor-Piercing (ignores DR).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 209 · PDF pages 211\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PALADIN’S SMITE\n“Repent or die!”\nAttack, Holy, Charisma, Favored: Paladin\nMana Cost: 11\nRange: 30 feet\nYou channel a torrent of divine wrath toward a soon-\nto-be repentant foe.\nBase Damage: 1d8 + Cha Holy\nUPGRADES\nRank 5: +1d8 base damage.\nRank 10: +1d8 base damage, and the target gains the\nTake Down Debuff.\nRank 15: +1d8 base damage, and the damage is Ar‑\nmor-Piercing (ignores DR).\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "paladin’s smite attack paladins-smite paladin’s smite spell “repent or die!” attack, holy, charisma, favored: paladin charisma false false false attack ['paladin'] ['holy'] 11 30 feet 1d8 + cha holy you channel a torrent of divine wrath toward a soon-to-be repentant foe. {'5': '+1d8 base damage.', '10': '+1d8 base damage, and the target gains the take down debuff.', '15': '+1d8 base damage, and the damage is armor-piercing (ignores dr).'}"}, {"id": "spell-panty-dropper", "reference": true, "referenceEntry": true, "title": "Panty Dropper", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Other", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“You know what’s on the menu? Me-n-u.”\u003c/em>\u003c/p>\u003cp class=\"source\">Charisma, Mind Control, Favored: Bard\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>other\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 minutes or until you finish\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Mind Control\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Bard\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Make an Int-Opposed Spell Check against a non-Boss target, even in combat. Fighting’s just another form of penetration, after all. On Success, the target wants to jump your bones and won’t let anyone stop them (they cease attacking or doing other things).\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The duration is 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The duration is 10 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The duration is 15 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 209–210 · PDF pages 211–212\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PANTY DROPPER\n“You know what’s on the menu? Me-n-u.”\nCharisma, Mind Control, Favored: Bard\nMana Cost: 10\nRange: 10 feet\nDuration: 2 minutes or until you finish\nCooldown: 5 minutes\nMake an Int-Opposed Spell Check against a non-Boss\ntarget, even in combat. Fighting’s just another form of\npenetration, after all.\nOn Success, the target wants to jump your bones and\nwon’t let anyone stop them (they cease attacking or\ndoing other things).\nUPGRADES\nRank 5: The duration is 5 minutes.\nRank 10: The duration is 10 minutes.\nRank 15: The duration is 15 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "panty dropper other panty-dropper panty dropper spell “you know what’s on the menu? me-n-u.” charisma, mind control, favored: bard charisma false false false other ['bard'] ['mind control'] 10 10 feet 2 minutes or until you finish 5 minutes make an int-opposed spell check against a non-boss target, even in combat. fighting’s just another form of penetration, after all. on success, the target wants to jump your bones and won’t let anyone stop them (they cease attacking or doing other things). {'5': 'the duration is 5 minutes.', '10': 'the duration is 10 minutes.', '15': 'the duration is 15 minutes.'}"}, {"id": "spell-ping", "reference": true, "referenceEntry": true, "title": "Ping", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Here piggy, piggy.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive, Area of Effect\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>5\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>1 mile Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Sends out an audible ping that gives the distance and location of all non-crawlers and non-red-tagged Mobs in a circle around you. It will mark targets beyond the range of your map. You receive information about the Mobs that is “somewhat complete.”\u003c/p>\u003cp>Targets hit with Ping will hear an audible ping noise, but they will not know where the ping originated. Environmental factors and obstacles may increase or decrease range.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>If you know the Fear Spell (see p. 204), you may cast it at no Action cost to affect all eligible Mobs within the Ping range. You only pay the Mana.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Environmental factors and obstacles no longer decrease the range, and you receive “mostly complete” information.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You pay no Mana to add the Fear Spell, and you receive “entirely complete” information.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 210 · PDF pages 212\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PING\n“Here piggy, piggy.”\nPassive, Area of Effect\nMana Cost: 5\nRange: 1 mile Burst radius\nCooldown: 5 minutes\nSends out an audible ping that gives the distance and\nlocation of all non-crawlers and non-red-tagged Mobs\nin a circle around you. It will mark targets beyond the\nrange of your map. You receive information about the\nMobs that is “somewhat complete.”\nTargets hit with Ping will hear an audible ping noise,\nbut they will not know where the ping originated.\nEnvironmental factors and obstacles may increase or\ndecrease range.\nUPGRADES\nRank 5: If you know the Fear Spell (see p. 204), you\nmay cast it at no Action cost to affect all eligible Mobs\nwithin the Ping range. You only pay the Mana.\nRank 10: Environmental factors and obstacles no\nlonger decrease the range, and you receive “mostly\ncomplete” information.\nRank 15: You pay no Mana to add the Fear Spell, and\nyou receive “entirely complete” information.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "ping passive ping ping spell “here piggy, piggy.” passive, area of effect true false true passive [] [] 5 1 mile burst radius 5 minutes sends out an audible ping that gives the distance and location of all non-crawlers and non-red-tagged mobs in a circle around you. it will mark targets beyond the range of your map. you receive information about the mobs that is “somewhat complete.”\n\ntargets hit with ping will hear an audible ping noise, but they will not know where the ping originated. environmental factors and obstacles may increase or decrease range. {'5': 'if you know the fear spell (see p. 204), you may cast it at no action cost to affect all eligible mobs within the ping range. you only pay the mana.', '10': 'environmental factors and obstacles no longer decrease the range, and you receive “mostly complete” information.', '15': 'you pay no mana to add the fear spell, and you receive “entirely complete” information.'}"}, {"id": "spell-protective-shell", "reference": true, "referenceEntry": true, "title": "Protective Shell", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Hope activated. Try not to waste it.”\u003c/em>\u003c/p>\u003cp class=\"source\">Interrupt, Passive, Area of Effect\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>None\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10ft Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>5 seconds (only long enough to push foes away and protect against a single physical attack)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>30 hours\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Spell must be imbued onto something you are wearing. The shell cannot be moved by any means.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You create a 10 + Int-foot Burst radius magic shell around yourself and nearby party members.\u003c/p>\u003cp>This shell pushes away all Mobs in its Area, which is the shell’s radius + 5ft. Mobs cannot enter the shell (unless non-corporeal) or physically attack those inside. The shell does not protect against magic effects. Crawlers inside may attack as usual.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Duration is 10 seconds. In addition to knocking enemies away, it protects the occupants from all non-Spell attacks originating from outside the shell until the end of the current combat round.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Duration is 20 seconds or two rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Duration is 30 seconds or three rounds.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 210 · PDF pages 212\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PROTECTIVE SHELL\n“Hope activated. Try not to waste it.”\nInterrupt, Passive, Area of Effect\nMana Cost: None\nRange: 10ft Burst radius\nDuration: 5 seconds (only long enough to push foes\naway and protect against a single physical attack)\nCooldown: 30 hours\nLimitations: Spell must be imbued onto something\nyou are wearing. The shell cannot be moved by any\nmeans.\nYou create a 10 + Int-foot Burst radius magic shell\naround yourself and nearby party members.\nThis shell pushes away all Mobs in its Area, which is\nthe shell’s radius + 5ft. Mobs cannot enter the shell\n(unless non-corporeal) or physically attack those in‑\nside. The shell does not protect against magic effects.\nCrawlers inside may attack as usual.\nUPGRADES\nRank 5: Duration is 10 seconds. In addition to knock‑\ning enemies away, it protects the occupants from all\nnon-Spell attacks originating from outside the shell\nuntil the end of the current combat round.\nRank 10: Duration is 20 seconds or two rounds.\nRank 15: Duration is 30 seconds or three rounds.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "protective shell passive protective-shell protective shell spell “hope activated. try not to waste it.” interrupt, passive, area of effect true true true passive [] [] none 10ft burst radius 5 seconds (only long enough to push foes away and protect against a single physical attack) 30 hours spell must be imbued onto something you are wearing. the shell cannot be moved by any means. you create a 10 + int-foot burst radius magic shell around yourself and nearby party members.\n\nthis shell pushes away all mobs in its area, which is the shell’s radius + 5ft. mobs cannot enter the shell (unless non-corporeal) or physically attack those inside. the shell does not protect against magic effects. crawlers inside may attack as usual. {'5': 'duration is 10 seconds. in addition to knocking enemies away, it protects the occupants from all non-spell attacks originating from outside the shell until the end of the current combat round.', '10': 'duration is 20 seconds or two rounds.', '15': 'duration is 30 seconds or three rounds.'}"}, {"id": "spell-puddle-jumper", "reference": true, "referenceEntry": true, "title": "Puddle Jumper", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Teleportation doesn’t suck.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>20\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Line-of-sight to the destination surface\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 hours\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>There is a 10-second delay before the effect takes place.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You and up to 3 party members of your choice teleport to another location. Everyone feels a tingling sensation while waiting for the effect to resolve.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The delay is 2 seconds, and the destination doesn’t have to be a surface.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The delay is 1 second, and the destination can be anywhere within 1,000 yards in any direction, even if the exact destination cannot be seen.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>There is no delay, and the destination can be anywhere within 1 mile in any direction, even if the exact destination cannot be seen.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 210–211 · PDF pages 212–213\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PUDDLE JUMPER\n“Teleportation doesn’t suck.”\nPassive\nMana Cost: 20\nRange: Line-of-sight to the destination surface\nLimitations: There is a 10-second delay before the\neffect takes place.\nCooldown: 5 hours\nYou and up to 3 party members of your choice teleport\nto another location. Everyone feels a tingling sensation\nwhile waiting for the effect to resolve.\nUPGRADES\nRank 5: The delay is 2 seconds, and the destination\ndoesn’t have to be a surface.\nRank 10: The delay is 1 second, and the destination\ncan be anywhere within 1,000 yards in any direction,\neven if the exact destination cannot be seen.\nRank 15: There is no delay, and the destination can\nbe anywhere within 1 mile in any direction, even if the\nexact destination cannot be seen.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "puddle jumper passive puddle-jumper puddle jumper spell “teleportation doesn’t suck.” passive true false false passive [] [] 20 line-of-sight to the destination surface 5 hours there is a 10-second delay before the effect takes place. you and up to 3 party members of your choice teleport to another location. everyone feels a tingling sensation while waiting for the effect to resolve. {'5': 'the delay is 2 seconds, and the destination doesn’t have to be a surface.', '10': 'the delay is 1 second, and the destination can be anywhere within 1,000 yards in any direction, even if the exact destination cannot be seen.', '15': 'there is no delay, and the destination can be anywhere within 1 mile in any direction, even if the exact destination cannot be seen.'}"}, {"id": "spell-rise-dead-minion", "reference": true, "referenceEntry": true, "title": "Rise, Dead Minion!", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“The bigger they are, the deeper they’re buried.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Favored: Necromancer\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>1 round\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Necromancer\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>At your command, a Medium (4) size skeleton emerges from the ground to attack your foe in melee combat, dealing 1d8 + Int Necrotic damage. After the Attack, the skeleton collapses, creating difficult terrain in the space it occupied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The skeleton attacks twice before collapsing.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The skeleton increases to size Large (5), and its Attack range is 10 feet. +1d8 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The skeleton increases to size Colossal (7), and its Attack range is 15 feet. Add one Rise, Dead Minion! Rank damage die to the damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 211 · PDF pages 213\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">RISE, DEAD MINION!\n“The bigger they are, the deeper they’re buried.”\nAttack, Favored: Necromancer\nMana Cost: 10\nRange: 30 feet\nDuration: 1 round\nAt your command, a Medium (4) size skeleton emerges\nfrom the ground to attack your foe in melee combat,\ndealing 1d8 + Int Necrotic damage. After the Attack,\nthe skeleton collapses, creating difficult terrain in the\nspace it occupied.\nUPGRADES\nRank 5: The skeleton attacks twice before collapsing.\nRank 10: The skeleton increases to size Large (5), and\nits Attack range is 10 feet. +1d8 base damage.\nRank 15: The skeleton increases to size Colossal (7),\nand its Attack range is 15 feet. Add one Rise, Dead\nMinion! Rank damage die to the damage.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "rise, dead minion! attack rise-dead-minion rise, dead minion! spell “the bigger they are, the deeper they’re buried.” attack, favored: necromancer false false false attack ['necromancer'] [] 10 30 feet 1 round at your command, a medium (4) size skeleton emerges from the ground to attack your foe in melee combat, dealing 1d8 + int necrotic damage. after the attack, the skeleton collapses, creating difficult terrain in the space it occupied. {'5': 'the skeleton attacks twice before collapsing.', '10': 'the skeleton increases to size large (5), and its attack range is 10 feet. +1d8 base damage.', '15': 'the skeleton increases to size colossal (7), and its attack range is 15 feet. add one rise, dead minion! rank damage die to the damage.'}"}, {"id": "spell-rootfoot", "reference": true, "referenceEntry": true, "title": "Rootfoot", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“The ground is never empty. It is only sleeping.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Favored: Druid\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>5\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>2 rounds\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Druid\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Roots reach up from the ground to ensnare a victim of up to Size 4 (Medium).\u003c/p>\u003cp>On Success, the victim gains the Held Debuff. The Rank of this Spell is used in the Opposed Difficulty to escape, instead of the default Str.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Can target victims up to size Large (5). Duration is 3 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Can target victims up to size Huge (6). Duration is 4 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Can target victims up to size Colossal (7). The victim also gains the Poisoned Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 211 · PDF pages 213\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ROOTFOOT\n“The ground is never empty. It is only sleeping.”\nAttack, Favored: Druid\nMana Cost: 5\nRange: 30 feet\nDuration: 2 rounds\nRoots reach up from the ground to ensnare a victim of\nup to Size 4 (Medium).\nOn Success, the victim gains the Held Debuff. The\nRank of this Spell is used in the Opposed Difficulty to\nescape, instead of the default Str.\nUPGRADES\nRank 5: Can target victims up to size Large (5).\nDuration is 3 rounds.\nRank 10: Can target victims up to size Huge (6).\nDuration is 4 rounds.\nRank 15: Can target victims up to size Colossal (7).\nThe victim also gains the Poisoned Debuff.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "rootfoot attack rootfoot rootfoot spell “the ground is never empty. it is only sleeping.” attack, favored: druid false false false attack ['druid'] [] 5 30 feet 2 rounds roots reach up from the ground to ensnare a victim of up to size 4 (medium).\n\non success, the victim gains the held debuff. the rank of this spell is used in the opposed difficulty to escape, instead of the default str. {'5': 'can target victims up to size large (5). duration is 3 rounds.', '10': 'can target victims up to size huge (6). duration is 4 rounds.', '15': 'can target victims up to size colossal (7). the victim also gains the poisoned debuff.'}"}, {"id": "spell-second-chance", "reference": true, "referenceEntry": true, "title": "Second Chance", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Everyone deserves one. Except for Phil. Never Phil.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>1 minute\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You raise a Mob with a level lower than your own from the dead. The Mob temporarily becomes your Undead Minion with half of its original Health Bar slots.\u003c/p>\u003cp>You spend one Action to command it, then it acts independently with 1 Move Action and 1 other Action (usually an Attack) until given new instructions.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The Mob can be up to 5 levels higher than you, and the duration is 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The Mob can be up to 10 levels higher than the caster, with a duration of 15 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The Mob can be up to 15 levels higher than the caster, with a duration of 45 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 211 · PDF pages 213\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SECOND CHANCE\n“Everyone deserves one. Except for Phil. Never Phil.”\nPassive\nMana Cost: 10\nRange: 10 feet\nDuration: 1 minute\nYou raise a Mob with a level lower than your own from\nthe dead. The Mob temporarily becomes your Undead\nMinion with half of its original Health Bar slots.\nYou spend one Action to command it, then it acts\nindependently with 1 Move Action and 1 other Action\n(usually an Attack) until given new instructions.\nUPGRADES\nRank 5: The Mob can be up to 5 levels higher than\nyou, and the duration is 5 minutes.\nRank 10: The Mob can be up to 10 levels higher than\nthe caster, with a duration of 15 minutes.\nRank 15: The Mob can be up to 15 levels higher than\nthe caster, with a duration of 45 minutes.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "second chance passive second-chance second chance spell “everyone deserves one. except for phil. never phil.” passive true false false passive [] [] 10 10 feet 1 minute you raise a mob with a level lower than your own from the dead. the mob temporarily becomes your undead minion with half of its original health bar slots.\n\nyou spend one action to command it, then it acts independently with 1 move action and 1 other action (usually an attack) until given new instructions. {'5': 'the mob can be up to 5 levels higher than you, and the duration is 5 minutes.', '10': 'the mob can be up to 10 levels higher than the caster, with a duration of 15 minutes.', '15': 'the mob can be up to 15 levels higher than the caster, with a duration of 45 minutes.'}"}, {"id": "spell-shield", "reference": true, "referenceEntry": true, "title": "Shield", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Enjoy the illusion of safety.”\u003c/em>\u003c/p>\u003cp class=\"source\">Interrupt, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>8\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You are surrounded by a translucent force field that moves with you and reduces non-magic damage you take. The Shield has 2 Health Bar slots, each with your Con Mod. When you take damage, reduce these Health Bar slots first. The Spell ends early if the shield loses all its Health Bar slots. You can’t heal a Shield.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The Shield has 5 Health Bar slots.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The Shield has 10 Health Bar slots.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The Shield has 15 Health Bar slots.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 211 · PDF pages 213\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SHIELD\n“Enjoy the illusion of safety.”\nInterrupt, Passive\nMana Cost: 8\nRange: Self\nDuration: 5 minutes\nYou are surrounded by a translucent force field that\nmoves with you and reduces non-magic damage you\ntake. The Shield has 2 Health Bar slots, each with your\nCon Mod. When you take damage, reduce these Health\nBar slots first. The Spell ends early if the shield loses all\nits Health Bar slots. You can’t heal a Shield.\nUPGRADES\nRank 5: The Shield has 5 Health Bar slots.\nRank 10: The Shield has 10 Health Bar slots.\nRank 15: The Shield has 15 Health Bar slots.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "shield passive shield shield spell “enjoy the illusion of safety.” interrupt, passive true true false passive [] [] 8 self 5 minutes you are surrounded by a translucent force field that moves with you and reduces non-magic damage you take. the shield has 2 health bar slots, each with your con mod. when you take damage, reduce these health bar slots first. the spell ends early if the shield loses all its health bar slots. you can’t heal a shield. {'5': 'the shield has 5 health bar slots.', '10': 'the shield has 10 health bar slots.', '15': 'the shield has 15 health bar slots.'}"}, {"id": "spell-shock-treatment", "reference": true, "referenceEntry": true, "title": "Shock Treatment", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Electrical therapy initiated; consent not required.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Electric\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d2 + Int Electric\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Electric\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Like a deranged emperor, bolts of electricity shoot out from your fingers.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d2 base damage, and you may choose to afflict the target with the Stunned Debuff instead of dealing damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d2 base damage, and add 1 Rank damage die (Electric) at the end of the round.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d2 base damage, and if you make this attack at melee range, you deal ×5 the total damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 212 · PDF pages 214\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SHOCK TREATMENT\n“Electrical therapy initiated; consent not required.”\nAttack, Electric\nMana Cost: 2\nRange: 30 feet\nAI Favor: 2\nLike a deranged emperor, bolts of electricity shoot out\nfrom your fingers.\nBase Damage: 1d2 + Int Electric\nUPGRADES\nRank 5: +1d2 base damage, and you may choose to\nafflict the target with the Stunned Debuff instead of\ndealing damage.\nRank 10: +1d2 base damage, and add 1 Rank damage\ndie (Electric) at the end of the round.\nRank 15: +1d2 base damage, and if you make this\nattack at melee range, you deal ×5 the total damage.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "shock treatment attack shock-treatment shock treatment spell “electrical therapy initiated; consent not required.” attack, electric false false false attack [] ['electric'] 2 30 feet 2 1d2 + int electric like a deranged emperor, bolts of electricity shoot out from your fingers. {'5': '+1d2 base damage, and you may choose to afflict the target with the stunned debuff instead of dealing damage.', '10': '+1d2 base damage, and add 1 rank damage die (electric) at the end of the round.', '15': '+1d2 base damage, and if you make this attack at melee range, you deal ×5 the total damage.'}"}, {"id": "spell-solsplash", "reference": true, "referenceEntry": true, "title": "Solsplash", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“The sun is merely a star close enough to hate us.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Fire, Constitution, Favored: Druid\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Constitution\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>13\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Con Fire\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Fire\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Druid\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Beams of concentrated “sunlight” fall upon the victim and those around them. Sunscreen’s not gonna help.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage, +5ft Splash.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage and +10ft Splash. Each affected entity who loses at least 3 Health Bar slots this way gains the Burned Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage and +15ft Splash.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 212 · PDF pages 214\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SOLSPLASH\n“The sun is merely a star close enough to hate us.”\nAttack, Fire, Constitution, Favored: Druid\nMana Cost: 13\nRange: 30 feet\nBeams of concentrated “sunlight” fall upon the victim\nand those around them. Sunscreen’s not gonna help.\nBase Damage: 1d8 + Con Fire\nUPGRADES\nRank 5: +1d8 base damage, +5ft Splash.\nRank 10: +1d8 base damage and +10ft Splash. Each\naffected entity who loses at least 3 Health Bar slots\nthis way gains the Burned Debuff.\nRank 15: +1d8 base damage and +15ft Splash.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "solsplash attack solsplash solsplash spell “the sun is merely a star close enough to hate us.” attack, fire, constitution, favored: druid constitution false false false attack ['druid'] ['fire'] 13 30 feet 1d8 + con fire beams of concentrated “sunlight” fall upon the victim and those around them. sunscreen’s not gonna help. {'5': '+1d8 base damage, +5ft splash.', '10': '+1d8 base damage and +10ft splash. each affected entity who loses at least 3 health bar slots this way gains the burned debuff.', '15': '+1d8 base damage and +15ft splash.'}"}, {"id": "spell-soul-collector", "reference": true, "referenceEntry": true, "title": "Soul Collector", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“This soul appears… reusable.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Necrotic\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>4\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>50 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Int Necrotic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Necrotic\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>With a twist of your hand, you siphon the spirit from your target.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and if this Spell deals the killing blow to a foe of at least half your level, it deals +1 bonus damage until you complete a long rest. This damage bonus is cumulative up to the Spell’s Rank.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and the bonus continues for one week.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and the bonus continues for as long as you remain on your current floor.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 212 · PDF pages 214\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">SOUL COLLECTOR\n“This soul appears… reusable.”\nAttack, Necrotic\nMana Cost: 4\nRange: 50 feet\nAI Favor: 1\nWith a twist of your hand, you siphon the spirit from\nyour target.\nBase Damage: 1d4 + Int Necrotic\nUPGRADES\nRank 5: +1d4 base damage, and if this Spell deals the\nkilling blow to a foe of at least half your level, it deals\n+1 bonus damage until you complete a long rest. This\ndamage bonus is cumulative up to the Spell’s Rank.\nRank 10: +1d4 base damage, and the bonus contin‑\nues for one week.\nRank 15: +1d4 base damage, and the bonus contin‑\nues for as long as you remain on your current floor.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "soul collector attack soul-collector soul collector spell “this soul appears… reusable.” attack, necrotic false false false attack [] ['necrotic'] 4 50 feet 1 1d4 + int necrotic with a twist of your hand, you siphon the spirit from your target. {'5': '+1d4 base damage, and if this spell deals the killing blow to a foe of at least half your level, it deals +1 bonus damage until you complete a long rest. this damage bonus is cumulative up to the spell’s rank.', '10': '+1d4 base damage, and the bonus continues for one week.', '15': '+1d4 base damage, and the bonus continues for as long as you remain on your current floor.'}"}, {"id": "spell-thunderlash", "reference": true, "referenceEntry": true, "title": "Thunderlash", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Loud noises and bad decisions go hand-in-hand.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Sonic\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>12\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>50 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d10 + Int Sonic\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Sonic\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You unleash a whip-like emanation of pure sound which thunders through the air.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d10 base damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d10 base damage, and this attack deals Armor-Piercing damage (ignores DR).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d10 base damage, and you can change the range to a 15ft Cone attack.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 212 · PDF pages 214\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">THUNDERLASH\n“Loud noises and bad decisions go hand-in-hand.”\nAttack, Sonic\nMana Cost: 12\nRange: 50 feet\nYou unleash a whip-like emanation of pure sound\nwhich thunders through the air.\nBase Damage: 1d10 + Int Sonic\nUPGRADES\nRank 5: +1d10 base damage.\nRank 10: +1d10 base damage, and this attack deals\nArmor-Piercing damage (ignores DR).\nRank 15: +1d10 base damage, and you can change\nthe range to a 15ft Cone attack.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "thunderlash attack thunderlash thunderlash spell “loud noises and bad decisions go hand-in-hand.” attack, sonic false false false attack [] ['sonic'] 12 50 feet 1d10 + int sonic you unleash a whip-like emanation of pure sound which thunders through the air. {'5': '+1d10 base damage.', '10': '+1d10 base damage, and this attack deals armor-piercing damage (ignores dr).', '15': '+1d10 base damage, and you can change the range to a 15ft cone attack.'}"}, {"id": "spell-torch", "reference": true, "referenceEntry": true, "title": "Torch", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Congratulations. You can now see what’s trying to kill you.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>Self\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>Until you enter a saferoom or descend to a new floor.\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You create a magical orb of light that follows slightly above and behind you. It provides bright light for a 20ft radius and dim light for a 20ft radius past that.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can move the orb up to 20 feet away from you.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can move the orb up to 60 feet away from you and can double the radius of the brightness with a thought.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can move the orb up to 100 feet away from you and attach it to a surface as an Action.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 212 · PDF pages 214\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TORCH\n“Congratulations. You can now see what’s trying to\nkill you.”\nPassive\nMana Cost: 1\nRange: Self\nDuration: Until you enter a saferoom or descend to a\nnew floor.\nYou create a magical orb of light that follows slightly\nabove and behind you. It provides bright light for a 20ft\nradius and dim light for a 20ft radius past that.\nUPGRADES\nRank 5: You can move the orb up to 20 feet away\nfrom you.\nRank 10: You can move the orb up to 60 feet away\nfrom you and can double the radius of the brightness\nwith a thought.\nRank 15: You can move the orb up to 100 feet away\nfrom you and attach it to a surface as an Action.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "torch passive torch torch spell “congratulations. you can now see what’s trying to kill you.” passive true false false passive [] [] 1 self until you enter a saferoom or descend to a new floor. you create a magical orb of light that follows slightly above and behind you. it provides bright light for a 20ft radius and dim light for a 20ft radius past that. {'5': 'you can move the orb up to 20 feet away from you.', '10': 'you can move the orb up to 60 feet away from you and can double the radius of the brightness with a thought.', '15': 'you can move the orb up to 100 feet away from you and attach it to a surface as an action.'}"}, {"id": "spell-tripper", "reference": true, "referenceEntry": true, "title": "Tripper", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Let’s see if they know we’re coming.”\u003c/em>\u003c/p>\u003cp class=\"source\">Passive, Area of Effect\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>None\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>30ft Burst radius\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 hours\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Does not detonate traps with very specific triggers. Must be imbued onto something you are wearing.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>With a snap of your fingers, every movement, heat, and weight-triggered trap in the area “goes off.” Blades swing, bombs blow, and creatures are released.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+Intelligence Burst radius.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+Intelligence Burst radius.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+Intelligence Burst radius, and all damage taken is considered Splash (half damage).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 213 · PDF pages 215\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TRIPPER\n“Let’s see if they know we’re coming.”\nPassive, Area of Effect\nMana Cost: None\nRange: 30ft Burst radius\nLimitations: Does not detonate traps with very specif‑\nic triggers. Must be imbued onto something you are\nwearing.\nCooldown: 5 hours\nWith a snap of your fingers, every movement, heat,\nand weight-triggered trap in the area “goes off.”\nBlades swing, bombs blow, and creatures are released.\nUPGRADES\nRank 5: +Intelligence Burst radius.\nRank 10: +Intelligence Burst radius.\nRank 15: +Intelligence Burst radius, and all damage\ntaken is considered Splash (half damage).\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "tripper passive tripper tripper spell “let’s see if they know we’re coming.” passive, area of effect true false true passive [] [] none 30ft burst radius 5 hours does not detonate traps with very specific triggers. must be imbued onto something you are wearing. with a snap of your fingers, every movement, heat, and weight-triggered trap in the area “goes off.” blades swing, bombs blow, and creatures are released. {'5': '+intelligence burst radius.', '10': '+intelligence burst radius.', '15': '+intelligence burst radius, and all damage taken is considered splash (half damage).'}"}, {"id": "spell-turn-undead", "reference": true, "referenceEntry": true, "title": "Turn Undead", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“What is dead should stay dead… and far away.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Area of Effect, Favored: Bard, Cleric, &amp; Paladin\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attack\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>9\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10ft Cone\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>3 rounds\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>5 minutes\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Favored classes\u003c/dt>\u003cdd>Bard, Cleric, Paladin\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Does not work against Bosses.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Make a single Cha-Opposed Spell Check vs. the Undead Mobs in the affected area.\u003c/p>\u003cp>On Success, the Undead Mob runs away for the duration of the Spell.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+5ft Cone. Duration is 5 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+10ft Cone. Duration is 10 rounds.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+15ft Cone. Duration is 15 rounds. On an Amazing Success or better, the Undead Mob is destroyed.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 213 · PDF pages 215\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TURN UNDEAD\n“What is dead should stay dead… and far away.”\nAttack, Area of Effect, Favored: Bard, Cleric, &amp; Paladin\nMana Cost: 9\nRange: 10ft Cone\nDuration: 3 rounds\nLimitations: Does not work against Bosses.\nCooldown: 5 minutes\nMake a single Cha-Opposed Spell Check vs. the Un‑\ndead Mobs in the affected area.\nOn Success, the Undead Mob runs away for the dura‑\ntion of the Spell.\nUPGRADES\nRank 5: +5ft Cone. Duration is 5 rounds.\nRank 10: +10ft Cone. Duration is 10 rounds.\nRank 15: +15ft Cone. Duration is 15 rounds. On an\nAmazing Success or better, the Undead Mob is de‑\nstroyed.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "turn undead attack turn-undead turn undead spell “what is dead should stay dead… and far away.” attack, area of effect, favored: bard, cleric, & paladin false false true attack ['bard', 'cleric', 'paladin'] [] 9 10ft cone 3 rounds 5 minutes does not work against bosses. make a single cha-opposed spell check vs. the undead mobs in the affected area.\n\non success, the undead mob runs away for the duration of the spell. {'5': '+5ft cone. duration is 5 rounds.', '10': '+10ft cone. duration is 10 rounds.', '15': '+15ft cone. duration is 15 rounds. on an amazing success or better, the undead mob is destroyed.'}"}, {"id": "spell-twinkle-toes", "reference": true, "referenceEntry": true, "title": "Twinkle Toes", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Passive", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Fly my pretties, fly!”\u003c/em>\u003c/p>\u003cp class=\"source\">Intelligence, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>passive\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Mana cost\u003c/dt>\u003cdd>2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>5 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Duration\u003c/dt>\u003cdd>A number of seconds equal to your Intelligence.\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Target a pet or minion within range. It has Move ×2 for the duration.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The pet or minion has Move ×3 for the duration.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The pet or minion has Move ×4 for the duration.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The pet or minion has Move ×5 for the duration.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 213 · PDF pages 215\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">TWINKLE TOES\n“Fly my pretties, fly!”\nIntelligence, Passive\nMana Cost: 2\nRange: 5 feet\nDuration: A number of seconds equal to your\nIntelligence.\nTarget a pet or minion within range. It has Move ×2 for\nthe duration.\nUPGRADES\nRank 5: The pet or minion has Move ×3 for the duration.\nRank 10: The pet or minion has Move ×4 for the duration.\nRank 15: The pet or minion has Move ×5 for the duration.\u003c/pre>\u003c/details>", "backlinks": ["spells"], "search": "twinkle toes passive twinkle-toes twinkle toes spell “fly my pretties, fly!” intelligence, passive intelligence true false false passive [] [] 2 5 feet a number of seconds equal to your intelligence. target a pet or minion within range. it has move ×2 for the duration. {'5': 'the pet or minion has move ×3 for the duration.', '10': 'the pet or minion has move ×4 for the duration.', '15': 'the pet or minion has move ×5 for the duration.'}"}, {"id": "spell-unnecessary-force", "reference": true, "referenceEntry": true, "title": "Unnecessary Force", "group": "Spells", "type": "spell", "typeLabel": "Spell", "dek": "Attack", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#spells\">← All spells\u003c/a> · \u003ca class=\"wl\" href=\"#spells-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>“Excessive force authorized. Paperwork waived.”\u003c/em>\u003c/p>\u003cp class=\"source\">Attack, Force\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Spell mode\u003c/dt>\u003cdd>attac
