=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>If you’re familiar with the area you are investigating, you can make the Skill Check with Advantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Each attempt takes 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Roll with Advantage if you know the parties involved. Example: You know the puzzle’s maker, or you know the murder victim and the main suspect.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 194 · PDF pages 196\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">INVESTIGATION\nIntelligence\nYou spend 10 minutes looking at an area or puzzle in\nfront of you and might make heads or tails of it. Make\nan Unopposed Skill Check.\nWhen you take the Look for Clues Action (p. 85),\nspend only one Action to use this Skill.\nOn Success, you learn something useful.\nUPGRADES\nRank 5: If you’re familiar with the area you are investi‑\ngating, you can make the Skill Check with Advantage.\nRank 10: Each attempt takes 5 minutes.\nRank 15: Roll with Advantage if you know the parties\ninvolved. Example: You know the puzzle’s maker, or\nyou know the murder victim and the main suspect.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "investigation utility skills investigation investigation utility_skill intelligence intelligence false false false [] [] you spend 10 minutes looking at an area or puzzle in front of you and might make heads or tails of it. make an unopposed skill check.\n\nwhen you take the look for clues action (p. 85), spend only one action to use this skill.\n\non success, you learn something useful. {'5': 'if you’re familiar with the area you are investigating, you can make the skill check with advantage.', '10': 'each attempt takes 5 minutes.', '15': 'roll with advantage if you know the parties involved. example: you know the puzzle’s maker, or you know the murder victim and the main suspect.'}"}, {"id": "skill-iron-punch", "reference": true, "referenceEntry": true, "title": "Iron Punch", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Pugilism Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You deal +1d2 base damage.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Pugilism\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-pugilism\">Pugilism\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Add 1 Rank damage die.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may choose to have the target gain the Stunned Debuff instead of rolling damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Add 1 Rank damage die, and the target gains the Stunned Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 180 · PDF pages 182\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">IRON PUNCH\nPugilism Damage Effect, Passive\nYou deal +1d2 base damage.\nUPGRADES\nRank 5: Add 1 Rank damage die.\nRank 10: You may choose to have the target gain the\nStunned Debuff instead of rolling damage.\nRank 15: Add 1 Rank damage die, and the target gains\nthe Stunned Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "iron punch hand-to-hand damage effect skills iron-punch iron punch attack_skill hand-to-hand damage effect skills pugilism damage effect, passive true false false pugilism [] [] you deal +1d2 base damage. {'5': 'add 1 rank damage die.', '10': 'you may choose to have the target gain the stunned debuff instead of rolling damage.', '15': 'add 1 rank damage die, and the target gains the stunned debuff.'}"}, {"id": "skill-iron-stomach", "reference": true, "referenceEntry": true, "title": "Iron Stomach", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Constitution\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Constitution\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Eat magic items for fun and profit! But beware of cursed items, as they could have negative effects. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you eat the item. It is destroyed, as the shitter will be tomorrow morning.\u003c/p>\u003cp>On an Amazing Success or better, gain 1 permanent Intelligence.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>On a Critical Hit, gain 1 additional permanent Intelligence.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>On a Standard Success or better, gain 1 permanent Intelligence. You may eat cursed items with no ill effects.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You choose which Stat is permanently increased.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 194 · PDF pages 196\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">IRON STOMACH\nConstitution\nEat magic items for fun and profit! But beware of\ncursed items, as they could have negative effects.\nMake an Unopposed Skill Check.\nOn Success, you eat the item. It is destroyed, as the\nshitter will be tomorrow morning.\nOn an Amazing Success or better, gain 1 permanent\nIntelligence.\nUPGRADES\nRank 5: On a Critical Hit, gain 1 additional permanent\nIntelligence.\nRank 10: On a Standard Success or better, gain 1\npermanent Intelligence. You may eat cursed items with\nno ill effects.\nRank 15: You choose which Stat is permanently\nincreased.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "iron stomach utility skills iron-stomach iron stomach utility_skill constitution constitution false false false [] [] eat magic items for fun and profit! but beware of cursed items, as they could have negative effects. make an unopposed skill check.\n\non success, you eat the item. it is destroyed, as the shitter will be tomorrow morning.\n\non an amazing success or better, gain 1 permanent intelligence. {'5': 'on a critical hit, gain 1 additional permanent intelligence.', '10': 'on a standard success or better, gain 1 permanent intelligence. you may eat cursed items with no ill effects.', '15': 'you choose which stat is permanently increased.'}"}, {"id": "skill-javelin", "reference": true, "referenceEntry": true, "title": "Javelin", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>40 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage, and this attack deals Armor-Piercing damage (ignores DR).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and its range increases by your Strength score in feet.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 182 · PDF pages 184\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">JAVELIN\nRanged Attack, Dex\nRange: 40 feet\nBase Damage: 1d8 + Str Piercing\nUPGRADES\nRank 5: +1d8 base damage\nRank 10: +1d8 base damage, and this attack deals\nArmor-Piercing damage (ignores DR).\nRank 15: +1d8 base damage, and its range increases\nby your Strength score in feet.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "javelin ranged weapon skills javelin javelin attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['piercing'] 40 feet 1d8 + str piercing {'5': '+1d8 base damage', '10': '+1d8 base damage, and this attack deals armor-piercing damage (ignores dr).', '15': '+1d8 base damage, and its range increases by your strength score in feet.'}"}, {"id": "skill-jumping", "reference": true, "referenceEntry": true, "title": "Jumping", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>With a running start of at least 10 feet (made as a 10-foot Step with this Action), you leap through the air in an arcing trajectory. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you leap a distance in feet up to your Rank + Str with a height of 1ft.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Add your Dex to the height of your Jump.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You gain a +1 Evade Buff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your leap distance in feet is Rank + [Str ×2].\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 194 · PDF pages 196\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">JUMPING\nStrength\nWith a running start of at least 10 feet (made as a 10-\nfoot Step with this Action), you leap through the air in\nan arcing trajectory. Make an Unopposed Skill Check.\nOn Success, you leap a distance in feet up to your\nRank + Str with a height of 1ft.\nUPGRADES\nRank 5: Add your Dex to the height of your Jump.\nRank 10: You gain a +1 Evade Buff.\nRank 15: Your leap distance in feet is Rank + [Str ×2].\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "jumping utility skills jumping jumping utility_skill strength strength false false false [] [] with a running start of at least 10 feet (made as a 10-foot step with this action), you leap through the air in an arcing trajectory. make an unopposed skill check.\n\non success, you leap a distance in feet up to your rank + str with a height of 1ft. {'5': 'add your dex to the height of your jump.', '10': 'you gain a +1 evade buff.', '15': 'your leap distance in feet is rank + [str ×2].'}"}, {"id": "skill-lance", "reference": true, "referenceEntry": true, "title": "Lance", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Reach Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d12 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Must be mounted to use. Cannot be used in conjunction with Attack of Opportunity or Zone of Control Skills.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d12 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d12 base damage, and +1 damage for every 10 feet your mount Moved this turn.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d12 base damage, and +X damage, where X is the size of your mount.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 182 · PDF pages 184\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LANCE\nMelee Attack, Str\nRange: 10 feet\nLimitations: Must be mounted to use. Cannot be used\nin conjunction with Attack of Opportunity or Zone of\nControl Skills.\nBase Damage: 1d12 + Str Piercing\nUPGRADES\nRank 5: +1d12 base damage\nRank 10: +1d12 base damage, and +1 damage for\nevery 10 feet your mount Moved this turn.\nRank 15: +1d12 base damage, and +X damage, where\nX is the size of your mount.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "lance reach weapon skills lance lance attack_skill reach weapon skills melee attack, str strength false false false melee [] ['piercing'] 10 feet must be mounted to use. cannot be used in conjunction with attack of opportunity or zone of control skills. 1d12 + str piercing {'5': '+1d12 base damage', '10': '+1d12 base damage, and +1 damage for every 10 feet your mount moved this turn.', '15': '+1d12 base damage, and +x damage, where x is the size of your mount.'}"}, {"id": "skill-leadership", "reference": true, "referenceEntry": true, "title": "Leadership", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You are skilled at coordinating two or more separate parties during fights against Bosses. Make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success, the parties have Advantage on their first Attack against the Boss.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may instead use this Skill during Skill challenges while on a group Quest. Perform a free Call a Play Action, and it extends to each member of the parties during their next non-combat Skill Check.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Instead of Advantage, anyone in the parties may perform a free Move Action.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Instead of Advantage, anyone in the parties may perform a free Evade Action.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 194–195 · PDF pages 196–197\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LEADERSHIP\nCharisma\nYou are skilled at coordinating two or more separate\nparties during fights against Bosses. Make an Int-Op‑\nposed Skill Check.\nOn Success, the parties have Advantage on their first\nAttack against the Boss.\nUPGRADES\nRank 5: You may instead use this Skill during Skill\nchallenges while on a group Quest. Perform a free Call\na Play Action, and it extends to each member of the\nparties during their next non-combat Skill Check.\nRank 10: Instead of Advantage, anyone in the parties\nmay perform a free Move Action.\nRank 15: Instead of Advantage, anyone in the parties\nmay perform a free Evade Action.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "leadership utility skills leadership leadership utility_skill charisma charisma false false false [] [] you are skilled at coordinating two or more separate parties during fights against bosses. make an int-opposed skill check.\n\non success, the parties have advantage on their first attack against the boss. {'5': 'you may instead use this skill during skill challenges while on a group quest. perform a free call a play action, and it extends to each member of the parties during their next non-combat skill check.', '10': 'instead of advantage, anyone in the parties may perform a free move action.', '15': 'instead of advantage, anyone in the parties may perform a free evade action.'}"}, {"id": "skill-light-on-your-feet", "reference": true, "referenceEntry": true, "title": "Light On Your Feet", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Usable only by animals\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>With a running start of at least 10 feet (made as a 10ft Step with this Skill), you leap through the air in an arcing trajectory. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you leap a distance in feet up to your Rank ×2 with a height equal to your Dex ×2 in feet.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your distance is Rank ×3 and your height is Dex ×3.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may leap without an arcing trajectory, which allows for “straight up.”\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your leap may last up to your Rank in seconds, which resembles gliding.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 195 · PDF pages 197\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LIGHT ON YOUR FEET\nDexterity\nLimitations: Usable only by animals\nWith a running start of at least 10 feet (made as a 10ft\nStep with this Skill), you leap through the air in an arc‑\ning trajectory. Make an Unopposed Skill Check.\nOn Success, you leap a distance in feet up to your\nRank ×2 with a height equal to your Dex ×2 in feet.\nUPGRADES\nRank 5: Your distance is Rank ×3 and your height is\nDex ×3.\nRank 10: You may leap without an arcing trajectory,\nwhich allows for “straight up.”\nRank 15: Your leap may last up to your Rank in sec‑\nonds, which resembles gliding.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "light on your feet utility skills light-on-your-feet light on your feet utility_skill dexterity dexterity false false false [] [] usable only by animals with a running start of at least 10 feet (made as a 10ft step with this skill), you leap through the air in an arcing trajectory. make an unopposed skill check.\n\non success, you leap a distance in feet up to your rank ×2 with a height equal to your dex ×2 in feet. {'5': 'your distance is rank ×3 and your height is dex ×3.', '10': 'you may leap without an arcing trajectory, which allows for “straight up.”', '15': 'your leap may last up to your rank in seconds, which resembles gliding.'}"}, {"id": "skill-lockpicking", "reference": true, "referenceEntry": true, "title": "Lockpicking", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Roll with Disadvantage if you do not have the proper tools, unless it’s a crude lock.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You spend the Floor number in minutes trying to pick the lock. Make an Unopposed Skill Check (more complex locks may have a higher Difficulty, as determined by the GM). If the lock was created by a named antagonist, this could be an Int-Opposed Skill Check instead.\u003c/p>\u003cp>On Success, you pick the lock!\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You make no noise and leave no trace.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Each attempt takes half the time. You may alter the lock so that the key no longer works.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You don’t roll with Disadvantage if you lack the proper tools.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 195 · PDF pages 197\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LOCKPICKING\nDexterity\nLimitations: Roll with Disadvantage if you do not\nhave the proper tools, unless it’s a crude lock.\nYou spend the Floor number in minutes trying to pick\nthe lock. Make an Unopposed Skill Check (more com‑\nplex locks may have a higher Difficulty, as determined\nby the GM). If the lock was created by a named antago‑\nnist, this could be an Int-Opposed Skill Check instead.\nOn Success, you pick the lock!\nUPGRADES\nRank 5: You make no noise and leave no trace.\nRank 10: Each attempt takes half the time. You may\nalter the lock so that the key no longer works.\nRank 15: You don’t roll with Disadvantage if you lack\nthe proper tools.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "lockpicking utility skills lockpicking lockpicking utility_skill dexterity dexterity false false false [] [] roll with disadvantage if you do not have the proper tools, unless it’s a crude lock. you spend the floor number in minutes trying to pick the lock. make an unopposed skill check (more complex locks may have a higher difficulty, as determined by the gm). if the lock was created by a named antagonist, this could be an int-opposed skill check instead.\n\non success, you pick the lock! {'5': 'you make no noise and leave no trace.', '10': 'each attempt takes half the time. you may alter the lock so that the key no longer works.', '15': 'you don’t roll with disadvantage if you lack the proper tools.'}"}, {"id": "skill-longsword", "reference": true, "referenceEntry": true, "title": "Longsword", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Edged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Str Slashing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Slashing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and you gain a +1 Evade Buff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178 · PDF pages 180\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LONGSWORD\nMelee Attack, Str\nBase Damage: 1d8 + Str Slashing\nUPGRADES\nRank 5: +1d8 base damage\nRank 10: +1d8 base damage\nRank 15: +1d8 base damage, and you gain a +1\nEvade Buff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "longsword edged weapon skills longsword longsword attack_skill edged weapon skills melee attack, str strength false false false melee [] ['slashing'] 1d8 + str slashing {'5': '+1d8 base damage', '10': '+1d8 base damage', '15': '+1d8 base damage, and you gain a +1 evade buff.'}"}, {"id": "skill-lore", "reference": true, "referenceEntry": true, "title": "Lore", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You have studied the goings-on in the Dungeon and have figured out a thing or two. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you know a little something about a neighborhood, some of the Mobs, or how to avoid pissing off the locals.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can identify the major factions in the area.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You are aware of the important local NPCs. Just give your GM a break and don’t demand this all up front or the first one you come across will likely attack you.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You roll with Advantage on your first Charisma-based Skill Check when encountering an organized group in a neighborhood.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 195 · PDF pages 197\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">LORE\nIntelligence\nYou have studied the goings-on in the Dungeon and\nhave figured out a thing or two. Make an Unopposed\nSkill Check.\nOn Success, you know a little something about a\nneighborhood, some of the Mobs, or how to avoid\npissing off the locals.\nUPGRADES\nRank 5: You can identify the major factions in the area.\nRank 10: You are aware of the important local NPCs.\nJust give your GM a break and don’t demand this all\nup front or the first one you come across will likely\nattack you.\nRank 15: You roll with Advantage on your first Charis‑\nma-based Skill Check when encountering an organized\ngroup in a neighborhood.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "lore utility skills lore lore utility_skill intelligence intelligence false false false [] [] you have studied the goings-on in the dungeon and have figured out a thing or two. make an unopposed skill check.\n\non success, you know a little something about a neighborhood, some of the mobs, or how to avoid pissing off the locals. {'5': 'you can identify the major factions in the area.', '10': 'you are aware of the important local npcs. just give your gm a break and don’t demand this all up front or the first one you come across will likely attack you.', '15': 'you roll with advantage on your first charisma-based skill check when encountering an organized group in a neighborhood.'}"}, {"id": "skill-negotiation", "reference": true, "referenceEntry": true, "title": "Negotiation", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Does not work on members of your own party. Some items have a minimum price.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You spend 5 minutes haggling over the price of items or negotiating to get what you want through compromise. Typically, haggling is done with an NPC merchant when you’re buying or selling items. If you haggle with other entities, you do so with Disadvantage. Make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success, you increase or decrease the price 10% in your favor. If you’re not haggling, the opponent tentatively agrees to your terms.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your party members can also buy or sell at your newly-negotiated price.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Increase or decrease the price by an additional 10% in your favor.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Increase or decrease the price by an additional 15% in your favor.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 195 · PDF pages 197\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">NEGOTIATION\nCharisma\nLimitations: Does not work on members of your own\nparty. Some items have a minimum price.\nYou spend 5 minutes haggling over the price of items\nor negotiating to get what you want through compro‑\nmise. Typically, haggling is done with an NPC merchant\nwhen you’re buying or selling items. If you haggle with\nother entities, you do so with Disadvantage. Make an\nInt-Opposed Skill Check.\nOn Success, you increase or decrease the price 10% in\nyour favor. If you’re not haggling, the opponent tenta‑\ntively agrees to your terms.\nUPGRADES\nRank 5: Your party members can also buy or sell at\nyour newly-negotiated price.\nRank 10: Increase or decrease the price by an addi‑\ntional 10% in your favor.\nRank 15: Increase or decrease the price by an addi‑\ntional 15% in your favor.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "negotiation utility skills negotiation negotiation utility_skill charisma charisma false false false [] [] does not work on members of your own party. some items have a minimum price. you spend 5 minutes haggling over the price of items or negotiating to get what you want through compromise. typically, haggling is done with an npc merchant when you’re buying or selling items. if you haggle with other entities, you do so with disadvantage. make an int-opposed skill check.\n\non success, you increase or decrease the price 10% in your favor. if you’re not haggling, the opponent tentatively agrees to your terms. {'5': 'your party members can also buy or sell at your newly-negotiated price.', '10': 'increase or decrease the price by an additional 10% in your favor.', '15': 'increase or decrease the price by an additional 15% in your favor.'}"}, {"id": "skill-noggin-nocker", "reference": true, "referenceEntry": true, "title": "Noggin Nocker", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Combat Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>It’s like a headbutt, only cooler.\u003c/em>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Con Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1 (only if no Damage Effect is used)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>On Success, you lose 1 Health Bar slot.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Choose the Skullcracker or Powerful Strike Damage Effect (if you wish) before rolling to hit.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and you don’t take any damage from your own Attack.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and add 1 Rank damage die.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and the target gains the Woozy Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 179 · PDF pages 181\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">NOGGIN NOCKER\nIt’s like a headbutt, only cooler.\nMelee Attack, Str\nAI Favor: 1 (only if no Damage Effect is used)\nLimitations: On Success, you lose 1 Health Bar slot.\nChoose the Skullcracker or Powerful Strike Damage\nEffect (if you wish) before rolling to hit.\nBase Damage: 1d4 + Con Bludgeoning\nUPGRADES\nRank 5: +1d4 base damage, and you don’t take any\ndamage from your own Attack.\nRank 10: +1d4 base damage, and add 1 Rank damage die.\nRank 15: +1d4 base damage, and the target gains the\nWoozy Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skill-powerful-strike", "skills", "skill-skullcracker"], "search": "noggin nocker hand-to-hand combat skills noggin-nocker noggin nocker attack_skill hand-to-hand combat skills it’s like a headbutt, only cooler. melee attack, str strength false false false melee [] ['bludgeoning'] 1 (only if no damage effect is used) on success, you lose 1 health bar slot. 1d4 + con bludgeoning choose the skullcracker or powerful strike damage effect (if you wish) before rolling to hit. {'5': '+1d4 base damage, and you don’t take any damage from your own attack.', '10': '+1d4 base damage, and add 1 rank damage die.', '15': '+1d4 base damage, and the target gains the woozy debuff.'}"}, {"id": "skill-pathfinder", "reference": true, "referenceEntry": true, "title": "Pathfinder", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Ranks in this Skill only increase by magical means and training.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Your HUD map zooms out with a thought, the breadth of which is determined by a multiplier equal to your Rank. Example: Rank 4 means your map covers ×4 the standard area (1/4 of a square mile), which makes it extend to 1 mile around you.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You are notified when you are near a saferoom or stairwell.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can see through your map while it is open in your HUD.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Mobs appear as red dots on your HUD map.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 195 · PDF pages 197\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PATHFINDER\nPassive\nLimitations: Ranks in this Skill only increase by magi‑\ncal means and training.\nYour HUD map zooms out with a thought, the breadth\nof which is determined by a multiplier equal to your\nRank. Example: Rank 4 means your map covers ×4 the\nstandard area (1/4 of a square mile), which makes it\nextend to 1 mile around you.\nUPGRADES\nRank 5: You are notified when you are near a safe‑\nroom or stairwell.\nRank 10: You can see through your map while it is\nopen in your HUD.\nRank 15: Mobs appear as red dots on your HUD map.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "pathfinder utility skills pathfinder pathfinder utility_skill passive true false false [] [] ranks in this skill only increase by magical means and training. your hud map zooms out with a thought, the breadth of which is determined by a multiplier equal to your rank. example: rank 4 means your map covers ×4 the standard area (1/4 of a square mile), which makes it extend to 1 mile around you. {'5': 'you are notified when you are near a saferoom or stairwell.', '10': 'you can see through your map while it is open in your hud.', '15': 'mobs appear as red dots on your hud map.'}"}, {"id": "skill-perception", "reference": true, "referenceEntry": true, "title": "Perception", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You concentrate your senses to pick out details about your environment that others might miss. Make an Unopposed Skill Check, though the GM will likely adjust the Difficulty based on the lighting, how cluttered the area is, how quickly an event occurs, and other such circumstances.\u003c/p>\u003cp>Also use Perception when you take a Look for Clues Action (p. 85).\u003c/p>\u003cp>On Success, you notice something. It could be important; it might not be.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Halve the penalty for cluttered areas.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Halve the penalty for how short of a window you have to notice the thing.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Halve the penalty for the range to the thing.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 196 · PDF pages 198\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PERCEPTION\nIntelligence\nYou concentrate your senses to pick out details about\nyour environment that others might miss. Make an Un‑\nopposed Skill Check, though the GM will likely adjust\nthe Difficulty based on the lighting, how cluttered the\narea is, how quickly an event occurs, and other such\ncircumstances.\nAlso use Perception when you take a Look for Clues\nAction (p. 85).\nOn Success, you notice something. It could be import‑\nant; it might not be.\nUPGRADES\nRank 5: Halve the penalty for cluttered areas.\nRank 10: Halve the penalty for how short of a window\nyou have to notice the thing.\nRank 15: Halve the penalty for the range to the thing.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "perception utility skills perception perception utility_skill intelligence intelligence false false false [] [] you concentrate your senses to pick out details about your environment that others might miss. make an unopposed skill check, though the gm will likely adjust the difficulty based on the lighting, how cluttered the area is, how quickly an event occurs, and other such circumstances.\n\nalso use perception when you take a look for clues action (p. 85).\n\non success, you notice something. it could be important; it might not be. {'5': 'halve the penalty for cluttered areas.', '10': 'halve the penalty for how short of a window you have to notice the thing.', '15': 'halve the penalty for the range to the thing.'}"}, {"id": "skill-performance", "reference": true, "referenceEntry": true, "title": "Performance", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Whether you’re acting, dancing, playing an instrument, singing, or delivering slam poetry, use this Skill when you want to electrify an audience. Choose a type of performance to specialize in as your starting type, be it comedy, guitar, screamo, or reciting the collected works of Alan Ginsberg.\u003c/p>\u003cp>Make an Unopposed Skill Check to determine the audience reaction. If you are competing against other performers, add the top rival’s Cha to the Difficulty.\u003c/p>\u003cp>On Success, you command the stage. The audience is entertained.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Choose an additional type of performance to specialize in.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Choose an additional type of performance. You can coach and coordinate others in one of your specialties. After coaching them for at least 1 hour in one of your specialties, they can attempt an unskilled Performance Skill Check without Disadvantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Choose an additional type of performance. You can mimic someone else’s performance after experiencing it once.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 196 · PDF pages 198\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PERFORMANCE\nCharisma\nWhether you’re acting, dancing, playing an instrument,\nsinging, or delivering slam poetry, use this Skill when\nyou want to electrify an audience. Choose a type of\nperformance to specialize in as your starting type, be\nit comedy, guitar, screamo, or reciting the collected\nworks of Alan Ginsberg.\nMake an Unopposed Skill Check to determine the\naudience reaction. If you are competing against other\nperformers, add the top rival’s Cha to the Difficulty.\nOn Success, you command the stage. The audience is\nentertained.\nUPGRADES\nRank 5: Choose an additional type of performance to\nspecialize in.\nRank 10: Choose an additional type of performance.\nYou can coach and coordinate others in one of your\nspecialties. After coaching them for at least 1 hour in\none of your specialties, they can attempt an unskilled\nPerformance Skill Check without Disadvantage.\nRank 15: Choose an additional type of performance.\nYou can mimic someone else’s performance after\nexperiencing it once.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "performance utility skills performance performance utility_skill charisma charisma false false false [] [] whether you’re acting, dancing, playing an instrument, singing, or delivering slam poetry, use this skill when you want to electrify an audience. choose a type of performance to specialize in as your starting type, be it comedy, guitar, screamo, or reciting the collected works of alan ginsberg.\n\nmake an unopposed skill check to determine the audience reaction. if you are competing against other performers, add the top rival’s cha to the difficulty.\n\non success, you command the stage. the audience is entertained. {'5': 'choose an additional type of performance to specialize in.', '10': 'choose an additional type of performance. you can coach and coordinate others in one of your specialties. after coaching them for at least 1 hour in one of your specialties, they can attempt an unskilled performance skill check without disadvantage.', '15': 'choose an additional type of performance. you can mimic someone else’s performance after experiencing it once.'}"}, {"id": "skill-persuasion", "reference": true, "referenceEntry": true, "title": "Persuasion", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You have a knack for getting others to see things your way. You typically need about 10 minutes of schmoozing in a safe environment to make a Check with this Skill, and you may suffer Disadvantage if the request is risky, inconvenient, or untoward. Make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success, you convince the target to follow your suggestion if it isn’t too costly for them, too dangerous, or against their nature.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>They’ll follow your suggestion even if it is costly for them.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>They’ll follow your suggestion even if it is dangerous.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>They’ll follow your suggestion even if it’s against their nature.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 196 · PDF pages 198\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PERSUASION\nCharisma\nYou have a knack for getting others to see things your\nway. You typically need about 10 minutes of schmooz‑\ning in a safe environment to make a Check with this\nSkill, and you may suffer Disadvantage if the request is\nrisky, inconvenient, or untoward. Make an Int-Opposed\nSkill Check.\nOn Success, you convince the target to follow your\nsuggestion if it isn’t too costly for them, too danger‑\nous, or against their nature.\nUPGRADES\nRank 5: They’ll follow your suggestion even if it is\ncostly for them.\nRank 10: They’ll follow your suggestion even if it is\ndangerous.\nRank 15: They’ll follow your suggestion even if it’s\nagainst their nature.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "persuasion utility skills persuasion persuasion utility_skill charisma charisma false false false [] [] you have a knack for getting others to see things your way. you typically need about 10 minutes of schmoozing in a safe environment to make a check with this skill, and you may suffer disadvantage if the request is risky, inconvenient, or untoward. make an int-opposed skill check.\n\non success, you convince the target to follow your suggestion if it isn’t too costly for them, too dangerous, or against their nature. {'5': 'they’ll follow your suggestion even if it is costly for them.', '10': 'they’ll follow your suggestion even if it is dangerous.', '15': 'they’ll follow your suggestion even if it’s against their nature.'}"}, {"id": "skill-polearm", "reference": true, "referenceEntry": true, "title": "Polearm", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Reach Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage, and +1 Rank in the Zone of Control Skill.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and +1 Rank in the Zone of Control Skill.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 183 · PDF pages 185\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">POLEARM\nMelee Attack, Str\nRange: 10 feet\nLimitations: Requires two hands to wield.\nBase Damage: 1d8 + Str Piercing\nUPGRADES\nRank 5: +1d8 base damage\nRank 10: +1d8 base damage, and +1 Rank in the\nZone of Control Skill.\nRank 15: +1d8 base damage, and +1 Rank in the\nZone of Control Skill.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "polearm reach weapon skills polearm polearm attack_skill reach weapon skills melee attack, str strength false false false melee [] ['piercing'] 10 feet requires two hands to wield. 1d8 + str piercing {'5': '+1d8 base damage', '10': '+1d8 base damage, and +1 rank in the zone of control skill.', '15': '+1d8 base damage, and +1 rank in the zone of control skill.'}"}, {"id": "skill-powerful-strike", "reference": true, "referenceEntry": true, "title": "Powerful Strike", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Foot Soldier, Noggin Nocker, or Pugilism Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>30 hours\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Multiply your base damage dice result by your Rank in this Skill, then add your modifiers and buffs.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Foot Soldier, Noggin Nocker, or Pugilism\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-foot-soldier\">Foot Soldier\u003c/a> · \u003ca class=\"wl\" href=\"#skill-noggin-nocker\">Noggin Nocker\u003c/a> · \u003ca class=\"wl\" href=\"#skill-pugilism\">Pugilism\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The cooldown is 10 hours.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The cooldown is 5 hours.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The cooldown is 2 hours.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 180 · PDF pages 182\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">POWERFUL STRIKE\nFoot Soldier, Noggin Nocker, or Pugilism Damage Effect,\nPassive\nCooldown: 30 hours\nMultiply your base damage dice result by your Rank in\nthis Skill, then add your modifiers and buffs.\nUPGRADES\nRank 5: The cooldown is 10 hours.\nRank 10: The cooldown is 5 hours.\nRank 15: The cooldown is 2 hours.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "powerful strike hand-to-hand damage effect skills powerful-strike powerful strike attack_skill hand-to-hand damage effect skills foot soldier, noggin nocker, or pugilism damage effect, passive true false false foot soldier, noggin nocker, or pugilism [] [] 30 hours multiply your base damage dice result by your rank in this skill, then add your modifiers and buffs. {'5': 'the cooldown is 10 hours.', '10': 'the cooldown is 5 hours.', '15': 'the cooldown is 2 hours.'}"}, {"id": "skill-pugilism", "reference": true, "referenceEntry": true, "title": "Pugilism", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Combat Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp>\u003cem>Philistines call it punching.\u003c/em>\u003c/p>\u003cp class=\"source\">Melee Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d2 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>2 (only if no Damage Effect is used)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Choose the Dirty Fighting, Iron Punch, or Powerful Strike Damage Effect (if you wish) before rolling to hit.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+2d2 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d2 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d2 base damage, and you may make an extra free Attack with Disadvantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 179 · PDF pages 181\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">PUGILISM\nPhilistines call it punching.\nMelee Attack, Dex\nAI Favor: 2 (only if no Damage Effect is used)\nChoose the Dirty Fighting, Iron Punch, or Powerful\nStrike Damage Effect (if you wish) before rolling to hit.\nBase Damage: 1d2 + Str Bludgeoning\nUPGRADES\nRank 5: +2d2 base damage\nRank 10: +1d2 base damage\nRank 15: +1d2 base damage, and you may make an\nextra free Attack with Disadvantage.\u003c/pre>\u003c/details>", "backlinks": ["skill-dirty-fighting", "skill-iron-punch", "skill-powerful-strike", "skills"], "search": "pugilism hand-to-hand combat skills pugilism pugilism attack_skill hand-to-hand combat skills philistines call it punching. melee attack, dex dexterity false false false melee [] ['bludgeoning'] 2 (only if no damage effect is used) 1d2 + str bludgeoning choose the dirty fighting, iron punch, or powerful strike damage effect (if you wish) before rolling to hit. {'5': '+2d2 base damage', '10': '+1d2 base damage', '15': '+1d2 base damage, and you may make an extra free attack with disadvantage.'}"}, {"id": "skill-quarterstaff", "reference": true, "referenceEntry": true, "title": "Quarterstaff", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Reach Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and you gain a +1 Evade Buff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and you gain a +1 Evade Buff. For handling explosives, see Explosives Handling, Goblin Explosives, and Incendiary Device Handling in Utility Skills (below). These Skills will also be useful for crafting your own explosives once you have access to a Sapper’s Table on the Fourth Floor. As crawlers descend to lower floors, explosives become more complex than the Tutorial Floors’ “light and throw” variety. See the Area of Effect Attacks (p. 83) for targeting, Difficulties, and what happens when you miss your target with tossed explosives. Your explosives Skill is not used when attacking with a thrown explosive, but the GM should have you make an Unopposed handling Skill Check before throwing. Here are the explosives typically found on the first five floors. Lesser explosives can be found on lower floors, but the more powerful explosives are rarely seen on the upper floors. Floor 1: Standard Explosive—Dynamite: 1d6 Bludgeoning, 0ft Blast radius +5ft Splash. Floor 2: Goblin Explosive—Dynamite: 2d6 Bludgeoning damage, 5ft Blast radius + 5ft Splash. Floor 2: Incendiary Device—Carl’s Jug O’ Boom: 1d8 Fire damage, 5ft Blast radius + 15ft Splash. Anyone who loses at least 1 Health Bar slot gains the Burned Debuff. Floor 3: Goblin Explosive—Hob-Lobbers: 3d6 Piercing, +10ft Splash Floor 4: Standard Explosive—Demon Det Cord: 5d6 Bludgeoning, deals double damage to objects. Can only be applied to non-moving targets. Floor 5: Incendiary Device—Gnomish Knock-Knock: 4d6 Fire, 10ft Blast radius +10ft Splash, and anyone who fails to Evade gains the Burned Debuff. As this is a notoriously unstable fuel-air explosive, a Critical Fail is achieved on a Natural 1–4. Most explosives are custom made and not available on store shelves. Carl had his custom Jelly Bombs, Banger Spheres, Chum Bombs, and more. Smoke is used for concealment, distraction, and confusion. Attacking into or out of smoke is done with Disadvantage (see Mob Advantage and Disadvantage p. 60). Thrown smoke bombs are popular on most dungeon floors as a way to get out of trouble quick-ly. See the Throwing Skill (p. 200) for targeting, Difficulties, and what happens when you miss your target. You don’t need to make a Skill Check to drop it in your own space. Floor 1: Goblin Smoke Bomb: Creates a multicolor smoke cloud that reaches 30 feet in each direction from the point of impact, with a maximum duration of 3 minutes. However, even a slight breeze will dissipate it in 1 minute. Floor 3: Hobgoblin Smoke Curtain: Creates a dense white fog over a 60ft radius that holds even in a breeze. Floor 5: Hobgoblin Disco Ball: Created by infusing (see Infusion Skill, p. 194) an Invisibility potion onto a Hobgoblin Smoke Curtain. It produces thick multi-hued smoke plumes, along with some sick beats. It blinds everyone in the area, friend and foe alike. Utility Skills help crawlers survive, adapt, and solve problems that can’t be fixed by hitting them until they stop moving. Checks that are labeled as Unopposed can, at the GM’s discretion, become Opposed if something is actively working against you. For example, you’re trying to swim the rapids, and some dipshit is throwing fishing nets at you. Cut it out, Cletus! Or I’m gonna tell Mom on you!\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 183–184 · PDF pages 185–186\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">QUARTERSTAFF\nMelee Attack, Str\nRange: 10 feet\nLimitations: Requires two hands to wield.\nBase Damage: 1d6 + Str Bludgeoning\nUPGRADES\nRank 5: +1d6 base damage\nRank 10: +1d6 base damage, and you gain a +1\nEvade Buff.\nRank 15: +1d6 base damage, and you gain a +1\nEvade Buff.\nFor handling explosives, see Explosives Handling,\nGoblin Explosives, and Incendiary Device Handling in\nUtility Skills (below). These Skills will also be useful for\ncrafting your own explosives once you have access to\na Sapper’s Table on the Fourth Floor.\nAs crawlers descend to lower floors, explosives\nbecome more complex than the Tutorial Floors’\n“light and throw” variety. See the Area of Effect\nAttacks (p. 83) for targeting, Difficulties, and what\nhappens when you miss your target with tossed\nexplosives. Your explosives Skill is not used when\nattacking with a thrown explosive, but the GM\nshould have you make an Unopposed handling Skill\nCheck before throwing.\nHere are the explosives typically found on the first\nfive floors. Lesser explosives can be found on lower\nfloors, but the more powerful explosives are rarely\nseen on the upper floors.\nFloor 1: Standard Explosive—Dynamite: 1d6\nBludgeoning, 0ft Blast radius +5ft Splash.\nFloor 2: Goblin Explosive—Dynamite: 2d6\nBludgeoning damage, 5ft Blast radius + 5ft Splash.\nFloor 2: Incendiary Device—Carl’s Jug O’ Boom: 1d8\nFire damage, 5ft Blast radius + 15ft Splash. Anyone who\nloses at least 1 Health Bar slot gains the Burned Debuff.\nFloor 3: Goblin Explosive—Hob-Lobbers: 3d6\nPiercing, +10ft Splash\nFloor 4: Standard Explosive—Demon Det Cord: 5d6\nBludgeoning, deals double damage to objects. Can\nonly be applied to non-moving targets.\nFloor 5: Incendiary Device—Gnomish Knock-Knock:\n4d6 Fire, 10ft Blast radius +10ft Splash, and anyone\nwho fails to Evade gains the Burned Debuff. As this is\na notoriously unstable fuel-air explosive, a Critical Fail\nis achieved on a Natural 1–4.\nMost explosives are custom made and not available\non store shelves. Carl had his custom Jelly Bombs,\nBanger Spheres, Chum Bombs, and more.\nSmoke is used for concealment, distraction, and\nconfusion. Attacking into or out of smoke is done\nwith Disadvantage (see Mob Advantage and\nDisadvantage p. 60).\nThrown smoke bombs are popular on most\ndungeon floors as a way to get out of trouble quick-\nly. See the Throwing Skill (p. 200) for targeting,\nDifficulties, and what happens when you miss your\ntarget. You don’t need to make a Skill Check to drop it\nin your own space.\nFloor 1: Goblin Smoke Bomb: Creates a multicolor\nsmoke cloud that reaches 30 feet in each direction\nfrom the point of impact, with a maximum duration of\n3 minutes. However, even a slight breeze will dissipate\nit in 1 minute.\nFloor 3: Hobgoblin Smoke Curtain: Creates a dense\nwhite fog over a 60ft radius that holds even in a breeze.\nFloor 5: Hobgoblin Disco Ball: Created by infusing\n(see Infusion Skill, p. 194) an Invisibility potion onto\na Hobgoblin Smoke Curtain. It produces thick multi-\nhued smoke plumes, along with some sick beats. It\nblinds everyone in the area, friend and foe alike.\nUtility Skills help crawlers survive, adapt, and solve\nproblems that can’t be fixed by hitting them until they\nstop moving.\nChecks that are labeled as Unopposed can, at the\nGM’s discretion, become Opposed if something is\nactively working against you. For example, you’re\ntrying to swim the rapids, and some dipshit is throwing\nfishing nets at you. Cut it out, Cletus! Or I’m gonna tell\nMom on you!\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "quarterstaff reach weapon skills quarterstaff quarterstaff attack_skill reach weapon skills melee attack, str strength false false false melee [] ['bludgeoning'] 10 feet requires two hands to wield. 1d6 + str bludgeoning {'5': '+1d6 base damage', '10': '+1d6 base damage, and you gain a +1 evade buff.', '15': '+1d6 base damage, and you gain a +1 evade buff. for handling explosives, see explosives handling, goblin explosives, and incendiary device handling in utility skills (below). these skills will also be useful for crafting your own explosives once you have access to a sapper’s table on the fourth floor. as crawlers descend to lower floors, explosives become more complex than the tutorial floors’ “light and throw” variety. see the area of effect attacks (p. 83) for targeting, difficulties, and what happens when you miss your target with tossed explosives. your explosives skill is not used when attacking with a thrown explosive, but the gm should have you make an unopposed handling skill check before throwing. here are the explosives typically found on the first five floors. lesser explosives can be found on lower floors, but the more powerful explosives are rarely seen on the upper floors. floor 1: standard explosive—dynamite: 1d6 bludgeoning, 0ft blast radius +5ft splash. floor 2: goblin explosive—dynamite: 2d6 bludgeoning damage, 5ft blast radius + 5ft splash. floor 2: incendiary device—carl’s jug o’ boom: 1d8 fire damage, 5ft blast radius + 15ft splash. anyone who loses at least 1 health bar slot gains the burned debuff. floor 3: goblin explosive—hob-lobbers: 3d6 piercing, +10ft splash floor 4: standard explosive—demon det cord: 5d6 bludgeoning, deals double damage to objects. can only be applied to non-moving targets. floor 5: incendiary device—gnomish knock-knock: 4d6 fire, 10ft blast radius +10ft splash, and anyone who fails to evade gains the burned debuff. as this is a notoriously unstable fuel-air explosive, a critical fail is achieved on a natural 1–4. most explosives are custom made and not available on store shelves. carl had his custom jelly bombs, banger spheres, chum bombs, and more. smoke is used for concealment, distraction, and confusion. attacking into or out of smoke is done with disadvantage (see mob advantage and disadvantage p. 60). thrown smoke bombs are popular on most dungeon floors as a way to get out of trouble quick-ly. see the throwing skill (p. 200) for targeting, difficulties, and what happens when you miss your target. you don’t need to make a skill check to drop it in your own space. floor 1: goblin smoke bomb: creates a multicolor smoke cloud that reaches 30 feet in each direction from the point of impact, with a maximum duration of 3 minutes. however, even a slight breeze will dissipate it in 1 minute. floor 3: hobgoblin smoke curtain: creates a dense white fog over a 60ft radius that holds even in a breeze. floor 5: hobgoblin disco ball: created by infusing (see infusion skill, p. 194) an invisibility potion onto a hobgoblin smoke curtain. it produces thick multi-hued smoke plumes, along with some sick beats. it blinds everyone in the area, friend and foe alike. utility skills help crawlers survive, adapt, and solve problems that can’t be fixed by hitting them until they stop moving. checks that are labeled as unopposed can, at the gm’s discretion, become opposed if something is actively working against you. for example, you’re trying to swim the rapids, and some dipshit is throwing fishing nets at you. cut it out, cletus! or i’m gonna tell mom on you!'}"}, {"id": "skill-rapier", "reference": true, "referenceEntry": true, "title": "Rapier", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Edged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Dex Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and you gain a +1 Evade Buff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and you gain a +1 Evade Buff. When attacking with a hand-to-hand Attack Skill that has a description stating you can choose a Damage Effect, choose one available Damage Effect before you make the Attack Skill Check. If the Attack hits, first roll the base damage dice and then apply the chosen Damage Effect. If you choose not to use a Damage Effect for a majority of your hand-to-hand attacks during a combat that lasts for at least three rounds, you gain the amount of AI Favor listed in the Skill’s entry.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178–179 · PDF pages 180–181\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">RAPIER\nMelee Attack, Dex\nBase Damage: 1d6 + Dex Piercing\nUPGRADES\nRank 5: +1d6 base damage\nRank 10: +1d6 base damage, and you gain a +1\nEvade Buff.\nRank 15: +1d6 base damage, and you gain a +1\nEvade Buff.\nWhen attacking with a hand-to-hand Attack Skill that\nhas a description stating you can choose a Damage\nEffect, choose one available Damage Effect before\nyou make the Attack Skill Check. If the Attack hits,\nfirst roll the base damage dice and then apply the\nchosen Damage Effect.\nIf you choose not to use a Damage Effect for\na majority of your hand-to-hand attacks during a\ncombat that lasts for at least three rounds, you gain\nthe amount of AI Favor listed in the Skill’s entry.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "rapier edged weapon skills rapier rapier attack_skill edged weapon skills melee attack, dex dexterity false false false melee [] ['piercing'] 1d6 + dex piercing {'5': '+1d6 base damage', '10': '+1d6 base damage, and you gain a +1 evade buff.', '15': '+1d6 base damage, and you gain a +1 evade buff. when attacking with a hand-to-hand attack skill that has a description stating you can choose a damage effect, choose one available damage effect before you make the attack skill check. if the attack hits, first roll the base damage dice and then apply the chosen damage effect. if you choose not to use a damage effect for a majority of your hand-to-hand attacks during a combat that lasts for at least three rounds, you gain the amount of ai favor listed in the skill’s entry.'}"}, {"id": "skill-regeneration", "reference": true, "referenceEntry": true, "title": "Regeneration", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>If your Rank in this Skill is equal to or greater than your Con, you heal 1 Health Bar slot at the start of each round (or every 10 seconds outside of combat). If not, you heal 1 Health Bar slot every other round (or every 20 seconds outside of combat).\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>After 5 minutes, any Minor Injury Debuff you suffer from ends. After 10 minutes, any Major Injury Debuff you suffer from ends.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>After 20 minutes, any Long-Term Minor Injury Debuff you suffer from ends. After 1 hour, any Long-Term Major Injury Debuff you suffer from ends.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The time required to end injury Debuffs is halved.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 196–197 · PDF pages 198–199\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">REGENERATION\nPassive\nIf your Rank in this Skill is equal to or greater than your\nCon, you heal 1 Health Bar slot at the start of each\nround (or every 10 seconds outside of combat). If not,\nyou heal 1 Health Bar slot every other round (or every\n20 seconds outside of combat).\nUPGRADES\nRank 5: After 5 minutes, any Minor Injury Debuff you\nsuffer from ends. After 10 minutes, any Major Injury\nDebuff you suffer from ends.\nRank 10: After 20 minutes, any Long-Term Minor\nInjury Debuff you suffer from ends. After 1 hour, any\nLong-Term Major Injury Debuff you suffer from ends.\nRank 15: The time required to end injury Debuffs is\nhalved.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "regeneration utility skills regeneration regeneration utility_skill passive true false false [] [] if your rank in this skill is equal to or greater than your con, you heal 1 health bar slot at the start of each round (or ever
