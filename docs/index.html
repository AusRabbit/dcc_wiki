<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Crawler Carl</title>
<meta name="description" content="Dungeon Crawler Carl — session recaps, floors and a cross-linked cast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
  .nav-toggle{display:none}
  @media(max-width:820px){
    .nav-toggle{display:block;margin:0 20px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer}
    .nav:not(.expanded){display:none}
    .nav.expanded{max-height:40vh;overflow-y:auto}
  }

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .tag.t-floor{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-crawler,.tag.t-npc,.tag.t-rival{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-mob{background:var(--rust-soft); color:var(--rust); border-color:transparent}

  .st-good,.st-bad,.st-warn{font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; padding:1px 6px; border-radius:3px; margin-left:6px; white-space:nowrap}
  .st-good{background:var(--teal-soft); color:var(--teal)}
  .st-bad{background:var(--rust-soft); color:var(--rust)}
  .st-warn{background:var(--amber-soft); color:var(--amber)}

  .axis-grp{margin:0 0 16px}
  .axis-grp .ph{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:5px}
  .axis-grp ul{list-style:none; margin:0; padding:0}
  .axis-grp li{margin-bottom:4px; font-size:15px}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
  main{width:100%}
  .source{color:var(--muted);font-size:14px}
  .reference-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:9px}
  .reference-controls label{font-size:13px;color:var(--muted)}
  .reference-controls label:first-child{grid-column:1/-1}
  .reference-controls input,.reference-controls select,.reference-controls button{display:block;width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink)}
  .reference-controls button{align-self:end;cursor:pointer}
  .reference-controls :focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .reference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .reference-card{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:16px;overflow-wrap:anywhere}
  .reference-card h2{font-size:20px;margin:0 0 8px;border:0;padding:0}
  .reference-card p:last-child{margin-bottom:0}
  .reference-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:20px 0}
  .reference-facts div{background:var(--surface);padding:12px}
  .reference-facts dt{font-size:12px;color:var(--muted)}
  .reference-facts dd{margin:3px 0 0;overflow-wrap:anywhere}
  .rank-upgrades h3{color:var(--teal);font-size:18px;margin-bottom:8px}
  .reference-table{width:100%;border-collapse:collapse;margin-bottom:20px;text-align:left}
  .reference-table th,.reference-table td{padding:8px 12px;border-bottom:1px solid var(--line)}
  .raw-reference{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}
  details{margin:16px 0}summary{cursor:pointer;color:var(--teal)}
  [hidden]{display:none!important}
  @media(max-width:520px){.reference-grid,.reference-facts,.reference-controls{grid-template-columns:minmax(0,1fr)}}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "session-00", "reference": false, "referenceEntry": false, "title": "Session 00", "group": "Sessions", "type": "doc", "typeLabel": "Session", "dek": "Noosa, 9pm. The world flattens. Two strangers go down the stairs.", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> was on the beach at Noosa with a beer and a sawn-off shotgun down his pants. \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> was there to clear his head about dropping out of university. Neither knew the other. At 9pm the world flattened.\u003c/p>\u003ch2>The Flattening\u003c/h2>\u003cp>A rush of dust came off the ruined boulevard and onto the sand. The couple who had been canoodling under a beach awning a minute earlier rolled onto the beach as a pair of bodiless legs. Then the text appeared in front of every surviving face, in a language nobody had learned but everybody could read: the planet had been seized under \u003ca class=\"wl\" href=\"#the-syndicate\">The Syndicate\u003c/a>'s precious elemental reserves code, and \u003ca class=\"wl\" href=\"#borant-corporation\">The Borant Corporation\u003c/a>, assigned regency, had chosen option three — \u003ca class=\"wl\" href=\"#the-world-dungeon\">The World Dungeon\u003c/a>, eighteen levels deep.\u003c/p>\u003ch2>Two Strangers and a Light\u003c/h2>\u003cp>The pair met over a beer and a blueberry-ice vape, discovered a shared broken-family history and some shared politics, and set off down the beach towards the only light left standing. Hundreds of people were screaming in the dark. The light never seemed to get closer.\u003c/p>\u003ch2>The Stair Bully\u003c/h2>\u003cp>What they found at \u003ca class=\"wl\" href=\"#the-stairwell\">The Stairwell\u003c/a> was \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> at the top of the steps with a nailed two-by-four, standing over bodies and a small cache of stolen goods, charging admission to the end of the world. He had just pulled the timber out of the back of a woman's skull — \u003ca class=\"wl\" href=\"#cheryl\">Cheryl\u003c/a>, as it turned out — and he grabbed her cousin \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> as a hostage when the pair approached.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> threw a beer can at his head and tried to trade him a truck full of supplies. \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> called the party's first play — \u003ca class=\"wl\" href=\"#call-a-play\">the Looky-loo\u003c/a> — and went round his blind side with a club. It went less cleanly than either intended: \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> grabbed at the shotgun in the scrum, the gun jammed at point-blank range, and with under a minute before the stairwell sealed the whole tangle went down the stairs in a heap.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> arrived at the bottom with his neck at an ungodly angle.\u003c/p>\u003ch2>Floor One\u003c/h2>\u003cp>Through an ornate set of doors worked with something demonic and aquatic, a booming voice welcomed the crawlers to \u003ca class=\"wl\" href=\"#floor-01\">Floor 1\u003c/a>. Green lichen, endless junctions, and children's laughter coming from ahead and behind at once. Twice they glimpsed \u003ca class=\"wl\" href=\"#the-white-dress-girls\">The Girls in White Dresses\u003c/a> standing in the middle distance, gone when looked at properly.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> spent half an hour patting the walls looking for a door. Then the rumbling started, and \u003ca class=\"wl\" href=\"#the-wall-of-blood\">The Wall of Blood\u003c/a> came round the corner like a red avalanche. \u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> climbed the wall, hung off a brazier and held \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> over one shoulder. \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> tried to surf it and got slammed into a wall.\u003c/p>\u003cp>Drenched and coughing, they rounded the corner, found a door marked \u003cem>Tutorial Guild\u003c/em>, and fell through it into \u003ca class=\"wl\" href=\"#tutorial-guild\">The Tutorial Guild\u003c/a> — incense, yoga mats, body odour, and a bat-like creature unfolding from the ceiling to introduce herself as \u003ca class=\"wl\" href=\"#mauritius\">Mauritius\u003c/a>.\u003c/p>\u003cp>Session ends there, on a short rest and a full heal.\u003c/p>", "backlinks": [], "search": "session 00 noosa, 9pm. the world flattens. two strangers go down the stairs. "}, {"id": "pre-collapse", "reference": false, "referenceEntry": false, "title": "Pre-Collapse", "group": "Floors", "type": "floor", "typeLabel": "Floor", "dek": "Earth, before. Ordinary lives, about to stop being ordinary.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "Pre-Collapse", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Everything before 9pm. For this party it is one Queensland beach town and two people with nothing much going on — a long-haul trucker passing through, and a burnt-out hospitality worker up for the weekend.\u003c/p>\u003ch2>On this floor\u003c/h2>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Places\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#noosa\">Noosa\u003c/a>\u003c/li>\u003c/ul>\u003c/div>", "backlinks": [], "search": "pre-collapse earth, before. ordinary lives, about to stop being ordinary. "}, {"id": "surface", "reference": false, "referenceEntry": false, "title": "The Surface", "group": "Floors", "type": "floor", "typeLabel": "Floor", "dek": "After the flattening, before the descent. Roughly one hour.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "Surface", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>The hour between the collapse and the stairwells sealing. Buildings gone, the interior of the world crushed, hundreds of injured and dead on the sand at Noosa, and a single ethereal light at the far end of the strip marking the way down.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#borant-corporation\">The Borant Corporation\u003c/a>'s announcement gave everyone the same choice and the same deadline. Most people ran the other way, towards homes and families that no longer existed.\u003c/p>\u003ch2>On this floor\u003c/h2>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">NPCs & Guides\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#cheryl\">Cheryl\u003c/a> \u003cspan class=\"st-bad\">Dead\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Bestiary\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> \u003cspan class=\"st-bad\">Dead\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Places\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#the-stairwell\">The Stairwell\u003c/a>\u003c/li>\u003c/ul>\u003c/div>", "backlinks": [], "search": "the surface after the flattening, before the descent. roughly one hour. "}, {"id": "floor-01", "reference": false, "referenceEntry": false, "title": "Floor 1", "group": "Floors", "type": "floor", "typeLabel": "Floor", "dek": "Lichen-lit tunnels. Junctions that lead to more junctions.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Stone corridors lined with green lichen that gives off just enough light to see by. Every intersection leads to another intersection. The party arrived soaked in blood within their first hour.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#borant-corporation\">The Borant Corporation\u003c/a>'s entry announcement recommends immediately finding and using a tutorial guild — advice that is easier given than followed when every corridor looks like the last one.\u003c/p>\u003ch2>On this floor\u003c/h2>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Crawlers\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> \u003cspan class=\"st-good\">Active\u003c/span>\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> \u003cspan class=\"st-good\">Active\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">NPCs & Guides\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#mauritius\">Mauritius\u003c/a> \u003cspan class=\"st-good\">Active\u003c/span>\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> \u003cspan class=\"st-good\">Active\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Bestiary\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#the-white-dress-girls\">The Girls in White Dresses\u003c/a> \u003cspan class=\"st-good\">Active\u003c/span>\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#the-wall-of-blood\">The Wall of Blood\u003c/a> \u003cspan class=\"st-good\">Active\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Places\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#tutorial-guild\">The Tutorial Guild\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"axis-grp\">\u003cdiv class=\"ph\">Loot & Gear\u003c/div>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#nailed-two-by-four\">Nailed Two-by-Four\u003c/a>\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#oddments\">Oddments\u003c/a>\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#paddle-club\">Paddle Club\u003c/a>\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#sawn-off-shotgun\">Sawn-off Shotgun\u003c/a>\u003c/li>\u003c/ul>\u003c/div>", "backlinks": ["session-00", "the-stairwell", "the-world-dungeon"], "search": "floor 1 lichen-lit tunnels. junctions that lead to more junctions. "}, {"id": "darcy-smith", "reference": false, "referenceEntry": false, "title": "Darcy Smith", "group": "Crawlers", "type": "crawler", "typeLabel": "Crawler", "dek": "Long-haul trucker. Sawn-off shotgun. No loved ones.", "conf": "hi", "confLabel": "Confirmed", "player": "aussiebapps7569", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>American, driving through Noosa, stopped for a few bevvies and a rest before getting back on the lonely road. Was on the beach with a beer when the world ended, and had a \u003ca class=\"wl\" href=\"#sawn-off-shotgun\">Sawn-off Shotgun\u003c/a> stitched into his pants line, which nobody has satisfactorily explained.\u003c/p>\u003cp>Charismatic and quick, and not at all clever — dexterity six, charisma five, strength four, constitution three, intelligence two, and openly uninterested in magic. Talked \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> into nearly walking away from the stairs by offering him a truck full of beer, water, food and a full tank.\u003c/p>\u003cp>Carries a Bible and a set of jumper cables as his oddments. Named \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> \"Big Tits McGee\" within a minute of meeting her and has not stopped.\u003c/p>", "backlinks": ["call-a-play", "frank-doyle", "michelle", "oddments", "sawn-off-shotgun", "session-00", "the-wall-of-blood"], "search": "darcy smith long-haul trucker. sawn-off shotgun. no loved ones. "}, {"id": "frank-doyle", "reference": false, "referenceEntry": false, "title": "Frank Doyle", "group": "Crawlers", "type": "crawler", "typeLabel": "Crawler", "dek": "Hospitality burnout and uni dropout. Treats this as his isekai moment.", "conf": "hi", "confLabel": "Confirmed", "player": "gy0410", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "1", "axisLabel": "Floor", "aliases": ["Frankie", "Frankie Doyle", "The Unpaid Intern of the Dungeon", "UIOTD"], "html": "\u003cp>Came up to Noosa for the weekend to clear his head about dropping out of university and whether to go back. Decided within about ninety seconds of the apocalypse that he had been gaming his whole life for this exact moment.\u003c/p>\u003cp>Smarter than his companion and considerably weaker — intelligence plus three, evade plus two, and a strength score he describes as \"not that strong\". Fights with a \u003ca class=\"wl\" href=\"#paddle-club\">Paddle Club\u003c/a>, and looted \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a>'s \u003ca class=\"wl\" href=\"#nailed-two-by-four\">Nailed Two-by-Four\u003c/a> on the way down the stairs.\u003c/p>\u003cp>Carries a blueberry-ice vape and a water bottle. Called the party's first play and has been calling them since.\u003c/p>\u003cdiv class=\"panel note\">\u003cdiv class=\"ph\">He renamed himself mid-session\u003c/div>\u003cp>Started the night as \u003cem>The Unpaid Intern of the Dungeon\u003c/em>, asked for a do-over, and took the name Frank Doyle on the beach while introducing himself to \u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a>.\u003c/p>\u003c/div>", "backlinks": ["call-a-play", "nailed-two-by-four", "oddments", "paddle-club", "session-00", "the-wall-of-blood"], "search": "frank doyle frankie frankie doyle the unpaid intern of the dungeon uiotd hospitality burnout and uni dropout. treats this as his isekai moment. "}, {"id": "cheryl", "reference": false, "referenceEntry": false, "title": "Cheryl", "group": "NPCs & Guides", "type": "npc", "typeLabel": "NPC", "dek": "Michelle's cousin. Killed at the stairwell.", "conf": "mid", "confLabel": "Needs review", "player": "", "status": "dead", "statusLabel": "Dead", "statusTone": "bad", "axis": "Surface", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Out for an evening swim with \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> when the collapse happened. \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> hit her in the back of the head with a \u003ca class=\"wl\" href=\"#nailed-two-by-four\">Nailed Two-by-Four\u003c/a> at the top of the stairs. She was dead on the ground before the party arrived, and \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> was still asking after her on Floor 1.\u003c/p>", "backlinks": ["dale-prosky", "michelle", "nailed-two-by-four", "session-00"], "search": "cheryl michelle's cousin. killed at the stairwell. "}, {"id": "mauritius", "reference": false, "referenceEntry": false, "title": "Mauritius", "group": "NPCs & Guides", "type": "npc", "typeLabel": "NPC", "dek": "Tutorial guide. Bat-like. Hangs from the ceiling.", "conf": "lo", "confLabel": "Low confidence", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Unfolded from the roof of \u003ca class=\"wl\" href=\"#tutorial-guild\">The Tutorial Guild\u003c/a>, landed gracefully, and introduced herself as the party's tutorial guide. Walked them through the mundanity of the game — characters, party tab, health, the interface.\u003c/p>\u003cdiv class=\"panel note warn\">\u003cdiv class=\"ph\">Name unconfirmed\u003c/div>\u003cp>Recovered from a single spoken line and never spelled out. Correct this before it becomes canon.\u003c/p>\u003c/div>", "backlinks": ["session-00", "tutorial-guild"], "search": "mauritius tutorial guide. bat-like. hangs from the ceiling. "}, {"id": "michelle", "reference": false, "referenceEntry": false, "title": "Michelle", "group": "NPCs & Guides", "type": "npc", "typeLabel": "NPC", "dek": "Rescued at the stairwell. Travelling with the party, under protest.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "1", "axisLabel": "Floor", "aliases": ["Big Tits McGee", "BTM", "BTJ", "Big T McGee"], "html": "\u003cp>Was out for an evening dip with her cousin \u003ca class=\"wl\" href=\"#cheryl\">Cheryl\u003c/a> when the world flattened. Still in her bathers. \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> took her hostage in front of the stairs with a hand around her neck, and she was still in the middle of the fight when it went down the stairs — she grabbed at the \u003ca class=\"wl\" href=\"#sawn-off-shotgun\">Sawn-off Shotgun\u003c/a> mid-scrum and nearly got herself shot.\u003c/p>\u003cp>She came down with the party because she did not want to be alone, and because the two of them were not the most frightening thing she had met that night. She has since been given a club and told to defend herself, and has thought seriously about using it on \u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> instead.\u003c/p>\u003cp>Not a player character. Played, in the GM's words, loosey-goosey.\u003c/p>\u003cdiv class=\"panel note\">\u003cdiv class=\"ph\">One person, four names\u003c/div>\u003cp>She corrected the party — my name is Michelle, not Big Tits McGee — and was immediately renamed BTJ instead. Every variant is listed above so they all resolve here.\u003c/p>\u003c/div>", "backlinks": ["cheryl", "dale-prosky", "darcy-smith", "paddle-club", "session-00", "the-wall-of-blood"], "search": "michelle big tits mcgee btm btj big t mcgee rescued at the stairwell. travelling with the party, under protest. "}, {"id": "borant-corporation", "reference": false, "referenceEntry": false, "title": "The Borant Corporation", "group": "The Production", "type": "production", "typeLabel": "Production", "dek": "Assigned planetary regent. Chose option three.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "", "axisLabel": "Floor", "aliases": ["Borent Corporation", "Borant"], "html": "\u003cp>Granted regency over the solar system by \u003ca class=\"wl\" href=\"#the-syndicate\">The Syndicate\u003c/a> after humanity failed to file a proper appeal for its own mineral and elemental rights within fifty solars of first contact. Having crushed the interior of the world and begun mining it, Borant was entitled to choose the manner in which surviving humans could reclaim their lost matter.\u003c/p>\u003cp>It chose option three: \u003ca class=\"wl\" href=\"#the-world-dungeon\">The World Dungeon\u003c/a>.\u003c/p>\u003cp>Its announcements arrive as floating text in front of your face, in letters that crawl downward rather than across, in a language you have never learned and can read perfectly.\u003c/p>", "backlinks": ["floor-01", "session-00", "surface", "the-syndicate", "the-world-dungeon"], "search": "the borant corporation borent corporation borant assigned planetary regent. chose option three. "}, {"id": "the-syndicate", "reference": false, "referenceEntry": false, "title": "The Syndicate", "group": "The Production", "type": "production", "typeLabel": "Production", "dek": "Wrote the rules Earth was seized under.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>The authority whose subsection 543 of the precious elemental reserves code permitted the seizure of the planet, and whose indigenous planetary species protection act obliges \u003ca class=\"wl\" href=\"#borant-corporation\">The Borant Corporation\u003c/a> to offer survivors a way to reclaim what was taken.\u003c/p>\u003cp>Named once, in the announcement. Nothing else is known yet.\u003c/p>", "backlinks": ["session-00", "borant-corporation"], "search": "the syndicate wrote the rules earth was seized under. "}, {"id": "dale-prosky", "reference": false, "referenceEntry": false, "title": "Dale Prosky", "group": "Bestiary", "type": "mob", "typeLabel": "Bestiary", "dek": "The warm-up act. Charged admission to the end of the world.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "dead", "statusLabel": "Dead", "statusTone": "bad", "axis": "Surface", "axisLabel": "Floor", "aliases": ["Drunk Dickwad Stair Bully", "the stair bully"], "html": "\u003cp>Twenty minutes after his species received formal notice of its own extinction, Dale found a staircase, stood in front of it, and began charging admission. He did not own the staircase. He did not own anything. He did own a two-foot length of timber with nails through it, and he stood between the survivors of a dead world and their only way out.\u003c/p>\u003cp>In Dale's mind this was a completely functional and logical road for his life.\u003c/p>\u003cp>Visibly under the influence, freakishly strong for it, and erratic. Killed \u003ca class=\"wl\" href=\"#cheryl\">Cheryl\u003c/a> and at least one other before the party arrived, then took \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> hostage. Took a point-blank shotgun shot that missed, several club hits, and a beer can to the head.\u003c/p>\u003cp>Died on the way down \u003ca class=\"wl\" href=\"#the-stairwell\">The Stairwell\u003c/a>, underneath the scrum, with his neck at an ungodly angle.\u003c/p>\u003cdiv class=\"panel note\">\u003cdiv class=\"ph\">Roughly four billion of your neighbours died in the collapse\u003c/div>\u003cp>And this is the one your planet chose to save. The GM's introduction, delivered as a broadcast warm-up act — the first sign that the show is watching.\u003c/p>\u003c/div>", "backlinks": ["cheryl", "darcy-smith", "frank-doyle", "michelle", "nailed-two-by-four", "sawn-off-shotgun", "session-00", "the-stairwell"], "search": "dale prosky drunk dickwad stair bully the stair bully the warm-up act. charged admission to the end of the world. "}, {"id": "the-white-dress-girls", "reference": false, "referenceEntry": false, "title": "The Girls in White Dresses", "group": "Bestiary", "type": "mob", "typeLabel": "Bestiary", "dek": "Two of them. Green-skinned. Laughing.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>First heard as children's laughter coming from ahead and behind at the same time. Twice glimpsed in the middle distance as two figures in white, side by side, gone on a second look.\u003c/p>\u003cp>Seen properly after \u003ca class=\"wl\" href=\"#the-wall-of-blood\">The Wall of Blood\u003c/a>: two green-skinned girls in pristine white dresses, walking forward in perfect unison, spotless in a corridor running with blood. The laughter does not match the serious look on their faces.\u003c/p>\u003cp>The party ran.\u003c/p>", "backlinks": ["session-00"], "search": "the girls in white dresses two of them. green-skinned. laughing. "}, {"id": "the-wall-of-blood", "reference": false, "referenceEntry": false, "title": "The Wall of Blood", "group": "Bestiary", "type": "mob", "typeLabel": "Bestiary", "dek": "A red avalanche that fills the corridor. Comes and goes.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Announced by a rumbling in the floor, then thirty feet of blood filling the corridor wall to wall at a great rate of knots, stripping lichen off the stone as it goes.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> rolled a natural twenty, climbed the wall, caught hold of a brazier and held on with \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> over his shoulder. \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> tried to surf it, ate a wall, and came out coughing thick mucusy blood.\u003c/p>\u003cp>It subsides on its own. The GM was clear that it comes and goes.\u003c/p>", "backlinks": ["session-00", "the-white-dress-girls"], "search": "the wall of blood a red avalanche that fills the corridor. comes and goes. "}, {"id": "noosa", "reference": false, "referenceEntry": false, "title": "Noosa", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Queensland beach town. Lovely all year round.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "Pre-Collapse", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Where both crawlers happened to be at 9pm. A beach, a boulevard strip worth going to, and a warm evening — none of which survived the flattening. Everything that lined the boulevard and made it worth visiting is gone.\u003c/p>", "backlinks": [], "search": "noosa queensland beach town. lovely all year round. "}, {"id": "the-stairwell", "reference": false, "referenceEntry": false, "title": "The Stairwell", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "The way down. Glowed. Guarded.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "Surface", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>The light at the far end of the strip, visible from the beach and further away than it looked. Tens of people gathered near it in the dark, and a small heap of bodies lay at its foot courtesy of \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a>.\u003c/p>\u003cp>Below it, a short corridor ending in a ginormous ornate set of doors worked in metallic relief with something that could be described as demonic, or possibly aquatic. The doorway crashed closed behind the party as they crossed into \u003ca class=\"wl\" href=\"#floor-01\">Floor 1\u003c/a>.\u003c/p>", "backlinks": ["call-a-play", "dale-prosky", "nailed-two-by-four", "session-00"], "search": "the stairwell the way down. glowed. guarded. "}, {"id": "tutorial-guild", "reference": false, "referenceEntry": false, "title": "The Tutorial Guild", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Bead curtains, yoga mats, incense, body odour.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>A door found round a corner at a dead run, marked with words to the effect of \u003cem>Tutorial Guild\u003c/em>. Inside, something between a health retreat and a share-house lounge room: bead curtains, yoga mats spread about, incense candles burning, and a powerful smell of body odour.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#mauritius\">Mauritius\u003c/a> was hanging from the ceiling. Safe enough for a short rest and a full heal.\u003c/p>", "backlinks": ["mauritius", "session-00"], "search": "the tutorial guild bead curtains, yoga mats, incense, body odour. "}, {"id": "nailed-two-by-four", "reference": false, "referenceEntry": false, "title": "Nailed Two-by-Four", "group": "Loot & Gear", "type": "item", "typeLabel": "Item", "dek": "Dale's. Looted off his body. 1d8+3 in his hands.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "1", "axisLabel": "Floor", "aliases": ["2b4", "two before"], "html": "\u003cp>Two feet of timber with gnarly bits of nail sticking out of it. Killed \u003ca class=\"wl\" href=\"#cheryl\">Cheryl\u003c/a> and at least one other person, and opened \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a>'s neck for eight damage on the first swing of the campaign.\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> picked it up off \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a>'s body at the bottom of \u003ca class=\"wl\" href=\"#the-stairwell\">The Stairwell\u003c/a>.\u003c/p>", "backlinks": ["cheryl", "frank-doyle"], "search": "nailed two-by-four 2b4 two before dale's. looted off his body. 1d8+3 in his hands. "}, {"id": "oddments", "reference": false, "referenceEntry": false, "title": "Oddments", "group": "Loot & Gear", "type": "item", "typeLabel": "Item", "dek": "What each crawler happened to have on them.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Everything the party brought into the dungeon by accident rather than design.\u003c/p>\u003cul>\u003cli>\u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> — a Bible, and a set of jumper cables.\u003c/li>\u003cli>\u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> — a blueberry-ice vape, and a water bottle.\u003c/li>\u003c/ul>\u003cp>The vape has already been shared twice and constitutes most of the party's diplomacy to date.\u003c/p>", "backlinks": [], "search": "oddments what each crawler happened to have on them. "}, {"id": "paddle-club", "reference": false, "referenceEntry": false, "title": "Paddle Club", "group": "Loot & Gear", "type": "item", "typeLabel": "Item", "dek": "Frank's. 1d6+1 bludgeoning.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a>'s starting weapon. Handed to \u003ca class=\"wl\" href=\"#michelle\">Michelle\u003c/a> on Floor 1 with the instruction to defend herself at all times, which she is considering doing in an unintended direction.\u003c/p>", "backlinks": ["frank-doyle"], "search": "paddle club frank's. 1d6+1 bludgeoning. "}, {"id": "sawn-off-shotgun", "reference": false, "referenceEntry": false, "title": "Sawn-off Shotgun", "group": "Loot & Gear", "type": "item", "typeLabel": "Item", "dek": "Darcy's. 1d10 piercing, two hands. Jams.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "1", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Range 20 to 30 feet, two hands to wield, 1d10 piercing. Was stitched into \u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a>'s pants line on an Australian beach, which the GM noted is not a thing you find on an Australian beach.\u003c/p>\u003cp>Jammed at point-blank range against \u003ca class=\"wl\" href=\"#dale-prosky\">Dale Prosky\u003c/a> at the worst possible moment — the GM's ruling being that the weapon had been down a trucker's trousers for an unknown length of time and the maintenance had not been smart.\u003c/p>", "backlinks": ["darcy-smith", "michelle"], "search": "sawn-off shotgun darcy's. 1d10 piercing, two hands. jams. "}, {"id": "the-world-dungeon", "reference": false, "referenceEntry": false, "title": "The World Dungeon", "group": "Quests & Achievements", "type": "quest", "typeLabel": "Quest", "dek": "Eighteen levels. Go down. Save the world.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "active", "statusLabel": "Active", "statusTone": "good", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#borant-corporation\">The Borant Corporation\u003c/a>'s chosen method of letting surviving humans reclaim their lost matter, and the show built on top of it. Within one hour of the announcement you either entered or you didn't.\u003c/p>\u003cp>Eighteen levels down. The party is on \u003ca class=\"wl\" href=\"#floor-01\">Floor 1\u003c/a>.\u003c/p>\u003cp>\u003cem>Achievements and loot boxes are earned in safe rooms. The GM intends to hand them out between sessions rather than interrupt play, so expect them to arrive by Discord as text and then as loot boxes at the table.\u003c/em>\u003c/p>", "backlinks": ["session-00", "borant-corporation"], "search": "the world dungeon eighteen levels. go down. save the world. "}, {"id": "call-a-play", "reference": false, "referenceEntry": false, "title": "Call a Play", "group": "Game Guide", "type": "rule", "typeLabel": "Game Guide", "dek": "Name it once. Roll 2d6, keep the highest, add it to your mate's roll.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Spend an action to call a play: roll 2d6, keep the highest, and add it to an ally's roll. The play needs a name, and the name sticks.\u003c/p>\u003cp>\u003cstrong>The Looky-loo\u003c/strong> — \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a> gets the enemy's attention, \u003ca class=\"wl\" href=\"#darcy-smith\">Darcy Smith\u003c/a> shoots them. Established on the beach on the way to \u003ca class=\"wl\" href=\"#the-stairwell\">The Stairwell\u003c/a> and called twice in the first fight. \u003ca class=\"wl\" href=\"#frank-doyle\">Frank Doyle\u003c/a>'s preferred name for it was rejected.\u003c/p>", "backlinks": ["session-00"], "search": "call a play name it once. roll 2d6, keep the highest, add it to your mate's roll. "}, {"id": "combat", "reference": false, "referenceEntry": false, "title": "Combat", "group": "Game Guide", "type": "rule", "typeLabel": "Game Guide", "dek": "They signpost, you react. Two actions each.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Unlike most systems, the GM tells you what the enemy is about to do and you respond — the way a video game telegraphs an attack, and the way the books work.\u003c/p>\u003cul>\u003cli>\u003cstrong>Two actions per round\u003c/strong>, per crawler.\u003c/li>\u003cli>\u003cstrong>Step\u003c/strong> — every action carries a free step of two squares (10 feet) with it.\u003c/li>\u003cli>\u003cstrong>Move\u003c/strong> — 20 feet, four squares. Move plus step is 30 feet in one action.\u003c/li>\u003cli>\u003cstrong>Evade\u003c/strong> — d20 plus your evade modifier against the incoming attack. Spending an action to\u003c/li>\u003c/ul>\u003cp>evade is a real cost. Fail and you take it.\u003c/p>\u003cul>\u003cli>\u003cstrong>Intervene\u003c/strong> — spend an action to add 1d6 to an ally's near-miss and try to lift it into a\u003c/li>\u003c/ul>\u003cp>success.\u003c/p>\u003cul>\u003cli>\u003cstrong>Natural 20\u003c/strong> is a triumph. You narrate why it worked.\u003c/li>\u003c/ul>\u003cp>Each square on the battle map is five feet, so divide every range by five.\u003c/p>\u003cp>Enemy dice are rolled by the Dungeon AI.\u003c/p>", "backlinks": [], "search": "combat they signpost, you react. two actions each. "}, {"id": "the-system", "reference": false, "referenceEntry": false, "title": "The System", "group": "Game Guide", "type": "rule", "typeLabel": "Game Guide", "dek": "Characteristics, health, safe rooms, loot.", "conf": "hi", "confLabel": "Confirmed", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>Five characteristics — strength, dexterity, constitution, intelligence, charisma — each with a modifier that applies to every roll of that type. Health is a bar, tracked on the dashboard.\u003c/p>\u003cp>Safe rooms are where achievements and loot boxes happen, and where you can take a short rest and heal.\u003c/p>\u003cdiv class=\"panel note\">\u003cdiv class=\"ph\">Running this game is the GM's second job\u003c/div>\u003cp>The published system runs to roughly a thousand pages of notes, thoughts and structure that don't talk to each other. Everything on the dashboard is linked to a rule that had to be dug out and translated first.\u003c/p>\u003c/div>", "backlinks": [], "search": "the system characteristics, health, safe rooms, loot. "}, {"id": "skills", "reference": true, "referenceEntry": false, "title": "Skills", "group": "Skills", "type": "reference", "typeLabel": "Catalogue", "dek": "114 entries · Royal Court Edition", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills-rules\">Read the skills rules →\u003c/a>\u003c/p>\u003cp>Browse by category, listed stat, or trait. Search includes effects, upgrades, damage types, and favored classes. Open an entry for full rules and sources.\u003c/p>\u003cp class=\"source\">Fields absent from the source are omitted; consult the general rules for defaults. The supplied extraction is preserved, including any extraction errors.\u003c/p>\u003cdiv class=\"reference-controls\">\u003clabel>Search skills\u003cinput type=\"search\" data-filter=\"search\" placeholder=\"Name, effect, class, damage…\">\u003c/label>\u003clabel>Category\u003cselect data-filter=\"category\">\u003coption value=\"\">All\u003c/option>\u003coption value=\"Animal Crawler &amp; Pet Strike Skills\">Animal Crawler &amp; Pet Strike Skills\u003c/option>\u003coption value=\"Bashing Weapon Skills\">Bashing Weapon Skills\u003c/option>\u003coption value=\"Edged Weapon Skills\">Edged Weapon Skills\u003c/option>\u003coption value=\"Hand-to-Hand Combat Skills\">Hand-to-Hand Combat Skills\u003c/option>\u003coption value=\"Hand-to-Hand Damage Effect Skills\">Hand-to-Hand Damage Effect Skills\u003c/option>\u003coption value=\"Ranged Weapon Skills\">Ranged Weapon Skills\u003c/option>\u003coption value=\"Reach Weapon Skills\">Reach Weapon Skills\u003c/option>\u003coption value=\"Utility Skills\">Utility Skills\u003c/option>\u003c/select>\u003c/label>\u003clabel>Listed stat\u003cselect data-filter=\"stat\">\u003coption value=\"\">All\u003c/option>\u003coption value=\"Charisma\">Charisma\u003c/option>\u003coption value=\"Constitution\">Constitution\u003c/option>\u003coption value=\"Dexterity\">Dexterity\u003c/option>\u003coption value=\"Intelligence\">Intelligence\u003c/option>\u003coption value=\"Strength\">Strength\u003c/option>\u003c/select>\u003c/label>\u003clabel>Trait\u003cselect data-filter=\"traits\">\u003coption value=\"\">All\u003c/option>\u003coption value=\"Area of Effect\">Area of Effect\u003c/option>\u003coption value=\"Interrupt\">Interrupt\u003c/option>\u003coption value=\"Passive\">Passive\u003c/option>\u003c/select>\u003c/label>\u003cbutton type=\"button\" data-reset-reference>Clear filters\u003c/button>\u003c/div>\u003cp data-reference-count role=\"status\">114 entries\u003c/p>\u003cdiv class=\"reference-grid\">\u003carticle class=\"reference-card\" data-search=\"acute-ears acute ears utility_skill intelligence, passive intelligence true false false [] [] improves a crawler’s hearing and allows the crawler to see more mobs on the minimap in their hud. the information is “somewhat reliable.” {&#x27;5&#x27;: &#x27;information on the mob’s size and whether you have encountered them before are added to the red dot indicator.&#x27;, &#x27;10&#x27;: &#x27;mobs of a lower level than you cannot ambush your party.&#x27;, &#x27;15&#x27;: &#x27;mobs cannot ambush your party.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-acute-ears\">Acute Ears\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"aiming aiming utility_skill passive true false false [] [] this skill is used only in conjunction with ranged attacks. mark this skill for advancement only when applying its ranks to such an attack. you are skilled at targeting vital body parts to deal additional damage.\n\nwhen making a ranged attack, you can add your ranks in this skill to your attack skill check if you choose to make the check with disadvantage.\n\non success, add 1d4 to the damage. {&#x27;5&#x27;: &#x27;+1d4 damage&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-aiming\">Aiming\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"alchemy alchemy utility_skill intelligence intelligence false false false [] [] used for crafting potions and poisons. see crafting p. 221.\n\nyou may craft potions up to a +5 bonus level. {&#x27;5&#x27;: &#x27;you may craft potions up to a +10 bonus level.&#x27;, &#x27;10&#x27;: &#x27;you may create additional potions of the same kind without spending extra time.&#x27;, &#x27;15&#x27;: &#x27;you can write the recipe for any potion you find.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-alchemy\">Alchemy\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"ambush ambush utility_skill intelligence intelligence false false false [] [] you are skilled at popping up out of nowhere. when a mob is moving toward you, even if they are aware of your general presence, make an int-opposed skill check.\n\non success, you gain a surprise action against the mob before combat starts. as an unseen attacker, you attack with advantage. {&#x27;5&#x27;: &#x27;if you attack with your surprise action, add an ambush rank damage die to your surprise attack damage.&#x27;, &#x27;10&#x27;: &#x27;when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;, &#x27;15&#x27;: &#x27;you gain a second bonus action as a surprise action. this bonus action can’t be an attack.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-ambush\">Ambush\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"animal-handling animal handling utility_skill charisma charisma false false false [] [] you are skilled in calming, befriending, and guiding animals. make an int-opposed skill check.\n\non success, the animal is friendly enough to avoid attacking you. {&#x27;5&#x27;: &#x27;choose an animal type to specialize in. you have advantage on your animal handling skill checks against that animal type. you gain a second bonus action as a surprise action. this bonus action can’t be an attack.&#x27;, &#x27;10&#x27;: &#x27;forming each level of bonding with a potential pet takes half the normal time.&#x27;, &#x27;15&#x27;: &#x27;you can have up to two pets.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-animal-handling\">Animal Handling\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"arcane arcane utility_skill intelligence intelligence false false false [] [] you have general knowledge of magic and can determine whether items are magical or not. make an unopposed skill check.\n\non success, you can identify the item as magical or not. {&#x27;5&#x27;: &#x27;you are able to determine details such as the specific rank and bonus levels of magical items.&#x27;, &#x27;10&#x27;: &#x27;you can imbue items with inherent spells using an arcanist table. see crafting on p. 221.&#x27;, &#x27;15&#x27;: &#x27;the default cooldown of your imbued spells is 3 hours.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-arcane\">Arcane\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"attack-of-opportunity attack of opportunity utility_skill passive, interrupt true true false [] [] requires a single-handed melee weapon with a range no greater than 5 feet. when a foe moves out of a space adjacent to you (except via a step), you may spend an action to make an attack action as an interrupt against that foe.\n\non success, roll damage and apply any other effects from the attack! {&#x27;5&#x27;: &#x27;if the foe moves into another space adjacent to you, they must stop.&#x27;, &#x27;10&#x27;: &#x27;a foe using their step no longer prevents this ability.&#x27;, &#x27;15&#x27;: &#x27;roll the attack skill check with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-attack-of-opportunity\">Attack of Opportunity\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"axe axe attack_skill edged weapon skills melee attack, str strength false false false melee [] [&#x27;slashing&#x27;] 1d6 + str slashing {&#x27;5&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and you may make an extra free attack with disadvantage against another foe adjacent to both you and the original target.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and on an amazing success or better, sever an arm (or similar) of your foe (which disarms anyone with a two-handed weapon).&#x27;}\" data-category=\"Edged Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-axe\">Axe\u003c/a>\u003c/h2>\u003cp class=\"source\">Edged Weapon Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d6 + Str Slashing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"back-claw back claw attack_skill animal crawler &amp; pet strike skills melee attack, str strength false false false melee [] [&#x27;slashing&#x27;] 1d6 + str slashing {&#x27;5&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and the target gains the blood trail debuff.&#x27;}\" data-category=\"Animal Crawler &amp; Pet Strike Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-back-claw\">Back Claw\u003c/a>\u003c/h2>\u003cp class=\"source\">Animal Crawler &amp; Pet Strike Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d6 + Str Slashing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"backfire backfire utility_skill intelligence intelligence false false false [] [] compensated anarchist class only you are skilled at neutralizing and deconstructing traps without the use of a sapper’s table. triggering mechanisms are quite valuable. time required to neutralize a trap is 10 minutes. time required to deconstruct it is 1 hour. make an unopposed skill check.\n\non success, you successfully take apart the trap and can repurpose it. {&#x27;5&#x27;: &#x27;you can identify when the trap was placed. time required to neutralize a trap is 5 minutes.&#x27;, &#x27;10&#x27;: &#x27;you can identify when the trap was created. time required to deconstruct a trap is 30 minutes.&#x27;, &#x27;15&#x27;: &#x27;you can identify the designer of the trap. time required to deconstruct a trap is 15 minutes.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-backfire\">Backfire\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"balance balance utility_skill dexterity dexterity false false false [] [] you can traverse tricky surfaces with general ease. make an unopposed skill check. the gm may add difficulty for especially crazy surfaces.\n\non success, you keep your balance on tricky or shifting surfaces. {&#x27;5&#x27;: &#x27;you may perform move actions in difficult terrain without penalty.&#x27;, &#x27;10&#x27;: &#x27;when subject to a take down or involuntary move effects, you may use this skill as a free interrupt action to avoid the effect.&#x27;, &#x27;15&#x27;: &#x27;you may perform your step on vertical surfaces (yes, like in the matrix), but must end it on a flat(ish) surface.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-balance\">Balance\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"basic-science basic science utility_skill intelligence intelligence false false false [] [] you understand basic scientific principles and natural laws, which you hope are still in effect in the dungeon. if you want to conduct experiments involving dead goblins and various acids, this is the skill for you. experiments take 2 hours to perform. make an unopposed skill check.\n\non success, you learn or confirm something. {&#x27;5&#x27;: &#x27;experiments take 1 hour to perform.&#x27;, &#x27;10&#x27;: &#x27;choose a specialty (physics, biology, chemistry, earth science, etc.), and roll with advantage when dealing with that.&#x27;, &#x27;15&#x27;: &#x27;experiments take 30 minutes to perform.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-basic-science\">Basic Science\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"bite bite attack_skill animal crawler &amp; pet strike skills melee attack, str strength false false false melee [] [&#x27;piercing&#x27;] the target must have an appendage you can clamp down onto. you taste your victim’s blood. better hope they’re not poisonous. 1d8 + str piercing {&#x27;5&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage. you may latch on to move when the foe moves during their next action (then you let go).&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and the target gains the woozy debuff.&#x27;}\" data-category=\"Animal Crawler &amp; Pet Strike Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-bite\">Bite\u003c/a>\u003c/h2>\u003cp class=\"source\">Animal Crawler &amp; Pet Strike Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d8 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"bomb-surgeon bomb surgeon utility_skill intelligence intelligence false false false [] [] use this skill to deconstruct explosive bombs and smoke bombs. you can then use the half-sized bomb, or use the component parts to craft new bombs using other skills.\n\nif you are using a sapper’s table, you do not have to make an unopposed explosives handling skill check to avoid a mishap. time required is 1 hour. make an unopposed skill check.\n\non success, you have deconstructed it. {&#x27;5&#x27;: &#x27;time required is 30 minutes.&#x27;, &#x27;10&#x27;: &#x27;you never have to make an explosives handling skill check when using this skill.&#x27;, &#x27;15&#x27;: &#x27;when cutting dynamite in half to make smaller bombs, round dice up. time required is 15 minutes.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-bomb-surgeon\">Bomb Surgeon\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"bow bow attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;piercing&#x27;] 100 feet requires two hands to wield. each attack requires proper ammunition. 1d6 + str piercing {&#x27;5&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and add 1 rank damage die.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and the target gains the blood trail debuff.&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-bow\">Bow\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 100 feet · Damage: 1d6 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"calligraphy calligraphy utility_skill dexterity dexterity false false false [] [] used for making documents look super elegant. make an unopposed skill check.\n\non success, what you have written is a joy to read and feels important, even if it’s bad news. {&#x27;5&#x27;: &#x27;roll with advantage on your next charisma skill check vs. the recipient of your beautiful paper.&#x27;, &#x27;10&#x27;: &#x27;you are able to craft scrolls as if this were a crafting skill. see crafting, p. 221.&#x27;, &#x27;15&#x27;: &#x27;once per floor, you may craft a scroll for a spell you have only seen cast within the last 2 hours.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-calligraphy\">Calligraphy\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"cartography cartography utility_skill intelligence intelligence false false false [] [] you probably played some old-school ttrpgs and think that mapping the dungeon will help you in some way. wrong! it will help you in many ways. make an unopposed skill check.\n\non success, you figure out where you are in relation to other things. {&#x27;5&#x27;: &#x27;you can always return from whence you came quickly, assuming the dungeon walls haven’t shifted in the meantime.&#x27;, &#x27;10&#x27;: &#x27;you provide an advantage die to crawlers in your party (could be you) who are making tracking skill checks or checks that rely on spatial relations.&#x27;, &#x27;15&#x27;: &#x27;even with merely a finger point or a “thattaway,” you can get from point a to point b via the most direct path.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-cartography\">Cartography\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"cat-like-reflexes cat-like reflexes utility_skill dexterity dexterity false false false [] [] this limited skill is only available to cat-based races, such as cat, cat girl/cat boy, and tigran you gain a +10ft move. use this skill check when you would make a dexterity stat check (vs. the typically lesser stat check difficulty). {&#x27;5&#x27;: &#x27;reduce the damage you take from foes’ surprise attacks against you by your rank in this skill.&#x27;, &#x27;10&#x27;: &#x27;reduce all area damage you take by 50% (rounded down).&#x27;, &#x27;15&#x27;: &#x27;+10ft move. you gain a +1 evade buff. roll with advantage to evade attacks and effects that would apply the held debuff (or similar) to you.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-cat-like-reflexes\">Cat-Like Reflexes\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"catcher catcher utility_skill passive, interrupt true true false [] [] when a successful direct (non-area) attack is about to damage an ally, you leap in and take the damage instead. you must be adjacent to that ally but can take a 10ft step before using this skill to get into position.\n\nyou take the damage. you can’t use evade, shield block, and other skills or spells to negate damage dealt to you this way. {&#x27;5&#x27;: &#x27;you’ve learned how to take hits. you gain +5 dr when using this skill.&#x27;, &#x27;10&#x27;: &#x27;you gain +5 dr a when using this skill.&#x27;, &#x27;15&#x27;: &#x27;you gain +5 dr when using this skill and ignore any debuffs attached to this damage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive|Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-catcher\">Catcher\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive · Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"cesta-punta cesta punta utility_skill dexterity dexterity false false false [] [] only acquired via an earth hobby potion use this skill check when playing jai alai or when throwing things that fit in the xistera. see throwing p. 200 for rules on throwing things, but use the ranges below. roll with disadvantage at ranges over 500 feet. {&#x27;5&#x27;: &#x27;throw range strength ×20 feet.&#x27;, &#x27;10&#x27;: &#x27;add 1 cesta punta rank damage die to thrown damaging attacks.&#x27;, &#x27;15&#x27;: &#x27;throw range strength ×30 feet, and roll with disadvantage at ranges over 2,000 feet.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-cesta-punta\">Cesta Punta\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"character-actor character actor utility_skill passive, charisma charisma true false false [] [] former child actor class only. rank increases by 1 when descending to a new floor only. at the start of each floor, choose a new class from a random list of three provided by the gm. you gain a random assortment of the new class’s abilities for the remainder of the current floor, while keeping your current ones.\n\nfor each bullet point line item in the new class description, roll 1d2. on a 2, you gain the listed abilities. {&#x27;5&#x27;: &#x27;the random classes increase in rarity and power based on the crawler’s stats and level.&#x27;, &#x27;10&#x27;: &#x27;skill ranks gained in any newly-granted skills persist from floor to floor, but the starting ranks of those skills are lost.&#x27;, &#x27;15&#x27;: &#x27;you choose the class from any available.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-character-actor\">Character Actor\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"choke-out choke out attack_skill hand-to-hand damage effect skills wrasslin’ damage effect, passive true false false wrasslin’ [] [] if the target is at 10% health bar or less, you deal ×2 the total damage. {&#x27;5&#x27;: &#x27;choke out activates at 20% health bar or less.&#x27;, &#x27;10&#x27;: &#x27;choke out activates at 40% health bar or less, and deals ×4 the total damage.&#x27;, &#x27;15&#x27;: &#x27;choke out activates at 80% health bar or less, and deals ×8 the total damage.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-choke-out\">Choke Out\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"chopper-pilot chopper pilot utility_skill dexterity dexterity false false false [] [] you suffer disadvantage on attack skill checks made while piloting and cannot attack with a weapon that requires two hands. known as a motorcycle in most parts of the world— and in the world dungeon.\n\nyou don’t need to use this skill if you’re cruising through a town, but if you’re racing, chasing, showing off, or trying to pop a wheelie, this is the skill you want. if you’re doing something wild or trying to avoid becoming a skid mark on the highway, make an unopposed skill check. depending on how extreme the circumstances are, the gm may apply advantage or disadvantage to the check.\n\non success, you stay upright while performing your crazy maneuvers. {&#x27;5&#x27;: &#x27;your chopper has +5ft move.&#x27;, &#x27;10&#x27;: &#x27;attacking while piloting no longer suffers disadvantage.&#x27;, &#x27;15&#x27;: &#x27;your chopper has +5ft move. when performing crazy stunts (like riding up a canyon wall), roll with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-chopper-pilot\">Chopper Pilot\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"climbing climbing utility_skill strength strength false false false [] [] if you attack while climbing, you suffer disadvantage on those checks. you don’t need to use this skill if you’re climbing up a narrow flight of stairs. probably not even when you’re fully roped in and tethered to other climbers. but if you’re racing, chasing, rappelling from a burning building, or doing something dangerous while climbing, this is the skill you want.\n\nmake an unopposed skill check every minute (not round). depending on how extreme the circumstances are, the gm may apply advantage (such as if you’ve previously already climbed it) or disadvantage (you got no ropes) to the check.\n\non success, you are safe in your climb and make progress. see special forms of movement p. 70, if the distance moved is important. {&#x27;5&#x27;: &#x27;make a check every 5 minutes.&#x27;, &#x27;10&#x27;: &#x27;make a check every 10 minutes. you no longer attack with disadvantage while climbing.&#x27;, &#x27;15&#x27;: &#x27;make a check every 15 minutes. when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-climbing\">Climbing\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"club club attack_skill bashing weapon skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 1d6 + str bludgeoning {&#x27;5&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and the target gains the woozy debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and if the target loses at least 3 health bar slots, they gain the take down debuff.&#x27;}\" data-category=\"Bashing Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-club\">Club\u003c/a>\u003c/h2>\u003cp class=\"source\">Bashing Weapon Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d6 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"cockroach cockroach utility_skill constitution constitution false false false [] [] once per scene this limited skill can only be learned via a race, class, or item. mark the skill for advancement until you reach rank 5. after that, ranks in this skill only increase by magical means and training. when an attack would drop you to 0% health bar, roll an unopposed skill check.\n\non success, drop to 10% instead. {&#x27;5&#x27;: &#x27;no skill check required anymore.&#x27;, &#x27;10&#x27;: &#x27;the crawler’s health bar is unaffected by damage that would drop them to 0%.&#x27;, &#x27;15&#x27;: &#x27;cooldown is twice per scene. when it triggers, the crawler heals to 100% and has +rank dr until the end of the next round of combat.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Constitution\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-cockroach\">Cockroach\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Constitution\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"cooking cooking utility_skill intelligence intelligence false false false [] [] you are skilled in the culinary arts. once you have your ingredients and 1 hour to prepare it, make an unopposed skill check. on success, you make edible food for you and your party. {&#x27;5&#x27;: &#x27;it takes you 30 minutes to prepare a meal with makeshift ingredients.&#x27;, &#x27;10&#x27;: &#x27;the diners gain the day-long “you are full!” buff: heal 2 health bar slots per hour when not resting.&#x27;, &#x27;15&#x27;: &#x27;the “you are full!” buff also causes debuffs to end if you drop to 10% health bar.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-cooking\">Cooking\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"crossbow crossbow attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;piercing&#x27;] 50 feet once per round. requires two hands to wield. each attack requires proper ammunition. 1d8 piercing {&#x27;5&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage, and the target gains the blood trail debuff.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and the range is 100 feet.&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-crossbow\">Crossbow\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 50 feet · Damage: 1d8 Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"dagger dagger attack_skill edged weapon skills melee attack, dex dexterity false false false melee [] [&#x27;piercing&#x27;] 1 1d4 + str piercing {&#x27;5&#x27;: &#x27;+1d4 base damage, and this attack deals armor-piercing damage (ignores dr).&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and you can throw this weapon (using this skill) up to a range of rank × 5 feet.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and attacks targeting the back of a foe deal ×2 damage.&#x27;}\" data-category=\"Edged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-dagger\">Dagger\u003c/a>\u003c/h2>\u003cp class=\"source\">Edged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Damage: 1d4 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"deception deception utility_skill charisma charisma false false false [] [] if you know the truth but want to obscure it, this is the skill for you. when you lie and try to get away with it, make an int-opposed skill check. if the creature you’re lying to has the detect lies skill, you make this check with disadvantage.\n\non success, they believe you! {&#x27;5&#x27;: &#x27;you can use this skill while gambling.&#x27;, &#x27;10&#x27;: &#x27;you can use this skill to forge documents.&#x27;, &#x27;15&#x27;: &#x27;you’re good enough to know when you’ve been caught. if you fail this check, you may perform one action before your foes can react.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-deception\">Deception\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"detect-lies detect lies utili
