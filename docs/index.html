ying Game Core Rulebook: Royal Court Edition · Printed pages 177 · PDF pages 179\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BITE\nMelee Attack, Str\nLimitations: The target must have an appendage you\ncan clamp down onto. You taste your victim’s blood.\nBetter hope they’re not poisonous.\nBase Damage: 1d8 + Str Piercing\nUPGRADES\nRank 5: +1d8 base damage\nRank 10: +1d8 base damage. You may latch on to\nmove when the foe moves during their next Action\n(then you let go).\nRank 15: +1d8 base damage, and the target gains the\nWoozy Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "bite animal crawler & pet strike skills bite bite attack_skill animal crawler & pet strike skills melee attack, str strength false false false melee [] ['piercing'] the target must have an appendage you can clamp down onto. you taste your victim’s blood. better hope they’re not poisonous. 1d8 + str piercing {'5': '+1d8 base damage', '10': '+1d8 base damage. you may latch on to move when the foe moves during their next action (then you let go).', '15': '+1d8 base damage, and the target gains the woozy debuff.'}"}, {"id": "skill-bomb-surgeon", "reference": true, "referenceEntry": true, "title": "Bomb Surgeon", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill to deconstruct explosive bombs and smoke bombs. You can then use the half-sized bomb, or use the component parts to craft new bombs using other Skills.\u003c/p>\u003cp>If you are using a Sapper’s Table, you do not have to make an Unopposed Explosives Handling Skill Check to avoid a mishap. Time required is 1 hour. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you have deconstructed it.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Time required is 30 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You never have to make an Explosives Handling Skill Check when using this skill.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>When cutting dynamite in half to make smaller bombs, round dice up. Time required is 15 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 186 · PDF pages 188\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BOMB SURGEON\nIntelligence\nUse this Skill to deconstruct explosive bombs and smoke\nbombs. You can then use the half-sized bomb, or use the\ncomponent parts to craft new bombs using other Skills.\nIf you are using a Sapper’s Table, you do not have to\nmake an Unopposed Explosives Handling Skill Check\nto avoid a mishap. Time required is 1 hour. Make an\nUnopposed Skill Check.\nOn Success, you have deconstructed it.\nUPGRADES\nRank 5: Time required is 30 minutes.\nRank 10: You never have to make an Explosives Han‑\ndling Skill Check when using this skill.\nRank 15: When cutting dynamite in half to make small‑\ner bombs, round dice up. Time required is 15 minutes.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "bomb surgeon utility skills bomb-surgeon bomb surgeon utility_skill intelligence intelligence false false false [] [] use this skill to deconstruct explosive bombs and smoke bombs. you can then use the half-sized bomb, or use the component parts to craft new bombs using other skills.\n\nif you are using a sapper’s table, you do not have to make an unopposed explosives handling skill check to avoid a mishap. time required is 1 hour. make an unopposed skill check.\n\non success, you have deconstructed it. {'5': 'time required is 30 minutes.', '10': 'you never have to make an explosives handling skill check when using this skill.', '15': 'when cutting dynamite in half to make smaller bombs, round dice up. time required is 15 minutes.'}"}, {"id": "skill-bow", "reference": true, "referenceEntry": true, "title": "Bow", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>100 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield. Each Attack requires proper ammunition.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and add 1 Rank damage die.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and the target gains the Blood Trail Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 181 · PDF pages 183\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BOW\nRanged Attack, Dex\nRange: 100 feet\nLimitations: Requires two hands to wield. Each Attack\nrequires proper ammunition.\nBase Damage: 1d6 + Str Piercing\nUPGRADES\nRank 5: +1d6 base damage\nRank 10: +1d6 base damage, and add 1 Rank damage die.\nRank 15: +1d6 base damage, and the target gains the\nBlood Trail Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "bow ranged weapon skills bow bow attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['piercing'] 100 feet requires two hands to wield. each attack requires proper ammunition. 1d6 + str piercing {'5': '+1d6 base damage', '10': '+1d6 base damage, and add 1 rank damage die.', '15': '+1d6 base damage, and the target gains the blood trail debuff.'}"}, {"id": "skill-calligraphy", "reference": true, "referenceEntry": true, "title": "Calligraphy", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Used for making documents look super elegant. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, what you have written is a joy to read and feels important, even if it’s bad news.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Roll with Advantage on your next Charisma Skill Check vs. the recipient of your beautiful paper.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You are able to craft scrolls as if this were a crafting skill. See Crafting, p. 221.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Once per floor, you may craft a scroll for a spell you have only seen cast within the last 2 hours.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 186 · PDF pages 188\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CALLIGRAPHY\nDexterity\nUsed for making documents look super elegant. Make\nan Unopposed Skill Check.\nOn Success, what you have written is a joy to read and\nfeels important, even if it’s bad news.\nUPGRADES\nRank 5: Roll with Advantage on your next Charisma\nSkill Check vs. the recipient of your beautiful paper.\nRank 10: You are able to craft scrolls as if this were a\ncrafting skill. See Crafting, p. 221.\nRank 15: Once per floor, you may craft a scroll for a\nspell you have only seen cast within the last 2 hours.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "calligraphy utility skills calligraphy calligraphy utility_skill dexterity dexterity false false false [] [] used for making documents look super elegant. make an unopposed skill check.\n\non success, what you have written is a joy to read and feels important, even if it’s bad news. {'5': 'roll with advantage on your next charisma skill check vs. the recipient of your beautiful paper.', '10': 'you are able to craft scrolls as if this were a crafting skill. see crafting, p. 221.', '15': 'once per floor, you may craft a scroll for a spell you have only seen cast within the last 2 hours.'}"}, {"id": "skill-cartography", "reference": true, "referenceEntry": true, "title": "Cartography", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You probably played some old-school TTRPGs and think that mapping the dungeon will help you in some way. Wrong! It will help you in many ways. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you figure out where you are in relation to other things.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can always return from whence you came quickly, assuming the dungeon walls haven’t shifted in the meantime.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You provide an Advantage die to crawlers in your party (could be you) who are making Tracking Skill Checks or Checks that rely on spatial relations.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Even with merely a finger point or a “thattaway,” you can get from point A to point B via the most direct path.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 186 · PDF pages 188\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CARTOGRAPHY\nIntelligence\nYou probably played some old-school TTRPGs and\nthink that mapping the dungeon will help you in some\nway. Wrong! It will help you in many ways. Make an\nUnopposed Skill Check.\nOn Success, you figure out where you are in relation to\nother things.\nUPGRADES\nRank 5: You can always return from whence you came\nquickly, assuming the dungeon walls haven’t shifted in\nthe meantime.\nRank 10: You provide an Advantage die to crawlers\nin your party (could be you) who are making Tracking\nSkill Checks or Checks that rely on spatial relations.\nRank 15: Even with merely a finger point or a “that‑\ntaway,” you can get from point A to point B via the\nmost direct path.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "cartography utility skills cartography cartography utility_skill intelligence intelligence false false false [] [] you probably played some old-school ttrpgs and think that mapping the dungeon will help you in some way. wrong! it will help you in many ways. make an unopposed skill check.\n\non success, you figure out where you are in relation to other things. {'5': 'you can always return from whence you came quickly, assuming the dungeon walls haven’t shifted in the meantime.', '10': 'you provide an advantage die to crawlers in your party (could be you) who are making tracking skill checks or checks that rely on spatial relations.', '15': 'even with merely a finger point or a “thattaway,” you can get from point a to point b via the most direct path.'}"}, {"id": "skill-cat-like-reflexes", "reference": true, "referenceEntry": true, "title": "Cat-Like Reflexes", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>This limited Skill is only available to cat-based Races, such as Cat, Cat Girl/Cat Boy, and Tigran\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You gain a +10ft Move. Use this Skill Check when you would make a Dexterity Stat Check (vs. the typically lesser Stat Check Difficulty).\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Reduce the damage you take from foes’ Surprise Attacks against you by your Rank in this skill.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Reduce all Area damage you take by 50% (rounded down).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+10ft Move. You gain a +1 Evade Buff. Roll with Advantage to Evade Attacks and effects that would apply the Held Debuff (or similar) to you.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 186–187 · PDF pages 188–189\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CAT-LIKE REFLEXES\nDexterity\nLimitation: This limited Skill is only available to cat-\nbased Races, such as Cat, Cat Girl/Cat Boy, and Tigran\nYou gain a +10ft Move. Use this Skill Check when you\nwould make a Dexterity Stat Check (vs. the typically\nlesser Stat Check Difficulty).\nUPGRADES\nRank 5: Reduce the damage you take from foes’ Sur‑\nprise Attacks against you by your Rank in this skill.\nRank 10: Reduce all Area damage you take by 50%\n(rounded down).\nRank 15: +10ft Move. You gain a +1 Evade Buff. Roll\nwith Advantage to Evade Attacks and effects that\nwould apply the Held Debuff (or similar) to you.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "cat-like reflexes utility skills cat-like-reflexes cat-like reflexes utility_skill dexterity dexterity false false false [] [] this limited skill is only available to cat-based races, such as cat, cat girl/cat boy, and tigran you gain a +10ft move. use this skill check when you would make a dexterity stat check (vs. the typically lesser stat check difficulty). {'5': 'reduce the damage you take from foes’ surprise attacks against you by your rank in this skill.', '10': 'reduce all area damage you take by 50% (rounded down).', '15': '+10ft move. you gain a +1 evade buff. roll with advantage to evade attacks and effects that would apply the held debuff (or similar) to you.'}"}, {"id": "skill-catcher", "reference": true, "referenceEntry": true, "title": "Catcher", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive, Interrupt\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>When a Successful direct (non-Area) Attack is about to damage an ally, you leap in and take the damage instead. You must be adjacent to that ally but can take a 10ft Step before using this Skill to get into position.\u003c/p>\u003cp>You take the damage. You can’t use Evade, Shield Block, and other Skills or Spells to negate damage dealt to you this way.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You’ve learned how to take hits. You gain +5 DR when using this Skill.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You gain +5 DR a when using this Skill.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You gain +5 DR when using this Skill and ignore any Debuffs attached to this damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 187 · PDF pages 189\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CATCHER\nPassive, Interrupt\nWhen a Successful direct (non-Area) Attack is about\nto damage an ally, you leap in and take the damage\ninstead. You must be adjacent to that ally but can take\na 10ft Step before using this Skill to get into position.\nYou take the damage. You can’t use Evade, Shield\nBlock, and other Skills or Spells to negate damage\ndealt to you this way.\nUPGRADES\nRank 5: You’ve learned how to take hits. You gain +5\nDR when using this Skill.\nRank 10: You gain +5 DR a when using this Skill.\nRank 15: You gain +5 DR when using this Skill and\nignore any Debuffs attached to this damage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "catcher utility skills catcher catcher utility_skill passive, interrupt true true false [] [] when a successful direct (non-area) attack is about to damage an ally, you leap in and take the damage instead. you must be adjacent to that ally but can take a 10ft step before using this skill to get into position.\n\nyou take the damage. you can’t use evade, shield block, and other skills or spells to negate damage dealt to you this way. {'5': 'you’ve learned how to take hits. you gain +5 dr when using this skill.', '10': 'you gain +5 dr a when using this skill.', '15': 'you gain +5 dr when using this skill and ignore any debuffs attached to this damage.'}"}, {"id": "skill-cesta-punta", "reference": true, "referenceEntry": true, "title": "Cesta Punta", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Only acquired via an Earth Hobby Potion\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill Check when playing jai alai or when throwing things that fit in the xistera. See Throwing p. 200 for rules on throwing things, but use the ranges below. Roll with Disadvantage at ranges over 500 feet.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Throw range Strength ×20 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Add 1 Cesta Punta Rank damage die to thrown damaging Attacks.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Throw range Strength ×30 feet, and roll with Disadvantage at ranges over 2,000 feet.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 187 · PDF pages 189\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CESTA PUNTA\nDexterity\nLimitations: Only acquired via an Earth\nHobby Potion\nUse this Skill Check when playing jai alai or\nwhen throwing things that fit in the xistera. See\nThrowing p. 200 for rules on throwing things, but\nuse the ranges below. Roll with Disadvantage at rang‑\nes over 500 feet.\nUPGRADES\nRank 5: Throw range Strength ×20 feet.\nRank 10: Add 1 Cesta Punta Rank damage die to\nthrown damaging Attacks.\nRank 15: Throw range Strength ×30 feet, and roll with\nDisadvantage at ranges over 2,000 feet.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "cesta punta utility skills cesta-punta cesta punta utility_skill dexterity dexterity false false false [] [] only acquired via an earth hobby potion use this skill check when playing jai alai or when throwing things that fit in the xistera. see throwing p. 200 for rules on throwing things, but use the ranges below. roll with disadvantage at ranges over 500 feet. {'5': 'throw range strength ×20 feet.', '10': 'add 1 cesta punta rank damage die to thrown damaging attacks.', '15': 'throw range strength ×30 feet, and roll with disadvantage at ranges over 2,000 feet.'}"}, {"id": "skill-character-actor", "reference": true, "referenceEntry": true, "title": "Character Actor", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive, Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Former Child Actor Class Only. Rank increases by 1 when descending to a new floor only.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>At the start of each floor, choose a new Class from a random list of three provided by the GM. You gain a random assortment of the new Class’s abilities for the remainder of the current floor, while keeping your current ones.\u003c/p>\u003cp>For each bullet point line item in the new Class description, roll 1d2. On a 2, you gain the listed abilities.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The random Classes increase in rarity and power based on the crawler’s Stats and Level.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Skill Ranks gained in any newly-granted Skills persist from floor to floor, but the starting Ranks of those Skills are lost.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You choose the Class from any available.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 187 · PDF pages 189\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CHARACTER ACTOR\nPassive, Charisma\nLimitations: Former Child Actor Class Only. Rank\nincreases by 1 when descending to a new floor only.\nAt the start of each floor, choose a new Class from\na random list of three provided by the GM. You gain\na random assortment of the new Class’s abilities for\nthe remainder of the current floor, while keeping your\ncurrent ones.\nFor each bullet point line item in the new Class descrip‑\ntion, roll 1d2. On a 2, you gain the listed abilities.\nUPGRADES\nRank 5: The random Classes increase in rarity and\npower based on the crawler’s Stats and Level.\nRank 10: Skill Ranks gained in any newly-granted\nSkills persist from floor to floor, but the starting Ranks\nof those Skills are lost.\nRank 15: You choose the Class from any available.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "character actor utility skills character-actor character actor utility_skill passive, charisma charisma true false false [] [] former child actor class only. rank increases by 1 when descending to a new floor only. at the start of each floor, choose a new class from a random list of three provided by the gm. you gain a random assortment of the new class’s abilities for the remainder of the current floor, while keeping your current ones.\n\nfor each bullet point line item in the new class description, roll 1d2. on a 2, you gain the listed abilities. {'5': 'the random classes increase in rarity and power based on the crawler’s stats and level.', '10': 'skill ranks gained in any newly-granted skills persist from floor to floor, but the starting ranks of those skills are lost.', '15': 'you choose the class from any available.'}"}, {"id": "skill-choke-out", "reference": true, "referenceEntry": true, "title": "Choke Out", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Wrasslin’ Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>If the target is at 10% Health Bar or less, you deal ×2 the total damage.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Wrasslin’\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-wrasslin\">Wrasslin’\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Choke Out activates at 20% Health Bar or less.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Choke Out activates at 40% Health Bar or less, and deals ×4 the total damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Choke Out activates at 80% Health Bar or less, and deals ×8 the total damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 180 · PDF pages 182\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CHOKE OUT\nWrasslin’ Damage Effect, Passive\nIf the target is at 10% Health Bar or less, you deal ×2\nthe total damage.\nUPGRADES\nRank 5: Choke Out activates at 20% Health Bar or less.\nRank 10: Choke Out activates at 40% Health Bar or\nless, and deals ×4 the total damage.\nRank 15: Choke Out activates at 80% Health Bar or\nless, and deals ×8 the total damage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "choke out hand-to-hand damage effect skills choke-out choke out attack_skill hand-to-hand damage effect skills wrasslin’ damage effect, passive true false false wrasslin’ [] [] if the target is at 10% health bar or less, you deal ×2 the total damage. {'5': 'choke out activates at 20% health bar or less.', '10': 'choke out activates at 40% health bar or less, and deals ×4 the total damage.', '15': 'choke out activates at 80% health bar or less, and deals ×8 the total damage.'}"}, {"id": "skill-chopper-pilot", "reference": true, "referenceEntry": true, "title": "Chopper Pilot", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>You suffer Disadvantage on Attack Skill Checks made while Piloting and cannot Attack with a weapon that requires two hands.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Known as a motorcycle in most parts of the world— and in the World Dungeon.\u003c/p>\u003cp>You don’t need to use this Skill if you’re cruising through a town, but if you’re racing, chasing, showing off, or trying to pop a wheelie, this is the Skill you want. If you’re doing something wild or trying to avoid becoming a skid mark on the highway, make an Unopposed Skill Check. Depending on how extreme the circumstances are, the GM may apply Advantage or Disadvantage to the Check.\u003c/p>\u003cp>On Success, you stay upright while performing your crazy maneuvers.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your chopper has +5ft Move.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Attacking while piloting no longer suffers Disadvantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your chopper has +5ft Move. When performing crazy stunts (like riding up a canyon wall), roll with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 187–188 · PDF pages 189–190\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CHOPPER PILOT\nDexterity\nKnown as a motorcycle in most parts of the world—\nand in the World Dungeon.\nLimitations: You suffer Disadvantage on Attack Skill\nChecks made while Piloting and cannot Attack with a\nweapon that requires two hands.\nYou don’t need to use this Skill if you’re cruising\nthrough a town, but if you’re racing, chasing, show‑\ning off, or trying to pop a wheelie, this is the Skill you\nwant.\nIf you’re doing something wild or trying to avoid\nbecoming a skid mark on the highway, make an Un‑\nopposed Skill Check. Depending on how extreme the\ncircumstances are, the GM may apply Advantage or\nDisadvantage to the Check.\nOn Success, you stay upright while performing your\ncrazy maneuvers.\nUPGRADES\nRank 5: Your chopper has +5ft Move.\nRank 10: Attacking while piloting no longer suffers\nDisadvantage.\nRank 15: Your chopper has +5ft Move. When per‑\nforming crazy stunts (like riding up a canyon wall), roll\nwith Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "chopper pilot utility skills chopper-pilot chopper pilot utility_skill dexterity dexterity false false false [] [] you suffer disadvantage on attack skill checks made while piloting and cannot attack with a weapon that requires two hands. known as a motorcycle in most parts of the world— and in the world dungeon.\n\nyou don’t need to use this skill if you’re cruising through a town, but if you’re racing, chasing, showing off, or trying to pop a wheelie, this is the skill you want. if you’re doing something wild or trying to avoid becoming a skid mark on the highway, make an unopposed skill check. depending on how extreme the circumstances are, the gm may apply advantage or disadvantage to the check.\n\non success, you stay upright while performing your crazy maneuvers. {'5': 'your chopper has +5ft move.', '10': 'attacking while piloting no longer suffers disadvantage.', '15': 'your chopper has +5ft move. when performing crazy stunts (like riding up a canyon wall), roll with advantage.'}"}, {"id": "skill-climbing", "reference": true, "referenceEntry": true, "title": "Climbing", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>If you Attack while Climbing, you suffer Disadvantage on those Checks.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You don’t need to use this Skill if you’re climbing up a narrow flight of stairs. Probably not even when you’re fully roped in and tethered to other climbers. But if you’re racing, chasing, rappelling from a burning building, or doing something dangerous while climbing, this is the Skill you want.\u003c/p>\u003cp>Make an Unopposed Skill Check every minute (not round). Depending on how extreme the circumstances are, the GM may apply Advantage (such as if you’ve previously already climbed it) or Disadvantage (you got no ropes) to the Check.\u003c/p>\u003cp>On Success, you are safe in your climb and make progress. See Special Forms of Movement p. 70, if the distance moved is important.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Make a Check every 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Make a Check every 10 minutes. You no longer Attack with Disadvantage while climbing.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Make a Check every 15 minutes. When other crawlers in your party roll this skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 188 · PDF pages 190\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CLIMBING\nStrength\nLimitations: If you Attack while Climbing, you suffer\nDisadvantage on those Checks.\nYou don’t need to use this Skill if you’re climbing up a\nnarrow flight of stairs. Probably not even when you’re\nfully roped in and tethered to other climbers. But if\nyou’re racing, chasing, rappelling from a burning build‑\ning, or doing something dangerous while climbing, this\nis the Skill you want.\nMake an Unopposed Skill Check every minute (not\nround). Depending on how extreme the circumstances\nare, the GM may apply Advantage (such as if you’ve\npreviously already climbed it) or Disadvantage (you got\nno ropes) to the Check.\nOn Success, you are safe in your climb and make\nprogress. See Special Forms of Movement p. 70, if the\ndistance moved is important.\nUPGRADES\nRank 5: Make a Check every 5 minutes.\nRank 10: Make a Check every 10 minutes. You no\nlonger Attack with Disadvantage while climbing.\nRank 15: Make a Check every 15 minutes. When other\ncrawlers in your party roll this skill untrained, they roll\nas normal (not with Disadvantage).\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "climbing utility skills climbing climbing utility_skill strength strength false false false [] [] if you attack while climbing, you suffer disadvantage on those checks. you don’t need to use this skill if you’re climbing up a narrow flight of stairs. probably not even when you’re fully roped in and tethered to other climbers. but if you’re racing, chasing, rappelling from a burning building, or doing something dangerous while climbing, this is the skill you want.\n\nmake an unopposed skill check every minute (not round). depending on how extreme the circumstances are, the gm may apply advantage (such as if you’ve previously already climbed it) or disadvantage (you got no ropes) to the check.\n\non success, you are safe in your climb and make progress. see special forms of movement p. 70, if the distance moved is important. {'5': 'make a check every 5 minutes.', '10': 'make a check every 10 minutes. you no longer attack with disadvantage while climbing.', '15': 'make a check every 15 minutes. when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).'}"}, {"id": "skill-club", "reference": true, "referenceEntry": true, "title": "Club", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Bashing Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and the target gains the Woozy Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and if the target loses at least 3 Health Bar slots, they gain the Take Down Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178 · PDF pages 180\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CLUB\nMelee Attack, Str\nBase Damage: 1d6 + Str Bludgeoning\nUPGRADES\nRank 5: +1d6 base damage\nRank 10: +1d6 base damage, and the target gains the\nWoozy Debuff.\nRank 15: +1d6 base damage, and if the target loses\nat least 3 Health Bar slots, they gain the Take Down\nDebuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "club bashing weapon skills club club attack_skill bashing weapon skills melee attack, str strength false false false melee [] ['bludgeoning'] 1d6 + str bludgeoning {'5': '+1d6 base damage', '10': '+1d6 base damage, and the target gains the woozy debuff.', '15': '+1d6 base damage, and if the target loses at least 3 health bar slots, they gain the take down debuff.'}"}, {"id": "skill-cockroach", "reference": true, "referenceEntry": true, "title": "Cockroach", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Constitution\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Constitution\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>Once per scene\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>This Limited Skill can only be learned via a Race, Class, or item. Mark the skill for advancement until you reach Rank 5. After that, Ranks in this Skill only increase by magical means and training.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>When an Attack would drop you to 0% Health Bar, roll an Unopposed Skill Check.\u003c/p>\u003cp>On Success, drop to 10% instead.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>No Skill Check required anymore.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The crawler’s Health Bar is unaffected by damage that would drop them to 0%.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Cooldown is twice per scene. When it triggers, the crawler heals to 100% and has +Rank DR until the end of the next round of combat.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 188 · PDF pages 190\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">COCKROACH\nConstitution\nLimitation: This Limited Skill can only be learned via\na Race, Class, or item. Mark the skill for advancement\nuntil you reach Rank 5. After that, Ranks in this Skill\nonly increase by magical means and training.\nCooldown: Once per scene\nWhen an Attack would drop you to 0% Health Bar, roll\nan Unopposed Skill Check.\nOn Success, drop to 10% instead.\nUPGRADES\nRank 5: No Skill Check required anymore.\nRank 10: The crawler’s Health Bar is unaffected by\ndamage that would drop them to 0%.\nRank 15: Cooldown is twice per scene. When it trig‑\ngers, the crawler heals to 100% and has +Rank DR\nuntil the end of the next round of combat.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "cockroach utility skills cockroach cockroach utility_skill constitution constitution false false false [] [] once per scene this limited skill can only be learned via a race, class, or item. mark the skill for advancement until you reach rank 5. after that, ranks in this skill only increase by magical means and training. when an attack would drop you to 0% health bar, roll an unopposed skill check.\n\non success, drop to 10% instead. {'5': 'no skill check required anymore.', '10': 'the crawler’s health bar is unaffected by damage that would drop them to 0%.', '15': 'cooldown is twice per scene. when it triggers, the crawler heals to 100% and has +rank dr until the end of the next round of combat.'}"}, {"id": "skill-cooking", "reference": true, "referenceEntry": true, "title": "Cooking", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You are skilled in the culinary arts. Once you have your ingredients and 1 hour to prepare it, make an Unopposed Skill Check. On Success, you make edible food for you and your party.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>It takes you 30 minutes to prepare a meal with makeshift ingredients.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The diners gain the day-long “You are full!” Buff: Heal 2 Health Bar slots per hour when not resting.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The “You are full!” Buff also causes Debuffs to end if you drop to 10% Health Bar.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 188–189 · PDF pages 190–191\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">COOKING\nIntelligence\nYou are skilled in the culinary arts. Once you have\nyour ingredients and 1 hour to prepare it, make an\nUnopposed Skill Check.\nOn Success, you make edible food for you and your\nparty.\nUPGRADES\nRank 5: It takes you 30 minutes to prepare a meal with\nmakeshift ingredients.\nRank 10: The diners gain the day-long “You are full!” Buff:\nHeal 2 Health Bar slots per hour when not resting.\nRank 15: The “You are full!” Buff also causes Debuffs\nto end if you drop to 10% Health Bar.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "cooking utility skills cooking cooking utility_skill intelligence intelligence false false false [] [] you are skilled in the culinary arts. once you have your ingredients and 1 hour to prepare it, make an unopposed skill check. on success, you make edible food for you and your party. {'5': 'it takes you 30 minutes to prepare a meal with makeshift ingredients.', '10': 'the diners gain the day-long “you are full!” buff: heal 2 health bar slots per hour when not resting.', '15': 'the “you are full!” buff also causes debuffs to end if you drop to 10% health bar.'}"}, {"id": "skill-crossbow", "reference": true, "referenceEntry": true, "title": "Crossbow", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>50 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Cooldown\u003c/dt>\u003cdd>Once per round.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield. Each Attack requires proper ammunition.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage, and the target gains the Blood Trail Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and the range is 100 feet.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 181 · PDF pages 183\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">CROSSBOW\nRanged Attack, Dex\nRange: 50 feet\nLimitations: Requires two hands to wield. Each Attack\nrequires proper ammunition.\nCooldown: Once per round.\nBase Damage: 1d8 Piercing\nUPGRADES\nRank 5: +1d8 base damage\nRank 10: +1d8 base damage, and the target gains the\nBlood Trail Debuff.\nRank 15: +1d8 base damage, and the range is 100\nfeet.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "crossbow ranged weapon skills crossbow crossbow attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['piercing'] 50 feet once per round. requires two hands to wield. each attack requires proper ammunition. 1d8 piercing {'5': '+1d8 base damage', '10': '+1d8 base damage, and the target gains the blood trail debuff.', '15': '+1d8 base damage, and the range is 100 feet.'}"}, {"id": "skill-dagger", "reference": true, "referenceEntry": true, "title": "Dagger", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Edged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and this Attack deals Armor-Piercing damage (ignores DR).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and you can throw this weapon (using this Skill) up to a range of Rank × 5 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and Attacks targeting the back of a foe deal ×2 damage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178 · PDF pages 180\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DAGGER\nMelee Attack, Dex\nAI Favor: 1\nBase Damage: 1d4 + Str Piercing\nUPGRADES\nRank 5: +1d4 base damage, and this Attack deals\nArmor-Piercing damage (ignores DR).\nRank 10: +1d4 base damage, and you can throw this\nweapon (using this Skill) up to a range of Rank × 5 feet.\nRank 15: +1d4 base damage, and Attacks targeting\nthe back of a foe deal ×2 damage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "dagger edged weapon skills dagger dagger attack_skill edged weapon skills melee attack, dex dexterity false false false melee [] ['piercing'] 1 1d4 + str piercing {'5': '+1d4 base damage, and this attack deals armor-piercing damage (ignores dr).', '10': '+1d4 base damage, and you can throw this weapon (using this skill) up to a range of rank × 5 feet.', '15': '+1d4 base damage, and attacks targeting the back of a foe deal ×2 damage.'}"}, {"id": "skill-deception", "reference": true, "referenceEntry": true, "title": "Deception", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>If you know the truth but want to obscure it, this is the Skill for you. When you lie and try to get away with it, make an Int-Opposed Skill Check. If the creature you’re lying to has the Detect Lies Skill, you make this Check with Disadvantage.\u003c/p>\u003cp>On Success, they believe you!\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can use this Skill while gambling.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can use this Skill to forge documents.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You’re good enough to know when you’ve been caught. If you fail this Check, you may perform one Action before your foes can react.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 189 · PDF pages 191\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DECEPTION\nCharisma\nIf you know the truth but want to obscure it, this is the\nSkill for you. When you lie and try to get away with it,\nmake an Int-Opposed Skill Check. If the creature you’re\nlying to has the Detect Lies Skill, you make this Check\nwith Disadvantage.\nOn Success, they believe you!\nUPGRADES\nRank 5: You can use this Skill while gambling.\nRank 10: You can use this Skill to forge documents.\nRank 15: You’re good enough to know when you’ve\nbeen caught. If you fail this Check, you may perform\none Action before your foes can react.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "deception utility skills deception deception utility_skill charisma charisma false false false [] [] if you know the truth but want to obscure it, this is the skill for you. when you lie and try to get away with it, make an int-opposed skill check. if the creature you’re lying to has the detect lies skill, you make this check with disadvantage.\n\non success, they believe you! {'5': 'you can use this skill while gambling.', '10': 'you can use this skill to forge documents.', '15': 'you’re good enough to know when you’ve been caught. if you fail this check, you may perform one action before your foes can react.'}"}, {"id": "skill-detect-lies", "reference": true, "referenceEntry": true, "title": "Detect Lies", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You have an incredible bullshit detector. If you believe someone is trying to lie to you, make a Cha-Opposed Skill Check. If they possess the Deception Skill, you make this Check with Disadvantage.\u003c/p>\u003cp>On Success, you sense if they’re lying, but if they believe they’re telling the truth, you sense they’re telling the truth.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>When you Fail, you still can’t detect the lie, but you can ignore the additional effects of a Major Fail or worse.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When you Fail, you can’t detect the lie, but you can ignore the effects of a Critical Fail.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You do not need to see the speaker, which allows you to detect lies in text and audio form.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 189 · PDF pages 191\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DETECT LIES\nIntelligence\nYou have an incredible bullshit detector. If you believe\nsomeone is trying to lie to you, make a Cha-Opposed\nSkill Check. If they possess the Deception Skill, you\nmake this Check with Disadvantage.\nOn Success, you sense if they’re lying, but if they believe\nthey’re telling the truth, you sense they’re telling the truth.\nUPGRADES\nRank 5: When you Fail, you still can’t detect the lie, but you\ncan ignore the additional effects of a Major Fail or worse.\nRank 10: When you Fail, you can’t detect the lie, but\nyou can ignore the effects of a Critical Fail.\nRank 15: You do not need to see the speaker, which\nallows you to detect lies in text and audio form.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "detect lies utility skills detect-lies detect lies utility_skill intelligence intelligence false false false [] [] you have an incredible bullshit detector. if you believe someone is trying to lie to you, make a cha-opposed skill check. if they possess the deception skill, you make this check with disadvantage.\n\non success, you sense if they’re lying, but if they believe they’re telling the truth, you sense they’re telling the truth. {'5': 'when you fail, you still can’t detect the lie, but you can ignore the additional effects of a major fail or worse.', '10': 'when you fail, you can’t detect the lie, but you can ignore the effects of a critical fail.', '15': 'you do not need to see the speaker, which allows you to detect lies in text and audio form.'}"}, {"id": "skill-detect-trap", "reference": true, "referenceEntry": true, "title": "Detect Trap", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>When you suspect a room, door, chest, or other object has an active trap, this is the Skill you want. Make an Unopposed Skill Check. Roll with Disadvantage when using this Skill to scan an entire room or while moving.\u003c/p>\u003cp>On Success, you are alerted to the presence of a non-magic trap, which typically allows you to avoid triggering it.\u003c/p>\u003cp>On Fail, you sense nothing, and a trap may or may not be present.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can detect magical traps.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You no longer roll with Disadvantage when searching a broad area or while moving.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>When you are aware of nearby traps, your party has Advantage on their first Check to avoid or escape the effects.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 189 · PDF pages 191\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DETECT TRAP\nIntelligence\nWhen you suspect a room, door, chest, or other object\nhas an active trap, this is the Skill you want. Make an\nUnopposed Skill Check. Roll with Disadvantage when\nusing this Skill to scan an entire room or while moving.\nOn Success, you are alerted to the presence of a\nnon-magic trap, which typically allows you to avoid\ntriggering it.\nOn Fail, you sense nothing, and a trap may or may not\nbe present.\nUPGRADES\nRank 5: You can detect magical traps.\nRank 10: You no longer roll with Disadvantage when\nsearching a broad area or while moving.\nRank 15: When you are aware of nearby traps, your\nparty has Advantage on their first Check to avoid or\nescape the effects.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "detect trap utility skills detect-trap detect trap utility_skill intelligence intelligence false false false [] [] when you suspect a room, door, chest, or other object has an active trap, this is the skill you want. make an unopposed skill check. roll with disadvantage when using this skill to scan an entire room or while moving.\n\non success, you are alerted to the presence of a non-magic trap, which typically allows you to avoid triggering it.\n\non fail, you sense nothing, and a trap may or may not be present. {'5': 'you can detect magical traps.', '10': 'you no longer roll with disadvantage when searching a broad area or while moving.', '15': 'when you are aware of nearby traps, your party has advantage on their first check to avoid or escape the effects.'}"}, {"id": "skill-determine-value", "reference": true, "referenceEntry": true, "title": "Determine Value", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Ranks in this Skill only increase by magical means.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You can sort your HUD’s Inventory by item value. The actual gold value is not displayed.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your Inventory is tabbed to sort your items by type, and it includes a history tab that tracks your item usage and any former owners of an item.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can determine what type of loot box the item would have come from.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Whenever you add a new item to your Inventory, the gold value of that item is displayed.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 189 · PDF pages 191\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DETERMINE VALUE\nPassive\nLimitations: Ranks in this Skill only increase by\nmagical means.\nYou can sort your HUD’s Inventory by item value. The\nactual gold value is not displayed.\nUPGRADES\nRank 5: Your Inventory is tabbed to sort your items by\ntype, and it includes a history tab that tracks your item\nusage and any former owners of an item.\nRank 10: You can determine what type of loot box the\nitem would have come from.\nRank 15: Whenever you add a new item to your Inven‑\ntory, the gold value of that item is displayed.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "determine value utility skills determine-value determine value utility_skill passive true false false [] [] ranks in this skill only increase by magical means. you can sort your hud’s inventory by item value. the actual gold value is not displayed. {'5': 'your inventory is tabbed to sort your items by type, and it includes a history tab that tracks your item usage and any former owners of an item.', '10': 'you can determine what type of loot box the item would have come from.', '15': 'whenever you add a new item to your inventory, the gold value of that item is displayed.'}"}, {"id": "skill-diplomacy", "reference": true, "referenceEntry": true, "title": "Diplomacy", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Used in mediation between opposing organizations and parties. Make an Int-Opposed Skill Check of the side with the higher Int Mod.\u003c/p>\u003cp>On Success, the two parties are willing to discuss options.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Roll with Advantage if you are not a member of either party.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Each side accepts consequences if they break the deal.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Hostilities cease at least for the remainder of the day.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 189 · PDF pages 191\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DIPLOMACY\nCharisma\nUsed in mediation between opposing organizations\nand parties. Make an Int-Opposed Skill Check of the\nside with the higher Int Mod.\nOn Success, the two parties are willing to discuss options.\nUPGRADES\nRank 5: Roll with Advantage if you are not a member\nof either party.\nRank 10: Each side accepts consequences if they\nbreak the deal.\nRank 15: Hostilities cease at least for the remainder of\nthe day.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "diplomacy utility skills diplomacy diplomacy utility_skill charisma charisma false false false [] [] used in mediation between opposing organizations and parties. make an int-opposed skill check of the side with the higher int mod.\n\non success, the two parties are willing to discuss options. {'5': 'roll with advantage if you are not a member of either party.', '10': 'each side accepts consequences if they break the deal.', '15': 'hostilities cease at least for the remainder of the day.'}"}, {"id": "skill-dirty-fighting", "reference": true, "referenceEntry": true, "title": "Dirty Fighting", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Damage Effect Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Pugilism or Wrasslin’ Damage Effect, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You use underhanded tactics to win fights and cause a different kind of harm to your opponents. If the Attack Skill Check is a Critical Fail, lose 1 Popularity.\u003c/p>\u003cp>Apply the Woozy Debuff to the target.\u003c/p>\u003cp>\u003cstrong>Damage effect for:\u003c/strong> Pugilism or Wrasslin’\u003c/p>\u003cp>\u003ca class=\"wl\" href=\"#skill-pugilism\">Pugilism\u003c/a> · \u003ca class=\"wl\" href=\"#skill-wrasslin\">Wrasslin’\u003c/a>\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Also apply The Taint Debuff to the target.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Also apply the Blinded Debuff to the target. You no longer lose Popularity on Critical Fails.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Also apply an immediate Minor Injury Debuff to the target.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 180 · PDF pages 182\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DIRTY FIGHTING\nPugilism or Wrasslin’ Damage Effect, Passive\nYou use underhanded tactics to win fights and cause a\ndifferent kind of harm to your opponents. If the Attack\nSkill Check is a Critical Fail, lose 1 Popularity.\nApply the Woozy Debuff to the\ntarget.\nUPGRADES\nRank 5: Also apply The Taint Debuff to the target.\nRank 10: Also apply the Blinded Debuff to the target.\nYou no longer lose Popularity on Critical Fails.\nRank 15: Also apply an immediate Minor Injury Debuff\nto the target.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "dirty fighting hand-to-hand damage effect skills dirty-fighting dirty fighting attack_skill hand-to-hand damage effect skills pugilism or wrasslin’ damage effect, passive true false false pugilism or wrasslin’ [] [] you use underhanded tactics to win fights and cause a different kind of harm to your opponents. if the attack skill check is a critical fail, lose 1 popularity.\n\napply the woozy debuff to the target. {'5': 'also apply the taint debuff to the target.', '10': 'also apply the blinded debuff to the target. you no longer lose popularity on critical fails.', '15': 'also apply an immediate minor injury debuff to the target.'}"}, {"id": "skill-dodge", "reference": true, "referenceEntry": true, "title": "Dodge", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Mark the Skill for Advancement when Evading until you reach Rank 5. After that, Ranks in this Skill only increase by magical means and training.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You gain a +1 Evade Buff.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Gain a +1 Evade Buff, and you may Step an additional 5 feet when you perform the Evade Action.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Gain a +2 Evade Buff, and roll Evade with Advantage vs. Spells and Ranged Attacks.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Gain a +2 Evade Buff, and you may perform the Evade Action without spending an Action in combat.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 190 · PDF pages 192\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DODGE\nPassive\nLimitations: Mark the Skill for Advancement when\nEvading until you reach Rank 5. After that, Ranks in\nthis Skill only increase by magical means and training.\nYou gain a +1 Evade Buff.\nUPGRADES\nRank 5: Gain a +1 Evade Buff, and you may Step an\nadditional 5 feet when you perform the Evade Action.\nRank 10: Gain a +2 Evade Buff, and roll Evade with\nAdvantage vs. Spells and Ranged Attacks.\nRank 15: Gain a +2 Evade Buff, and you may per‑\nform the Evade Action without spending an Action in\ncombat.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "dodge utility skills dodge dodge utility_skill passive true false false [] [] mark the skill for advancement when evading until you reach rank 5. after that, ranks in this skill only increase by magical means and training. you gain a +1 evade buff. {'5': 'gain a +1 evade buff, and you may step an additional 5 feet when you perform the evade action.', '10': 'gain a +2 evade buff, and roll evade with advantage vs. spells and ranged attacks.', '15': 'gain a +2 evade buff, and you may perform the evade action without spending an action in combat.'}"}, {"id": "skill-double-tap", "reference": true, "referenceEntry": true, "title": "Double Tap", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>To engage this Skill, you must declare a Double Tap at the start of the combat round, before Mob Actions have been determined. You must then use all of your Actions this round to Attack a single target with the same weapon or Spell. Mark this Skill for advancement anytime you roll an Amazing Success or better while using it.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>If your first Attack is an Amazing Success or better, your second Attack (if it hits) is upgraded to a Critical Hit.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Roll your first Attack with Advantage. better, the second Attack (if it hits) is upgraded to a Critical Hit.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Roll your second Attack with Advantage. If your second Attack is a Critical Hit or upgraded to one, deal ×3 damage (instead of ×2).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 190 · PDF pages 192\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DOUBLE TAP\nPassive\nLimitations: To engage this Skill, you must declare a\nDouble Tap at the start of the combat round, before\nMob Actions have been determined. You must then\nuse all of your Actions this round to Attack a single\ntarget with the same weapon or Spell. Mark this Skill\nfor advancement anytime you roll an Amazing Success\nor better while using it.\nIf your first Attack is an Amazing Success or better, your\nsecond Attack (if it hits) is upgraded to a Critical Hit.\nUPGRADES\nRank 5: Roll your first Attack with Advantage.\nbetter, the second Attack (if it hits) is upgraded to a\nCritical Hit.\nRank 15: Roll your second Attack with Advantage. If\nyour second Attack is a Critical Hit or upgraded to one,\ndeal ×3 damage (instead of ×2).\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "double tap utility skills double-tap double tap utility_skill passive true false false [] [] to engage this skill, you must declare a double tap at the start of the combat round, before mob actions have been determined. you must then use all of your actions this round to attack a single target with the same weapon or spell. mark this skill for advancement anytime you roll an amazing success or better while using it. if your first attack is an amazing success or better, your second attack (if it hits) is upgraded to a critical hit. {'5': 'roll your first attack with advantage. better, the second attack (if it hits) is upgraded to a critical hit.', '15': 'roll your second attack with advantage. if your second attack is a critical hit or upgraded to one, deal ×3 damage (instead of ×2).'}"}, {"id": "skill-driving", "reference": true, "referenceEntry": true, "title": "Driving", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>If you Attack while Driving, you suffer Disadvantage on those Checks.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You don’t need this Skill if you’re casually driving down the road to pick up a quart of milk, but if you’re racing, chasing, showing off, or doing something dangerous in a vehicle, this is the Skill you want.\u003c/p>\u003cp>If you’re doing something wild or trying to avoid becoming a skid mark on the highway, make an Unopposed Skill Check. Depending on how extreme the circumstances are, the GM may apply Advantage or Disadvantage to the Check.\u003c/p>\u003cp>On Success, you achieve your daredevil maneuver or avoid wrecking your vehicle.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You no longer suffer Disadvantage when attacking while Driving.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Your vehicle has +5ft Move. Rol
