for each higher degree of success. {&#x27;5&#x27;: &#x27;if you observe the foes and battlefield for at least 5 minutes prior to combat, roll this skill check with advantage.&#x27;, &#x27;10&#x27;: &#x27;after using this skill during a combat, you roll 2d10 when you call a play (still choose one die).&#x27;, &#x27;15&#x27;: &#x27;the bonus applies to all three combat disciplines instead of just one.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-tactics\">Tactics\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"tattoo-artistry tattoo artistry utility_skill dexterity dexterity false false false [] [] used to stick and poke ink under someone’s skin to create a mundane tattoo. see crafting, p. 221 for magical tattoos. {&#x27;5&#x27;: &#x27;you may craft tattoos with up to a +5 bonus.&#x27;, &#x27;10&#x27;: &#x27;you may craft tattoos with up to a +10 bonus.&#x27;, &#x27;15&#x27;: &#x27;your crafting with this skill takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-tattoo-artistry\">Tattoo Artistry\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"taunt taunt utility_skill charisma, interrupt charisma false true false [] [] with a shout, some choice words, and maybe an obscene hand gesture, you attempt to draw the ire of enemies within 30 feet of you. after seeing where the mob attacks are headed, make an int-opposed skill check. on success, taunt one attack of your choosing away from any target of your choosing and onto you. higher degrees of success allow you to taunt additional attacks onto you. {&#x27;5&#x27;: &#x27;you may make a free evade check against each taunted attack (roll separately vs. each attack as usual). then you may still spend an action to evade other attacks and reroll any fails from your free evades.&#x27;, &#x27;10&#x27;: &#x27;you can affect mobs within 60 feet.&#x27;, &#x27;15&#x27;: &#x27;your free evade checks against taunted attacks are made with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-taunt\">Taunt\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003cp class=\"source\">Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"throwing throwing utility_skill strength strength false false false [] [] this skill is used for passing the pigskin with your pops or throwing dynamite (potentially also at your pops).\n\nyou can throw an object that weighs up to your str in pounds at a distance of up to your str ×10 feet. if you want to throw a heavier or bulkier item (up to the gm’s discretion), you do so with disadvantage.\n\nto hit a target area, make an unopposed skill check.\n\nto hit a foe with an object, make an attack skill check vs. the target’s evade.\n\non success, you hit the target. on fail, roll 1d8 for direction (see figure 3). the amount the skill check missed by is the distance away in feet it lands. {&#x27;5&#x27;: &#x27;you have advantage when throwing to a target who wants to catch what you are selling.&#x27;, &#x27;10&#x27;: &#x27;choose the direction on a miss, rather than roll.&#x27;, &#x27;15&#x27;: &#x27;your throw range is your str ×20 feet.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-throwing\">Throwing\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"toss toss attack_skill hand-to-hand damage effect skills wrasslin’ damage effect, passive true false false wrasslin’ [] [] you deal +1d8 base damage + str bludgeoning, end the held debuff, and throw the target 5 feet for every five ranks (minimum 5 feet) you have in this skill. you can only toss foes of a smaller size than you. {&#x27;5&#x27;: &#x27;you can toss foes up to your own size or smaller.&#x27;, &#x27;10&#x27;: &#x27;you can toss foes one size larger than you or smaller.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and you can throw foes two sizes larger than you or smaller. ranged skills allow you to strike targets from a distance, hopefully before they can get into range to attack you— you filthy camper. all ranged weapons use your dex to hit, and some add your str to the damage.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-toss\">Toss\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"tracking tracking utility_skill intelligence intelligence false false false [] [] use this skill to find and follow tracks. when searching for or attempting to follow tracks, make an unopposed skill check. factors such as how long ago the tracks were made, the ground conditions, and whether other tracks or marks obscure them may influence the difficulty. once you find tracks, you must make another tracking check every 15 minutes to continue following them.\n\non success, you either find the tracks or continue following them. {&#x27;5&#x27;: &#x27;you can follow found tracks for 30 minutes before making a new check, and gain 1 piece of information about the target(s).&#x27;, &#x27;10&#x27;: &#x27;you can follow found tracks for 1 hour before making a new check, and gain 2 pieces of information about the target(s).&#x27;, &#x27;15&#x27;: &#x27;you can follow found tracks for 2 hours before making a new check, and gain 4 pieces of information about the target(s).&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-tracking\">Tracking\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"trap-engineer trap engineer utility_skill intelligence intelligence false false false [] [] used to craft traps via a sapper’s table with a trap module (3,000 gold). see crafting, p. 221. {&#x27;5&#x27;: &#x27;roll with advantage when making non-explosive traps.&#x27;, &#x27;10&#x27;: &#x27;your traps can be set to trigger only against a specific mob, boss, npc, or crawler.&#x27;, &#x27;15&#x27;: &#x27;add a +5 splash to your trap at no additional difficulty, and your crafting takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-trap-engineer\">Trap Engineer\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"unarmed-combat unarmed combat attack_skill hand-to-hand combat skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 1 cannot choose a damage effect. 1d4 + str bludgeoning every crawler starts out with this skill. this is a mixture of all strikes, so call it what you will when you attack. {&#x27;5&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;15&#x27;: &#x27;+2d4 base damage&#x27;}\" data-category=\"Hand-to-Hand Combat Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-unarmed-combat\">Unarmed Combat\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Combat Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d4 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"warhammer warhammer attack_skill bashing weapon skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] requires two hands to wield. 1d10 + str bludgeoning {&#x27;5&#x27;: &#x27;+1d10 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d10 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d10 base damage, and the target (of your size or smaller) is pushed 15 feet.&#x27;}\" data-category=\"Bashing Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-warhammer\">Warhammer\u003c/a>\u003c/h2>\u003cp class=\"source\">Bashing Weapon Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d10 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"wrasslin wrasslin’ attack_skill hand-to-hand combat skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 1 (only if no damage effect is used) requires two hands to wield. 1d4 + str bludgeoning choose the choke out, dirty fighting, or toss damage effect (if you wish) before rolling to hit.\n\non success, the target gains the held debuff. held foes continue to be held until they spend an action to attempt escape (mobs may use their move action). to prevent such an escape, you must use an action as an interrupt and succeed in a wrasslin’ str-opposed skill check. {&#x27;5&#x27;: &#x27;you may maintain the held debuff at no action cost if you wish, but your skill check to prevent escape is made with disadvantage.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage hand-to-hand damage effects are a special kind of passive skill that can be added to certain hand-to-hand skills to enhance or modify the attack. if the attack succeeds, the chosen damage effect applies as well. if the attack fails, the damage effect does nothing but still goes on cooldown (if there is one). when you make an attack that adds a damage effect, place a mark for later skill advancement (p. 169) in either the attack skill or the damage effect, not both.&#x27;}\" data-category=\"Hand-to-Hand Combat Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-wrasslin\">Wrasslin’\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Combat Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d4 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"zone-of-control zone of control utility_skill passive true false false [] [] you must be wielding a reach weapon. once per round, when an enemy enters a space adjacent to you for the first time, you may perform an interrupt attack against them at a cost of one action. make the attack with disadvantage. {&#x27;5&#x27;: &#x27;your attack is no longer made with disadvantage.&#x27;, &#x27;10&#x27;: &#x27;the target is pushed 5 feet.&#x27;, &#x27;15&#x27;: &#x27;make your attack skill check with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-zone-of-control\">Zone of Control\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003c/div>\u003cp data-reference-empty hidden>No entries match. Try clearing a filter.\u003c/p>", "backlinks": ["skill-acute-ears", "skill-aiming", "skill-alchemy", "skill-ambush", "skill-animal-handling", "skill-arcane", "skill-attack-of-opportunity", "skill-axe", "skill-back-claw", "skill-backfire", "skill-balance", "skill-basic-science", "skill-bite", "skill-bomb-surgeon", "skill-bow", "skill-calligraphy", "skill-cartography", "skill-cat-like-reflexes", "skill-catcher", "skill-cesta-punta", "skill-character-actor", "skill-choke-out", "skill-chopper-pilot", "skill-climbing", "skill-club", "skill-cockroach", "skill-cooking", "skill-crossbow", "skill-dagger", "skill-deception", "skill-detect-lies", "skill-detect-trap", "skill-determine-value", "skill-diplomacy", "skill-dirty-fighting", "skill-dodge", "skill-double-tap", "skill-driving", "skill-dumpster-diving", "skill-endurance", "skill-engineering", "skill-escape-artist", "skill-escape-plan", "skill-explosives-handling", "skill-fabricate", "skill-find-crawler", "skill-find-trap", "skill-first-aid", "skill-foot-soldier", "skill-gear-head", "skill-goblin-explosives", "skill-good-first-impression", "skill-handgun", "skill-herding-weapons", "skill-hide-in-shadows", "skill-improvised-explosive-device", "skill-improvised-weapons", "skill-incendiary-device-handling", "skill-infusion", "skill-intimidate", "skill-investigation", "skill-iron-punch", "skill-iron-stomach", "skill-javelin", "skill-jumping", "skill-lance", "skill-leadership", "skill-light-on-your-feet", "skill-lockpicking", "skill-longsword", "skill-lore", "skill-negotiation", "skill-noggin-nocker", "skill-pathfinder", "skill-perception", "skill-performance", "skill-persuasion", "skill-polearm", "skill-powerful-strike", "skill-pugilism", "skill-quarterstaff", "skill-rapier", "skill-regeneration", "skill-religion", "skill-repair", "skill-riding", "skill-ropework", "skill-running", "skill-salvage", "skill-scutelliphily", "skill-shield-block", "skill-shotgun", "skill-shuriken", "skills-rules", "skill-skullcracker", "skill-sleight-of-hand", "skill-slice-attack", "skill-slingshot", "skill-smithing", "skill-smush", "skill-stealth", "skill-streetwise", "skill-survival", "skill-swimming", "skill-tactics", "skill-tattoo-artistry", "skill-taunt", "skill-throwing", "skill-toss", "skill-tracking", "skill-trap-engineer", "skill-unarmed-combat", "skill-warhammer", "skill-wrasslin", "skill-zone-of-control"], "search": "skills 114 entries · royal court edition "}, {"id": "skills-rules", "reference": true, "referenceEntry": false, "title": "Skills — Rules", "group": "Skills", "type": "rule", "typeLabel": "Game Guide", "dek": "General rules from the Royal Court Edition.", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← Browse skills\u003c/a>\u003c/p>\u003ch2>Skills\u003c/h2>\u003cp>Skills are the heart of the Dungeon Crawler Carl Roleplaying Game. You make Skill Checks to do most things and gain upgrades from ranking up Skills. Each Skill entry follows a consistent format: The header is the name that tells you exactly what it’s called—hopefully something that sounds impressive when shouted aloud. Under the header is a list of keywords identifying the Stat Mod you add to the Skill Check, if any, and any special traits tied to the Skill. The description explains what the Skill actually does, which you should probably read before attempting it. On average, 35.71% of deaths in past Crawls are attributable to illiteracy. The description may contain additional keywords like “AI Favor” and “Limitations,” which vary by the Skill type. Finally, the entry teases you with upgrade benefits if you train it to higher Ranks, as if you need more incentive to avoid your leg being ripped off by a giant demon crab, only to wake up two floors later to discover it grew an eyeball and a mouth and is licking your face off in anger at being replaced by a prosthetic.\u003c/p>\u003cp class=\"source\">Printed pages 173 · PDF pages 175\u003c/p>\u003ch2>Skill Checks\u003c/h2>\u003cp>Skill Checks are either Opposed or Unopposed, depending on what you are up against (see p. 59). Roll 1d20, add your Skill’s Rank, and add your associated Stat Mod. If the total matches or exceeds the Difficulty of the Check, the outcome is at least a Standard Success but could grant even better effects if you significantly exceed the Difficulty. Your GM determines the Difficulty for a Check, so they’re the one who needs to know the exact type of Skill Check you’re making. They won’t share the Difficulty with you but will only inform you of the outcome. Don’t worry, System AIs don’t cheat or lie; we always fully believe what we tell you. But if you must know every detail (good for you, boring for viewers), Opposed Skills make Checks against a specific antagonist, and the Difficulty factors in their Stat Mod. Unopposed Skills make Checks against things that don’t have a Stat block, like objects or the environment. The Skill’s description lists the effects of a Standard Success. Lots of results are possible other than a Standard Success (see Degrees of Success and Failure, p. 60). Know that I encourage GMs to get creative when narrating both Successes and Fails; the more spectacular the results (good or bad), the more the viewers can’t turn away.\u003c/p>\u003cp class=\"source\">Printed pages 173 · PDF pages 175\u003c/p>\u003ch2>Passive Skills\u003c/h2>\u003cp>You don’t make Skill Checks to gain the effects of Passive Skills. This makes them easy to use but hard to Rank-up; since you don’t make a Skill Check, you can’t mark it for a Skill Advancement Check (p. 169). Each Passive Skill entry describes how you can increase its Rank, typically requiring magic gear and training, though some feature other ways. Using a Passive Skill typically requires an Action like any other Skill type. However, some trigger alongside other Skills at no extra Action cost, like Hand-to-Hand Damage Effects (see p. 180). You can’t use a Passive Skill if you have no Ranks in it (untrained). The easiest way to gain them is via a potion, scroll, or gear. They can also be found in some Race and Class benefits starting on the Third Floor.\u003c/p>\u003cp class=\"source\">Printed pages 173 · PDF pages 175\u003c/p>\u003ch2>Skill Upgrades\u003c/h2>\u003cp>As Skills increase in Rank, they grant additional bonuses at Ranks 5, 10, and 15. add extra damage dice to the base effect damage, and these always apply even if other parts of the Upgrade are situational. Where an Upgrade increases the range or duration, removes a limitation, or the like, the Upgrade overrides the base effect instead of being in addition to it. All other sorts of Upgrades get added together. Typically, these additive Upgrades use a plus sign (+) to help note this.\u003c/p>\u003cp class=\"source\">Printed pages 173–174 · PDF pages 175–176\u003c/p>\u003ch2>Creating Your Own Skills\u003c/h2>\u003cp>The list of Skills in the World Dungeon is endless. Our artificial sky’s the limit, folks! Here’s the framework in which you can create any Skill you want. You’ll need to use it if you come across a Skill or Spell marked with an gear asterisk ( ): that’s the cue that it’s a Custom Skill not found in this book. The simplest way to customize a Skill is to reuse an existing Skill but reframe its narrative. A Skill like Dumpster Diving could just as easily become Search 4 174 Copyright Renegade Game Studios. Unauthorized distribution prohibited. 08/25/2026. just by changing the name and thematic focus while still operating within the same mechanical structure. Mixing and matching Skill effects and Upgrades is a great way to create weird Skills to really customize your crawler. A Crochet Skill, for instance, might have a custom Upgrade that works like a Utility Skill Upgrade, or it could borrow a Rank 5 Upgrade found on the Dagger Skill. You can invent a new effect or Upgrade following the guideline that the more niche it is, the stronger it can be. If something ends up too strong or too weak, the GM can always patch it later. The system adjusts; so should you. In play, you’ll often find more than one Skill that applies to a situation. Because Skills improve through use, you might choose to attempt a task with a weaker or less-optimal Skill just to gain experience with it. This is perfectly normal behavior and occa-sionally even works out. Made-up Skills should typically be narrowly focused and should not completely replace or outgun existing Skills… or Actions like Evade. If you want to create an Evade-like Skill, it should perhaps only be useful against a certain attack type (such as Edged Weapons and Ranged Weapons) or come with a significant downside that makes its usage situational. Evade Checks don’t use Ranks, so anything that adds Ranks to a Skill Check that lets you avoid any type of attack will instantly be much better than Evading, and that’s a no-no. If you don’t spill blood, I won’t be happy. That’s the whole point!\u003c/p>\u003cp class=\"source\">Printed pages 174–175 · PDF pages 176–177\u003c/p>\u003ch2>Attack Skills (Weapons)\u003c/h2>\u003cp>Attack Skills represent your ability to harm, disable, or otherwise make something stop trying to kill you, whether through weapons, fists, or pure destructive intent. Name: The name of the Attack appears as a headline to the entry. Attack Type: Melee or Ranged. Most Attacks are Melee, which have a range of 5 feet (i.e., adjacent). If an Attack has a range farther than that, it will be noted in the Range entry below this line. The default Stat Mod used for Melee rolls to hit is Str, while the default Stat Mod for ranged weapon Attacks is Dex. If another Stat Mod is used to hit, it will be listed here. Range: If the Attack can hit a target farther than 5 feet away, the maximum distance it can hit will be listed here. If the Attack has no range listed, its range is Melee range (adjacent or within 5 feet). AI Favor: Low-damage weapons grant AI Favor to you if you use such a wimpy Attack for a majority of your attacks during a combat that lasts for at least three rounds. Limitations: Any conditions, requirements, or penalties are listed here. “Requires two hands to wield” is a common limitation, which means both hands must be used to wield the weapon (I’m sure you never would’ve figured that out without this explanation). You can’t hold other things at the same time when attacking. If the weapon or effect has a cooldown, it will be listed here. Hit or miss, the timer starts. While on cooldown, the weapon or effect cannot be used. Description: Any notes or descriptions of the Skill are listed here. Make an Attack Skill Check vs. the target’s Evade value, which is: 10 + Dex + the Floor number. Base Damage: This is the damage dice the weapon deals with 0–4 Ranks in the Skill. Zero Ranks means using it untrained. The appropriate Stat Mod value is added to the damage. This Mod does not always match the one listed in the Attack Type line, and not every weapon adds a Stat Mod. Finally, the damage type is listed. The damage type is important if the target has Resistance, Immunity, or Vulnerability to that damage type. Effects: If there are effects other than damage, they will be listed there. Upgrades: When you reach Rank 5, 10, and 15, these bonuses kick in. Write your Attack Skills in the “Attacks” section on the front of your character sheet. Fill out the “To Hit” box for your weapons, writing in your “Rank + Stat Mod” values. Then fill in the “Damage” box. Write in the dice as “1dX,” replacing the “X” with the die type noted in the description. The weapon’s base damage entry will also tell you which Stat Mod (if any) you add to the damage. Use the Effects area to write in short reminders of base effects, Upgrade effects, and AI Favor (if any). Lastly, write in the Attack Skill name on your “Skills” list. There, you can write in additional notes and mark the advancement box on the far right when you use the Skill. This keeps all your Skills in one place when rolling for Skill Advancement (p. 169). Just remember to update your Rank in the “Attacks” section as well when you advance an Attack Skill, or you’ll be weak forever, just like your middle school gym teacher prophesied.\u003c/p>\u003cp class=\"source\">Printed pages 175–176 · PDF pages 177–178\u003c/p>\u003ch2>Explosives Skills\u003c/h2>\u003cp>For handling explosives, see Explosives Handling, Goblin Explosives, and Incendiary Device Handling in Utility Skills (below). These Skills will also be useful for crafting your own explosives once you have access to a Sapper’s Table on the Fourth Floor. As crawlers descend to lower floors, explosives become more complex than the Tutorial Floors’ “light and throw” variety. See the Area of Effect Attacks (p. 83) for targeting, Difficulties, and what happens when you miss your target with tossed explosives. Your explosives Skill is not used when attacking with a thrown explosive, but the GM should have you make an Unopposed handling Skill Check before throwing. Here are the explosives typically found on the first five floors. Lesser explosives can be found on lower floors, but the more powerful explosives are rarely seen on the upper floors. Floor 1: Standard Explosive—Dynamite: 1d6 Bludgeoning, 0ft Blast radius +5ft Splash. Floor 2: Goblin Explosive—Dynamite: 2d6 Bludgeoning damage, 5ft Blast radius + 5ft Splash. Floor 2: Incendiary Device—Carl’s Jug O’ Boom: 1d8 Fire damage, 5ft Blast radius + 15ft Splash. Anyone who loses at least 1 Health Bar slot gains the Burned Debuff. Floor 3: Goblin Explosive—Hob-Lobbers: 3d6 Piercing, +10ft Splash Floor 4: Standard Explosive—Demon Det Cord: 5d6 Bludgeoning, deals double damage to objects. Can only be applied to non-moving targets. Floor 5: Incendiary Device—Gnomish Knock-Knock: 4d6 Fire, 10ft Blast radius +10ft Splash, and anyone who fails to Evade gains the Burned Debuff. As this is a notoriously unstable fuel-air explosive, a Critical Fail is achieved on a Natural 1–4. Most explosives are custom made and not available on store shelves. Carl had his custom Jelly Bombs, Banger Spheres, Chum Bombs, and more.\u003c/p>\u003cp class=\"source\">Printed pages 183 · PDF pages 185\u003c/p>\u003ch2>Smoke\u003c/h2>\u003cp>Smoke is used for concealment, distraction, and confusion. Attacking into or out of smoke is done with Disadvantage (see Mob Advantage and Disadvantage p. 60). Thrown smoke bombs are popular on most dungeon floors as a way to get out of trouble quick-ly. See the Throwing Skill (p. 200) for targeting, Difficulties, and what happens when you miss your target. You don’t need to make a Skill Check to drop it in your own space. Floor 1: Goblin Smoke Bomb: Creates a multicolor smoke cloud that reaches 30 feet in each direction from the point of impact, with a maximum duration of 3 minutes. However, even a slight breeze will dissipate it in 1 minute. Floor 3: Hobgoblin Smoke Curtain: Creates a dense white fog over a 60ft radius that holds even in a breeze. Floor 5: Hobgoblin Disco Ball: Created by infusing (see Infusion Skill, p. 194) an Invisibility potion onto a Hobgoblin Smoke Curtain. It produces thick multi-hued smoke plumes, along with some sick beats. It blinds everyone in the area, friend and foe alike.\u003c/p>\u003cp class=\"source\">Printed pages 184 · PDF pages 186\u003c/p>\u003ch2>Utility Skills\u003c/h2>\u003cp>Utility Skills help crawlers survive, adapt, and solve problems that can’t be fixed by hitting them until they stop moving. Checks that are labeled as Unopposed can, at the GM’s discretion, become Opposed if something is actively working against you. For example, you’re trying to swim the rapids, and some dipshit is throwing fishing nets at you. Cut it out, Cletus! Or I’m gonna tell Mom on you!\u003c/p>\u003cp class=\"source\">Printed pages 184 · PDF pages 186\u003c/p>\u003ch2>Rank damage dice\u003c/h2>\u003cp>Use when an entry calls for Rank damage dice.\u003c/p>\u003ctable class=\"reference-table\">\u003cthead>\u003ctr>\u003cth>Rank\u003c/th>\u003cth>Damage dice\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>+1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2–3\u003c/td>\u003ctd>+1d2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4–5\u003c/td>\u003ctd>+1d4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6–7\u003c/td>\u003ctd>+1d6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8–9\u003c/td>\u003ctd>+1d8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10–11\u003c/td>\u003ctd>+1d10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12–13\u003c/td>\u003ctd>+1d12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14–15\u003c/td>\u003ctd>+1d8 &amp; +1d6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16–17\u003c/td>\u003ctd>+2d8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18–19\u003c/td>\u003ctd>+1d10 &amp; +1d8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>+2d10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "backlinks": ["skill-acute-ears", "skill-aiming", "skill-alchemy", "skill-ambush", "skill-animal-handling", "skill-arcane", "skill-attack-of-opportunity", "skill-axe", "skill-back-claw", "skill-backfire", "skill-balance", "skill-basic-science", "skill-bite", "skill-bomb-surgeon", "skill-bow", "skill-calligraphy", "skill-cartography", "skill-cat-like-reflexes", "skill-catcher", "skill-cesta-punta", "skill-character-actor", "skill-choke-out", "skill-chopper-pilot", "skill-climbing", "skill-club", "skill-cockroach", "skill-cooking", "skill-crossbow", "skill-dagger", "skill-deception", "skill-detect-lies", "skill-detect-trap", "skill-determine-value", "skill-diplomacy", "skill-dirty-fighting", "skill-dodge", "skill-double-tap", "skill-driving", "skill-dumpster-diving", "skill-endurance", "skill-engineering", "skill-escape-artist", "skill-escape-plan", "skill-explosives-handling", "skill-fabricate", "skill-find-crawler", "skill-find-trap", "skill-first-aid", "skill-foot-soldier", "skill-gear-head", "skill-goblin-explosives", "skill-good-first-impression", "skill-handgun", "skill-herding-weapons", "skill-hide-in-shadows", "skill-improvised-explosive-device", "skill-improvised-weapons", "skill-incendiary-device-handling", "skill-infusion", "skill-intimidate", "skill-investigation", "skill-iron-punch", "skill-iron-stomach", "skill-javelin", "skill-jumping", "skill-lance", "skill-leadership", "skill-light-on-your-feet", "skill-lockpicking", "skill-longsword", "skill-lore", "skill-negotiation", "skill-noggin-nocker", "skill-pathfinder", "skill-perception", "skill-performance", "skill-persuasion", "skill-polearm", "skill-powerful-strike", "skill-pugilism", "skill-quarterstaff", "skill-rapier", "skill-regeneration", "skill-religion", "skill-repair", "skill-riding", "skill-ropework", "skill-running", "skill-salvage", "skill-scutelliphily", "skill-shield-block", "skill-shotgun", "skill-shuriken", "skills", "skill-skullcracker", "skill-sleight-of-hand", "skill-slice-attack", "skill-slingshot", "skill-smithing", "skill-smush", "skill-stealth", "skill-streetwise", "skill-survival", "skill-swimming", "skill-tactics", "skill-tattoo-artistry", "skill-taunt", "skill-throwing", "skill-toss", "skill-tracking", "skill-trap-engineer", "skill-unarmed-combat", "skill-warhammer", "skill-wrasslin", "skill-zone-of-control"], "search": "skills — rules general rules from the royal court edition. skills are the heart of the dungeon crawler carl roleplaying game. you make skill checks to do most things and gain upgrades from ranking up skills. each skill entry follows a consistent format: the header is the name that tells you exactly what it’s called—hopefully something that sounds impressive when shouted aloud. under the header is a list of keywords identifying the stat mod you add to the skill check, if any, and any special traits tied to the skill. the description explains what the skill actually does, which you should probably read before attempting it. on average, 35.71% of deaths in past crawls are attributable to illiteracy. the description may contain additional keywords like “ai favor” and “limitations,” which vary by the skill type. finally, the entry teases you with upgrade benefits if you train it to higher ranks, as if you need more incentive to avoid your leg being ripped off by a giant demon crab, only to wake up two floors later to discover it grew an eyeball and a mouth and is licking your face off in anger at being replaced by a prosthetic. skill checks are either opposed or unopposed, depending on what you are up against (see p. 59). roll 1d20, add your skill’s rank, and add your associated stat mod. if the total matches or exceeds the difficulty of the check, the outcome is at least a standard success but could grant even better effects if you significantly exceed the difficulty. your gm determines the difficulty for a check, so they’re the one who needs to know the exact type of skill check you’re making. they won’t share the difficulty with you but will only inform you of the outcome. don’t worry, system ais don’t cheat or lie; we always fully believe what we tell you. but if you must know every detail (good for you, boring for viewers), opposed skills make checks against a specific antagonist, and the difficulty factors in their stat mod. unopposed skills make checks against things that don’t have a stat block, like objects or the environment. the skill’s description lists the effects of a standard success. lots of results are possible other than a standard success (see degrees of success and failure, p. 60). know that i encourage gms to get creative when narrating both successes and fails; the more spectacular the results (good or bad), the more the viewers can’t turn away. you don’t make skill checks to gain the effects of passive skills. this makes them easy to use but hard to rank-up; since you don’t make a skill check, you can’t mark it for a skill advancement check (p. 169). each passive skill entry describes how you can increase its rank, typically requiring magic gear and training, though some feature other ways. using a passive skill typically requires an action like any other skill type. however, some trigger alongside other skills at no extra action cost, like hand-to-hand damage effects (see p. 180). you can’t use a passive skill if you have no ranks in it (untrained). the easiest way to gain them is via a potion, scroll, or gear. they can also be found in some race and class benefits starting on the third floor. as skills increase in rank, they grant additional bonuses at ranks 5, 10, and 15. add extra damage dice to the base effect damage, and these always apply even if other parts of the upgrade are situational. where an upgrade increases the range or duration, removes a limitation, or the like, the upgrade overrides the base effect instead of being in addition to it. all other sorts of upgrades get added together. typically, these additive upgrades use a plus sign (+) to help note this. the list of skills in the world dungeon is endless. our artificial sky’s the limit, folks! here’s the framework in which you can create any skill you want. you’ll need to use it if you come across a skill or spell marked with an gear asterisk ( ): that’s the cue that it’s a custom skill not found in this book. the simplest way to customize a skill is to reuse an existing skill but reframe its narrative. a skill like dumpster diving could just as easily become search 4 174 copyright renegade game studios. unauthorized distribution prohibited. 08/25/2026. just by changing the name and thematic focus while still operating within the same mechanical structure. mixing and matching skill effects and upgrades is a great way to create weird skills to really customize your crawler. a crochet skill, for instance, might have a custom upgrade that works like a utility skill upgrade, or it could borrow a rank 5 upgrade found on the dagger skill. you can invent a new effect or upgrade following the guideline that the more niche it is, the stronger it can be. if something ends up too strong or too weak, the gm can always patch it later. the system adjusts; so should you. in play, you’ll often find more than one skill that applies to a situation. because skills improve through use, you might choose to attempt a task with a weaker or less-optimal skill just to gain experience with it. this is perfectly normal behavior and occa-sionally even works out. made-up skills should typically be narrowly focused and should not completely replace or outgun existing skills… or actions like evade. if you want to create an evade-like skill, it should perhaps only be useful against a certain attack type (such as edged weapons and ranged weapons) or come with a significant downside that makes its usage situational. evade checks don’t use ranks, so anything that adds ranks to a skill check that lets you avoid any type of attack will instantly be much better than evading, and that’s a no-no. if you don’t spill blood, i won’t be happy. that’s the whole point! attack skills represent your ability to harm, disable, or otherwise make something stop trying to kill you, whether through weapons, fists, or pure destructive intent. name: the name of the attack appears as a headline to the entry. attack type: melee or ranged. most attacks are melee, which have a range of 5 feet (i.e., adjacent). if an attack has a range farther than that, it will be noted in the range entry below this line. the default stat mod used for melee rolls to hit is str, while the default stat mod for ranged weapon attacks is dex. if another stat mod is used to hit, it will be listed here. range: if the attack can hit a target farther than 5 feet away, the maximum distance it can hit will be listed here. if the attack has no range listed, its range is melee range (adjacent or within 5 feet). ai favor: low-damage weapons grant ai favor to you if you use such a wimpy attack for a majority of your attacks during a combat that lasts for at least three rounds. limitations: any conditions, requirements, or penalties are listed here. “requires two hands to wield” is a common limitation, which means both hands must be used to wield the weapon (i’m sure you never would’ve figured that out without this explanation). you can’t hold other things at the same time when attacking. if the weapon or effect has a cooldown, it will be listed here. hit or miss, the timer starts. while on cooldown, the weapon or effect cannot be used. description: any notes or descriptions of the skill are listed here. make an attack skill check vs. the target’s evade value, which is: 10 + dex + the floor number. base damage: this is the damage dice the weapon deals with 0–4 ranks in the skill. zero ranks means using it untrained. the appropriate stat mod value is added to the damage. this mod does not always match the one listed in the attack type line, and not every weapon adds a stat mod. finally, the damage type is listed. the damage type is important if the target has resistance, immunity, or vulnerability to that damage type. effects: if there are effects other than damage, they will be listed there. upgrades: when you reach rank 5, 10, and 15, these bonuses kick in. write your attack skills in the “attacks” section on the front of your character sheet. fill out the “to hit” box for your weapons, writing in your “rank + stat mod” values. then fill in the “damage” box. write in the dice as “1dx,” replacing the “x” with the die type noted in the description. the weapon’s base damage entry will also tell you which stat mod (if any) you add to the damage. use the effects area to write in short reminders of base effects, upgrade effects, and ai favor (if any). lastly, write in the attack skill name on your “skills” list. there, you can write in additional notes and mark the advancement box on the far right when you use the skill. this keeps all your skills in one place when rolling for skill advancement (p. 169). just remember to update your rank in the “attacks” section as well when you advance an attack skill, or you’ll be weak forever, just like your middle school gym teacher prophesied. for handling explosives, see explosives handling, goblin explosives, and incendiary device handling in utility skills (below). these skills will also be useful for crafting your own explosives once you have access to a sapper’s table on the fourth floor. as crawlers descend to lower floors, explosives become more complex than the tutorial floors’ “light and throw” variety. see the area of effect attacks (p. 83) for targeting, difficulties, and what happens when you miss your target with tossed explosives. your explosives skill is not used when attacking with a thrown explosive, but the gm should have you make an unopposed handling skill check before throwing. here are the explosives typically found on the first five floors. lesser explosives can be found on lower floors, but the more powerful explosives are rarely seen on the upper floors. floor 1: standard explosive—dynamite: 1d6 bludgeoning, 0ft blast radius +5ft splash. floor 2: goblin explosive—dynamite: 2d6 bludgeoning damage, 5ft blast radius + 5ft splash. floor 2: incendiary device—carl’s jug o’ boom: 1d8 fire damage, 5ft blast radius + 15ft splash. anyone who loses at least 1 health bar slot gains the burned debuff. floor 3: goblin explosive—hob-lobbers: 3d6 piercing, +10ft splash floor 4: standard explosive—demon det cord: 5d6 bludgeoning, deals double damage to objects. can only be applied to non-moving targets. floor 5: incendiary device—gnomish knock-knock: 4d6 fire, 10ft blast radius +10ft splash, and anyone who fails to evade gains the burned debuff. as this is a notoriously unstable fuel-air explosive, a critical fail is achieved on a natural 1–4. most explosives are custom made and not available on store shelves. carl had his custom jelly bombs, banger spheres, chum bombs, and more. smoke is used for concealment, distraction, and confusion. attacking into or out of smoke is done with disadvantage (see mob advantage and disadvantage p. 60). thrown smoke bombs are popular on most dungeon floors as a way to get out of trouble quick-ly. see the throwing skill (p. 200) for targeting, difficulties, and what happens when you miss your target. you don’t need to make a skill check to drop it in your own space. floor 1: goblin smoke bomb: creates a multicolor smoke cloud that reaches 30 feet in each direction from the point of impact, with a maximum duration of 3 minutes. however, even a slight breeze will dissipate it in 1 minute. floor 3: hobgoblin smoke curtain: creates a dense white fog over a 60ft radius that holds even in a breeze. floor 5: hobgoblin disco ball: created by infusing (see infusion skill, p. 194) an invisibility potion onto a hobgoblin smoke curtain. it produces thick multi-hued smoke plumes, along with some sick beats. it blinds everyone in the area, friend and foe alike. utility skills help crawlers survive, adapt, and solve problems that can’t be fixed by hitting them until they stop moving. checks that are labeled as unopposed can, at the gm’s discretion, become opposed if something is actively working against you. for example, you’re trying to swim the rapids, and some dipshit is throwing fishing nets at you. cut it out, cletus! or i’m gonna tell mom on you!"}, {"id": "skill-acute-ears", "reference": true, "referenceEntry": true, "title": "Acute Ears", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence, Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Improves a crawler’s hearing and allows the crawler to see more Mobs on the minimap in their HUD. The information is “somewhat reliable.”\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Information on the Mob’s size and whether you have encountered them before are added to the red dot indicator.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Mobs of a lower level than you cannot Ambush your party.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Mobs cannot Ambush your party.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 184 · PDF pages 186\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ACUTE EARS\nIntelligence\nPassive\nImproves a crawler’s hearing and allows the crawler\nto see more Mobs on the minimap in their HUD. The\ninformation is “somewhat reliable.”\nRank 5: Information on the Mob’s size and whether\nyou have encountered them before are added to the\nred dot indicator.\nRank 10: Mobs of a lower level than you cannot Am‑\nbush your party.\nRank 15: Mobs cannot Ambush your party.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "acute ears utility skills acute-ears acute ears utility_skill intelligence, passive intelligence true false false [] [] improves a crawler’s hearing and allows the crawler to see more mobs on the minimap in their hud. the information is “somewhat reliable.” {'5': 'information on the mob’s size and whether you have encountered them before are added to the red dot indicator.', '10': 'mobs of a lower level than you cannot ambush your party.', '15': 'mobs cannot ambush your party.'}"}, {"id": "skill-aiming", "reference": true, "referenceEntry": true, "title": "Aiming", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>This Skill is used only in conjunction with Ranged Attacks. Mark this Skill for Advancement only when applying its Ranks to such an Attack.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You are skilled at targeting vital body parts to deal additional damage.\u003c/p>\u003cp>When making a Ranged Attack, you can add your Ranks in this Skill to your Attack Skill Check if you choose to make the Check with Disadvantage.\u003c/p>\u003cp>On Success, add 1d4 to the damage.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 184 · PDF pages 186\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">AIMING\nPassive\nLimitations: This Skill is used only in conjunction with\nRanged Attacks. Mark this Skill for Advancement only\nwhen applying its Ranks to such an Attack.\nYou are skilled at targeting vital body parts to deal\nadditional damage.\nWhen making a Ranged Attack, you can add your\nRanks in this Skill to your Attack Skill Check if you\nchoose to make the Check with Disadvantage.\nOn Success, add 1d4 to the damage.\nUPGRADES\nRank 5: +1d4 damage\nRank 10: +1d4 base damage\nRank 15: +1d4 base damage\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "aiming utility skills aiming aiming utility_skill passive true false false [] [] this skill is used only in conjunction with ranged attacks. mark this skill for advancement only when applying its ranks to such an attack. you are skilled at targeting vital body parts to deal additional damage.\n\nwhen making a ranged attack, you can add your ranks in this skill to your attack skill check if you choose to make the check with disadvantage.\n\non success, add 1d4 to the damage. {'5': '+1d4 damage', '10': '+1d4 base damage', '15': '+1d4 base damage'}"}, {"id": "skill-alchemy", "reference": true, "referenceEntry": true, "title": "Alchemy", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Used for crafting potions and poisons. See Crafting p. 221.\u003c/p>\u003cp>You may craft potions up to a +5 bonus level.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may craft potions up to a +10 bonus level.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may create additional potions of the same kind without spending extra time.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can write the recipe for any potion you find.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 184 · PDF pages 186\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ALCHEMY\nIntelligence\nUsed for crafting potions and poisons. See Crafting p.\n221.\nYou may craft potions up to a +5 bonus level.\nUPGRADES\nRank 5: You may craft potions up to a +10 bonus level.\nRank 10: You may create additional potions of the\nsame kind without spending extra time.\nRank 15: You can write the recipe for any potion you find.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "alchemy utility skills alchemy alchemy utility_skill intelligence intelligence false false false [] [] used for crafting potions and poisons. see crafting p. 221.\n\nyou may craft potions up to a +5 bonus level. {'5': 'you may craft potions up to a +10 bonus level.', '10': 'you may create additional potions of the same kind without spending extra time.', '15': 'you can write the recipe for any potion you find.'}"}, {"id": "skill-ambush", "reference": true, "referenceEntry": true, "title": "Ambush", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You are skilled at popping up out of nowhere. When a Mob is moving toward you, even if they are aware of your general presence, make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success, you gain a surprise Action against the Mob before combat starts. As an unseen attacker, you Attack with Advantage.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>If you Attack with your Surprise Action, add an Ambush Rank damage die to your Surprise Attack damage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When other crawlers in your party roll this skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You gain a second bonus Action as a surprise Action. This bonus Action can’t be an Attack.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 184–185 · PDF pages 186–187\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">AMBUSH\nIntelligence\nYou are skilled at popping up out of nowhere. When a\nMob is moving toward you, even if they are aware of your\ngeneral presence, make an Int-Opposed Skill Check.\nOn Success, you gain a surprise Action against the\nMob before combat starts. As an unseen attacker, you\nAttack with Advantage.\nUPGRADES\nRank 5: If you Attack with your Surprise Action, add\nan Ambush Rank damage die to your Surprise Attack\ndamage.\nRank 10: When other crawlers in your party roll this skill\nuntrained, they roll as normal (not with Disadvantage).\nRank 15: You gain a second bonus Action as a sur‑\nprise Action. This bonus Action can’t be an Attack.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "ambush utility skills ambush ambush utility_skill intelligence intelligence false false false [] [] you are skilled at popping up out of nowhere. when a mob is moving toward you, even if they are aware of your general presence, make an int-opposed skill check.\n\non success, you gain a surprise action against the mob before combat starts. as an unseen attacker, you attack with advantage. {'5': 'if you attack with your surprise action, add an ambush rank damage die to your surprise attack damage.', '10': 'when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).', '15': 'you gain a second bonus action as a surprise action. this bonus action can’t be an attack.'}"}, {"id": "skill-animal-handling", "reference": true, "referenceEntry": true, "title": "Animal Handling", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You are skilled in calming, befriending, and guiding animals. Make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success, the animal is friendly enough to avoid attacking you.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Choose an animal type to specialize in. You have Advantage on your Animal Handling Skill Checks against that animal type. You gain a second bonus Action as a surprise Action. This bonus Action can’t be an attack.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Forming each level of bonding with a potential pet takes half the normal time.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can have up to two pets.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 185 · PDF pages 187\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ANIMAL HANDLING\nCharisma\nYou are skilled in calming, befriending, and guiding\nanimals. Make an Int-Opposed Skill Check.\nOn Success, the animal is friendly enough to avoid\nattacking you.\nUPGRADES\nRank 5: Choose an animal type to specialize in. You\nhave Advantage on your Animal Handling Skill Checks\nagainst that animal type. You gain a second bonus\nAction as a surprise Action. This bonus Action can’t be\nan attack.\nRank 10: Forming each level of bonding with a poten‑\ntial pet takes half the normal time.\nRank 15: You can have up to two pets.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "animal handling utility skills animal-handling animal handling utility_skill charisma charisma false false false [] [] you are skilled in calming, befriending, and guiding animals. make an int-opposed skill check.\n\non success, the animal is friendly enough to avoid attacking you. {'5': 'choose an animal type to specialize in. you have advantage on your animal handling skill checks against that animal type. you gain a second bonus action as a surprise action. this bonus action can’t be an attack.', '10': 'forming each level of bonding with a potential pet takes half the normal time.', '15': 'you can have up to two pets.'}"}, {"id": "skill-arcane", "reference": true, "referenceEntry": true, "title": "Arcane", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You have general knowledge of magic and can determine whether items are magical or not. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you can identify the item as magical or not.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You are able to determine details such as the specific Rank and bonus levels of magical items.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can imbue items with inherent spells using an Arcanist Table. See Crafting on p. 221.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The default cooldown of your imbued spells is 3 hours.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 185 · PDF pages 187\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ARCANE\nIntelligence\nYou have general knowledge of magic and can de‑\ntermine whether items are magical or not. Make an\nUnopposed Skill Check.\nOn Success, you can identify the item as magical or not.\nUPGRADES\nRank 5: You are able to determine details such as the\nspecific Rank and bonus levels of magical items.\nRank 10: You can imbue items with inherent spells\nusing an Arcanist Table. See Crafting on p. 221.\nRank 15: The default cooldown of your imbued spells\nis 3 hours.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "arcane utility skills arcane arcane utility_skill intelligence intelligence false false false [] [] you have general knowledge of magic and can determine whether items are magical or not. make an unopposed skill check.\n\non success, you can identify the item as magical or not. {'5': 'you are able to determine details such as the specific rank and bonus levels of magical items.', '10': 'you can imbue items with inherent spells using an arcanist table. see crafting on p. 221.', '15': 'the default cooldown of your imbued spells is 3 hours.'}"}, {"id": "skill-attack-of-opportunity", "reference": true, "referenceEntry": true, "title": "Attack of Opportunity", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive, Interrupt\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires a single-handed melee weapon with a range no greater than 5 feet.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>When a foe moves out of a space adjacent to you (except via a Step), you may spend an Action to make an Attack Action as an Interrupt against that foe.\u003c/p>\u003cp>On Success, roll damage and apply any other effects from the Attack!\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>If the foe moves into another space adjacent to you, they must stop.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>A foe using their Step no longer prevents this ability.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Roll the Attack Skill Check with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 185 · PDF pages 187\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ATTACK OF OPPORTUNITY\nPassive, Interrupt\nLimitations: Requires a single-handed melee weapon\nwith a range no greater than 5 feet.\nWhen a foe moves out of a space adjacent to you (ex‑\ncept via a Step), you may spend an Action to make an\nAttack Action as an Interrupt against that foe.\nOn Success, roll damage and apply any other effects\nfrom the Attack!\nUPGRADES\nRank 5: If the foe moves into another space adjacent\nto you, they must stop.\nRank 10: A foe using their Step no longer prevents\nthis ability.\nRank 15: Roll the Attack Skill Check with Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "attack of opportunity utility skills attack-of-opportunity attack of opportunity utility_skill passive, interrupt true true false [] [] requires a single-handed melee weapon with a range no greater than 5 feet. when a foe moves out of a space adjacent to you (except via a step), you may spend an action to make an attack action as an interrupt against that foe.\n\non success, roll damage and apply any other effects from the attack! {'5': 'if the foe moves into another space adjacent to you, they must stop.', '10': 'a foe using their step no longer prevents this ability.', '15': 'roll the attack skill check with advantage.'}"}, {"id": "skill-axe", "reference": true, "referenceEntry": true, "title": "Axe", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Edged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Str Slashing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Slashing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage, and you may make an extra free Attack with Disadvantage against another foe adjacent to both you and the original target.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and on an Amazing Success or better, sever an arm (or similar) of your foe (which disarms anyone with a two-handed weapon).\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178 · PDF pages 180\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">AXE\nMelee Attack, Str\nBase Damage: 1d6 + Str Slashing\nUPGRADES\nRank 5: +1d6 base damage\nRank 10: +1d6 base damage, and you may make an\nextra free Attack with Disadvantage against another\nfoe adjacent to both you and the original target.\nRank 15: +1d6 base damage, and on an Amazing\nSuccess or better, sever an arm (or similar) of your foe\n(which disarms anyone with a two-handed weapon).\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "axe edged weapon skills axe axe attack_skill edged weapon skills melee attack, str strength false false false melee [] ['slashing'] 1d6 + str slashing {'5': '+1d6 base damage', '10': '+1d6 base damage, and you may make an extra free attack with disadvantage against another foe adjacent to both you and the original target.', '15': '+1d6 base damage, and on an amazing success or better, sever an arm (or similar) of your foe (which disarms anyone with a two-handed weapon).'}"}, {"id": "skill-back-claw", "reference": true, "referenceEntry": true, "title": "Back Claw", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Animal Crawler & Pet Strike Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d6 + Str Slashing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Slashing\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d6 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d6 base damage, and the target gains the Blood Trail Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 177 · PDF pages 179\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BACK CLAW\nMelee Attack, Str\nBase Damage: 1d6 + Str Slashing\nUPGRADES\nRank 5: +1d6 base damage\nRank 10: +1d6 base damage\nRank 15: +1d6 base damage,\nand the target gains the Blood\nTrail Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "back claw animal crawler & pet strike skills back-claw back claw attack_skill animal crawler & pet strike skills melee attack, str strength false false false melee [] ['slashing'] 1d6 + str slashing {'5': '+1d6 base damage', '10': '+1d6 base damage', '15': '+1d6 base damage, and the target gains the blood trail debuff.'}"}, {"id": "skill-backfire", "reference": true, "referenceEntry": true, "title": "Backfire", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Compensated Anarchist Class Only\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You are skilled at neutralizing and deconstructing traps without the use of a Sapper’s Table. Triggering mechanisms are quite valuable. Time required to neutralize a trap is 10 minutes. Time required to deconstruct it is 1 hour. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you successfully take apart the trap and can repurpose it.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can identify when the trap was placed. Time required to neutralize a trap is 5 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You can identify when the trap was created. Time required to deconstruct a trap is 30 minutes.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can identify the designer of the trap. Time required to deconstruct a trap is 15 minutes.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 185 · PDF pages 187\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BACKFIRE\nIntelligence\nLimitations: Compensated Anarchist Class Only\nYou are skilled at neutralizing and deconstructing traps\nwithout the use of a Sapper’s Table. Triggering mecha‑\nnisms are quite valuable. Time required to neutralize a\ntrap is 10 minutes. Time required to deconstruct it is 1\nhour. Make an Unopposed Skill Check.\nOn Success, you successfully take apart the trap and\ncan repurpose it.\nUPGRADES\nRank 5: You can identify when the trap was placed.\nTime required to neutralize a trap is 5 minutes.\nRank 10: You can identify when the trap was created.\nTime required to deconstruct a trap is 30 minutes.\nRank 15: You can identify the designer of the trap.\nTime required to deconstruct a trap is 15 minutes.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "backfire utility skills backfire backfire utility_skill intelligence intelligence false false false [] [] compensated anarchist class only you are skilled at neutralizing and deconstructing traps without the use of a sapper’s table. triggering mechanisms are quite valuable. time required to neutralize a trap is 10 minutes. time required to deconstruct it is 1 hour. make an unopposed skill check.\n\non success, you successfully take apart the trap and can repurpose it. {'5': 'you can identify when the trap was placed. time required to neutralize a trap is 5 minutes.', '10': 'you can identify when the trap was created. time required to deconstruct a trap is 30 minutes.', '15': 'you can identify the designer of the trap. time required to deconstruct a trap is 15 minutes.'}"}, {"id": "skill-balance", "reference": true, "referenceEntry": true, "title": "Balance", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You can traverse tricky surfaces with general ease. Make an Unopposed Skill Check. The GM may add Difficulty for especially crazy surfaces.\u003c/p>\u003cp>On Success, you keep your balance on tricky or shifting surfaces.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You may perform Move Actions in difficult terrain without penalty.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When subject to a Take Down or involuntary Move effects, you may use this skill as a free Interrupt Action to avoid the effect.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You may perform your Step on vertical surfaces (yes, like in The Matrix), but must end it on a flat(ish) surface.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 186 · PDF pages 188\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BALANCE\nDexterity\nYou can traverse tricky surfaces with general ease.\nMake an Unopposed Skill Check. The GM may add\nDifficulty for especially crazy surfaces.\nOn Success, you keep your balance on tricky or shift‑\ning surfaces.\nUPGRADES\nRank 5: You may perform Move Actions in difficult\nterrain without penalty.\nRank 10: When subject to a Take Down or involuntary\nMove effects, you may use this skill as a free Interrupt\nAction to avoid the effect.\nRank 15: You may perform your Step on vertical\nsurfaces (yes, like in The Matrix), but must end it on a\nflat(ish) surface.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "balance utility skills balance balance utility_skill dexterity dexterity false false false [] [] you can traverse tricky surfaces with general ease. make an unopposed skill check. the gm may add difficulty for especially crazy surfaces.\n\non success, you keep your balance on tricky or shifting surfaces. {'5': 'you may perform move actions in difficult terrain without penalty.', '10': 'when subject to a take down or involuntary move effects, you may use this skill as a free interrupt action to avoid the effect.', '15': 'you may perform your step on vertical surfaces (yes, like in the matrix), but must end it on a flat(ish) surface.'}"}, {"id": "skill-basic-science", "reference": true, "referenceEntry": true, "title": "Basic Science", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You understand basic scientific principles and natural laws, which you hope are still in effect in the dungeon. If you want to conduct experiments involving dead Goblins and various acids, this is the Skill for you. Experiments take 2 hours to perform. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you learn or confirm something.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Experiments take 1 hour to perform.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Choose a specialty (physics, biology, chemistry, Earth science, etc.), and roll with Advantage when dealing with that.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Experiments take 30 minutes to perform.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 186 · PDF pages 188\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">BASIC SCIENCE\nIntelligence\nYou understand basic scientific principles and natural\nlaws, which you hope are still in effect in the dungeon. If\nyou want to conduct experiments involving dead Goblins\nand various acids, this is the Skill for you. Experiments\ntake 2 hours to perform. Make an Unopposed Skill Check.\nOn Success, you learn or confirm something.\nUPGRADES\nRank 5: Experiments take 1 hour to perform.\nRank 10: Choose a specialty (physics, biology, chemis‑\ntry, Earth science, etc.), and roll with Advantage when\ndealing with that.\nRank 15: Experiments take 30 minutes to perform.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "basic science utility skills basic-science basic science utility_skill intelligence intelligence false false false [] [] you understand basic scientific principles and natural laws, which you hope are still in effect in the dungeon. if you want to conduct experiments involving dead goblins and various acids, this is the skill for you. experiments take 2 hours to perform. make an unopposed skill check.\n\non success, you learn or confirm something. {'5': 'experiments take 1 hour to perform.', '10': 'choose a specialty (physics, biology, chemistry, earth science, etc.), and roll with advantage when dealing with that.', '15': 'experiments take 30 minutes to perform.'}"}, {"id": "skill-bite", "reference": true, "referenceEntry": true, "title": "Bite", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Animal Crawler & Pet Strike Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 + Str Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>The target must have an appendage you can clamp down onto. You taste your victim’s blood. Better hope they’re not poisonous.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage. You may latch on to move when the foe moves during their next Action (then you let go).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and the target gains the Woozy Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Rolepla
