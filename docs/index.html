l with Advantage to Evade Attacks against your vehicle.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your vehicle has +5ft Move. When performing crazy stunts (like driving on only your left-side wheels), roll with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 190 · PDF pages 192\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DRIVING\nDexterity\nLimitations: If you Attack while Driving, you suffer\nDisadvantage on those Checks.\nYou don’t need this Skill if you’re casually driving down\nthe road to pick up a quart of milk, but if you’re racing,\nchasing, showing off, or doing something dangerous in\na vehicle, this is the Skill you want.\nIf you’re doing something wild or trying to avoid\nbecoming a skid mark on the highway, make an Un‑\nopposed Skill Check. Depending on how extreme the\ncircumstances are, the GM may apply Advantage or\nDisadvantage to the Check.\nOn Success, you achieve your daredevil maneuver or\navoid wrecking your vehicle.\nUPGRADES\nRank 5: You no longer suffer Disadvantage when\nattacking while Driving.\nRank 10: Your vehicle has +5ft Move. Roll with Ad‑\nvantage to Evade Attacks against your vehicle.\nRank 15: Your vehicle has +5ft Move. When perform‑\ning crazy stunts (like driving on only your left-side\nwheels), roll with Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "driving utility skills driving driving utility_skill dexterity dexterity false false false [] [] if you attack while driving, you suffer disadvantage on those checks. you don’t need this skill if you’re casually driving down the road to pick up a quart of milk, but if you’re racing, chasing, showing off, or doing something dangerous in a vehicle, this is the skill you want.\n\nif you’re doing something wild or trying to avoid becoming a skid mark on the highway, make an unopposed skill check. depending on how extreme the circumstances are, the gm may apply advantage or disadvantage to the check.\n\non success, you achieve your daredevil maneuver or avoid wrecking your vehicle. {'5': 'you no longer suffer disadvantage when attacking while driving.', '10': 'your vehicle has +5ft move. roll with advantage to evade attacks against your vehicle.', '15': 'your vehicle has +5ft move. when performing crazy stunts (like driving on only your left-side wheels), roll with advantage.'}"}, {"id": "skill-dumpster-diving", "reference": true, "referenceEntry": true, "title": "Dumpster Diving", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Known as “scrounging” in some parts of the world.\u003c/p>\u003cp>This Skill bolsters your ability to search the clutter within the dungeon to find interesting bits of rubbish and maybe something useful. Using this Skill takes 1 hour and can only be performed once per 50-foot-square area. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you find what you were looking for or another interesting item, determined by the GM.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You also find 1 Rank damage die’s-worth of Misc. Junk.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>A Dumpster Dive takes 30 minutes. On a Critical Hit, you gain an additional interesting item.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>A Dumpster Dive takes 10 minutes. On an Amazing Success, you gain an interesting item.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 190 · PDF pages 192\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">DUMPSTER DIVING\nIntelligence\nKnown as “scrounging” in some parts of the world.\nThis Skill bolsters your ability to search the clutter with‑\nin the dungeon to find interesting bits of rubbish and\nmaybe something useful. Using this Skill takes 1 hour\nand can only be performed once per 50-foot-square\narea. Make an Unopposed Skill Check.\nOn Success, you find what you were looking for or\nanother interesting item, determined by the GM.\nUPGRADES\nRank 5: You also find 1 Rank damage die’s-worth of\nMisc. Junk.\nRank 10: A Dumpster Dive takes 30 minutes. On a\nCritical Hit, you gain an additional interesting item.\nRank 15: A Dumpster Dive takes 10 minutes. On an\nAmazing Success, you gain an interesting item.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "dumpster diving utility skills dumpster-diving dumpster diving utility_skill intelligence intelligence false false false [] [] known as “scrounging” in some parts of the world.\n\nthis skill bolsters your ability to search the clutter within the dungeon to find interesting bits of rubbish and maybe something useful. using this skill takes 1 hour and can only be performed once per 50-foot-square area. make an unopposed skill check.\n\non success, you find what you were looking for or another interesting item, determined by the gm. {'5': 'you also find 1 rank damage die’s-worth of misc. junk.', '10': 'a dumpster dive takes 30 minutes. on a critical hit, you gain an additional interesting item.', '15': 'a dumpster dive takes 10 minutes. on an amazing success, you gain an interesting item.'}"}, {"id": "skill-endurance", "reference": true, "referenceEntry": true, "title": "Endurance", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Constitution\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Constitution\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill to prevent fatigue while grinding, walking long distances (measured in miles), or other extended strenuous activities. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you may continue the activity and do not gain the Fatigued Debuff.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can ignore the effects of a Major Fail when making these Checks.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>If you are not Fatigued or in extreme conditions, you make this Check with Advantage.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>If your Check is a Critical Fail, you can take the effects of a Standard Fail.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 190 · PDF pages 192\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ENDURANCE\nConstitution\nUse this Skill to prevent fatigue while grinding, walking\nlong distances (measured in miles), or other extended\nstrenuous activities. Make an Unopposed Skill Check.\nOn Success, you may continue the activity and do not\ngain the Fatigued Debuff.\nUPGRADES\nRank 5: You can ignore the effects of a Major Fail\nwhen making these Checks.\nRank 10: If you are not Fatigued or in extreme condi‑\ntions, you make this Check with Advantage.\nRank 15: If your Check is a Critical Fail, you can take\nthe effects of a Standard Fail.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "endurance utility skills endurance endurance utility_skill constitution constitution false false false [] [] use this skill to prevent fatigue while grinding, walking long distances (measured in miles), or other extended strenuous activities. make an unopposed skill check.\n\non success, you may continue the activity and do not gain the fatigued debuff. {'5': 'you can ignore the effects of a major fail when making these checks.', '10': 'if you are not fatigued or in extreme conditions, you make this check with advantage.', '15': 'if your check is a critical fail, you can take the effects of a standard fail.'}"}, {"id": "skill-engineering", "reference": true, "referenceEntry": true, "title": "Engineering", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Cannot create vehicles or high-powered engines (see Gear Head for that p. 192).\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>This Skill is used to design and build things with moving parts, fluids, or chemicals wholly out of Misc. Junk with no inherent bonuses, though they may have situational bonuses. Examples include a watch, a water pump, or bullets. See Crafting p. 221.\u003c/p>\u003cp>Starting on the Fourth Floor, you may make use of an Engineering Table to make your mundane items easier to craft. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you create the item.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Choose a mundane item type to specialize in. You have Advantage when creating an item of that type.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may craft your specialty item with a +1 bonus level enchantment.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You may craft your specialty item with up to +2 bonus level enchantment, and it takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 191 · PDF pages 193\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ENGINEERING\nIntelligence\nLimitations: Cannot create vehicles or high-powered\nengines (see Gear Head for that p. 192).\nThis Skill is used to design and build things with\nmoving parts, fluids, or chemicals wholly out of Misc.\nJunk with no inherent bonuses, though they may have\nsituational bonuses. Examples include a watch, a water\npump, or bullets. See Crafting p. 221.\nStarting on the Fourth Floor, you may make use of an\nEngineering Table to make your mundane items easier\nto craft. Make an Unopposed Skill Check.\nOn Success, you create the item.\nUPGRADES\nRank 5: Choose a mundane item type to specialize\nin. You have Advantage when creating an item of that\ntype.\nRank 10: You may craft your specialty item with a +1\nbonus level enchantment.\nRank 15: You may craft your specialty item with up to\n+2 bonus level enchantment, and it takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "engineering utility skills engineering engineering utility_skill intelligence intelligence false false false [] [] cannot create vehicles or high-powered engines (see gear head for that p. 192). this skill is used to design and build things with moving parts, fluids, or chemicals wholly out of misc. junk with no inherent bonuses, though they may have situational bonuses. examples include a watch, a water pump, or bullets. see crafting p. 221.\n\nstarting on the fourth floor, you may make use of an engineering table to make your mundane items easier to craft. make an unopposed skill check.\n\non success, you create the item. {'5': 'choose a mundane item type to specialize in. you have advantage when creating an item of that type.', '10': 'you may craft your specialty item with a +1 bonus level enchantment.', '15': 'you may craft your specialty item with up to +2 bonus level enchantment, and it takes half the time.'}"}, {"id": "skill-escape-artist", "reference": true, "referenceEntry": true, "title": "Escape Artist", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Holy Houdini! While anyone can use Dexterity to wiggle out of restraints or a hold, you’re especially skilled at the art of escape. When you try to escape from bonds or being Held, you can use this Skill.\u003c/p>\u003cp>When trying to escape bonds, make an Unopposed Skill Check.\u003c/p>\u003cp>To escape being Held, make a Str-Opposed Skill Check. Based on the complexity or simplicity of what binds you, the GM may have you make the Check with Advantage or Disadvantage.\u003c/p>\u003cp>On Success, you escape your bonds or the creature holding you.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can escape your bonds, and no one sees you do it. If you escape being Held, you can then take a Step (also unseen).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When other crawlers in your party roll this skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>When you slip out, you may immediately take an Action with Advantage.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 191 · PDF pages 193\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ESCAPE ARTIST\nDexterity\nHoly Houdini! While anyone can use Dexterity to wig‑\ngle out of restraints or a hold, you’re especially skilled\nat the art of escape. When you try to escape from\nbonds or being Held, you can use this Skill.\nWhen trying to escape bonds, make an Unopposed\nSkill Check.\nTo escape being Held, make a Str-Opposed Skill\nCheck. Based on the complexity or simplicity of what\nbinds you, the GM may have you make the Check with\nAdvantage or Disadvantage.\nOn Success, you escape your bonds or the creature\nholding you.\nUPGRADES\nRank 5: You can escape your bonds, and no one sees\nyou do it. If you escape being Held, you can then take\na Step (also unseen).\nRank 10: When other crawlers in your party roll\nthis skill untrained, they roll as normal (not with\nDisadvantage).\nRank 15: When you slip out, you may immediately take\nan Action with Advantage.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "escape artist utility skills escape-artist escape artist utility_skill dexterity dexterity false false false [] [] holy houdini! while anyone can use dexterity to wiggle out of restraints or a hold, you’re especially skilled at the art of escape. when you try to escape from bonds or being held, you can use this skill.\n\nwhen trying to escape bonds, make an unopposed skill check.\n\nto escape being held, make a str-opposed skill check. based on the complexity or simplicity of what binds you, the gm may have you make the check with advantage or disadvantage.\n\non success, you escape your bonds or the creature holding you. {'5': 'you can escape your bonds, and no one sees you do it. if you escape being held, you can then take a step (also unseen).', '10': 'when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).', '15': 'when you slip out, you may immediately take an action with advantage.'}"}, {"id": "skill-escape-plan", "reference": true, "referenceEntry": true, "title": "Escape Plan", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Ranks in this Skill only advance by magical means.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Your HUD reveals hidden doors and passages, unless those passages were crafted by someone with more Ranks in Fabricate or Engineering than you have in this Skill or the passage is entirely natural.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You have access to system-concealed displays and the Dungeon Locator. Holographic signs pop up in your HUD, displaying insider information like signs at a zoo. Includes arrows toward City and stronger Bosses.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You are able to read hidden sigils (glowing blue circles) used by the showrunners to direct the movement of Mobs.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You are able to read hidden messages and redactions in dungeon documents.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 191 · PDF pages 193\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">ESCAPE PLAN\nPassive\nLimitations: Ranks in this Skill only advance by magi‑\ncal means.\nYour HUD reveals hidden doors and passages, unless\nthose passages were crafted by someone with more\nRanks in Fabricate or Engineering than you have in this\nSkill or the passage is entirely natural.\nUPGRADES\nRank 5: You have access to system-concealed dis‑\nplays and the Dungeon Locator. Holographic signs\npop up in your HUD, displaying insider information\nlike signs at a zoo. Includes arrows toward City and\nstronger Bosses.\nRank 10: You are able to read hidden sigils (glowing\nblue circles) used by the showrunners to direct the\nmovement of Mobs.\nRank 15: You are able to read hidden messages and\nredactions in dungeon documents.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "escape plan utility skills escape-plan escape plan utility_skill passive true false false [] [] ranks in this skill only advance by magical means. your hud reveals hidden doors and passages, unless those passages were crafted by someone with more ranks in fabricate or engineering than you have in this skill or the passage is entirely natural. {'5': 'you have access to system-concealed displays and the dungeon locator. holographic signs pop up in your hud, displaying insider information like signs at a zoo. includes arrows toward city and stronger bosses.', '10': 'you are able to read hidden sigils (glowing blue circles) used by the showrunners to direct the movement of mobs.', '15': 'you are able to read hidden messages and redactions in dungeon documents.'}"}, {"id": "skill-explosives-handling", "reference": true, "referenceEntry": true, "title": "Explosives Handling", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>For making Attack Skill Checks with explosives (see Throwing, p. 200).\u003c/p>\u003cp>Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you safely handle standard explosive devices. On Fail, I’m sure the GM will think of something.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You are able to determine the type, status, and raw materials of explosives you handle.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You are able to craft explosives such as dynamite as if this were a crafting Skill, though you must have explosive raw materials and a Sapper’s Table (see Crafting, p. 221).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You may create explosive raw materials out of non-volatile materials. Your crafting takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 191 · PDF pages 193\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">EXPLOSIVES HANDLING\nIntelligence\nFor making Attack Skill Checks with explosives (see\nThrowing, p. 200).\nMake an Unopposed Skill Check.\nOn Success, you safely handle standard explosive de‑\nvices. On Fail, I’m sure the GM will think of something.\nUPGRADES\nRank 5: You are able to determine the type, status,\nand raw materials of explosives you handle.\nRank 10: You are able to craft explosives such as dy‑\nnamite as if this were a crafting Skill, though you must\nhave explosive raw materials and a Sapper’s Table (see\nCrafting, p. 221).\nRank 15: You may create explosive raw materials out of\nnon-volatile materials. Your crafting takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "explosives handling utility skills explosives-handling explosives handling utility_skill intelligence intelligence false false false [] [] for making attack skill checks with explosives (see throwing, p. 200).\n\nmake an unopposed skill check.\n\non success, you safely handle standard explosive devices. on fail, i’m sure the gm will think of something. {'5': 'you are able to determine the type, status, and raw materials of explosives you handle.', '10': 'you are able to craft explosives such as dynamite as if this were a crafting skill, though you must have explosive raw materials and a sapper’s table (see crafting, p. 221).', '15': 'you may create explosive raw materials out of non-volatile materials. your crafting takes half the time.'}"}, {"id": "skill-fabricate", "reference": true, "referenceEntry": true, "title": "Fabricate", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Cannot create things with moving parts, fluids, or chemicals.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill to make generic, mundane items with no inherent bonuses wholly out of Misc. Junk, but your GM can give them situational bonuses.\u003c/p>\u003cp>Examples include a ladder, a 50ft rope, or a ceramic pot to store napalm. For items with moving parts, see the Engineering Skill above instead. See Crafting, p. 221. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you create the item.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Choose a mundane item to specialize in. You have Advantage when creating that item.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You may craft your specialty item with a +1 bonus level enchantment.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You may craft your specialty item with up to +2 bonus level enchantment, and it takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 191–192 · PDF pages 193–194\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FABRICATE\nIntelligence\nLimitations: Cannot create things with moving parts,\nfluids, or chemicals.\nUse this Skill to make generic, mundane items with no\ninherent bonuses wholly out of Misc. Junk, but your\nGM can give them situational bonuses.\nExamples include a ladder, a 50ft rope, or a ceramic\npot to store napalm. For items with moving parts, see\nthe Engineering Skill above instead. See Crafting, p.\n221. Make an Unopposed Skill Check.\nOn Success, you create the item.\nUPGRADES\nRank 5: Choose a mundane item to specialize in. You\nhave Advantage when creating that item.\nRank 10: You may craft your specialty item with a +1\nbonus level enchantment.\nRank 15: You may craft your specialty item with up to\n+2 bonus level enchantment, and it takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "fabricate utility skills fabricate fabricate utility_skill intelligence intelligence false false false [] [] cannot create things with moving parts, fluids, or chemicals. use this skill to make generic, mundane items with no inherent bonuses wholly out of misc. junk, but your gm can give them situational bonuses.\n\nexamples include a ladder, a 50ft rope, or a ceramic pot to store napalm. for items with moving parts, see the engineering skill above instead. see crafting, p. 221. make an unopposed skill check.\n\non success, you create the item. {'5': 'choose a mundane item to specialize in. you have advantage when creating that item.', '10': 'you may craft your specialty item with a +1 bonus level enchantment.', '15': 'you may craft your specialty item with up to +2 bonus level enchantment, and it takes half the time.'}"}, {"id": "skill-find-crawler", "reference": true, "referenceEntry": true, "title": "Find Crawler", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Ranks in this Skill only increase by magical means.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Your HUD displays other crawlers within 1,000 feet of you. They are designated with a blue dot.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>The area in which you can detect other crawlers increases to 5 miles.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The area in which you can detect other crawlers increases to 10 miles.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can input a specific crawler’s name and learn their exact location anywhere in the dungeon.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 192 · PDF pages 194\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FIND CRAWLER\nPassive\nLimitations: Ranks in this Skill only increase by\nmagical means.\nYour HUD displays other crawlers within 1,000 feet of\nyou. They are designated with a blue dot.\nUPGRADES\nRank 5: The area in which you can detect other crawl‑\ners increases to 5 miles.\nRank 10: The area in which you can detect other\ncrawlers increases to 10 miles.\nRank 15: You can input a specific crawler’s name and\nlearn their exact location anywhere in the dungeon.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "find crawler utility skills find-crawler find crawler utility_skill passive true false false [] [] ranks in this skill only increase by magical means. your hud displays other crawlers within 1,000 feet of you. they are designated with a blue dot. {'5': 'the area in which you can detect other crawlers increases to 5 miles.', '10': 'the area in which you can detect other crawlers increases to 10 miles.', '15': 'you can input a specific crawler’s name and learn their exact location anywhere in the dungeon.'}"}, {"id": "skill-find-trap", "reference": true, "referenceEntry": true, "title": "Find Trap", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003cdl class=\"reference-facts\">\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Ranks in this Skill only increase by magical means and training.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Traps within 5 feet of you appear on your HUD one second prior to triggering the trap, which is often too late to react.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Traps appear on your HUD up to 5 seconds before they are triggered.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Traps within 10 feet of you appear on your HUD as you approach them.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Traps within 15 feet of you appear on your HUD as you approach them.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 192 · PDF pages 194\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FIND TRAP\nPassive\nLimitations: Ranks in this Skill only increase by\nmagical means and training.\nTraps within 5 feet of you appear on your HUD one\nsecond prior to triggering the trap, which is often too\nlate to react.\nUPGRADES\nRank 5: Traps appear on your HUD up to 5 seconds\nbefore they are triggered.\nRank 10: Traps within 10 feet of you appear on your\nHUD as you approach them.\nRank 15: Traps within 15 feet of you appear on your\nHUD as you approach them.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "find trap utility skills find-trap find trap utility_skill passive true false false [] [] ranks in this skill only increase by magical means and training. traps within 5 feet of you appear on your hud one second prior to triggering the trap, which is often too late to react. {'5': 'traps appear on your hud up to 5 seconds before they are triggered.', '10': 'traps within 10 feet of you appear on your hud as you approach them.', '15': 'traps within 15 feet of you appear on your hud as you approach them.'}"}, {"id": "skill-first-aid", "reference": true, "referenceEntry": true, "title": "First Aid", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>After you treat someone, you can’t treat them again until they complete a Short or Long Rest.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Give minor medical aid to yourself or someone else. Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, the patient regains 1 Health Bar slot. Each higher degree of Success heals 1 additional slot.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>If you spend 5 minutes, the patient also heals a Minor Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>If you spend 10 minutes, the patient also heals a Long-Term Minor Injury Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The patient regains 1 additional Health Bar slot. If you spend 15 minutes, the patient also heals a Major Injury Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 192 · PDF pages 194\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FIRST AID\nIntelligence\nLimitations: After you treat someone, you can’t treat\nthem again until they complete a Short or Long Rest.\nGive minor medical aid to yourself or someone else.\nMake an Unopposed Skill Check.\nOn Success, the patient regains 1 Health Bar slot. Each\nhigher degree of Success heals 1 additional slot.\nUPGRADES\nRank 5: If you spend 5 minutes, the patient also heals\na Minor Injury Debuff.\nRank 10: If you spend 10 minutes, the patient also\nheals a Long-Term Minor Injury Debuff.\nRank 15: The patient regains 1 additional Health Bar\nslot. If you spend 15 minutes, the patient also heals a\nMajor Injury Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "first aid utility skills first-aid first aid utility_skill intelligence intelligence false false false [] [] after you treat someone, you can’t treat them again until they complete a short or long rest. give minor medical aid to yourself or someone else. make an unopposed skill check.\n\non success, the patient regains 1 health bar slot. each higher degree of success heals 1 additional slot. {'5': 'if you spend 5 minutes, the patient also heals a minor injury debuff.', '10': 'if you spend 10 minutes, the patient also heals a long-term minor injury debuff.', '15': 'the patient regains 1 additional health bar slot. if you spend 15 minutes, the patient also heals a major injury debuff.'}"}, {"id": "skill-foot-soldier", "reference": true, "referenceEntry": true, "title": "Foot Soldier", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Hand-to-Hand Combat Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1 (only if no Damage Effect is used)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Choose the Powerful Strike or Smush Damage Effect (if you wish) before rolling to hit.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and the target gains the Sore as Shit Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 179 · PDF pages 181\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">FOOT SOLDIER\nMelee Attack, Str\nAI Favor: 1 (only if no Damage Effect is used)\nChoose the Powerful Strike or Smush Damage Effect\n(if you wish) before rolling to hit.\nBase Damage: 1d4 + Str Bludgeoning\nUPGRADES\nRank 5: +1d4 base damage\nRank 10: +1d4 base damage\nRank 15: +1d4 base damage, and the target gains the\nSore as Shit Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skill-powerful-strike", "skills", "skill-smush"], "search": "foot soldier hand-to-hand combat skills foot-soldier foot soldier attack_skill hand-to-hand combat skills melee attack, str strength false false false melee [] ['bludgeoning'] 1 (only if no damage effect is used) 1d4 + str bludgeoning choose the powerful strike or smush damage effect (if you wish) before rolling to hit. {'5': '+1d4 base damage', '10': '+1d4 base damage', '15': '+1d4 base damage, and the target gains the sore as shit debuff.'}"}, {"id": "skill-gear-head", "reference": true, "referenceEntry": true, "title": "Gear Head", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>This Limited Skill can only be learned via a Race, Class, or item. Requires an Engine Stand attachment to an Engineering Table (2,000 gold).\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You are proficient at building high-performance engines, using the rules of Crafting (see p. 221). Each +5ft Move is a +1 Bonus Level at the default “10 + Bonus Level ×4” Difficulty. The time it takes and Misc. Junk required uses the rules of crafting mundane items.\u003c/p>\u003cp>On Success, you have successfully built a custom engine.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You are able to add accessories to vehicles or even build your own custom vehicles. Use the rules of Engineering for crafting such things, but use this Skill and there are no bonus level limits to your custom-crafted items.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Each +10ft Move is a +1 Bonus Level. You may use this Skill as a Repair Skill (see p. 197) when fixing engines.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Cut the time required to craft engines and vehicles you build around your engines in half.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 192 · PDF pages 194\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">GEAR HEAD\nIntelligence\nLimitations: This Limited Skill can only be learned\nvia a Race, Class, or item. Requires an Engine Stand\nattachment to an Engineering Table (2,000 gold).\nYou are proficient at building high-performance engines,\nusing the rules of Crafting (see p. 221). Each +5ft Move\nis a +1 Bonus Level at the default “10 + Bonus Level\n×4” Difficulty. The time it takes and Misc. Junk required\nuses the rules of crafting mundane items.\nOn Success, you have successfully built a custom engine.\nUPGRADES\nRank 5: You are able to add accessories to vehicles or\neven build your own custom vehicles. Use the rules of Engi‑\nneering for crafting such things, but use this Skill and there\nare no bonus level limits to your custom-crafted items.\nRank 10: Each +10ft Move is a +1 Bonus Level. You\nmay use this Skill as a Repair Skill (see p. 197) when\nfixing engines.\nRank 15: Cut the time required to craft engines and\nvehicles you build around your engines in half.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "gear head utility skills gear-head gear head utility_skill intelligence intelligence false false false [] [] this limited skill can only be learned via a race, class, or item. requires an engine stand attachment to an engineering table (2,000 gold). you are proficient at building high-performance engines, using the rules of crafting (see p. 221). each +5ft move is a +1 bonus level at the default “10 + bonus level ×4” difficulty. the time it takes and misc. junk required uses the rules of crafting mundane items.\n\non success, you have successfully built a custom engine. {'5': 'you are able to add accessories to vehicles or even build your own custom vehicles. use the rules of engineering for crafting such things, but use this skill and there are no bonus level limits to your custom-crafted items.', '10': 'each +10ft move is a +1 bonus level. you may use this skill as a repair skill (see p. 197) when fixing engines.', '15': 'cut the time required to craft engines and vehicles you build around your engines in half.'}"}, {"id": "skill-goblin-explosives", "reference": true, "referenceEntry": true, "title": "Goblin Explosives", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>For making Attack Skill Checks with explosives, see Throwing, p. 200.\u003c/p>\u003cp>Make an Unopposed Skill Check. Goblin Explosives are so unstable that Critical Fails occur on a Natural 1–4.\u003c/p>\u003cp>On Success, you safely use Goblin Explosive devices.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Critical Fail occurs on a Natural 3 or less. You are able to determine the type, status, and raw materials of Goblin Explosives you handle.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Critical Fail occurs on a Natural 2 or less. You are able to craft explosives such as dynamite as if this were a crafting Skill, though you must have explosive raw materials and a Sapper’s Table. See Crafting on p. 221.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Critical Fail occurs on a Natural 1 as usual. You may create explosive raw materials out of non-volatile materials with the use of a Sapper’s Table. Your crafting takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 192–193 · PDF pages 194–195\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">GOBLIN EXPLOSIVES\nIntelligence\nFor making Attack Skill Checks with explosives, see\nThrowing, p. 200.\nMake an Unopposed Skill Check. Goblin Explosives are\nso unstable that Critical Fails occur on a Natural 1–4.\nOn Success, you safely use Goblin Explosive devices.\nUPGRADES\nRank 5: Critical Fail occurs on a Natural 3 or less. You\nare able to determine the type, status, and raw materi‑\nals of Goblin Explosives you handle.\nRank 10: Critical Fail occurs on a Natural 2 or less. You\nare able to craft explosives such as dynamite as if this\nwere a crafting Skill, though you must have explosive raw\nmaterials and a Sapper’s Table. See Crafting on p. 221.\nRank 15: Critical Fail occurs on a Natural 1 as usual.\nYou may create explosive raw materials out of non-vol‑\natile materials with the use of a Sapper’s Table. Your\ncrafting takes half the time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "goblin explosives utility skills goblin-explosives goblin explosives utility_skill intelligence intelligence false false false [] [] for making attack skill checks with explosives, see throwing, p. 200.\n\nmake an unopposed skill check. goblin explosives are so unstable that critical fails occur on a natural 1–4.\n\non success, you safely use goblin explosive devices. {'5': 'critical fail occurs on a natural 3 or less. you are able to determine the type, status, and raw materials of goblin explosives you handle.', '10': 'critical fail occurs on a natural 2 or less. you are able to craft explosives such as dynamite as if this were a crafting skill, though you must have explosive raw materials and a sapper’s table. see crafting on p. 221.', '15': 'critical fail occurs on a natural 1 as usual. you may create explosive raw materials out of non-volatile materials with the use of a sapper’s table. your crafting takes half the time.'}"}, {"id": "skill-good-first-impression", "reference": true, "referenceEntry": true, "title": "Good First Impression", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Charisma\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Charisma\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>This Skill doesn’t work on crawlers, Bosses, or Elites. You can only make a Skill Check against individuals, not groups.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>When you encounter an NPC or Mob that is not immediately hostile or attacking, make an Int-Opposed Skill Check.\u003c/p>\u003cp>On Success, the Mob approaches with wary curiosity.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>A Mob that is lower level than you won’t attack your party unless they are attacked by a member of your party.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>A Mob that is up to double your level won’t attack your party unless they are attacked by you or an ally or your party is preventing them from completing their objective.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>A group of Mobs of the same type up to double your level won’t attack your party unless they are attacked by a member of your party, or your party is preventing them from completing their objective.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 193 · PDF pages 195\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">GOOD FIRST IMPRESSION\nCharisma\nLimitations: This Skill doesn’t work on crawlers,\nBosses, or Elites. You can only make a Skill Check\nagainst individuals, not groups.\nWhen you encounter an NPC or Mob that is not\nimmediately hostile or attacking, make an Int-Opposed\nSkill Check.\nOn Success, the Mob approaches with wary curiosity.\nUPGRADES\nRank 5: A Mob that is lower level than you won’t at‑\ntack your party unless they are attacked by a member\nof your party.\nRank 10: A Mob that is up to double your level won’t\nattack your party unless they are attacked by you or an\nally or your party is preventing them from completing\ntheir objective.\nRank 15: A group of Mobs of the same type up to\ndouble your level won’t attack your party unless they\nare attacked by a member of your party, or your party\nis preventing them from completing their objective.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "good first impression utility skills good-first-impression good first impression utility_skill charisma charisma false false false [] [] this skill doesn’t work on crawlers, bosses, or elites. you can only make a skill check against individuals, not groups. when you encounter an npc or mob that is not immediately hostile or attacking, make an int-opposed skill check.\n\non success, the mob approaches with wary curiosity. {'5': 'a mob that is lower level than you won’t attack your party unless they are attacked by a member of your party.', '10': 'a mob that is up to double your level won’t attack your party unless they are attacked by you or an ally or your party is preventing them from completing their objective.', '15': 'a group of mobs of the same type up to double your level won’t attack your party unless they are attacked by a member of your party, or your party is preventing them from completing their objective.'}"}, {"id": "skill-handgun", "reference": true, "referenceEntry": true, "title": "Handgun", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Ranged Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Ranged Attack, Dex\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>ranged\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>150 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d8 Piercing\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Piercing\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Each Attack requires proper ammunition. Spend one Action to reload after a Major Fail or worse.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use the base damage and listed properties above; no additional description is supplied.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d8 base damage\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d8 base damage, and the target gains the Staggered Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 181 · PDF pages 183\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HANDGUN\nRanged Attack, Dex\nRange: 150 feet\nLimitations: Each Attack requires proper ammunition.\nSpend one Action to reload after a Major Fail or worse.\nBase Damage: 1d8 Piercing\nUPGRADES\nRank 5: +1d8 base damage\nRank 10: +1d8 base damage\nRank 15: +1d8 base damage, and the target gains the\nStaggered Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "handgun ranged weapon skills handgun handgun attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] ['piercing'] 150 feet each attack requires proper ammunition. spend one action to reload after a major fail or worse. 1d8 piercing {'5': '+1d8 base damage', '10': '+1d8 base damage', '15': '+1d8 base damage, and the target gains the staggered debuff.'}"}, {"id": "skill-herding-weapons", "reference": true, "referenceEntry": true, "title": "Herding Weapons", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Reach Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Range\u003c/dt>\u003cdd>10 feet\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires two hands to wield.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>You start with a shepherd’s crook but soon have more tricks up your dirty sleeves.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage and you may slide the target 5 feet\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and you may use this skill to make a Sling attack with a range of 50 feet, but using Dex to hit.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage, and the target gains the Take Down Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 182 · PDF pages 184\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HERDING WEAPONS\nMelee Attack, Str\nYou start with a shepherd’s crook but soon have more\ntricks up your dirty sleeves.\nRange: 10 feet\nAI Favor: 1\nLimitations: Requires two hands to wield.\nBase Damage: 1d4 + Str Bludgeoning\nUPGRADES\nRank 5: +1d4 base damage and you may slide the\ntarget 5 feet\nRank 10: +1d4 base damage, and you may use this\nskill to make a Sling attack with a range of 50 feet, but\nusing Dex to hit.\nRank 15: +1d4 base damage, and the target gains the\nTake Down Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "herding weapons reach weapon skills herding-weapons herding weapons attack_skill reach weapon skills melee attack, str strength false false false melee [] ['bludgeoning'] 10 feet 1 requires two hands to wield. 1d4 + str bludgeoning you start with a shepherd’s crook but soon have more tricks up your dirty sleeves. {'5': '+1d4 base damage and you may slide the target 5 feet', '10': '+1d4 base damage, and you may use this skill to make a sling attack with a range of 50 feet, but using dex to hit.', '15': '+1d4 base damage, and the target gains the take down debuff.'}"}, {"id": "skill-hide-in-shadows", "reference": true, "referenceEntry": true, "title": "Hide In Shadows", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Dexterity\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Dexterity\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>To move while avoiding detection, see Stealth, p. 199.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>While in a heavily shadowed area or out of sight, you can stay still and attempt to foil foes’ chances to spot you. Make an Int-Opposed Skill Check. If you’re hiding behind an object that is larger than you, roll with Advantage.\u003c/p>\u003cp>On Success, you become invisible to Mobs and the HUDs of other crawlers but can still be affected by environmental and Area Attacks. You become visible if you take an Action that affects another creature or if you’re no longer behind cover.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You can use this Skill in a dim light without having an object to hide behind.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>When other crawlers in your party roll this Skill untrained, they roll as normal (not with Disadvantage).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>You can use this Skill in a lightly shaded area and may make a Step without giving away your position.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 193 · PDF pages 195\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">HIDE IN SHADOWS\nDexterity\nLimitations: To move while avoiding detection, see\nStealth, p. 199.\nWhile in a heavily shadowed area or out of sight,\nyou can stay still and attempt to foil foes’ chances to\nspot you. Make an Int-Opposed Skill Check. If you’re\nhiding behind an object that is larger than you, roll\nwith Advantage.\nOn Success, you become invisible to Mobs and the\nHUDs of other crawlers but can still be affected by\nenvironmental and Area Attacks. You become visible\nif you take an Action that affects another creature or if\nyou’re no longer behind cover.\nUPGRADES\nRank 5: You can use this Skill in a dim light without\nhaving an object to hide behind.\nRank 10: When other crawlers in your party roll\nthis Skill untrained, they roll as normal (not with\nDisadvantage).\nRank 15: You can use this Skill in a lightly shaded area\nand may make a Step without giving away your position.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "hide in shadows utility skills hide-in-shadows hide in shadows utility_skill dexterity dexterity false false false [] [] to move while avoiding detection, see stealth, p. 199. while in a heavily shadowed area or out of sight, you can stay still and attempt to foil foes’ chances to spot you. make an int-opposed skill check. if you’re hiding behind an object that is larger than you, roll with advantage.\n\non success, you become invisible to mobs and the huds of other crawlers but can still be affected by environmental and area attacks. you become visible if you take an action that affects another creature or if you’re no longer behind cover. {'5': 'you can use this skill in a dim light without having an object to hide behind.', '10': 'when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).', '15': 'you can use this skill in a lightly shaded area and may make a step without giving away your position.'}"}, {"id": "skill-improvised-explosive-device", "reference": true, "referenceEntry": true, "title": "Improvised Explosive Device", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill to manipulate explosive material into bombs and traps without a Sapper’s Table. You literally can’t use one, so you’ll have to make an Explosives Handling Skill Check to avoid issues when crafting your device. Use the rules of Crafting on p. 221.\u003c/p>\u003cp>On Success, you create the device. Bombs and traps can have timers and triggering devices more sophisticated than a burning fuse.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>Your crafting takes half the time.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>Your devices deal d10s of damage instead of d6s (the default).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Your devices can be set to trigger only against a specific Mob, Boss, NPC, or crawler.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 193 · PDF pages 195\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">IMPROVISED EXPLOSIVE DEVICE\nIntelligence\nUse this Skill to manipulate explosive material into\nbombs and traps without a Sapper’s Table. You literally\ncan’t use one, so you’ll have to make an Explosives\nHandling Skill Check to avoid issues when crafting your\ndevice. Use the rules of Crafting on p. 221.\nOn Success, you create the device. Bombs and\ntraps can have timers and triggering devices more\nsophisticated than a burning fuse.\nUPGRADES\nRank 5: Your crafting takes half the time.\nRank 10: Your devices deal d10s of damage instead of\nd6s (the default).\nRank 15: Your devices can be set to trigger only\nagainst a specific Mob, Boss, NPC, or crawler.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "improvised explosive device utility skills improvised-explosive-device improvised explosive device utility_skill intelligence intelligence false false false [] [] use this skill to manipulate explosive material into bombs and traps without a sapper’s table. you literally can’t use one, so you’ll have to make an explosives handling skill check to avoid issues when crafting your device. use the rules of crafting on p. 221.\n\non success, you create the device. bombs and traps can have timers and triggering devices more sophisticated than a burning fuse. {'5': 'your crafting takes half the time.', '10': 'your devices deal d10s of damage instead of d6s (the default).', '15': 'your devices can be set to trigger only against a specific mob, boss, npc, or crawler.'}"}, {"id": "skill-improvised-weapons", "reference": true, "referenceEntry": true, "title": "Improvised Weapons", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Bashing Weapon Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Melee Attack, Str\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attack mode\u003c/dt>\u003cdd>melee\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Base damage\u003c/dt>\u003cdd>1d4 + Str Bludgeoning\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI Favor\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Damage / effect types\u003c/dt>\u003cdd>Bludgeoning\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>Pick up something and smack someone else with it. That object must weigh at least one pound and can’t weigh more than your Str in pounds.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>+1d4 base damage, and you can throw the item (using this Skill) up to a range of Rank ×5 feet.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>+1d4 base damage, and you roll your first Attack each combat with Advantage due to the unexpected nature of your Attacks.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>+1d4 base damage\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 178 · PDF pages 180\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">IMPROVISED WEAPONS\nMelee Attack, Str\nAI Favor: 1\nPick up something and smack someone else with it.\nThat object must weigh at least one pound and can’t\nweigh more than your Str in pounds.\nBase Damage: 1d4 + Str Bludgeoning\nUPGRADES\nRank 5: +1d4 base damage, and you can throw the\nitem (using this Skill) up to a range of Rank ×5 feet.\nRank 10: +1d4 base damage, and you roll your first\nAttack each combat with Advantage due to the unex‑\npected nature of your Attacks.\nRank 15: +1d4 base damage\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "improvised weapons bashing weapon skills improvised-weapons improvised weapons attack_skill bashing weapon skills melee attack, str strength false false false melee [] ['bludgeoning'] 1 1d4 + str bludgeoning pick up something and smack someone else with it. that object must weigh at least one pound and can’t weigh more than your str in pounds. {'5': '+1d4 base damage, and you can throw the item (using this skill) up to a range of rank ×5 feet.', '10': '+1d4 base damage, and you roll your first attack each combat with advantage due to the unexpected nature of your attacks.', '15': '+1d4 base damage'}"}, {"id": "skill-incendiary-device-handling", "reference": true, "referenceEntry": true, "title": "Incendiary Device Handling", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>For making Attack Skill Checks with incendiary devices, see Throwing, p. 200.\u003c/p>\u003cp>Make an Unopposed Skill Check.\u003c/p>\u003cp>On Success, you are able to safely handle incendiary devices.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>You are able to determine the type, status, and raw materials of incendiary devices you handle.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>You are able to craft incendiary devices as if this were a crafting Skill, though you must have incendiary raw materials and a Sapper’s Table. See Crafting, p. 221.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>Add a +5 Splash to your crafted device at no additional Difficulty, and your crafting takes half the time.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 193 · PDF pages 195\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">INCENDIARY DEVICE HANDLING\nIntelligence\nFor making Attack Skill Checks with incendiary devic‑\nes, see Throwing, p. 200.\nMake an Unopposed Skill Check.\nOn Success, you are able to safely handle incendiary\ndevices.\nUPGRADES\nRank 5: You are able to determine the type, status,\nand raw materials of incendiary devices you handle.\nRank 10: You are able to craft incendiary devices\nas if this were a crafting Skill, though you must have\nincendiary raw materials and a Sapper’s Table. See\nCrafting, p. 221.\nRank 15: Add a +5 Splash to your crafted device at\nno additional Difficulty, and your crafting takes half\nthe time.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "incendiary device handling utility skills incendiary-device-handling incendiary device handling utility_skill intelligence intelligence false false false [] [] for making attack skill checks with incendiary devices, see throwing, p. 200.\n\nmake an unopposed skill check.\n\non success, you are able to safely handle incendiary devices. {'5': 'you are able to determine the type, status, and raw materials of incendiary devices you handle.', '10': 'you are able to craft incendiary devices as if this were a crafting skill, though you must have incendiary raw materials and a sapper’s table. see crafting, p. 221.', '15': 'add a +5 splash to your crafted device at no additional difficulty, and your crafting takes half the time.'}"}, {"id": "skill-infusion", "reference": true, "referenceEntry": true, "title": "Infusion", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"panel warn\">\u003cdiv class=\"ph\">Limitations\u003c/div>\u003cp>Requires an Infusion Station attachment on an Alchemy Table or Tier 3 Sapper’s Table.\u003c/p>\u003c/div>\u003ch2>Effect\u003c/h2>\u003cp>Use this Skill to infuse potion bonuses onto consumable items. One potion can infuse one item. You’ll either need to learn Alchemy so you can craft your own potions, or find potions to transfer to consumables. Example: Infuse a Hobgoblin Smoke Curtain with an Invisibility potion to create a Hobgoblin Disco Ball. See Crafting, p. 221.\u003c/p>\u003cp>On Success, your consumable item now does more!\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>One potion can infuse 2 items at once.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>One potion can infuse 5 items at once.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>One potion can infuse 10 items at once.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 194 · PDF pages 196\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">INFUSION\nIntelligence\nLimitations: Requires an Infusion Station attachment\non an Alchemy Table or Tier 3 Sapper’s Table.\nUse this Skill to infuse potion bonuses onto consum‑\nable items. One potion can infuse one item. You’ll ei‑\nther need to learn Alchemy so you can craft your own\npotions, or find potions to transfer to consumables.\nExample: Infuse a Hobgoblin Smoke Curtain with an\nInvisibility potion to create a Hobgoblin Disco Ball. See\nCrafting, p. 221.\nOn Success, your consumable item now does more!\nUPGRADES\nRank 5: One potion can infuse 2 items at once.\nRank 10: One potion can infuse 5 items at once.\nRank 15: One potion can infuse 10 items at once.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "infusion utility skills infusion infusion utility_skill intelligence intelligence false false false [] [] requires an infusion station attachment on an alchemy table or tier 3 sapper’s table. use this skill to infuse potion bonuses onto consumable items. one potion can infuse one item. you’ll either need to learn alchemy so you can craft your own potions, or find potions to transfer to consumables. example: infuse a hobgoblin smoke curtain with an invisibility potion to create a hobgoblin disco ball. see crafting, p. 221.\n\non success, your consumable item now does more! {'5': 'one potion can infuse 2 items at once.', '10': 'one potion can infuse 5 items at once.', '15': 'one potion can infuse 10 items at once.'}"}, {"id": "skill-intimidate", "reference": true, "referenceEntry": true, "title": "Intimidate", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Strength\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Strength\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You can use this Skill to scare the wits out of a foe. Make a Cha-Opposed Skill Check. If either side has attacked or taken a hostile stance in this encounter, roll with Disadvantage.\u003c/p>\u003cp>On Success, the target gains the Staggered Debuff (p. 97).\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class=\"rank-upgrades\">\u003csection class=\"panel\">\u003ch3>Rank 5\u003c/h3>\u003cp>On Success or greater, until the end of the next round, the target can only use its remaining Actions to move away from you (though it does not need to use its Step when doing so).\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 10\u003c/h3>\u003cp>The target also gains the Woozy Debuff.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Rank 15\u003c/h3>\u003cp>The target drops everything they were holding and also gains the Paralyzed Debuff.\u003c/p>\u003c/section>\u003c/div>\u003ch2>Source\u003c/h2>\u003cp class=\"source\">Dungeon Crawler Carl Roleplaying Game Core Rulebook: Royal Court Edition · Printed pages 194 · PDF pages 196\u003c/p>\u003cdetails>\u003csummary>Original extracted text\u003c/summary>\u003cpre class=\"raw-reference\">INTIMIDATE\nStrength\nYou can use this Skill to scare the wits out of a foe.\nMake a Cha-Opposed Skill Check. If either side has\nattacked or taken a hostile stance in this encounter, roll\nwith Disadvantage.\nOn Success, the target gains the Staggered Debuff (p. 97).\nUPGRADES\nRank 5: On Success or greater, until the end of the\nnext round, the target can only use its remaining Ac‑\ntions to move away from you (though it does not need\nto use its Step when doing so).\nRank 10: The target also gains the Woozy Debuff.\nRank 15: The target drops everything they were hold‑\ning and also gains the Paralyzed Debuff.\u003c/pre>\u003c/details>", "backlinks": ["skills"], "search": "intimidate utility skills intimidate intimidate utility_skill strength strength false false false [] [] you can use this skill to scare the wits out of a foe. make a cha-opposed skill check. if either side has attacked or taken a hostile stance in this encounter, roll with disadvantage.\n\non success, the target gains the staggered debuff (p. 97). {'5': 'on success or greater, until the end of the next round, the target can only use its remaining actions to move away from you (though it does not need to use its step when doing so).', '10': 'the target also gains the woozy debuff.', '15': 'the target drops everything they were holding and also gains the paralyzed debuff.'}"}, {"id": "skill-investigation", "reference": true, "referenceEntry": true, "title": "Investigation", "group": "Skills", "type": "skill", "typeLabel": "Skill", "dek": "Utility Skills", "conf": "", "confLabel": "", "player": "", "status": "", "statusLabel": "", "statusTone": "warn", "axis": "", "axisLabel": "Floor", "aliases": [], "html": "\u003cp>\u003ca class=\"wl\" href=\"#skills\">← All skills\u003c/a> · \u003ca class=\"wl\" href=\"#skills-rules\">General rules\u003c/a>\u003c/p>\u003cp class=\"source\">Intelligence\u003c/p>\u003cdl class=\"reference-facts\">\u003cdiv>\u003cdt>Listed stat\u003c/dt>\u003cdd>Intelligence\u003c/dd>\u003c/div>\u003c/dl>\u003ch2>Effect\u003c/h2>\u003cp>You spend 10 minutes looking at an area or puzzle in front of you and might make heads or tails of it. Make an Unopposed Skill Check.\u003c/p>\u003cp>When you take the Look for Clues Action (p. 85), spend only one Action to use this Skill.\u003c/p>\u003cp>On Success, you learn something useful.\u003c/p>\u003ch2>Rank upgrades\u003c/h2>\u003cdiv class
