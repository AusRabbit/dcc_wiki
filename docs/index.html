ty_skill intelligence intelligence false false false [] [] you have an incredible bullshit detector. if you believe someone is trying to lie to you, make a cha-opposed skill check. if they possess the deception skill, you make this check with disadvantage.\n\non success, you sense if they’re lying, but if they believe they’re telling the truth, you sense they’re telling the truth. {&#x27;5&#x27;: &#x27;when you fail, you still can’t detect the lie, but you can ignore the additional effects of a major fail or worse.&#x27;, &#x27;10&#x27;: &#x27;when you fail, you can’t detect the lie, but you can ignore the effects of a critical fail.&#x27;, &#x27;15&#x27;: &#x27;you do not need to see the speaker, which allows you to detect lies in text and audio form.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-detect-lies\">Detect Lies\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"detect-trap detect trap utility_skill intelligence intelligence false false false [] [] when you suspect a room, door, chest, or other object has an active trap, this is the skill you want. make an unopposed skill check. roll with disadvantage when using this skill to scan an entire room or while moving.\n\non success, you are alerted to the presence of a non-magic trap, which typically allows you to avoid triggering it.\n\non fail, you sense nothing, and a trap may or may not be present. {&#x27;5&#x27;: &#x27;you can detect magical traps.&#x27;, &#x27;10&#x27;: &#x27;you no longer roll with disadvantage when searching a broad area or while moving.&#x27;, &#x27;15&#x27;: &#x27;when you are aware of nearby traps, your party has advantage on their first check to avoid or escape the effects.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-detect-trap\">Detect Trap\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"determine-value determine value utility_skill passive true false false [] [] ranks in this skill only increase by magical means. you can sort your hud’s inventory by item value. the actual gold value is not displayed. {&#x27;5&#x27;: &#x27;your inventory is tabbed to sort your items by type, and it includes a history tab that tracks your item usage and any former owners of an item.&#x27;, &#x27;10&#x27;: &#x27;you can determine what type of loot box the item would have come from.&#x27;, &#x27;15&#x27;: &#x27;whenever you add a new item to your inventory, the gold value of that item is displayed.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-determine-value\">Determine Value\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"diplomacy diplomacy utility_skill charisma charisma false false false [] [] used in mediation between opposing organizations and parties. make an int-opposed skill check of the side with the higher int mod.\n\non success, the two parties are willing to discuss options. {&#x27;5&#x27;: &#x27;roll with advantage if you are not a member of either party.&#x27;, &#x27;10&#x27;: &#x27;each side accepts consequences if they break the deal.&#x27;, &#x27;15&#x27;: &#x27;hostilities cease at least for the remainder of the day.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-diplomacy\">Diplomacy\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"dirty-fighting dirty fighting attack_skill hand-to-hand damage effect skills pugilism or wrasslin’ damage effect, passive true false false pugilism or wrasslin’ [] [] you use underhanded tactics to win fights and cause a different kind of harm to your opponents. if the attack skill check is a critical fail, lose 1 popularity.\n\napply the woozy debuff to the target. {&#x27;5&#x27;: &#x27;also apply the taint debuff to the target.&#x27;, &#x27;10&#x27;: &#x27;also apply the blinded debuff to the target. you no longer lose popularity on critical fails.&#x27;, &#x27;15&#x27;: &#x27;also apply an immediate minor injury debuff to the target.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-dirty-fighting\">Dirty Fighting\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"dodge dodge utility_skill passive true false false [] [] mark the skill for advancement when evading until you reach rank 5. after that, ranks in this skill only increase by magical means and training. you gain a +1 evade buff. {&#x27;5&#x27;: &#x27;gain a +1 evade buff, and you may step an additional 5 feet when you perform the evade action.&#x27;, &#x27;10&#x27;: &#x27;gain a +2 evade buff, and roll evade with advantage vs. spells and ranged attacks.&#x27;, &#x27;15&#x27;: &#x27;gain a +2 evade buff, and you may perform the evade action without spending an action in combat.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-dodge\">Dodge\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"double-tap double tap utility_skill passive true false false [] [] to engage this skill, you must declare a double tap at the start of the combat round, before mob actions have been determined. you must then use all of your actions this round to attack a single target with the same weapon or spell. mark this skill for advancement anytime you roll an amazing success or better while using it. if your first attack is an amazing success or better, your second attack (if it hits) is upgraded to a critical hit. {&#x27;5&#x27;: &#x27;roll your first attack with advantage. better, the second attack (if it hits) is upgraded to a critical hit.&#x27;, &#x27;15&#x27;: &#x27;roll your second attack with advantage. if your second attack is a critical hit or upgraded to one, deal ×3 damage (instead of ×2).&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-double-tap\">Double Tap\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"driving driving utility_skill dexterity dexterity false false false [] [] if you attack while driving, you suffer disadvantage on those checks. you don’t need this skill if you’re casually driving down the road to pick up a quart of milk, but if you’re racing, chasing, showing off, or doing something dangerous in a vehicle, this is the skill you want.\n\nif you’re doing something wild or trying to avoid becoming a skid mark on the highway, make an unopposed skill check. depending on how extreme the circumstances are, the gm may apply advantage or disadvantage to the check.\n\non success, you achieve your daredevil maneuver or avoid wrecking your vehicle. {&#x27;5&#x27;: &#x27;you no longer suffer disadvantage when attacking while driving.&#x27;, &#x27;10&#x27;: &#x27;your vehicle has +5ft move. roll with advantage to evade attacks against your vehicle.&#x27;, &#x27;15&#x27;: &#x27;your vehicle has +5ft move. when performing crazy stunts (like driving on only your left-side wheels), roll with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-driving\">Driving\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"dumpster-diving dumpster diving utility_skill intelligence intelligence false false false [] [] known as “scrounging” in some parts of the world.\n\nthis skill bolsters your ability to search the clutter within the dungeon to find interesting bits of rubbish and maybe something useful. using this skill takes 1 hour and can only be performed once per 50-foot-square area. make an unopposed skill check.\n\non success, you find what you were looking for or another interesting item, determined by the gm. {&#x27;5&#x27;: &#x27;you also find 1 rank damage die’s-worth of misc. junk.&#x27;, &#x27;10&#x27;: &#x27;a dumpster dive takes 30 minutes. on a critical hit, you gain an additional interesting item.&#x27;, &#x27;15&#x27;: &#x27;a dumpster dive takes 10 minutes. on an amazing success, you gain an interesting item.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-dumpster-diving\">Dumpster Diving\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"endurance endurance utility_skill constitution constitution false false false [] [] use this skill to prevent fatigue while grinding, walking long distances (measured in miles), or other extended strenuous activities. make an unopposed skill check.\n\non success, you may continue the activity and do not gain the fatigued debuff. {&#x27;5&#x27;: &#x27;you can ignore the effects of a major fail when making these checks.&#x27;, &#x27;10&#x27;: &#x27;if you are not fatigued or in extreme conditions, you make this check with advantage.&#x27;, &#x27;15&#x27;: &#x27;if your check is a critical fail, you can take the effects of a standard fail.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Constitution\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-endurance\">Endurance\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Constitution\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"engineering engineering utility_skill intelligence intelligence false false false [] [] cannot create vehicles or high-powered engines (see gear head for that p. 192). this skill is used to design and build things with moving parts, fluids, or chemicals wholly out of misc. junk with no inherent bonuses, though they may have situational bonuses. examples include a watch, a water pump, or bullets. see crafting p. 221.\n\nstarting on the fourth floor, you may make use of an engineering table to make your mundane items easier to craft. make an unopposed skill check.\n\non success, you create the item. {&#x27;5&#x27;: &#x27;choose a mundane item type to specialize in. you have advantage when creating an item of that type.&#x27;, &#x27;10&#x27;: &#x27;you may craft your specialty item with a +1 bonus level enchantment.&#x27;, &#x27;15&#x27;: &#x27;you may craft your specialty item with up to +2 bonus level enchantment, and it takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-engineering\">Engineering\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"escape-artist escape artist utility_skill dexterity dexterity false false false [] [] holy houdini! while anyone can use dexterity to wiggle out of restraints or a hold, you’re especially skilled at the art of escape. when you try to escape from bonds or being held, you can use this skill.\n\nwhen trying to escape bonds, make an unopposed skill check.\n\nto escape being held, make a str-opposed skill check. based on the complexity or simplicity of what binds you, the gm may have you make the check with advantage or disadvantage.\n\non success, you escape your bonds or the creature holding you. {&#x27;5&#x27;: &#x27;you can escape your bonds, and no one sees you do it. if you escape being held, you can then take a step (also unseen).&#x27;, &#x27;10&#x27;: &#x27;when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;, &#x27;15&#x27;: &#x27;when you slip out, you may immediately take an action with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-escape-artist\">Escape Artist\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"escape-plan escape plan utility_skill passive true false false [] [] ranks in this skill only advance by magical means. your hud reveals hidden doors and passages, unless those passages were crafted by someone with more ranks in fabricate or engineering than you have in this skill or the passage is entirely natural. {&#x27;5&#x27;: &#x27;you have access to system-concealed displays and the dungeon locator. holographic signs pop up in your hud, displaying insider information like signs at a zoo. includes arrows toward city and stronger bosses.&#x27;, &#x27;10&#x27;: &#x27;you are able to read hidden sigils (glowing blue circles) used by the showrunners to direct the movement of mobs.&#x27;, &#x27;15&#x27;: &#x27;you are able to read hidden messages and redactions in dungeon documents.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-escape-plan\">Escape Plan\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"explosives-handling explosives handling utility_skill intelligence intelligence false false false [] [] for making attack skill checks with explosives (see throwing, p. 200).\n\nmake an unopposed skill check.\n\non success, you safely handle standard explosive devices. on fail, i’m sure the gm will think of something. {&#x27;5&#x27;: &#x27;you are able to determine the type, status, and raw materials of explosives you handle.&#x27;, &#x27;10&#x27;: &#x27;you are able to craft explosives such as dynamite as if this were a crafting skill, though you must have explosive raw materials and a sapper’s table (see crafting, p. 221).&#x27;, &#x27;15&#x27;: &#x27;you may create explosive raw materials out of non-volatile materials. your crafting takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-explosives-handling\">Explosives Handling\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"fabricate fabricate utility_skill intelligence intelligence false false false [] [] cannot create things with moving parts, fluids, or chemicals. use this skill to make generic, mundane items with no inherent bonuses wholly out of misc. junk, but your gm can give them situational bonuses.\n\nexamples include a ladder, a 50ft rope, or a ceramic pot to store napalm. for items with moving parts, see the engineering skill above instead. see crafting, p. 221. make an unopposed skill check.\n\non success, you create the item. {&#x27;5&#x27;: &#x27;choose a mundane item to specialize in. you have advantage when creating that item.&#x27;, &#x27;10&#x27;: &#x27;you may craft your specialty item with a +1 bonus level enchantment.&#x27;, &#x27;15&#x27;: &#x27;you may craft your specialty item with up to +2 bonus level enchantment, and it takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-fabricate\">Fabricate\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"find-crawler find crawler utility_skill passive true false false [] [] ranks in this skill only increase by magical means. your hud displays other crawlers within 1,000 feet of you. they are designated with a blue dot. {&#x27;5&#x27;: &#x27;the area in which you can detect other crawlers increases to 5 miles.&#x27;, &#x27;10&#x27;: &#x27;the area in which you can detect other crawlers increases to 10 miles.&#x27;, &#x27;15&#x27;: &#x27;you can input a specific crawler’s name and learn their exact location anywhere in the dungeon.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-find-crawler\">Find Crawler\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"find-trap find trap utility_skill passive true false false [] [] ranks in this skill only increase by magical means and training. traps within 5 feet of you appear on your hud one second prior to triggering the trap, which is often too late to react. {&#x27;5&#x27;: &#x27;traps appear on your hud up to 5 seconds before they are triggered.&#x27;, &#x27;10&#x27;: &#x27;traps within 10 feet of you appear on your hud as you approach them.&#x27;, &#x27;15&#x27;: &#x27;traps within 15 feet of you appear on your hud as you approach them.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-find-trap\">Find Trap\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"first-aid first aid utility_skill intelligence intelligence false false false [] [] after you treat someone, you can’t treat them again until they complete a short or long rest. give minor medical aid to yourself or someone else. make an unopposed skill check.\n\non success, the patient regains 1 health bar slot. each higher degree of success heals 1 additional slot. {&#x27;5&#x27;: &#x27;if you spend 5 minutes, the patient also heals a minor injury debuff.&#x27;, &#x27;10&#x27;: &#x27;if you spend 10 minutes, the patient also heals a long-term minor injury debuff.&#x27;, &#x27;15&#x27;: &#x27;the patient regains 1 additional health bar slot. if you spend 15 minutes, the patient also heals a major injury debuff.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-first-aid\">First Aid\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"foot-soldier foot soldier attack_skill hand-to-hand combat skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 1 (only if no damage effect is used) 1d4 + str bludgeoning choose the powerful strike or smush damage effect (if you wish) before rolling to hit. {&#x27;5&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and the target gains the sore as shit debuff.&#x27;}\" data-category=\"Hand-to-Hand Combat Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-foot-soldier\">Foot Soldier\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Combat Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d4 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"gear-head gear head utility_skill intelligence intelligence false false false [] [] this limited skill can only be learned via a race, class, or item. requires an engine stand attachment to an engineering table (2,000 gold). you are proficient at building high-performance engines, using the rules of crafting (see p. 221). each +5ft move is a +1 bonus level at the default “10 + bonus level ×4” difficulty. the time it takes and misc. junk required uses the rules of crafting mundane items.\n\non success, you have successfully built a custom engine. {&#x27;5&#x27;: &#x27;you are able to add accessories to vehicles or even build your own custom vehicles. use the rules of engineering for crafting such things, but use this skill and there are no bonus level limits to your custom-crafted items.&#x27;, &#x27;10&#x27;: &#x27;each +10ft move is a +1 bonus level. you may use this skill as a repair skill (see p. 197) when fixing engines.&#x27;, &#x27;15&#x27;: &#x27;cut the time required to craft engines and vehicles you build around your engines in half.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-gear-head\">Gear Head\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"goblin-explosives goblin explosives utility_skill intelligence intelligence false false false [] [] for making attack skill checks with explosives, see throwing, p. 200.\n\nmake an unopposed skill check. goblin explosives are so unstable that critical fails occur on a natural 1–4.\n\non success, you safely use goblin explosive devices. {&#x27;5&#x27;: &#x27;critical fail occurs on a natural 3 or less. you are able to determine the type, status, and raw materials of goblin explosives you handle.&#x27;, &#x27;10&#x27;: &#x27;critical fail occurs on a natural 2 or less. you are able to craft explosives such as dynamite as if this were a crafting skill, though you must have explosive raw materials and a sapper’s table. see crafting on p. 221.&#x27;, &#x27;15&#x27;: &#x27;critical fail occurs on a natural 1 as usual. you may create explosive raw materials out of non-volatile materials with the use of a sapper’s table. your crafting takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-goblin-explosives\">Goblin Explosives\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"good-first-impression good first impression utility_skill charisma charisma false false false [] [] this skill doesn’t work on crawlers, bosses, or elites. you can only make a skill check against individuals, not groups. when you encounter an npc or mob that is not immediately hostile or attacking, make an int-opposed skill check.\n\non success, the mob approaches with wary curiosity. {&#x27;5&#x27;: &#x27;a mob that is lower level than you won’t attack your party unless they are attacked by a member of your party.&#x27;, &#x27;10&#x27;: &#x27;a mob that is up to double your level won’t attack your party unless they are attacked by you or an ally or your party is preventing them from completing their objective.&#x27;, &#x27;15&#x27;: &#x27;a group of mobs of the same type up to double your level won’t attack your party unless they are attacked by a member of your party, or your party is preventing them from completing their objective.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-good-first-impression\">Good First Impression\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"handgun handgun attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;piercing&#x27;] 150 feet each attack requires proper ammunition. spend one action to reload after a major fail or worse. 1d8 piercing {&#x27;5&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and the target gains the staggered debuff.&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-handgun\">Handgun\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 150 feet · Damage: 1d8 Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"herding-weapons herding weapons attack_skill reach weapon skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 10 feet 1 requires two hands to wield. 1d4 + str bludgeoning you start with a shepherd’s crook but soon have more tricks up your dirty sleeves. {&#x27;5&#x27;: &#x27;+1d4 base damage and you may slide the target 5 feet&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and you may use this skill to make a sling attack with a range of 50 feet, but using dex to hit.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and the target gains the take down debuff.&#x27;}\" data-category=\"Reach Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-herding-weapons\">Herding Weapons\u003c/a>\u003c/h2>\u003cp class=\"source\">Reach Weapon Skills\u003c/p>\u003cp>Stat: Strength · Range: 10 feet · Damage: 1d4 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"hide-in-shadows hide in shadows utility_skill dexterity dexterity false false false [] [] to move while avoiding detection, see stealth, p. 199. while in a heavily shadowed area or out of sight, you can stay still and attempt to foil foes’ chances to spot you. make an int-opposed skill check. if you’re hiding behind an object that is larger than you, roll with advantage.\n\non success, you become invisible to mobs and the huds of other crawlers but can still be affected by environmental and area attacks. you become visible if you take an action that affects another creature or if you’re no longer behind cover. {&#x27;5&#x27;: &#x27;you can use this skill in a dim light without having an object to hide behind.&#x27;, &#x27;10&#x27;: &#x27;when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;, &#x27;15&#x27;: &#x27;you can use this skill in a lightly shaded area and may make a step without giving away your position.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-hide-in-shadows\">Hide In Shadows\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"improvised-explosive-device improvised explosive device utility_skill intelligence intelligence false false false [] [] use this skill to manipulate explosive material into bombs and traps without a sapper’s table. you literally can’t use one, so you’ll have to make an explosives handling skill check to avoid issues when crafting your device. use the rules of crafting on p. 221.\n\non success, you create the device. bombs and traps can have timers and triggering devices more sophisticated than a burning fuse. {&#x27;5&#x27;: &#x27;your crafting takes half the time.&#x27;, &#x27;10&#x27;: &#x27;your devices deal d10s of damage instead of d6s (the default).&#x27;, &#x27;15&#x27;: &#x27;your devices can be set to trigger only against a specific mob, boss, npc, or crawler.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-improvised-explosive-device\">Improvised Explosive Device\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"improvised-weapons improvised weapons attack_skill bashing weapon skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 1 1d4 + str bludgeoning pick up something and smack someone else with it. that object must weigh at least one pound and can’t weigh more than your str in pounds. {&#x27;5&#x27;: &#x27;+1d4 base damage, and you can throw the item (using this skill) up to a range of rank ×5 feet.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and you roll your first attack each combat with advantage due to the unexpected nature of your attacks.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage&#x27;}\" data-category=\"Bashing Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-improvised-weapons\">Improvised Weapons\u003c/a>\u003c/h2>\u003cp class=\"source\">Bashing Weapon Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d4 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"incendiary-device-handling incendiary device handling utility_skill intelligence intelligence false false false [] [] for making attack skill checks with incendiary devices, see throwing, p. 200.\n\nmake an unopposed skill check.\n\non success, you are able to safely handle incendiary devices. {&#x27;5&#x27;: &#x27;you are able to determine the type, status, and raw materials of incendiary devices you handle.&#x27;, &#x27;10&#x27;: &#x27;you are able to craft incendiary devices as if this were a crafting skill, though you must have incendiary raw materials and a sapper’s table. see crafting, p. 221.&#x27;, &#x27;15&#x27;: &#x27;add a +5 splash to your crafted device at no additional difficulty, and your crafting takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-incendiary-device-handling\">Incendiary Device Handling\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"infusion infusion utility_skill intelligence intelligence false false false [] [] requires an infusion station attachment on an alchemy table or tier 3 sapper’s table. use this skill to infuse potion bonuses onto consumable items. one potion can infuse one item. you’ll either need to learn alchemy so you can craft your own potions, or find potions to transfer to consumables. example: infuse a hobgoblin smoke curtain with an invisibility potion to create a hobgoblin disco ball. see crafting, p. 221.\n\non success, your consumable item now does more! {&#x27;5&#x27;: &#x27;one potion can infuse 2 items at once.&#x27;, &#x27;10&#x27;: &#x27;one potion can infuse 5 items at once.&#x27;, &#x27;15&#x27;: &#x27;one potion can infuse 10 items at once.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-infusion\">Infusion\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"intimidate intimidate utility_skill strength strength false false false [] [] you can use this skill to scare the wits out of a foe. make a cha-opposed skill check. if either side has attacked or taken a hostile stance in this encounter, roll with disadvantage.\n\non success, the target gains the staggered debuff (p. 97). {&#x27;5&#x27;: &#x27;on success or greater, until the end of the next round, the target can only use its remaining actions to move away from you (though it does not need to use its step when doing so).&#x27;, &#x27;10&#x27;: &#x27;the target also gains the woozy debuff.&#x27;, &#x27;15&#x27;: &#x27;the target drops everything they were holding and also gains the paralyzed debuff.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-intimidate\">Intimidate\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"investigation investigation utility_skill intelligence intelligence false false false [] [] you spend 10 minutes looking at an area or puzzle in front of you and might make heads or tails of it. make an unopposed skill check.\n\nwhen you take the look for clues action (p. 85), spend only one action to use this skill.\n\non success, you learn something useful. {&#x27;5&#x27;: &#x27;if you’re familiar with the area you are investigating, you can make the skill check with advantage.&#x27;, &#x27;10&#x27;: &#x27;each attempt takes 5 minutes.&#x27;, &#x27;15&#x27;: &#x27;roll with advantage if you know the parties involved. example: you know the puzzle’s maker, or you know the murder victim and the main suspect.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-investigation\">Investigation\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"iron-punch iron punch attack_skill hand-to-hand damage effect skills pugilism damage effect, passive true false false pugilism [] [] you deal +1d2 base damage. {&#x27;5&#x27;: &#x27;add 1 rank damage die.&#x27;, &#x27;10&#x27;: &#x27;you may choose to have the target gain the stunned debuff instead of rolling damage.&#x27;, &#x27;15&#x27;: &#x27;add 1 rank damage die, and the target gains the stunned debuff.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-iron-punch\">Iron Punch\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"iron-stomach iron stomach utility_skill constitution constitution false false false [] [] eat magic items for fun and profit! but beware of cursed items, as they could have negative effects. make an unopposed skill check.\n\non success, you eat the item. it is destroyed, as the shitter will be tomorrow morning.\n\non an amazing success or better, gain 1 permanent intelligence. {&#x27;5&#x27;: &#x27;on a critical hit, gain 1 additional permanent intelligence.&#x27;, &#x27;10&#x27;: &#x27;on a standard success or better, gain 1 permanent intelligence. you may eat cursed items with no ill effects.&#x27;, &#x27;15&#x27;: &#x27;you choose which stat is permanently increased.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Constitution\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-iron-stomach\">Iron Stomach\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Constitution\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"javelin javelin attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;piercing&#x27;] 40 feet 1d8 + str piercing {&#x27;5&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage, and this attack deals armor-piercing damage (ignores dr).&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and its range increases by your strength score in feet.&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-javelin\">Javelin\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 40 feet · Damage: 1d8 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"jumping jumping utility_skill strength strength false false false [] [] with a running start of at least 10 feet (made as a 10-foot step with this action), you leap through the air in an arcing trajectory. make an unopposed skill check.\n\non success, you leap a distance in feet up to your rank + str with a height of 1ft. {&#x27;5&#x27;: &#x27;add your dex to the height of your jump.&#x27;, &#x27;10&#x27;: &#x27;you gain a +1 evade buff.&#x27;, &#x27;15&#x27;: &#x27;your leap distance in feet is rank + [str ×2].&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-jumping\">Jumping\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"lance lance attack_skill reach weapon skills melee attack, str strength false false false melee [] [&#x27;piercing&#x27;] 10 feet must be mounted to use. cannot be used in conjunction with attack of opportunity or zone of control skills. 1d12 + str piercing {&#x27;5&#x27;: &#x27;+1d12 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d12 base damage, and +1 damage for every 10 feet your mount moved this turn.&#x27;, &#x27;15&#x27;: &#x27;+1d12 base damage, and +x damage, where x is the size of your mount.&#x27;}\" data-category=\"Reach Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-lance\">Lance\u003c/a>\u003c/h2>\u003cp class=\"source\">Reach Weapon Skills\u003c/p>\u003cp>Stat: Strength · Range: 10 feet · Damage: 1d12 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"leadership leadership utility_skill charisma charisma false false false [] [] you are skilled at coordinating two or more separate parties during fights against bosses. make an int-opposed skill check.\n\non success, the parties have advantage on their first attack against the boss. {&#x27;5&#x27;: &#x27;you may instead use this skill during skill challenges while on a group quest. perform a free call a play action, and it extends to each member of the parties during their next non-combat skill check.&#x27;, &#x27;10&#x27;: &#x27;instead of advantage, anyone in the parties may perform a free move action.&#x27;, &#x27;15&#x27;: &#x27;instead of advantage, anyone in the parties may perform a free evade action.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-leadership\">Leadership\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"light-on-your-feet light on your feet utility_skill dexterity dexterity false false false [] [] usable only by animals with a running start of at least 10 feet (made as a 10ft step with this skill), you leap through the air in an arcing trajectory. make an unopposed skill check.\n\non success, you leap a distance in feet up to your rank ×2 with a height equal to your dex ×2 in feet. {&#x27;5&#x27;: &#x27;your distance is rank ×3 and your height is dex ×3.&#x27;, &#x27;10&#x27;: &#x27;you may leap without an arcing trajectory, which allows for “straight up.”&#x27;, &#x27;15&#x27;: &#x27;your leap may last up to your rank in seconds, which resembles gliding.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-light-on-your-feet\">Light On Your Feet\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"lockpicking lockpicking utility_skill dexterity dexterity false false false [] [] roll with disadvantage if you do not have the proper tools, unless it’s a crude lock. you spend the floor number in minutes trying to pick the lock. make an unopposed skill check (more complex locks may have a higher difficulty, as determined by the gm). if the lock was created by a named antagonist, this could be an int-opposed skill check instead.\n\non success, you pick the lock! {&#x27;5&#x27;: &#x27;you make no noise and leave no trace.&#x27;, &#x27;10&#x27;: &#x27;each attempt takes half the time. you may alter the lock so that the key no longer works.&#x27;, &#x27;15&#x27;: &#x27;you don’t roll with disadvantage if you lack the proper tools.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-lockpicking\">Lockpicking\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"longsword longsword attack_skill edged weapon skills melee attack, str strength false false false melee [] [&#x27;slashing&#x27;] 1d8 + str slashing {&#x27;5&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and you gain a +1 evade buff.&#x27;}\" data-category=\"Edged Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-longsword\">Longsword\u003c/a>\u003c/h2>\u003cp class=\"source\">Edged Weapon Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d8 + Str Slashing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"lore lore utility_skill intelligence intelligence false false false [] [] you have studied the goings-on in the dungeon and have figured out a thing or two. make an unopposed skill check.\n\non success, you know a little something about a neighborhood, some of the mobs, or how to avoid pissing off the locals. {&#x27;5&#x27;: &#x27;you can identify the major factions in the area.&#x27;, &#x27;10&#x27;: &#x27;you are aware of the important local npcs. just give your gm a break and don’t demand this all up front or the first one you come across will likely attack you.&#x27;, &#x27;15&#x27;: &#x27;you roll with advantage on your first charisma-based skill check when encountering an organized group in a neighborhood.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-lore\">Lore\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"negotiation negotiation utility_skill charisma charisma false false false [] [] does not work on members of your own party. some items have a minimum price. you spend 5 minutes haggling over the price of items or negotiating to get what you want through compromise. typically, haggling is done with an npc merchant when you’re buying or selling items. if you haggle with other entities, you do so with disadvantage. make an int-opposed skill check.\n\non success, you increase or decrease the price 10% in your favor. if you’re not haggling, the opponent tentatively agrees to your terms. {&#x27;5&#x27;: &#x27;your party members can also buy or sell at your newly-negotiated price.&#x27;, &#x27;10&#x27;: &#x27;increase or decrease the price by an additional 10% in your favor.&#x27;, &#x27;15&#x27;: &#x27;increase or decrease the price by an additional 15% in your favor.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-negotiation\">Negotiation\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"noggin-nocker noggin nocker attack_skill hand-to-hand combat skills it’s like a headbutt, only cooler. melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 1 (only if no damage effect is used) on success, you lose 1 health bar slot. 1d4 + con bludgeoning choose the skullcracker or powerful strike damage effect (if you wish) before rolling to hit. {&#x27;5&#x27;: &#x27;+1d4 base damage, and you don’t take any damage from your own attack.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and add 1 rank damage die.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and the target gains the woozy debuff.&#x27;}\" data-category=\"Hand-to-Hand Combat Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-noggin-nocker\">Noggin Nocker\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Combat Skills\u003c/p>\u003cp>Stat: Strength · Damage: 1d4 + Con Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"pathfinder pathfinder utility_skill passive true false false [] [] ranks in this skill only increase by magical means and training. your hud map zooms out with a thought, the breadth of which is determined by a multiplier equal to your rank. example: rank 4 means your map covers ×4 the standard area (1/4 of a square mile), which makes it extend to 1 mile around you. {&#x27;5&#x27;: &#x27;you are notified when you are near a saferoom or stairwell.&#x27;, &#x27;10&#x27;: &#x27;you can see through your map while it is open in your hud.&#x27;, &#x27;15&#x27;: &#x27;mobs appear as red dots on your hud map.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-pathfinder\">Pathfinder\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"perception perception utility_skill intelligence intelligence false false false [] [] you concentrate your senses to pick out details about your environment that others might miss. make an unopposed skill check, though the gm will likely adjust the difficulty based on the lighting, how cluttered the area is, how quickly an event occurs, and other such circumstances.\n\nalso use perception when you take a look for clues action (p. 85).\n\non success, you notice something. it could be important; it might not be. {&#x27;5&#x27;: &#x27;halve the penalty for cluttered areas.&#x27;, &#x27;10&#x27;: &#x27;halve the penalty for how short of a window you have to notice the thing.&#x27;, &#x27;15&#x27;: &#x27;halve the penalty for the range to the thing.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-perception\">Perception\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"performance performance utility_skill charisma charisma false false false [] [] whether you’re acting, dancing, playing an instrument, singing, or delivering slam poetry, use this skill when you want to electrify an audience. choose a type of performance to specialize in as your starting type, be it comedy, guitar, screamo, or reciting the collected works of alan ginsberg.\n\nmake an unopposed skill check to determine the audience reaction. if you are competing against other performers, add the top rival’s cha to the difficulty.\n\non success, you command the stage. the audience is entertained. {&#x27;5&#x27;: &#x27;choose an additional type of performance to specialize in.&#x27;, &#x27;10&#x27;: &#x27;choose an additional type of performance. you can coach and coordinate others in one of your specialties. after coaching them for at least 1 hour in one of your specialties, they can attempt an unskilled performance skill check without disadvantage.&#x27;, &#x27;15&#x27;: &#x27;choose an additional type of performance. you can mimic someone else’s performance after experiencing it once.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-performance\">Performance\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"persuasion persuasion utility_skill charisma charisma false false false [] [] you have a knack for getting others to see things your way. you typically need about 10 minutes of schmoozing in a safe environment to make a check with this skill, and you may suffer disadvantage if the request is risky, inconvenient, or untoward. make an int-opposed skill check.\n\non success, you convince the target to follow your suggestion if it isn’t too costly for them, too dangerous, or against their nature. {&#x27;5&#x27;: &#x27;they’ll follow your suggestion even if it is costly for them.&#x27;, &#x27;10&#x27;: &#x27;they’ll follow your suggestion even if it is dangerous.&#x27;, &#x27;15&#x27;: &#x27;they’ll follow your suggestion even if it’s against their nature.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-persuasion\">Persuasion\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"polearm polearm attack_skill reach weapon skills melee attack, str strength false false false melee [] [&#x27;piercing&#x27;] 10 feet requires two hands to wield. 1d8 + str piercing {&#x27;5&#x27;: &#x27;+1d8 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d8 base damage, and +1 rank in the zone of control skill.&#x27;, &#x27;15&#x27;: &#x27;+1d8 base damage, and +1 rank in the zone of control skill.&#x27;}\" data-category=\"Reach Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-polearm\">Polearm\u003c/a>\u003c/h2>\u003cp class=\"source\">Reach Weapon Skills\u003c/p>\u003cp>Stat: Strength · Range: 10 feet · Damage: 1d8 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"powerful-strike powerful strike attack_skill hand-to-hand damage effect skills foot soldier, noggin nocker, or pugilism damage effect, passive true false false foot soldier, noggin nocker, or pugilism [] [] 30 hours multiply your base damage dice result by your rank in this skill, then add your modifiers and buffs. {&#x27;5&#x27;: &#x27;the cooldown is 10 hours.&#x27;, &#x27;10&#x27;: &#x27;the cooldown is 5 hours.&#x27;, &#x27;15&#x27;: &#x27;the cooldown is 2 hours.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-powerful-strike\">Powerful Strike\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"pugilism pugilism attack_skill hand-to-hand combat skills philistines call it punching. melee attack, dex dexterity false false false melee [] [&#x27;bludgeoning&#x27;] 2 (only if no damage effect is used) 1d2 + str bludgeoning choose the dirty fighting, iron punch, or powerful strike damage effect (if you wish) before rolling to hit. {&#x27;5&#x27;: &#x27;+2d2 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d2 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d2 base damage, and you may make an extra free attack with disadvantage.&#x27;}\" data-category=\"Hand-to-Hand Combat Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-pugilism\">Pugilism\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Combat Skills\u003c/p>\u003cp>Stat: Dexterity · Damage: 1d2 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"quarterstaff quarterstaff attack_skill reach weapon skills melee attack, str strength false false false melee [] [&#x27;bludgeoning&#x27;] 10 feet requires two hands to wield. 1d6 + str bludgeoning {&#x27;5&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and you gain a +1 evade buff.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and you gain a +1 evade buff. for handling explosives, see explosives handling, goblin explosives, and incendiary device handling in utility skills (below). these skills will also be useful for crafting your own explosives once you have access to a sapper’s table on the fourth floor. as crawlers descend to lower floors, explosives become more complex than the tutorial floors’ “light and throw” variety. see the area of effect attacks (p. 83) for targeting, difficulties, and what happens when you miss your target with tossed explosives. your explosives skill is not used when attacking with a thrown explosive, but the gm should have you make an unopposed handling skill check before throwing. here are the explosives typically found on the first five floors. lesser explosives can be found on lower floors, but the more powerful explosives are rarely seen on the upper floors. floor 1: standard explosive—dynamite: 1d6 bludgeoning, 0ft blast radius +5ft splash. floor 2: goblin explosive—dynamite: 2d6 bludgeoning damage, 5ft blast radius + 5ft splash. floor 2: incendiary device—carl’s jug o’ boom: 1d8 fire damage, 5ft blast radius + 15ft splash. anyone who loses at least 1 health bar slot gains the burned debuff. floor 3: goblin explosive—hob-lobbers: 3d6 piercing, +10ft splash floor 4: standard explosive—demon det cord: 5d6 bludgeoning, deals double damage to objects. can only be applied to non-moving targets. floor 5: incendiary device—gnomish knock-knock: 4d6 fire, 10ft blast radius +10ft splash, and anyone who fails to evade gains the burned debuff. as this is a notoriously unstable fuel-air explosive, a critical fail is achieved on a natural 1–4. most explosives are custom made and not available on store shelves. carl had his custom jelly bombs, banger spheres, chum bombs, and more. smoke is used for concealment, distraction, and confusion. attacking into or out of smoke is done with disadvantage (see mob advantage and disadvantage p. 60). thrown smoke bombs are popular on most dungeon floors as a way to get out of trouble quick-ly. see the throwing skill (p. 200) for targeting, difficulties, and what happens when you miss your target. you don’t need to make a skill check to drop it in your own space. floor 1: goblin smoke bomb: creates a multicolor smoke cloud that reaches 30 feet in each direction from the point of impact, with a maximum duration of 3 minutes. however, even a slight breeze will dissipate it in 1 minute. floor 3: hobgoblin smoke curtain: creates a dense white fog over a 60ft radius that holds even in a breeze. floor 5: hobgoblin disco ball: created by infusing (see infusion skill, p. 194) an invisibility potion onto a hobgoblin smoke curtain. it produces thick multi-hued smoke plumes, along with some sick beats. it blinds everyone in the area, friend and foe alike. utility skills help crawlers survive, adapt, and solve problems that can’t be fixed by hitting them until they stop moving. checks that are labeled as unopposed can, at the gm’s discretion, become opposed if something is actively working against you. for example, you’re trying to swim the rapids, and some dipshit is throwing fishing nets at you. cut it out, cletus! or i’m gonna tell mom on you!&#x27;}\" data-category=\"Reach Weapon Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-quarterstaff\">Quarterstaff\u003c/a>\u003c/h2>\u003cp class=\"source\">Reach Weapon Skills\u003c/p>\u003cp>Stat: Strength · Range: 10 feet · Damage: 1d6 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"rapier rapier attack_skill edged weapon skills melee attack, dex dexterity false false false melee [] [&#x27;piercing&#x27;] 1d6 + dex piercing {&#x27;5&#x27;: &#x27;+1d6 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d6 base damage, and you gain a +1 evade buff.&#x27;, &#x27;15&#x27;: &#x27;+1d6 base damage, and you gain a +1 evade buff. when attacking with a hand-to-hand attack skill that has a description stating you can choose a damage effect, choose one available damage effect before you make the attack skill check. if the attack hits, first roll the base damage dice and then apply the chosen damage effect. if you choose not to use a damage effect for a majority of your hand-to-hand attacks during a combat that lasts for at least three rounds, you gain the amount of ai favor listed in the skill’s entry.&#x27;}\" data-category=\"Edged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-rapier\">Rapier\u003c/a>\u003c/h2>\u003cp class=\"source\">Edged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Damage: 1d6 + Dex Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"regeneration regeneration utility_skill passive true false false [] [] if your rank in this skill is equal to or greater than your con, you heal 1 health bar slot at the start of each round (or every 10 seconds outside of combat). if not, you heal 1 health bar slot every other round (or every 20 seconds outside of combat). {&#x27;5&#x27;: &#x27;after 5 minutes, any minor injury debuff you suffer from ends. after 10 minutes, any major injury debuff you suffer from ends.&#x27;, &#x27;10&#x27;: &#x27;after 20 minutes, any long-term minor injury debuff you suffer from ends. after 1 hour, any long-term major injury debuff you suffer from ends.&#x27;, &#x27;15&#x27;: &#x27;the time required to end injury debuffs is halved.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-regeneration\">Regeneration\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"religion religion utility_skill intelligence intelligence false false false [] [] you have a knack for understanding gods, their followers, and what makes them tick. make an unopposed skill check.\n\non success, you know the basic information about a god and the practices of their followers. {&#x27;5&#x27;: &#x27;you can identify the followers on sight, even if they’re trying to hide their affiliation.&#x27;, &#x27;10&#x27;: &#x27;you know how to sow discord among the followers of that religion.&#x27;, &#x27;15&#x27;: &#x27;you know strengths and weakness of the gods.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-religion\">Religion\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"repair repair utility_skill intelligence intelligence false false false [] [] for basic repairs to items with no moving parts, magical or not. after spending 2 hours, you can repair most simple items that are broken or damaged but not destroyed. make an unopposed skill check.\n\non success, you repair the item. {&#x27;5&#x27;: &#x27;you can make repairs to things with moving parts.&#x27;, &#x27;10&#x27;: &#x27;you can make repairs in 1 hour.&#x27;, &#x27;15&#x27;: &#x27;you can rebuild a destroyed item.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-repair\">Repair\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"riding riding utility_skill dexterity dexterity false false false [] [] the rider in control of the mount rolls attack skill checks with disadvantage. while mounted on a living beast, you can ride to the local watering hole without needing to make a check. but during an action scene or when exploring giant gopher hole flats, your mount might panic, and you might get tossed for 1d6 bludgeoning for every 10ft move your mount has, plus its size value. don’t land in a cactus patch! make an unopposed skill check.\n\non success, your mount doesn’t stumble, and you stay upright. {&#x27;5&#x27;: &#x27;your mount has +5ft move. you no longer suffer disadvantage when attacking while riding.&#x27;, &#x27;10&#x27;: &#x27;your mount has an additional +10ft move. when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;, &#x27;15&#x27;: &#x27;your mount has an additional +15ft move. when performing crazy stunts (like jumping through flames), roll with advantage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-riding\">Riding\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"ropework ropework utility_skill dexterity dexterity false false false [] [] you know a half hitch from a clove hitch, and the qualities of hemp vs. nylon (we had to look it up). sadly, this knowledge is mostly used to tie people up so you can tor—interrogate them, but you’re going to buck that trend, right? just climbing and cattle-rustling for you!\n\nmake an unopposed skill check.\n\non success, you rope the thing with a good knot. {&#x27;5&#x27;: &#x27;you can now use this skill as an attack, at a range of 10ft vs. the target’s evade. on success, the target gains the held debuff.&#x27;, &#x27;10&#x27;: &#x27;you can whip your line in that special way to untie a knot you made and recover your rope.&#x27;, &#x27;15&#x27;: &#x27;your attack now has a range of your strength (min 15). just make sure your rope is long enough.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-ropework\">Ropework\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"running running utility_skill dexterity dexterity false false false [] [] for short bursts of running. for extended runs, use endurance instead (p. 190). you don’t need to use this skill if you’re running down a hallway to attack some mobs. but if you’re racing, chasing, or need to get away from a ticking time bomb, this is the skill you want. see racing &amp; chasing, p. 73. make an unopposed skill check every minute, not every round. add 1 to your result for every 10ft of move you have.\n\non success, you succeed in the run. {&#x27;5&#x27;: &#x27;you have a permanent +5ft move buff. make a check every 2 minutes.&#x27;, &#x27;10&#x27;: &#x27;you have an additional permanent +10ft move buff. make a check every 4 minutes.&#x27;, &#x27;15&#x27;: &#x27;you have an additional permanent +15ft move buff. make a check every 6 minutes.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-running\">Running\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"salvage salvage utility_skill intelligence intelligence false false false [] [] salvage cannot be used with explosive devices. salvage is the art of collecting useful items from things you have deconstructed or failed to properly craft. see crafting, p. 221.\n\nsalvaging usually takes 1 hour to accomplish. at the end of that time, make an unopposed skill check.\n\non success, you recover half of the important raw materials. {&#x27;5&#x27;: &#x27;your salvage checks take 30 minutes.&#x27;, &#x27;10&#x27;: &#x27;on success, you recover all of the important raw materials.&#x27;, &#x27;15&#x27;: &#x27;on a crafting standard fail or near miss, roll your crafting check again with advantage, with an additional 15-minute time expenditure.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-salvage\">Salvage\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"scutelliphily scutelliphily utility_skill intelligence intelligence false false false [] [] this limited skill can only be learned via a race, class, or item. you know your way around patches and love collecting them. make an unopposed skill check.\n\non success, you are able to identify a patch and its bonus level, if any. {&#x27;5&#x27;: &#x27;you can sew and iron patches onto clothing using this skill.&#x27;, &#x27;10&#x27;: &#x27;you may use this as a crafting skill, but crafting tables provide no bonuses. enchanted patches are limited to one per gear slot and do not take up accessory slots. see crafting, p. 221.&#x27;, &#x27;15&#x27;: &#x27;your crafting checks take half the time. increase the bonus value of your enchantments with this skill by 1, at no additional difficulty or time to craft. example: if you craft a +2 strength patch, it becomes a +3 strength patch.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Intelligence\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-scutelliphily\">Scutelliphily\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Intelligence\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"shield-block shield block utility_skill strength, interrupt strength false true false [] [] requires you to be wielding a shield. cannot be used against area of effect damage. a successful shield block still counts as “a hit crawler” or “a crawler who failed to evade.” you’re one of those types. you like a big slab of wood or metal between you and the beasties. when you are attacked by a physical attack, spend one action to make a separate shield block skill check vs. the mob’s “to hit” for each of the attacks targeting you. if 3 physical attacks are directed at you, roll this skill check 3 times. where an evade check is called for, ask your gm if you can use this skill.\n\non success, take half the damage before applying your dr. your shield takes a -1 dr penalty on a major fail; -2 on a critical fail. it breaks at 0 dr. however, a broken shield and lost dr can be repaired. {&#x27;5&#x27;: &#x27;you may also use this skill against spells and magical damage.&#x27;, &#x27;10&#x27;: &#x27;on a critical hit, you may make a shield bash attack as a free melee-range interrupt attack (instead of advantage on your next attack) if you wish, dealing 3d6 base damage + str bludgeoning.&#x27;, &#x27;15&#x27;: &#x27;+1d6 shield bash damage. further reduce the damage you would take by your str mod. example: after halving 30 damage down to 15, your str mod of 5 reduces it to 10 damage.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"Interrupt\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-shield-block\">Shield Block\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003cp class=\"source\">Interrupt\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"shotgun shotgun attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;piercing&#x27;] 30 feet requires two hands to wield. each attack requires proper ammunition. spend one action to reload after a major fail or worse. 1d10 piercing {&#x27;5&#x27;: &#x27;+1d10 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d10 base damage&#x27;, &#x27;15&#x27;: &#x27;+1d10 base damage, +5ft splash&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-shotgun\">Shotgun\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 30 feet · Damage: 1d10 Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"shuriken shuriken attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;piercing&#x27;] 30 feet 1 1d4 + str piercing {&#x27;5&#x27;: &#x27;+1d4 base damage, and the range is 40 feet.&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage, and you may make an extra free attack with disadvantage.&#x27;, &#x27;15&#x27;: &#x27;+1d4 base damage, and you may make an extra free attack with disadvantage.&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-shuriken\">Shuriken\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 30 feet · Damage: 1d4 + Str Piercing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"skullcracker skullcracker attack_skill hand-to-hand damage effect skills noggin nocker damage effect, passive true false false noggin nocker [] [] if the target is the same size as you, gain +1d4 base damage. {&#x27;5&#x27;: &#x27;+1d4 base damage if target is the same size as you.&#x27;, &#x27;10&#x27;: &#x27;if the target is the same size as you, add 1 rank damage die, and the target gains the stunned debuff.&#x27;, &#x27;15&#x27;: &#x27;if the target is the same size as you, add 1 rank damage die, and the target gains the blood trail debuff.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-skullcracker\">Skullcracker\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"sleight-of-hand sleight of hand utility_skill dexterity dexterity false false false [] [] items you manipulate must be smaller than the size of your hand. you cannot access others’ inventories or hotlists. you’ve learned to manipulate small objects without being spotted. great for shoplifting. make an int-opposed skill check. if someone’s perception is a higher rank than your sleight of hand, you have disadvantage.\n\non success, you maneuver the item without being noticed. {&#x27;5&#x27;: &#x27;you may attempt to pick the pockets of npcs and mobs.&#x27;, &#x27;10&#x27;: &#x27;you may attempt to plant items on someone with pockets or the equivalent.&#x27;, &#x27;15&#x27;: &#x27;you may manipulate items up to half your own size (rounded down).&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-sleight-of-hand\">Sleight of Hand\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"slice-attack slice attack attack_skill animal crawler &amp; pet strike skills melee attack, dex dexterity false false false melee [] [&#x27;slashing&#x27;] 1 1d4 + str slashing {&#x27;5&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;10&#x27;: &#x27;+1d4 base damage&#x27;, &#x27;15&#x27;: &#x27;+2d4 base damage&#x27;}\" data-category=\"Animal Crawler &amp; Pet Strike Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-slice-attack\">Slice Attack\u003c/a>\u003c/h2>\u003cp class=\"source\">Animal Crawler &amp; Pet Strike Skills\u003c/p>\u003cp>Stat: Dexterity · Damage: 1d4 + Str Slashing\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"slingshot slingshot attack_skill ranged weapon skills ranged attack, dex dexterity false false false ranged [] [&#x27;bludgeoning&#x27;] 30 feet 2 requires two hands to wield. 1d2 + str bludgeoning {&#x27;5&#x27;: &#x27;+1d2 base damage, and its range increases by your strength score in feet.&#x27;, &#x27;10&#x27;: &#x27;+1d2 base damage, and add 1 rank damage die.&#x27;, &#x27;15&#x27;: &#x27;+1d2 base damage, and add 1 rank damage die. reach weapons allow you to make melee attacks against foes up to 10 feet away but not through occu-pied spaces. you may attack diagonally through the junction of two spaces as long as at least one of those spaces is unoccupied.&#x27;}\" data-category=\"Ranged Weapon Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-slingshot\">Slingshot\u003c/a>\u003c/h2>\u003cp class=\"source\">Ranged Weapon Skills\u003c/p>\u003cp>Stat: Dexterity · Range: 30 feet · Damage: 1d2 + Str Bludgeoning\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"smithing smithing utility_skill strength strength false false false [] [] you may craft mundane items such as horseshoes, railroad spikes, nails, or the fun stuff: armor and weapons, but without dr or any bonuses. see crafting, p. 221. {&#x27;5&#x27;: &#x27;you may craft items up to a +5 bonus.&#x27;, &#x27;10&#x27;: &#x27;you may craft items up to a +10 bonus.&#x27;, &#x27;15&#x27;: &#x27;your crafting with this skill takes half the time.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-smithing\">Smithing\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"smush smush attack_skill hand-to-hand damage effect skills foot soldier damage effect, passive true false false foot soldier [] [] once per round. you can only apply this damage effect to targets with 20% health bar or less. you deal ×2 the total damage. {&#x27;5&#x27;: &#x27;smush activates at 30% health bar or less and deals ×3 the total damage.&#x27;, &#x27;10&#x27;: &#x27;this skill has no cooldown.&#x27;, &#x27;15&#x27;: &#x27;smush activates at 40% health bar or less and deals ×4 the total damage.&#x27;}\" data-category=\"Hand-to-Hand Damage Effect Skills\" data-stat=\"\" data-traits=\"Passive\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-smush\">Smush\u003c/a>\u003c/h2>\u003cp class=\"source\">Hand-to-Hand Damage Effect Skills\u003c/p>\u003cp>See entry for effects and requirements.\u003c/p>\u003cp class=\"source\">Passive\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"stealth stealth utility_skill dexterity dexterity false false false [] [] you must be out of sight of all foes to begin this check. use this skill if you want to move undetected or surprise a mob. make an int-opposed skill check.\n\non success before combat starts, you are unnoticed and gain 1 non-attack action. don’t forget to take your 10ft step!\n\non success in a non-combat situation, you remain unnoticed and can perform a move action with a 10ft step as part of this check. {&#x27;5&#x27;: &#x27;your surprise action can be an attack with advantage.&#x27;, &#x27;10&#x27;: &#x27;when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;, &#x27;15&#x27;: &#x27;on a successful surprise check, you may also take a full move and step. if you attack with your surprise action, deal ×2 the base damage dice.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Dexterity\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-stealth\">Stealth\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Dexterity\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"streetwise streetwise utility_skill charisma charisma false false false [] [] use this skill in populated areas to learn or spread rumors, avoid attracting too much attention, gain access to less-than-legal items, and the like. make an unopposed skill check. on success, you navigate a town without attracting attention, deal with a criminal network, identify an informal power structure, or gain the information you’re seeking. {&#x27;5&#x27;: &#x27;you also hear an additional rumor, as determined by the gm. or spread one!&#x27;, &#x27;10&#x27;: &#x27;you also quickly find a hiding place determined by the gm.&#x27;, &#x27;15&#x27;: &#x27;you also uncover information that might give you some leverage on an important person in town determined by the gm.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Charisma\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-streetwise\">Streetwise\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Charisma\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"survival survival utility_skill constitution constitution false false false [] [] you know how to survive in dangerous, often remote places for long periods of time with only the meager food and water you can rustle up. when traveling through such areas, make an unopposed skill check.\n\non success, you survive the perils of the conditions unscathed. on a standard fail, you suffer the effects of hunger and/or thirst (see p. 76). {&#x27;5&#x27;: &#x27;you do not suffer additional damage from a critical fail.&#x27;, &#x27;10&#x27;: &#x27;when other crawlers in your party roll this skill untrained, they roll as normal (not with disadvantage).&#x27;, &#x27;15&#x27;: &#x27;you do not suffer additional damage from a major fail.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Constitution\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-survival\">Survival\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Constitution\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"swimming swimming utility_skill strength strength false false false [] [] after 1 minute of swimming (success or fail) or immediately on a major fail or worse, gain the fatigued debuff. use this skill when there are consequences for not swimming strongly or well rather than when you’re taking a casual swim. for instance, if you’re racing for your life, swimming against a strong current, or trying to get to shore to avoid a waterfall. in these cases, make an unopposed skill check every 30 seconds.\n\non success, you swim well despite the danger. for swimming during combat, see special forms of move-ment, p. 70. {&#x27;5&#x27;: &#x27;after 2 minutes of swimming (success or fail), gain the fatigued debuff.&#x27;, &#x27;10&#x27;: &#x27;you can swim at your full move rate as an action, but you still can’t take a 10ft step.&#x27;, &#x27;15&#x27;: &#x27;make this check every 5 minutes, and only gain the fatigue debuff on a critical fail.&#x27;}\" data-category=\"Utility Skills\" data-stat=\"Strength\" data-traits=\"\">\u003ch2>\u003ca class=\"wl\" href=\"#skill-swimming\">Swimming\u003c/a>\u003c/h2>\u003cp class=\"source\">Utility Skills\u003c/p>\u003cp>Stat: Strength\u003c/p>\u003c/article>\u003carticle class=\"reference-card\" data-search=\"tactics tactics utility_skill intelligence intelligence false false false [] [] a crawler may attempt this skill check only once per combat. your tactical mind and directions can spur your allies to victory. choose one of the following combat disciplines: attack, damage, or evade, and then make an unopposed skill check.\n\non success, you and each member of your party gain a +1 bonus to checks for the chosen discipline. increase the bonus by +1
